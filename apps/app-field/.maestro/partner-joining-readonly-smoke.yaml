# Live-device read-only proof. Prerequisite: an authorized Field draft open at step 1.
# Never submit, save, clear app state, or modify partner records.
appId: com.bthwani.field
name: Field draft two-step navigation without saving
---
- launchApp:
    stopApp: false
    clearState: false
- extendedWaitUntil:
    visible: "الخطوة 1 من 2 · المالك والمتجر"
    timeout: 20000
- assertVisible: "اسم المالك"
- tapOn: "التالي"
- extendedWaitUntil:
    visible: "الخطوة 2 من 2 · التشغيل والإثبات"
    timeout: 20000
- assertVisible: "مدينة الخدمة"
- tapOn: "السابق"
- extendedWaitUntil:
    visible: "الخطوة 1 من 2 · المالك والمتجر"
    timeout: 20000
