    timeout: 20000
- tapOn: "الأداء"
- extendedWaitUntil:
    visible: "نظرة عامة"
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "حسابي وملف المتجر"
    timeout: 15000
- tapOn: "الطلبات"
- extendedWaitUntil:
    visible: "طلبات جديدة"
    timeout: 15000
