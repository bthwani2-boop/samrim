<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">اكتشف الجديد في بثواني</title>
  <desc id="desc">عروض واختيارات قريبة منك</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.62" stop-color="#10233a"/>
      <stop offset="1" stop-color="#173e43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#ff9e45"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="480" rx="34" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="210" fill="#35c98a" opacity="0.16" filter="url(#glow)"/>
  <circle cx="170" cy="420" r="260" fill="#ff6b35" opacity="0.16" filter="url(#glow)"/>
  <path d="M0 382 C210 300 350 440 565 365 S935 275 1280 350 V480 H0Z" fill="#0b1829" opacity="0.82"/>
  <rect x="78" y="78" width="170" height="52" rx="26" fill="#35c98a"/>
  <text x="163" y="113" fill="#06121e" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" direction="rtl">اختيارات اليوم</text>
  <text x="790" y="205" fill="#ffffff" font-family="Arial, sans-serif" font-size="64" font-weight="700" text-anchor="middle" direction="rtl">اكتشف الجديد</text>
  <text x="790" y="285" fill="url(#accent)" font-family="Arial, sans-serif" font-size="76" font-weight="800" text-anchor="middle" direction="rtl">في بثواني</text>
  <text x="790" y="344" fill="#b9c8d8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" direction="rtl">عروض واختيارات قريبة منك</text>
  <g transform="translate(110 200)">
