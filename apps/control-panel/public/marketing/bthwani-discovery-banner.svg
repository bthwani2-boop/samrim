    <rect x="145" y="40" width="92" height="16" rx="8" fill="#10233a" opacity="0.84"/>
    <rect x="145" y="72" width="70" height="12" rx="6" fill="#35c98a"/>
    <rect x="145" y="101" width="52" height="12" rx="6" fill="#ff6b35"/>
  </g>
  <rect x="650" y="382" width="255" height="54" rx="27" fill="#ff6b35"/>
  <text x="777" y="418" fill="#ffffff" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="middle" direction="rtl">افتح واكتشف الآن</text>
