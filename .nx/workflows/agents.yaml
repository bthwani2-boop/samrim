launch-templates:
  linux-medium-js:
    resource-class: 'docker_linux_amd64/medium'
    image: 'ubuntu22.04-node24.14-v1'
    init-steps:
      - name: Checkout
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'

      - name: Install pinned toolchains
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-mise/main.yaml'
        inputs:
          tools: |
            node=24.17.0
            go=1.27.1
            pnpm=10.34.0

      - name: Verify pinned toolchains
        script: |
          test "$(node -p 'process.version')" = "v24.17.0"
          test "$(go env GOVERSION)" = "go1.27.1"
          test "$(pnpm --version)" = "10.34.0"

      - name: Install workspace
        script: pnpm install --frozen-lockfile
