# Disposable Operator WebAuthn development stack. Not the shared Identity/DSH/WLT stack.
# Launch on verified Lenovo Docker through the existing Surface SSH Docker context.
name: bthwani-operator-webauthn-s02
services:
  postgres:
    image: postgis/postgis:18-3.6@sha256:e84455a058f60f06dd8c40e66a2c628b8fc113d9fca0896e1f308b25b897207f
    container_name: bthwani-session02-webauthn-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: bthwani_fido_s02
      POSTGRES_DB: refoundation_webauthn_s02
      POSTGRES_PASSWORD: "${REF_OPERATOR_SANDBOX_PASSWORD:?a separate disposable database password is required}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - operator-s02-postgres-data:/var/lib/postgresql
    labels:
      com.bthwani.environment: operator-webauthn-sandbox
      com.bthwani.capability: operator-bootstrap-disposable-db
    networks: [private, loopback]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bthwani_fido_s02 -d refoundation_webauthn_s02"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
  identity:
    build:
      context: ../../services/identity
      dockerfile: backend/Dockerfile
      args:
        SAMRIM_SOURCE_REVISION: "${REF_OPERATOR_SOURCE_REVISION:?local source revision required}"
    image: bthwani-operator-identity:s02
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      BTHWANI_ISOLATED_TEST_MODE: "true"
      BTHWANI_ISOLATED_CONTAINER_MODE: "true"
      IDENTITY_DB_SCHEMA: identity_test_operator_s02
      IDENTITY_TEST_DATABASE_URL: "postgres://bthwani_fido_s02:${REF_OPERATOR_SANDBOX_PASSWORD}@postgres:5432/refoundation_webauthn_s02?sslmode=disable"
      IDENTITY_DEV_LISTEN_ADDR: "0.0.0.0:3302"
      IDENTITY_ENABLE_ISOLATED_OPERATOR_PASSKEY_AUTH: "true"
      IDENTITY_ENABLE_ISOLATED_OPERATOR_BOOTSTRAP: "true"
      IDENTITY_OPERATOR_PASSKEY_RPID: localhost
      IDENTITY_OPERATOR_PASSKEY_ORIGINS: "http://localhost:13000"
    ports:
      - "127.0.0.1:3241:3302"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      com.bthwani.environment: operator-webauthn-sandbox
      com.bthwani.capability: identity-synthetic-operator-bootstrap
    networks: [private, loopback]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3302/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
networks:
  private:
    internal: true
  loopback: {}
volumes:
  operator-s02-postgres-data: {}
