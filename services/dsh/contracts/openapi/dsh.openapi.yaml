openapi: 3.1.0
info:
  title: BThwani DSH API
  version: 1.0.0
  description: |
    Canonical operational contract for DSH (Delivery, Shopping, Hospitality/Operations).
    Owns operational boundaries and domain workflows. Identity owns human actor and role lifecycle truth.
servers:
  - url: http://127.0.0.1:18080

paths:
  /dsh/health:
    $ref: "./paths/runtime.yaml#/paths/~1dsh~1health"

  /dsh/readiness:
    $ref: "./paths/runtime.yaml#/paths/~1dsh~1readiness"

  /dsh/joining-cases:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases"

  /dsh/joining-cases/self:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases~1self"

  /dsh/joining-cases/{caseId}:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases~1{caseId}"

  /dsh/joining-cases/{caseId}/submit:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases~1{caseId}~1submit"

  /dsh/joining-cases/{caseId}/correct-and-resubmit:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases~1{caseId}~1correct-and-resubmit"

  /dsh/joining-cases/{caseId}/review:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases~1{caseId}~1review"

  /dsh/catalog/products:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1catalog~1products"

  /dsh/catalog/products/{productId}:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1catalog~1products~1{productId}"

  /dsh/stores/{storeId}/assortment:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1stores~1{storeId}~1assortment"

  /dsh/stores/{storeId}/assortment/{productId}:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1stores~1{storeId}~1assortment~1{productId}"

  /dsh/stores/{storeId}/publication:
    $ref: "./paths/store-publication.yaml#/paths/~1dsh~1stores~1{storeId}~1publication"

  /dsh/public/stores:
    $ref: "./paths/store-publication.yaml#/paths/~1dsh~1public~1stores"

  /dsh/public/stores/{storeId}:
    $ref: "./paths/store-publication.yaml#/paths/~1dsh~1public~1stores~1{storeId}"

  /dsh/addresses:
    $ref: "./paths/location-core.yaml#/paths/~1dsh~1addresses"

  /dsh/addresses/{addressId}:
    $ref: "./paths/location-core.yaml#/paths/~1dsh~1addresses~1{addressId}"

  /dsh/stores/{storeId}/delivery-origin:
    $ref: "./paths/location-core.yaml#/paths/~1dsh~1stores~1{storeId}~1delivery-origin"

components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: token
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: token

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    ActingActorId:
      name: X-Acting-Actor-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    ActingActorIdRequired:
      name: X-Acting-Actor-ID
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    CorrelationIdRequired:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ExpectedVersion:
      name: X-Expected-Version
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
    ExpectedVersionRequired:
      name: X-Expected-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 1
    OriginVersionRequired:
      name: X-Expected-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

  schemas:
    StatusResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string

    CreateJoiningCaseRequest:
      type: object
      required: [contactPhoneE164, businessName, firstStoreName]
      additionalProperties: false
      properties:
        contactPhoneE164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        businessName:
          type: string
          minLength: 2
          maxLength: 160
        firstStoreName:
          type: string
          minLength: 2
          maxLength: 160

    JoiningCaseState:
      type: string
      enum: [draft, submitted, needs_correction, approved]

    JoiningCaseView:
      type: object
      required: [id, contactPhoneE164, businessName, firstStoreName, state, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        contactPhoneE164:
          type: string
        businessName:
          type: string
        firstStoreName:
          type: string
        partnerActorId:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/JoiningCaseState"
        correctionReason:
          type: string
          nullable: true
        reviewedBy:
          type: string
          nullable: true
        store:
          $ref: "#/components/schemas/StoreView"
          nullable: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JoiningCaseResponse:
      type: object
      required: [case, idempotentReplay]
      additionalProperties: false
      properties:
        case:
          $ref: "#/components/schemas/JoiningCaseView"
        idempotentReplay:
          type: boolean

    JoiningCaseSummary:
      type: object
      required: [id, contactPhoneE164, businessName, firstStoreName, state, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        contactPhoneE164:
          type: string
        businessName:
          type: string
        firstStoreName:
          type: string
        partnerActorId:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/JoiningCaseState"
        correctionReason:
          type: string
          nullable: true
        reviewedBy:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JoiningCaseListResponse:
      type: object
      required: [cases]
      additionalProperties: false
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/JoiningCaseSummary"
        nextCursor:
          type: string

    CorrectJoiningCaseRequest:
      type: object
      required: [businessName, firstStoreName]
      additionalProperties: false
      properties:
        businessName:
          type: string
          minLength: 2
          maxLength: 160
        firstStoreName:
          type: string
          minLength: 2
          maxLength: 160

    ReviewJoiningCaseRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approved, needs_correction]
        correctionReason:
          type: string
          nullable: true
          maxLength: 500

    StorePublicationReadiness:
      type: object
      required: [ready]
      additionalProperties: false
      properties:
        ready:
          type: boolean
        blockedReason:
          type: string
          enum: [PARTNER_IDENTITY_NOT_ELIGIBLE]

    StoreView:
      type: object
      required: [id, partnerActorId, name, version, publicationState, publicationReadiness, assortments, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        partnerActorId:
          type: string
        name:
          type: string
        version:
          type: integer
          minimum: 1
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        publicationReadiness:
          $ref: "#/components/schemas/StorePublicationReadiness"
        publicationChangedAt:
          type: string
          format: date-time
          nullable: true
        assortments:
          type: array
          items:
            $ref: "#/components/schemas/StoreAssortment"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicationState:
      type: string
      enum: [unpublished, published, hidden]

    PublicationAction:
      type: string
      enum: [published, hidden]

    StorePublicationRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/PublicationAction"

    StorePublicationResponse:
      type: object
      required: [store, idempotentReplay]
      additionalProperties: false
      properties:
        store:
          $ref: "#/components/schemas/StoreView"
        idempotentReplay:
          type: boolean

    DeliveryOrigin:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    DeliveryAddress:
      type: object
      required: [id, addressText, latitude, longitude, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        addressText:
          type: string
          minLength: 3
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDeliveryAddressRequest:
      type: object
      required: [addressText, latitude, longitude]
      additionalProperties: false
      properties:
        addressText:
          type: string
          minLength: 3
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    UpdateDeliveryAddressRequest:
      type: object
      required: [addressText, latitude, longitude]
      additionalProperties: false
      properties:
        addressText:
          type: string
          minLength: 3
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    DeliveryAddressResponse:
      type: object
      required: [address, idempotentReplay]
      additionalProperties: false
      properties:
        address:
          $ref: "#/components/schemas/DeliveryAddress"
        idempotentReplay:
          type: boolean

    DeliveryAddressListResponse:
      type: object
      required: [addresses, nextCursor]
      additionalProperties: false
      properties:
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAddress"
        nextCursor:
          type: string
          maxLength: 512

    SetStoreDeliveryOriginRequest:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    StoreDeliveryOriginResponse:
      type: object
      required: [storeId, originVersion, origin, idempotentReplay]
      additionalProperties: false
      properties:
        storeId:
          type: string
        originVersion:
          type: integer
          minimum: 0
        origin:
          $ref: "#/components/schemas/DeliveryOrigin"
          nullable: true
        idempotentReplay:
          type: boolean

    SellUnit:
      type: string
      enum: [piece, kg]

    CentralProduct:
      type: object
      required: [id, canonicalName, sellUnit, active, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        canonicalName:
          type: string
        brand:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        canonicalImageUrl:
          type: string
          nullable: true
        sellUnit:
          $ref: "#/components/schemas/SellUnit"
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCentralProductRequest:
      type: object
      required: [canonicalName, sellUnit]
      additionalProperties: false
      properties:
        canonicalName:
          type: string
          minLength: 1
          maxLength: 160
        brand:
          type: string
          nullable: true
          maxLength: 160
        barcode:
          type: string
          nullable: true
          maxLength: 128
        canonicalImageUrl:
          type: string
          nullable: true
          maxLength: 2048
        sellUnit:
          $ref: "#/components/schemas/SellUnit"

    UpdateCentralProductRequest:
      type: object
      required: [canonicalName, active]
      additionalProperties: false
      properties:
        canonicalName:
          type: string
          minLength: 1
          maxLength: 160
        brand:
          type: string
          nullable: true
          maxLength: 160
        barcode:
          type: string
          nullable: true
          maxLength: 128
        canonicalImageUrl:
          type: string
          nullable: true
          maxLength: 2048
        active:
          type: boolean

    CentralProductResponse:
      type: object
      required: [product, idempotentReplay]
      additionalProperties: false
      properties:
        product:
          $ref: "#/components/schemas/CentralProduct"
        idempotentReplay:
          type: boolean

    CentralProductListResponse:
      type: object
      required: [products]
      additionalProperties: false
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/CentralProduct"

    AssortmentPublicationState:
      type: string
      enum: [draft, published, hidden]

    StoreAssortment:
      type: object
      required: [storeId, productId, canonicalName, sellUnit, productActive, productVersion, priceMinor, currency, availability, publicationState, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        storeId:
          type: string
        productId:
          type: string
        canonicalName:
          type: string
        brand:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        canonicalImageUrl:
          type: string
          nullable: true
        sellUnit:
          $ref: "#/components/schemas/SellUnit"
        productActive:
          type: boolean
        productVersion:
          type: integer
          minimum: 1
        priceMinor:
          type: integer
          minimum: 1
        currency:
          type: string
          const: YER
        availability:
          type: boolean
        publicationState:
          $ref: "#/components/schemas/AssortmentPublicationState"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateStoreAssortmentRequest:
      type: object
      required: [productId, priceMinor]
      additionalProperties: false
      properties:
        productId:
          type: string
          minLength: 1
          maxLength: 128
        priceMinor:
          type: integer
          minimum: 1

    UpdateStoreAssortmentRequest:
      type: object
      required: [priceMinor, availability, publicationState]
      additionalProperties: false
      properties:
        priceMinor:
          type: integer
          minimum: 1
        availability:
          type: boolean
        publicationState:
          $ref: "#/components/schemas/AssortmentPublicationState"

    StoreAssortmentResponse:
      type: object
      required: [assortment, idempotentReplay]
      additionalProperties: false
      properties:
        assortment:
          $ref: "#/components/schemas/StoreAssortment"
        idempotentReplay:
          type: boolean

    StoreAssortmentListResponse:
      type: object
      required: [assortments]
      additionalProperties: false
      properties:
        assortments:
          type: array
          items:
            $ref: "#/components/schemas/StoreAssortment"

    PublicStoreView:
      type: object
      required: [id, name, version, assortments, publishedAt, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: integer
          minimum: 1
        assortments:
          type: array
          items:
            $ref: "#/components/schemas/StoreAssortment"
        publishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublishedStoreListResponse:
      type: object
      required: [stores]
      additionalProperties: false
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/PublicStoreView"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    InvalidInput:
      description: Invalid input or request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthenticated:
      description: Service authentication token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    IdentityUnavailable:
      description: Upstream identity dependency error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: The authenticated actor is not permitted to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: The request conflicts with canonical state or idempotency.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: The requested canonical record was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    DependencyUnavailable:
      description: A required DSH or Identity dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
