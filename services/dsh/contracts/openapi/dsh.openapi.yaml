          type: integer
          minimum: 1
        serviceabilityAddressVersion:
          type: integer
          minimum: 1
        state:
          $ref: "#/components/schemas/OrderState"
        totalAmountMinor:
          type: integer
          minimum: 1
        currency:
          type: string
          const: YER
        version:
          type: integer
          minimum: 1
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderResponse:
      type: object
      required: [order, idempotentReplay]
      additionalProperties: false
      properties:
        order:
          $ref: "#/components/schemas/Order"
        idempotentReplay:
          type: boolean

    OrderListResponse:
      type: object
      required: [orders]
      additionalProperties: false
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    OrderTransitionRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [PARTNER_ACCEPTED, PREPARING, READY_FOR_DISPATCH, REJECTED]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    InvalidInput:
      description: Invalid input or request body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthenticated:
      description: Service authentication token is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    IdentityUnavailable:
      description: Upstream identity dependency error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: The authenticated actor is not permitted to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: The request conflicts with canonical state or idempotency.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: The requested canonical record was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    DependencyUnavailable:
      description: A required DSH or Identity dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
