          minimum: 1
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        publicationReadiness:
          $ref: "#/components/schemas/StorePublicationReadiness"
        publicationChangedAt:
          type: string
          format: date-time
          nullable: true
        storeProfileImage:
          $ref: "#/components/schemas/StoreProfileImage"
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicationState:
      type: string
      enum: [unpublished, published, hidden]

    PublicationAction:
      type: string
      enum: [published, hidden]

    StorePublicationRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/PublicationAction"

    StorePublicationResponse:
      type: object
