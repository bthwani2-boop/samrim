openapi: 3.1.0
info:
  title: BThwani DSH API
  version: 1.0.0
  description: |
    Canonical operational contract for DSH (Delivery, Shopping, Hospitality/Operations).
    Owns operational boundaries and domain workflows. Identity owns human actor and role lifecycle truth.
servers:
  - url: http://127.0.0.1:18080

paths:
  /dsh/health:
    $ref: "./paths/runtime.yaml#/paths/~1dsh~1health"

  /dsh/readiness:
    $ref: "./paths/runtime.yaml#/paths/~1dsh~1readiness"

  /dsh/joining-cases:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases"

  /dsh/joining-cases/self:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases~1self"

  /dsh/joining-cases/{caseId}:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases~1{caseId}"

  /dsh/joining-cases/{caseId}/submit:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases~1{caseId}~1submit"

  /dsh/joining-cases/{caseId}/correct-and-resubmit:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases~1{caseId}~1correct-and-resubmit"

  /dsh/joining-cases/{caseId}/review:
    $ref: "./paths/joining-cases.yaml#/paths/~1dsh~1joining-cases~1{caseId}~1review"

  /dsh/catalog/verticals:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1catalog~1verticals"

  /dsh/catalog/categories:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1catalog~1categories"

  /dsh/catalog/products:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1catalog~1products"

  /dsh/catalog/products/{productId}:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1catalog~1products~1{productId}"

  /dsh/stores/{storeId}/offers:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1stores~1{storeId}~1offers"

  /dsh/stores/{storeId}/offers/{offerId}:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1stores~1{storeId}~1offers~1{offerId}"

  /dsh/public/stores/{storeId}/catalog:
    $ref: "./paths/catalog.yaml#/paths/~1dsh~1public~1stores~1{storeId}~1catalog"

  /dsh/stores/{storeId}/publication:
    $ref: "./paths/store-publication.yaml#/paths/~1dsh~1stores~1{storeId}~1publication"

  /dsh/public/stores:
    $ref: "./paths/store-publication.yaml#/paths/~1dsh~1public~1stores"

  /dsh/public/stores/{storeId}:
    $ref: "./paths/store-publication.yaml#/paths/~1dsh~1public~1stores~1{storeId}"

  /dsh/addresses:
    $ref: "./paths/location-core.yaml#/paths/~1dsh~1addresses"

  /dsh/addresses/{addressId}:
    $ref: "./paths/location-core.yaml#/paths/~1dsh~1addresses~1{addressId}"

  /dsh/stores/{storeId}/delivery-origin:
    $ref: "./paths/location-core.yaml#/paths/~1dsh~1stores~1{storeId}~1delivery-origin"

  /dsh/service-cities:
    $ref: "./paths/service-city.yaml#/paths/~1dsh~1service-cities"

  /dsh/service-cities/{cityId}:
    $ref: "./paths/service-city.yaml#/paths/~1dsh~1service-cities~1{cityId}"

  /dsh/public/service-cities:
    $ref: "./paths/service-city.yaml#/paths/~1dsh~1public~1service-cities"

  /dsh/serviceability:
    $ref: "./paths/serviceability.yaml#/paths/~1dsh~1serviceability"

  /dsh/cart:
    $ref: "./paths/commerce.yaml#/paths/~1dsh~1cart"

  /dsh/cart/lines:
    $ref: "./paths/commerce.yaml#/paths/~1dsh~1cart~1lines"

  /dsh/cart/lines/{lineId}:
    $ref: "./paths/commerce.yaml#/paths/~1dsh~1cart~1lines~1{lineId}"

  /dsh/cart/checkout:
    $ref: "./paths/commerce.yaml#/paths/~1dsh~1cart~1checkout"

  /dsh/orders:
    $ref: "./paths/commerce.yaml#/paths/~1dsh~1orders"

  /dsh/orders/{orderId}:
    $ref: "./paths/commerce.yaml#/paths/~1dsh~1orders~1{orderId}"

  /dsh/stores/{storeId}/orders:
    $ref: "./paths/commerce.yaml#/paths/~1dsh~1stores~1{storeId}~1orders"

  /dsh/stores/{storeId}/orders/{orderId}:
    $ref: "./paths/commerce.yaml#/paths/~1dsh~1stores~1{storeId}~1orders~1{orderId}"

  /dsh/stores/{storeId}/orders/{orderId}/transition:
    $ref: "./paths/commerce.yaml#/paths/~1dsh~1stores~1{storeId}~1orders~1{orderId}~1transition"

components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: token
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: token

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    ActingActorId:
      name: X-Acting-Actor-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    ActingActorIdRequired:
      name: X-Acting-Actor-ID
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    CorrelationIdRequired:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ExpectedVersion:
      name: X-Expected-Version
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
    ExpectedVersionRequired:
      name: X-Expected-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 1

    CartExpectedVersionRequired:
      name: X-Expected-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
    OriginVersionRequired:
      name: X-Expected-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    VerticalId:
      name: verticalId
      in: query
      required: false
      schema:
        type: string
        minLength: 2
        maxLength: 128

    VerticalIdRequired:
      name: verticalId
      in: query
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 128

    ServiceCityIdRequired:
      name: serviceCityId
      in: query
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 128

    CityId:
      name: cityId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'

  schemas:
    StatusResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string

    CreateJoiningCaseRequest:
      type: object
      required: [contactPhoneE164, businessName, firstStoreName, serviceCityId, firstStoreVerticalId]
      additionalProperties: false
      properties:
        contactPhoneE164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        businessName:
          type: string
          minLength: 2
          maxLength: 160
        firstStoreName:
          type: string
          minLength: 2
          maxLength: 160
        serviceCityId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'

    JoiningCaseState:
      type: string
      enum: [draft, submitted, needs_correction, approved]

    JoiningCaseView:
      type: object
      required: [id, contactPhoneE164, businessName, firstStoreName, serviceCityId, firstStoreVerticalId, state, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        contactPhoneE164:
          type: string
        businessName:
          type: string
        firstStoreName:
          type: string
        serviceCityId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        partnerActorId:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/JoiningCaseState"
        correctionReason:
          type: string
          nullable: true
        reviewedBy:
          type: string
          nullable: true
        store:
          $ref: "#/components/schemas/StoreView"
          nullable: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JoiningCaseResponse:
      type: object
      required: [case, idempotentReplay]
      additionalProperties: false
      properties:
        case:
          $ref: "#/components/schemas/JoiningCaseView"
        idempotentReplay:
          type: boolean

    JoiningCaseSummary:
      type: object
      required: [id, contactPhoneE164, businessName, firstStoreName, serviceCityId, firstStoreVerticalId, state, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        contactPhoneE164:
          type: string
        businessName:
          type: string
        firstStoreName:
          type: string
        serviceCityId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        partnerActorId:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/JoiningCaseState"
        correctionReason:
          type: string
          nullable: true
        reviewedBy:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JoiningCaseListResponse:
      type: object
      required: [cases]
      additionalProperties: false
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/JoiningCaseSummary"
        nextCursor:
          type: string

    CorrectJoiningCaseRequest:
      type: object
      required: [businessName, firstStoreName, serviceCityId, firstStoreVerticalId]
      additionalProperties: false
      properties:
        businessName:
          type: string
          minLength: 2
          maxLength: 160
        firstStoreName:
          type: string
          minLength: 2
          maxLength: 160
        serviceCityId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'

    ReviewJoiningCaseRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approved, needs_correction]
        correctionReason:
          type: string
          nullable: true
          maxLength: 500

    StorePublicationReadiness:
      type: object
      required: [ready]
      additionalProperties: false
      properties:
        ready:
          type: boolean
        blockedReason:
          type: string
          enum: [PARTNER_IDENTITY_NOT_ELIGIBLE, SERVICE_CITY_NOT_ELIGIBLE, CATALOG_NOT_READY]

    StoreView:
      type: object
      required: [id, partnerActorId, name, serviceCityId, primaryVerticalId, version, publicationState, publicationReadiness, offers, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        partnerActorId:
          type: string
        name:
          type: string
        serviceCityId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        primaryVerticalId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        version:
          type: integer
          minimum: 1
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        publicationReadiness:
          $ref: "#/components/schemas/StorePublicationReadiness"
        publicationChangedAt:
          type: string
          format: date-time
          nullable: true
        offers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogStoreOffer"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicationState:
      type: string
      enum: [unpublished, published, hidden]

    PublicationAction:
      type: string
      enum: [published, hidden]

    StorePublicationRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/PublicationAction"

    StorePublicationResponse:
      type: object
      required: [store, idempotentReplay]
      additionalProperties: false
      properties:
        store:
          $ref: "#/components/schemas/StoreView"
        idempotentReplay:
          type: boolean

    DeliveryOrigin:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    DeliveryAddress:
      type: object
      required: [id, addressText, latitude, longitude, serviceCityId, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        addressText:
          type: string
          minLength: 3
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        serviceCityId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDeliveryAddressRequest:
      type: object
      required: [addressText, latitude, longitude, serviceCityId]
      additionalProperties: false
      properties:
        addressText:
          type: string
          minLength: 3
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        serviceCityId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'

    UpdateDeliveryAddressRequest:
      type: object
      required: [addressText, latitude, longitude, serviceCityId]
      additionalProperties: false
      properties:
        addressText:
          type: string
          minLength: 3
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        serviceCityId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'

    DeliveryAddressResponse:
      type: object
      required: [address, idempotentReplay]
      additionalProperties: false
      properties:
        address:
          $ref: "#/components/schemas/DeliveryAddress"
        idempotentReplay:
          type: boolean

    DeliveryAddressListResponse:
      type: object
      required: [addresses, nextCursor]
      additionalProperties: false
      properties:
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryAddress"
        nextCursor:
          type: string
          maxLength: 512

    SetStoreDeliveryOriginRequest:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    StoreDeliveryOriginResponse:
      type: object
      required: [storeId, originVersion, origin, idempotentReplay]
      additionalProperties: false
      properties:
        storeId:
          type: string
        originVersion:
          type: integer
          minimum: 0
        origin:
          $ref: "#/components/schemas/DeliveryOrigin"
          nullable: true
        idempotentReplay:
          type: boolean

    SellUnit:
      type: string
      enum: [piece, kg]

    CatalogProduct:
      type: object
      required: [id, verticalId, scope, canonicalName, active, version, variants, categoryIds, media, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        verticalId:
          type: string
          nullable: true
        scope:
          type: string
          enum: [SHARED, STORE_SCOPED]
        canonicalName:
          type: string
        brand:
          type: string
          nullable: true
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

        variants:
          type: array
          items:
            $ref: "#/components/schemas/CatalogVariant"
        categoryIds:
          type: array
          items:
            type: string
        media:
          type: array
          items:
            $ref: "#/components/schemas/CatalogMedia"

    CatalogVariant:
      type: object
      required: [id, productId, title, sellUnit, active, version, identifiers, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        productId:
          type: string
        title:
          type: string
        sellUnit:
          $ref: "#/components/schemas/SellUnit"
        active:
          type: boolean
        version:
          type: integer
          minimum: 1
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogIdentifier"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CatalogIdentifier:
      type: object
      required: [type, value]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [GTIN, EAN, UPC, SKU, LEGACY_BARCODE]
        value:
          type: string

    CatalogMedia:
      type: object
      required: [uri, role, ordinal]
      additionalProperties: false
      properties:
        uri:
          type: string
        role:
          type: string
          enum: [primary, gallery]
        ordinal:
          type: integer

    CreateCatalogProductRequest:
      type: object
      required: [verticalId, scope, canonicalName, sellUnit, categoryIds]
      additionalProperties: false
      properties:
        canonicalName:
          type: string
          minLength: 1
          maxLength: 160
        verticalId:
          type: string
        scope:
          type: string
          enum: [SHARED, STORE_SCOPED]
        brand:
          type: string
          nullable: true
          maxLength: 160
        variantTitle:
          type: string
          nullable: true
          maxLength: 160
        sellUnit:
          $ref: "#/components/schemas/SellUnit"
        categoryIds:
          type: array
          items:
            type: string
        identifierType:
          type: string
          nullable: true
          enum: [GTIN, EAN, UPC, SKU]
        identifierValue:
          type: string
          nullable: true
          maxLength: 128
        imageUri:
          type: string
          nullable: true
          maxLength: 2048

    UpdateCatalogProductRequest:
      type: object
      required: [verticalId, scope, canonicalName, active]
      additionalProperties: false
      properties:
        canonicalName:
          type: string
          minLength: 1
          maxLength: 160
        verticalId:
          type: string
        scope:
          type: string
          enum: [SHARED, STORE_SCOPED]
        brand:
          type: string
          nullable: true
          maxLength: 160
        active:
          type: boolean

    CatalogProductResponse:
      type: object
      required: [product, idempotentReplay]
      additionalProperties: false
      properties:
        product:
          $ref: "#/components/schemas/CatalogProduct"
        idempotentReplay:
          type: boolean

    CatalogProductListResponse:
      type: object
      required: [products]
      additionalProperties: false
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"

    StoreOfferPublicationState:
      type: string
      enum: [draft, published, hidden]

    CatalogStoreOffer:
      type: object
      required: [offerId, storeId, variantId, productId, productName, sellUnit, productActive, variantActive, priceMinor, currency, quantityPolicy, pricingBasis, inventoryPolicy, availability, publicationState, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        offerId:
          type: string
        storeId:
          type: string
        variantId:
          type: string
        productId:
          type: string
        productName:
          type: string
        brand:
          type: string
          nullable: true
        sellUnit:
          $ref: "#/components/schemas/SellUnit"
        productActive:
          type: boolean
        variantActive:
          type: boolean
        productVersion:
          type: integer
          minimum: 1
        priceMinor:
          type: integer
          minimum: 1
        currency:
          type: string
          const: YER
        quantityPolicy:
          type: string
          enum: [DISCRETE, MEASURED]
        pricingBasis:
          type: string
          enum: [PER_UNIT, PER_KILOGRAM]
        inventoryPolicy:
          type: string
          const: AVAILABILITY_ONLY
        availability:
          type: boolean
        publicationState:
          $ref: "#/components/schemas/StoreOfferPublicationState"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateStoreOfferRequest:
      type: object
      required: [variantId, priceMinor, quantityPolicy, pricingBasis]
      additionalProperties: false
      properties:
        variantId:
          type: string
          minLength: 1
          maxLength: 128
        priceMinor:
          type: integer
          minimum: 1
        quantityPolicy:
          type: string
          enum: [DISCRETE, MEASURED]
        pricingBasis:
          type: string
          enum: [PER_UNIT, PER_KILOGRAM]

    UpdateStoreOfferRequest:
      type: object
      required: [priceMinor, availability, publicationState]
      additionalProperties: false
      properties:
        priceMinor:
          type: integer
          minimum: 1
        availability:
          type: boolean
        publicationState:
          $ref: "#/components/schemas/StoreOfferPublicationState"

    CatalogStoreOfferResponse:
      type: object
      required: [offer, idempotentReplay]
      additionalProperties: false
      properties:
        offer:
          $ref: "#/components/schemas/CatalogStoreOffer"
        idempotentReplay:
          type: boolean

    CatalogStoreOfferListResponse:
      type: object
      required: [offers]
      additionalProperties: false
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogStoreOffer"

    CommerceVertical:
      type: object
      required: [id, nameAr, nameEn, active, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
        active:
          type: boolean
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCommerceVerticalRequest:
      type: object
      required: [id, nameAr, nameEn, active]
      additionalProperties: false
      properties:
        id:
          type: string
        nameAr:
          type: string
        nameEn:
          type: string
        active:
          type: boolean

    CommerceVerticalResponse:
      type: object
      required: [vertical, idempotentReplay]
      additionalProperties: false
      properties:
        vertical:
          $ref: "#/components/schemas/CommerceVertical"
        idempotentReplay:
          type: boolean

    CommerceVerticalListResponse:
      type: object
      required: [verticals]
      additionalProperties: false
      properties:
        verticals:
          type: array
          items:
            $ref: "#/components/schemas/CommerceVertical"

    CatalogCategory:
