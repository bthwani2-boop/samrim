components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: token
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: token

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    ActingActorId:
      name: X-Acting-Actor-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    ActingActorIdRequired:
      name: X-Acting-Actor-ID
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    CorrelationIdRequired:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ExpectedVersion:
      name: X-Expected-Version
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
    ExpectedVersionRequired:
      name: X-Expected-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 1

    CartExpectedVersionRequired:
      name: X-Expected-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    AttributeId:
      name: attributeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ImportRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160

    PromotionId:
      name: promotionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    VerticalId:
      name: verticalId
      in: query
      required: false
      schema:
        type: string
        minLength: 2
        maxLength: 128

    VerticalIdRequired:
      name: verticalId
      in: query
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 128

    ServiceCityIdRequired:
      name: serviceCityId
      in: query
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 128

    CityId:
      name: cityId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'

  schemas:
    StatusResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string

    CreateJoiningCaseRequest:
      type: object
      required: [contactPhoneE164, businessName, firstStoreName, serviceCityId, firstStoreVerticalId, firstStoreLatitude, firstStoreLongitude, firstStoreFulfillmentModes]
      additionalProperties: false
      properties:
        contactPhoneE164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        businessName:
          type: string
          minLength: 2
          maxLength: 160
        firstStoreName:
          type: string
          minLength: 2
          maxLength: 160
        serviceCityId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreLatitude:
          type: number
          minimum: -90
          maximum: 90
        firstStoreLongitude:
          type: number
          minimum: -180
          maximum: 180
        firstStoreFulfillmentModes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/StoreFulfillmentMode"

    JoiningCaseState:
      type: string
      enum: [draft, submitted, needs_correction, approved]

    JoiningCaseOrigin:
      type: string
      enum: [field, control_panel]

    StoreProfileImage:
      type: object
      required: [uri, role]
      additionalProperties: false
      properties:
        uri:
          type: string
          format: uri
        role:
          type: string
          const: primary

    JoiningCaseView:
      type: object
      required: [id, contactPhoneE164, businessName, firstStoreName, serviceCityId, firstStoreVerticalId, firstStoreLatitude, firstStoreLongitude, firstStoreFulfillmentModes, origin, state, financialProfileState, termsPolicyVersion, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        contactPhoneE164:
          type: string
        businessName:
          type: string
        firstStoreName:
          type: string
        serviceCityId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreLatitude:
          type: number
          nullable: true
          minimum: -90
          maximum: 90
        firstStoreLongitude:
          type: number
          nullable: true
          minimum: -180
          maximum: 180
        firstStoreFulfillmentModes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/StoreFulfillmentMode"
        origin:
          $ref: "#/components/schemas/JoiningCaseOrigin"
        partnerActorId:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/JoiningCaseState"
        commissionRateBps:
          type: integer
          nullable: true
          x-go-pointer: true
          minimum: 0
          maximum: 10000
        settlementPeriod:
          type: string
          nullable: true
          x-go-pointer: true
          enum: [DAILY, WEEKLY, MONTHLY]
        financialProfileId:
          type: string
          nullable: true
          x-go-pointer: true
        financialProfileState:
          type: string
          enum: [REQUIRED, PENDING_BINDING, ACTIVE, FAILED]
        termsPolicyVersion:
          type: string
          nullable: true
          x-go-pointer: true
          maxLength: 128
        correctionReason:
          type: string
          nullable: true
        reviewedBy:
          type: string
          nullable: true
        store:
          $ref: "#/components/schemas/StoreView"
          nullable: true
        storeProfileImage:
          $ref: "#/components/schemas/StoreProfileImage"
          nullable: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JoiningCaseResponse:
      type: object
      required: [case, idempotentReplay]
      additionalProperties: false
      properties:
        case:
          $ref: "#/components/schemas/JoiningCaseView"
        idempotentReplay:
          type: boolean

    PartnerManagedStore:
      type: object
      required: [id, name, serviceCityId, primaryVerticalId, fulfillmentModes, version, publicationState, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        serviceCityId:
          type: string
        primaryVerticalId:
          type: string
        fulfillmentModes:
          type: array
          items:
            $ref: "#/components/schemas/StoreFulfillmentMode"
        version:
          type: integer
          minimum: 1
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PartnerStoreListResponse:
      type: object
      required: [stores]
      additionalProperties: false
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/PartnerManagedStore"
        nextCursor:
          type: string

    OperatorStoreSummary:
      type: object
      required: [id, partnerActorId, name, serviceCityId, primaryVerticalId, version, publicationState, fulfillmentModes, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        partnerActorId:
          type: string
        name:
          type: string
        serviceCityId:
          type: string
          nullable: true
        primaryVerticalId:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 1
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        fulfillmentModes:
          type: array
          items:
            $ref: "#/components/schemas/StoreFulfillmentMode"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OperatorStoreListResponse:
      type: object
      required: [stores]
      additionalProperties: false
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/OperatorStoreSummary"
        nextCursor:
          type: string

    JoiningCaseSummary:
      type: object
      required: [id, contactPhoneE164, businessName, firstStoreName, serviceCityId, firstStoreVerticalId, firstStoreLatitude, firstStoreLongitude, origin, state, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        contactPhoneE164:
          type: string
        businessName:
          type: string
        firstStoreName:
          type: string
        serviceCityId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreLatitude:
          type: number
          nullable: true
          minimum: -90
          maximum: 90
        firstStoreLongitude:
          type: number
          nullable: true
          minimum: -180
          maximum: 180
        origin:
          $ref: "#/components/schemas/JoiningCaseOrigin"
        partnerActorId:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/JoiningCaseState"
        correctionReason:
          type: string
          nullable: true
        reviewedBy:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JoiningCaseListResponse:
      type: object
      required: [cases]
      additionalProperties: false
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/JoiningCaseSummary"
        nextCursor:
          type: string

    CorrectJoiningCaseRequest:
      type: object
      required: [businessName, firstStoreName, serviceCityId, firstStoreVerticalId, firstStoreLatitude, firstStoreLongitude]
      additionalProperties: false
      properties:
        businessName:
          type: string
          minLength: 2
          maxLength: 160
        firstStoreName:
          type: string
          minLength: 2
          maxLength: 160
        serviceCityId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreLatitude:
          type: number
          minimum: -90
          maximum: 90
        firstStoreLongitude:
          type: number
          minimum: -180
          maximum: 180
    ReviewJoiningCaseRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approved, needs_correction]
        correctionReason:
          type: string
          nullable: true
          maxLength: 500
        expectedTermsPolicyVersion:
          type: string
          minLength: 1
          maxLength: 128
    BindJoiningCaseFinancialTermsRequest:
      type: object
      required: [expectedTermsPolicyVersion]
      additionalProperties: false
      properties:
        expectedTermsPolicyVersion:
          type: string
          minLength: 1
          maxLength: 128
    PartnerFinancialTermsPolicy:
      type: object
      required: [id, policyVersion, state, commissionRateBps, settlementPeriod, version, createdBy, createdAt, retiredAt]
      additionalProperties: false
      properties:
        id:
          type: string
        policyVersion:
          type: string
          maxLength: 128
        state:
          type: string
          enum: [ACTIVE, RETIRED]
        commissionRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        settlementPeriod:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        version:
          type: integer
          minimum: 1
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        retiredAt:
          type: string
          format: date-time
          nullable: true
    PartnerFinancialTermsPolicyResponse:
      type: object
      required: [policy]
      additionalProperties: false
      properties:
        policy:
          $ref: "#/components/schemas/PartnerFinancialTermsPolicy"
        idempotentReplay:
          type: boolean
    CreatePartnerFinancialTermsPolicyRequest:
      type: object
      required: [commissionRateBps, settlementPeriod, expectedVersion, reason]
      additionalProperties: false
      properties:
        commissionRateBps:
          type: integer
          minimum: 0
          maximum: 10000
        settlementPeriod:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 5
          maxLength: 500

    StorePublicationReadiness:
      type: object
      required: [ready]
      additionalProperties: false
      properties:
        ready:
          type: boolean
        blockedReason:
          type: string
          enum: [PARTNER_IDENTITY_NOT_ELIGIBLE, FINANCIAL_PROFILE_NOT_READY, SERVICE_CITY_NOT_ELIGIBLE, CATALOG_NOT_READY]

    StoreView:
      type: object
      required: [id, partnerActorId, name, serviceCityId, primaryVerticalId, deliveryOrigin, fulfillmentModes, version, publicationState, publicationReadiness, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
