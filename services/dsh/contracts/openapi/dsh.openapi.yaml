  /dsh/field/joining-cases:
    $ref: "./paths/field.yaml#/paths/~1dsh~1field~1joining-cases"

  /dsh/field/joining-cases/{caseId}:
    $ref: "./paths/field.yaml#/paths/~1dsh~1field~1joining-cases~1{caseId}"

  /dsh/field/joining-cases/{caseId}/submit:
    $ref: "./paths/field.yaml#/paths/~1dsh~1field~1joining-cases~1{caseId}~1submit"

components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: token
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: token

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    ActingActorId:
      name: X-Acting-Actor-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    ActingActorIdRequired:
      name: X-Acting-Actor-ID
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
    CorrelationIdRequired:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    ExpectedVersion:
      name: X-Expected-Version
      in: header
      required: false
      schema:
        type: integer
        minimum: 1
    ExpectedVersionRequired:
      name: X-Expected-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 1

    CartExpectedVersionRequired:
      name: X-Expected-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
    OriginVersionRequired:
      name: X-Expected-Version
      in: header
      required: true
      schema:
        type: integer
        minimum: 0
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    AttributeId:
      name: attributeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    ImportRunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160

    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128

    VerticalId:
      name: verticalId
      in: query
      required: false
      schema:
        type: string
        minLength: 2
        maxLength: 128

    VerticalIdRequired:
      name: verticalId
      in: query
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 128

    ServiceCityIdRequired:
      name: serviceCityId
      in: query
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 128

    CityId:
      name: cityId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'

  schemas:
    StatusResponse:
      type: object
      required: [service, status]
      properties:
        service:
          type: string
        status:
          type: string

    CreateJoiningCaseRequest:
      type: object
      required: [contactPhoneE164, businessName, firstStoreName, serviceCityId, firstStoreVerticalId]
      additionalProperties: false
      properties:
        contactPhoneE164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        businessName:
          type: string
          minLength: 2
          maxLength: 160
        firstStoreName:
          type: string
          minLength: 2
          maxLength: 160
        serviceCityId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'

    JoiningCaseState:
      type: string
      enum: [draft, submitted, needs_correction, approved]

    JoiningCaseView:
      type: object
      required: [id, contactPhoneE164, businessName, firstStoreName, serviceCityId, firstStoreVerticalId, state, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        contactPhoneE164:
          type: string
        businessName:
          type: string
        firstStoreName:
          type: string
        serviceCityId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        partnerActorId:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/JoiningCaseState"
        correctionReason:
          type: string
          nullable: true
        reviewedBy:
          type: string
          nullable: true
        store:
          $ref: "#/components/schemas/StoreView"
          nullable: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JoiningCaseResponse:
      type: object
      required: [case, idempotentReplay]
      additionalProperties: false
      properties:
        case:
          $ref: "#/components/schemas/JoiningCaseView"
        idempotentReplay:
          type: boolean

    JoiningCaseSummary:
      type: object
      required: [id, contactPhoneE164, businessName, firstStoreName, serviceCityId, firstStoreVerticalId, state, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        contactPhoneE164:
          type: string
        businessName:
          type: string
        firstStoreName:
          type: string
        serviceCityId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        partnerActorId:
          type: string
          nullable: true
        state:
          $ref: "#/components/schemas/JoiningCaseState"
        correctionReason:
          type: string
          nullable: true
        reviewedBy:
          type: string
          nullable: true
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JoiningCaseListResponse:
      type: object
      required: [cases]
      additionalProperties: false
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/JoiningCaseSummary"
        nextCursor:
          type: string

    CorrectJoiningCaseRequest:
      type: object
      required: [businessName, firstStoreName, serviceCityId, firstStoreVerticalId]
      additionalProperties: false
      properties:
        businessName:
          type: string
          minLength: 2
          maxLength: 160
        firstStoreName:
          type: string
          minLength: 2
          maxLength: 160
        serviceCityId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        firstStoreVerticalId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'

    ReviewJoiningCaseRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approved, needs_correction]
        correctionReason:
          type: string
          nullable: true
          maxLength: 500

    StorePublicationReadiness:
      type: object
      required: [ready]
      additionalProperties: false
      properties:
        ready:
          type: boolean
        blockedReason:
          type: string
          enum: [PARTNER_IDENTITY_NOT_ELIGIBLE, SERVICE_CITY_NOT_ELIGIBLE, CATALOG_NOT_READY]

    StoreView:
      type: object
      required: [id, partnerActorId, name, serviceCityId, primaryVerticalId, version, publicationState, publicationReadiness, offers, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        partnerActorId:
          type: string
        name:
          type: string
        serviceCityId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        primaryVerticalId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        version:
          type: integer
          minimum: 1
        publicationState:
          $ref: "#/components/schemas/PublicationState"
        publicationReadiness:
          $ref: "#/components/schemas/StorePublicationReadiness"
        publicationChangedAt:
          type: string
          format: date-time
          nullable: true
        offers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogStoreOffer"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PublicationState:
      type: string
      enum: [unpublished, published, hidden]

    PublicationAction:
      type: string
      enum: [published, hidden]

    StorePublicationRequest:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/PublicationAction"

    StorePublicationResponse:
      type: object
      required: [store, idempotentReplay]
      additionalProperties: false
      properties:
        store:
          $ref: "#/components/schemas/StoreView"
        idempotentReplay:
          type: boolean

    DeliveryOrigin:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    DeliveryAddress:
      type: object
      required: [id, addressText, latitude, longitude, serviceCityId, version, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
        addressText:
          type: string
          minLength: 3
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        serviceCityId:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDeliveryAddressRequest:
      type: object
      required: [addressText, latitude, longitude, serviceCityId]
      additionalProperties: false
      properties:
        addressText:
          type: string
          minLength: 3
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        serviceCityId:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,127}$'

    UpdateDeliveryAddressRequest:
      type: object
      required: [addressText, latitude, longitude, serviceCityId]
      additionalProperties: false
      properties:
        addressText:
          type: string
