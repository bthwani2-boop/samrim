openapi: 3.1.0
info:
  title: BThwani DSH API
  version: 0.1.0
  description: DSH public discovery plus isolated-development authenticated Store availability and versioned Operator city policy writer. No checkout or financial activation.
paths:
  /health:
    $ref: './paths/runtime.yaml#/paths/~1health'
  /v1/public/stores:
    $ref: './paths/stores.yaml#/paths/~1v1~1public~1stores'
  /v1/public/stores/{id}:
    $ref: './paths/stores.yaml#/paths/~1v1~1public~1stores~1{id}'
  /v1/public/stores/{id}/offers:
    $ref: './paths/offers.yaml#/paths/~1v1~1public~1stores~1{id}~1offers'
  /v1/stores/mine:
    $ref: './paths/store-access.yaml#/paths/~1v1~1stores~1mine'
  /v1/stores/{storeID}/availability:
    $ref: './paths/store-access.yaml#/paths/~1v1~1stores~1{storeID}~1availability'
  /v1/captains/me/standing:
    $ref: './paths/captain-standing.yaml#/paths/~1v1~1captains~1me~1standing'
  /v1/actors/me/captain-eligibility:
    $ref: './paths/captain-standing.yaml#/paths/~1v1~1actors~1me~1captain-eligibility'
  /v1/actors/me/captain-application:
    $ref: './paths/captain-standing.yaml#/paths/~1v1~1actors~1me~1captain-application'
  /v1/operators/captains/{actorId}/standing:
    $ref: './paths/captain-standing.yaml#/paths/~1v1~1operators~1captains~1{actorId}~1standing'
  /v1/operators/cities/{cityID}/store-availability-policy:
    $ref: './paths/operational-policies.yaml#/paths/~1v1~1operators~1cities~1{cityID}~1store-availability-policy'
components:
  securitySchemes:
    OpaqueSession:
      type: http
      scheme: bearer
      description: Identity-authenticated current opaque bearer; DSH independently checks Store action and owner policy
  parameters:
    StoreId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicId' }
  schemas:
    PublicId:
      type: string
      pattern: '^[a-z0-9-]{1,64}$'
      minLength: 1
      maxLength: 64
    PublicStore:
      type: object
      additionalProperties: false
      required: [id, name, cityId, verticalId, orderabilityStatus, orderingAvailable]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        name: { type: string, minLength: 1, maxLength: 120 }
        cityId: { $ref: '#/components/schemas/PublicId' }
        verticalId: { $ref: '#/components/schemas/PublicId' }
        orderabilityStatus: { type: string, enum: [OPEN_FOR_ORDERS, CLOSED_BY_SCHEDULE, PAUSED, OPERATIONALLY_UNAVAILABLE] }
        orderingAvailable: { type: boolean, const: false, description: "The checkout/fulfillment journey is not activated" }
    MerchantOwnedStore:
      type: object
      additionalProperties: false
      required: [id, name, relation, published]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        name: { type: string, minLength: 1, maxLength: 120 }
        relation: { type: string, enum: [MARKETPLACE, DIRECT] }
        published: { type: boolean }
    MerchantStoreStanding:
      type: object
      additionalProperties: false
      required: [actorId, stores]
      properties:
        actorId: { type: string, minLength: 1, maxLength: 128 }
        stores:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/MerchantOwnedStore' }
    PublicOffer:
      type: object
      additionalProperties: false
      required: [id, storeId, name, variantId, priceYer, available]
      properties:
        id: { $ref: '#/components/schemas/PublicId' }
        storeId: { $ref: '#/components/schemas/PublicId' }
        name: { type: string, minLength: 1, maxLength: 160 }
        variantId: { $ref: '#/components/schemas/PublicId' }
        priceYer: { type: integer, minimum: 1, description: Exact positive integer YER value from DSH }
        available: { type: boolean, const: true }
    CityStoreOperationalPolicy:
      type: object
      additionalProperties: false
      required: [cityId, version, maxPauseSeconds, maxPreparationMinutes, changedByActor, changeReason, updatedAt]
      properties:
        cityId: { $ref: '#/components/schemas/PublicId' }
        version: { type: integer, minimum: 1 }
        maxPauseSeconds: { type: integer, minimum: 0, maximum: 31536000 }
        maxPreparationMinutes: { type: integer, minimum: 0, maximum: 1440 }
        changedByActor: { type: string, minLength: 1, maxLength: 128 }
        changeReason: { type: string, minLength: 1, maxLength: 300 }
        updatedAt: { type: string, format: date-time }
    CityStoreOperationalPolicyChange:
      type: object
      additionalProperties: false
      required: [operationId, expectedVersion, maxPauseSeconds, maxPreparationMinutes, reason]
      properties:
        operationId: { type: string, pattern: '^[A-Za-z0-9._-]{8,128}$' }
        expectedVersion: { type: integer, minimum: 0, description: 0 only for deliberate first provisioning }
        maxPauseSeconds: { type: integer, minimum: 0, maximum: 31536000 }
        maxPreparationMinutes: { type: integer, minimum: 0, maximum: 1440 }
        reason: { type: string, minLength: 1, maxLength: 300 }
    CityStoreOperationalPolicyResult:
      type: object
      additionalProperties: false
      required: [policy, replay]
      properties:
        policy: { $ref: '#/components/schemas/CityStoreOperationalPolicy' }
        replay: { type: boolean }
    OperationalWeeklyWindow:
      type: object
      additionalProperties: false
      required: [weekday, opens, closes]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0=Sunday, 6=Saturday in DSH city timezone }
        opens: { type: integer, minimum: 0, maximum: 1439 }
        closes: { type: integer, minimum: 0, maximum: 1440 }
    OperationalAvailability:
      type: object
      additionalProperties: false
      required: [storeId, timezone, weekly, preparationMinutes, version, actingActorId, reason]
      properties:
        storeId: { $ref: '#/components/schemas/PublicId' }
        timezone: { type: string, minLength: 3, maxLength: 64, description: Canonical DSH city IANA timezone; never client-chosen }
        weekly:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/OperationalWeeklyWindow' }
        pausedUntil: { type: string, format: date-time, description: Omitted when the Store has no explicit pause }
        preparationMinutes: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        actingActorId: { type: string, maxLength: 128 }
        reason: { type: string, maxLength: 300 }
    OperationalAvailabilityChange:
      type: object
      additionalProperties: false
      required: [operationId, expectedVersion, weekly, preparationMinutes, reason]
      properties:
        operationId: { type: string, pattern: '^[A-Za-z0-9._-]{8,128}$' }
        expectedVersion: { type: integer, minimum: 1 }
        weekly:
          type: array
          items: { $ref: '#/components/schemas/OperationalWeeklyWindow' }
        pausedUntil: { type: [string, 'null'], format: date-time }
        preparationMinutes: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 300 }
    OperationalAvailabilityResult:
      type: object
      additionalProperties: false
      required: [availability, replay]
      properties:
        availability: { $ref: '#/components/schemas/OperationalAvailability' }
        replay: { type: boolean }
    StoreOperationalError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum: [UNAUTHENTICATED, IDENTITY_OWNER_UNAVAILABLE, STORE_OPERATION_FORBIDDEN, STORE_NOT_FOUND, STORE_AVAILABILITY_VERSION_CONFLICT, OPERATIONAL_POLICY_VERSION_CONFLICT, IDEMPOTENCY_KEY_REUSED, INVALID_OPERATIONAL_CHANGE, OPERATION_RESULT_UNKNOWN, OPERATIONAL_POLICY_UNAVAILABLE, OWNER_UNAVAILABLE]
    StorePage:
      type: object
      additionalProperties: false
      required: [items, revision]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicStore' }
        revision: { type: integer, minimum: 0 }
        nextCursor: { type: string, maxLength: 512 }
    OfferPage:
      type: object
      additionalProperties: false
      required: [items, revision]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicOffer' }
        revision: { type: integer, minimum: 0 }
        nextCursor: { type: string, maxLength: 512 }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: Invalid city, page, path or cursor
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Store is not publicly visible, or does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StaleCursor:
      description: Owner revision changed since the previous page; refresh from first page
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OwnerUnavailable:
      description: DSH cannot confirm durable eligibility
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    PolicyPermissionDenied:
      description: The current Identity actor is not an Operator holding explicit platform_policies permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StoreOperationalError' }
    StoreUnauthorized:
      description: Missing, invalid, expired or revoked Identity bearer
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StoreOperationalError' }
    StoreForbidden:
      description: No current Store-specific action grant or effective operations permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StoreOperationalError' }
    StoreMissing:
      description: Canonical Store record does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StoreOperationalError' }
    StoreInvalidChange:
      description: Invalid or unsupported Store operational command
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StoreOperationalError' }
    StoreConflict:
      description: Expected version or owner policy changed; stable operation key was reused
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StoreOperationalError' }
    StoreOperationalUnavailable:
      description: Identity, Store owner, active DSH policy or mutation result cannot be verified; fail closed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StoreOperationalError' }
