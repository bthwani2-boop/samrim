paths:
  /dsh/client/marketing-consent/{channel}:
    get:
      operationId: readClientMarketingConsent
      summary: Read caller-owned promotional contact preference; no consent defaults to OPTED_OUT
      security: [{ serviceBearer: [] }]
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string, enum: [PUSH, SMS, EMAIL, IN_APP] }
      responses:
        "200":
          description: Client's current promotional contact preference
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/MarketingConsentSnapshot" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
    post:
      operationId: changeClientMarketingConsent
      summary: Set or withdraw authenticated client's own promotional consent
      security: [{ serviceBearer: [] }]
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string, enum: [PUSH, SMS, EMAIL, IN_APP] }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - name: X-Expected-Version
          in: header
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [OPTED_IN, OPTED_OUT] }
      responses:
        "200":
          description: Decision and version, including idempotent replay
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/MarketingConsentResult" }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/public/banner-presentation:
    get:
      operationId: readPublicBannerPresentation
      summary: Read published HOME banner presentation settings
      responses:
        "200":
          description: Current marketing-owned banner presentation
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/BannerPresentation" } } }

  /dsh/operator/marketing/banner-presentation:
    get:
      operationId: readOperatorBannerPresentation
      summary: Read marketing banner presentation for operator
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
      responses:
        "200":
          description: Current presentation and version
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/BannerPresentation" } } }
    put:
      operationId: setOperatorBannerPresentation
      summary: Save version-checked marketing banner presentation
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, intervalSeconds]
              properties:
                mode: { type: string, enum: [STATIC, CINEMATIC, CROSSFADE] }
                intervalSeconds: { type: integer, minimum: 3, maximum: 10 }
      responses:
        "200": { description: Updated or replayed presentation }

  /dsh/operator/marketing/studio-draft:
    get:
      operationId: readOperatorStudioDraft
      summary: Read the unpublished shared CLIENT_HOME studio draft
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
      responses:
        "200":
          description: Shared draft (null document before first save) and current version
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StudioDraft" } } }
        "401": { description: Operator authentication is required }
        "403": { description: Operator marketing permission is required }
    put:
      operationId: setOperatorStudioDraft
      summary: Save unpublished version-checked shared CLIENT_HOME template draft
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [document]
              properties:
                document: { $ref: "../dsh.openapi.yaml#/components/schemas/StudioDraftDocument" }
      responses:
        "200": { description: "Saved draft, version and idempotent replay flag" }
        "400": { description: Studio draft input is invalid }
        "401": { description: Operator authentication is required }
        "403": { description: Operator marketing permission is required }
        "409": { description: Stale version or conflicting idempotency key }

  /dsh/public/studio-theme:
    get:
      operationId: readPublicStudioTheme
      summary: Read only the published visual palette, never the unpublished operator draft
      responses:
        "200":
          description: Versioned public palette, null when compiled defaults apply
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StudioThemePublication" } } }

  /dsh/operator/marketing/studio-theme:
    get:
      operationId: readOperatorStudioTheme
      summary: Read the current published palette version and operator attribution
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
      responses:
        "200":
          description: Versioned published palette
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StudioThemePublication" } } }
        "401": { description: Authentication required }
        "403": { description: Marketing permission required }
    put:
      operationId: setOperatorStudioTheme
      summary: Activate a saved draft palette, restore compiled defaults, or rollback to an earlier publication
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/StudioThemePublicationRequest"
      responses:
        "200":
          description: Published or idempotently replayed palette mutation
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StudioThemePublicationMutation" } } }
        "400": { description: Invalid palette or request }
        "401": { description: Authentication required }
        "403": { description: Marketing permission required }
        "409": { description: Stale version or conflicting idempotency key }

  /dsh/operator/marketing/studio-theme/history:
    get:
      operationId: readOperatorStudioThemeHistory
      summary: List the latest 20 published theme revisions for operator rollback
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
      responses:
        "200":
          description: Published version history
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StudioThemeHistory" } } }
        "401": { description: Authentication required }
        "403": { description: Marketing permission required }

  /dsh/public/promotions:
    get:
      operationId: listPublicPromotions
      summary: List currently eligible merchant-funded promotions for a service city and optional Store
      parameters:
        - name: serviceCityId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: storeId
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Customer-safe published promotion readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionListResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/public/discovery-content:
    get:
      operationId: listPublicDiscoveryContent
      summary: List currently published discovery content with canonical target relations
      parameters:
        - name: serviceCityId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Customer-safe published discovery content.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentListResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/public/discovery-content/events:
    post:
      operationId: recordPublicDiscoveryContentEvent
      summary: Record one idempotent discovery-content impression, click, or conversion
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentEventRequest" } } }
      responses:
        "204": { description: Event accepted or idempotently replayed. }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }

  /dsh/public/discovery-content/{contentId}/target:
    get:
      operationId: resolvePublicDiscoveryContentTarget
      summary: Resolve a published discovery target into a client-safe navigation destination
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ContentId" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ServiceCityIdRequired" }
      responses:
        "200":
          description: Client-safe target resolution.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentTargetResolution" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }

  /dsh/operator/promotions/{promotionId}/partner-decisions:
    get:
      operationId: listOperatorPartnerDecisions
      summary: Read Store participation decisions for an operator-selected platform campaign with server pagination
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: promotionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: decision
          in: query
          required: false
          schema: { type: string, enum: [PENDING, OPTED_IN, DECLINED] }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: One page of Store decisions and an optional next cursor, never customer PII.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorPartnerDecisionPage" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }

  /dsh/operator/promotions/{promotionId}/settlement-summary:
    get:
      operationId: readOperatorPromotionSettlementSummary
      summary: Read WLT-posted economic promotion settlements, never click-based revenue
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: promotionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Settled order and ledger expense totals, not net refunds.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionSettlementSummary" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/marketing/campaigns:
    get:
      operationId: listOperatorMarketingCampaigns
      summary: Server-paginated campaign registry, optionally filtered by state
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, PUBLISHED, PAUSED, ENDED, ARCHIVED] }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Ordered campaign page with bounded cursor
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/MarketingCampaignPage"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
    post:
      operationId: createOperatorMarketingCampaign
      summary: Create an idempotent campaign draft with mandatory budget
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/CreateMarketingCampaignRequest"
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/MarketingCampaignResponse"
        "201":
          description: Created campaign draft
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/MarketingCampaignResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/operator/marketing/campaigns/{campaignId}/details:
    get:
      operationId: readOperatorMarketingCampaign
      summary: Read one marketing campaign, including its aggregate assigned caps
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: campaignId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Campaign readback
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/MarketingCampaignResponse" }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }

  /dsh/operator/marketing/campaigns/{campaignId}/elements:
    post:
      operationId: linkOperatorMarketingCampaignElement
      summary: Link a draft promotion or creative to a draft campaign with expected version
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
        - name: campaignId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/MarketingCampaignLinkRequest"
      responses:
        "200":
          description: Canonical campaign budget and resource counts after linking
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/MarketingCampaignResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/operator/marketing/campaigns/{campaignId}/state:
    post:
      operationId: setOperatorMarketingCampaignState
      summary: Versioned, audited, replay-safe campaign state change with readiness checks
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
        - name: campaignId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { type: string, enum: [PUBLISHED, PAUSED, ENDED, ARCHIVED] }
      responses:
        "200":
          description: Changed or replayed campaign state
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/MarketingCampaignResponse" }
        "201":
          description: Accepted state change
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/MarketingCampaignResponse" }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/operator/marketing/summary:
    get:
      operationId: readOperatorMarketingSummary
      summary: Read complete operator publication-state aggregates without page truncation
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
      responses:
        "200":
          description: Aggregated counts across the entire promotion and discovery content registries.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorMarketingSummary" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/promotions:
    get:
      operationId: listOperatorPromotions
      summary: Read the operator-owned promotion registry
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: serviceCityId
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, PUBLISHED, PAUSED] }
        - name: discountKind
          in: query
          required: false
          schema: { type: string, enum: [PERCENTAGE, FIXED] }
        - name: fundingSource
          in: query
          required: false
          schema: { type: string, enum: [BTHWANI, PARTNER, SHARED] }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [starts_desc, starts_asc], default: starts_desc }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Operator promotion registry.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorPromotionRegistryResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
    post:
      operationId: createOperatorPromotion
      summary: Create one merchant-funded promotion in DRAFT state
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreatePromotionRequest" } } }
      responses:
        "201": { description: Promotion created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/operator/promotions/{promotionId}/publication:
    post:
      operationId: setOperatorPromotionPublication
      summary: Publish or pause one promotion with versioned operator attribution
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/PromotionId" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/MarketingPublicationRequest" } } }
      responses:
        "200": { description: Promotion publication readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/operator/discovery-content:
    get:
      operationId: listOperatorDiscoveryContent
      summary: Read the operator-owned discovery content registry
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, PUBLISHED, PAUSED] }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [BANNER, CAROUSEL, SHORT_FORM] }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [priority, created_desc], default: priority }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Operator discovery content registry.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorDiscoveryContentRegistryResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
    post:
      operationId: createOperatorDiscoveryContent
      summary: Create one discovery content item in DRAFT state
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateDiscoveryContentUploadRequest" } } }
      responses:
        "201": { description: Discovery content created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }

  /dsh/operator/discovery-content/{contentId}/publication:
    post:
      operationId: setOperatorDiscoveryContentPublication
      summary: Publish or pause one discovery item after target validation
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ContentId" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/MarketingPublicationRequest" } } }
      responses:
        "200": { description: Discovery content publication readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/operator/discovery-content/analytics:
    get:
      operationId: listOperatorDiscoveryContentAnalytics
      summary: Read aggregated discovery-content impression, click, and conversion counts
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: contentId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Operator-owned analytics readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentAnalyticsListResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/discovery-targets:
    get:
      operationId: listPartnerStoreReelTargets
      summary: List only owned Store products and promotions eligible to be reel destinations
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200":
          description: Product and offer references scoped to the authenticated Store
          content:
            application/json:
              schema:
                type: object
                required: [targets]
                properties:
                  targets:
                    type: array
                    items:
                      type: object
                      required: [targetType, targetId, label]
                      properties:
                        targetType: { type: string, enum: [PRODUCT, PROMOTION] }
                        targetId: { type: string }
                        label: { type: string }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }

  /dsh/partner/stores/{storeId}/discovery-content:
    get:
      operationId: listPartnerStoreReels
      summary: List governed reel drafts for the authenticated Partner's Store
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200":
          description: Store-scoped video submissions and publication status.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorDiscoveryContentRegistryResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
    post:
      operationId: createPartnerStoreReel
      summary: Upload a Store-targeted SHORT_FORM draft for Operator review
      description: Requires an authenticated app-partner session and the scoped promotions grant. The Store path and targetId must match; Partners cannot publish content or impersonate other Stores.
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateDiscoveryContentUploadRequest" } } }
      responses:
        "201":
          description: New draft pending platform approval.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentResponse" } } }
        "200":
          description: Idempotent replay.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }

  /dsh/partner/stores/{storeId}/discovery-content/{contentId}/analytics:
    get:
      operationId: listPartnerStoreContentAnalytics
      summary: Read only own Store short-form media impression, click, and attributed created-order counts
      description: Requires an authenticated Partner session with Store-scoped promotions authority. A media item must have source_store_id matching the requested Store; another Store's content is never exposed. CONVERSION counts created orders attributed by DSH and does not imply completed sales or earnings.
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ContentId"
      responses:
        "200":
          description: Own Store content-scoped analytics.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentAnalyticsListResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/promotions:
    get:
      operationId: listPartnerStorePromotions
      summary: Read every promotion of one owned Store across its lifecycle
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200":
          description: Owner-scoped promotion lifecycle readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorPromotionRegistryResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
    post:
      operationId: createPartnerStorePromotion
      summary: Author a partner-funded promotion bound to the owned Store
      description: Owner-only. DSH binds the Store scope to the owned path Store and owns the funding source (PARTNER); clients never choose funding.
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreatePromotionRequest" }
      responses:
        "201":
          description: Canonical promotion draft readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } }
        "200":
          description: Idempotent replay.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/campaigns:
    get:
      operationId: listPartnerStoreCampaigns
      summary: List published platform campaigns eligible for the Store with the opt-in state
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200":
          description: Eligible platform campaign readback for the Store.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerCampaignListResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/campaigns/{promotionId}/opt-in:
    post:
      operationId: optInPartnerStoreCampaign
      summary: Record the Store's opt-in decision for a platform campaign
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - name: promotionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CampaignOptInRequest" }
      responses:
        "200":
          description: Canonical campaign opt-in readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerCampaignOptInResponse" } } }
        "201":
          description: Opt-in decision recorded.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerCampaignOptInResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/promotions/{promotionId}/state:
    post:
      operationId: setPartnerStorePromotionState
      summary: Publish, pause or end an owned Store promotion
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - name: promotionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerPromotionStateRequest" }
      responses:
        "200":
          description: Canonical promotion state readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
