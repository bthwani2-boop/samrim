paths:
  /dsh/public/promotions:
    get:
      operationId: listPublicPromotions
      summary: List currently eligible merchant-funded promotions for a service city and optional Store
      parameters:
        - name: serviceCityId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: storeId
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Customer-safe published promotion readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionListResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/public/discovery-content:
    get:
      operationId: listPublicDiscoveryContent
      summary: List currently published discovery content with canonical target relations
      parameters:
        - name: serviceCityId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Customer-safe published discovery content.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentListResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/public/discovery-content/events:
    post:
      operationId: recordPublicDiscoveryContentEvent
      summary: Record one idempotent discovery-content impression, click, or conversion
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentEventRequest" } } }
      responses:
        "204": { description: Event accepted or idempotently replayed. }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }

  /dsh/public/discovery-content/{contentId}/target:
    get:
      operationId: resolvePublicDiscoveryContentTarget
      summary: Resolve a published discovery target into a client-safe navigation destination
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ContentId" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ServiceCityIdRequired" }
      responses:
        "200":
          description: Client-safe target resolution.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentTargetResolution" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }

  /dsh/operator/promotions:
    get:
      operationId: listOperatorPromotions
      summary: Read the operator-owned promotion registry
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: serviceCityId
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, PUBLISHED, PAUSED] }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [starts_desc, starts_asc], default: starts_desc }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Operator promotion registry.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorPromotionRegistryResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
    post:
      operationId: createOperatorPromotion
      summary: Create one merchant-funded promotion in DRAFT state
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreatePromotionRequest" } } }
      responses:
        "201": { description: Promotion created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/operator/promotions/{promotionId}/publication:
    post:
      operationId: setOperatorPromotionPublication
      summary: Publish or pause one promotion with versioned operator attribution
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/PromotionId" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/MarketingPublicationRequest" } } }
      responses:
        "200": { description: Promotion publication readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/operator/discovery-content:
    get:
      operationId: listOperatorDiscoveryContent
      summary: Read the operator-owned discovery content registry
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, PUBLISHED, PAUSED] }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [BANNER, CAROUSEL, SHORT_FORM] }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [priority, created_desc], default: priority }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 2048 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Operator discovery content registry.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorDiscoveryContentRegistryResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
    post:
      operationId: createOperatorDiscoveryContent
      summary: Create one discovery content item in DRAFT state
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateDiscoveryContentUploadRequest" } } }
      responses:
        "201": { description: Discovery content created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }

  /dsh/operator/discovery-content/{contentId}/publication:
    post:
      operationId: setOperatorDiscoveryContentPublication
      summary: Publish or pause one discovery item after target validation
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ContentId" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/MarketingPublicationRequest" } } }
      responses:
        "200": { description: Discovery content publication readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/operator/discovery-content/analytics:
    get:
      operationId: listOperatorDiscoveryContentAnalytics
      summary: Read aggregated discovery-content impression, click, and conversion counts
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: contentId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Operator-owned analytics readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/DiscoveryContentAnalyticsListResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/promotions:
    get:
      operationId: listPartnerStorePromotions
      summary: Read every promotion of one owned Store across its lifecycle
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200":
          description: Owner-scoped promotion lifecycle readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorPromotionRegistryResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
    post:
      operationId: createPartnerStorePromotion
      summary: Author a partner-funded promotion bound to the owned Store
      description: Owner-only. DSH binds the Store scope to the owned path Store and owns the funding source (PARTNER); clients never choose funding.
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreatePromotionRequest" }
      responses:
        "201":
          description: Canonical promotion draft readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } }
        "200":
          description: Idempotent replay.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/campaigns:
    get:
      operationId: listPartnerStoreCampaigns
      summary: List published platform campaigns eligible for the Store with the opt-in state
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200":
          description: Eligible platform campaign readback for the Store.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerCampaignListResponse" } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/campaigns/{promotionId}/opt-in:
    post:
      operationId: optInPartnerStoreCampaign
      summary: Record the Store's opt-in decision for a platform campaign
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - name: promotionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CampaignOptInRequest" }
      responses:
        "200":
          description: Canonical campaign opt-in readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerCampaignOptInResponse" } } }
        "201":
          description: Opt-in decision recorded.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerCampaignOptInResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/promotions/{promotionId}/state:
    post:
      operationId: setPartnerStorePromotionState
      summary: Publish, pause or end an owned Store promotion
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - name: promotionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - name: X-Expected-Version
          in: header
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/MarketingPublicationRequest" }
      responses:
        "200":
          description: Canonical promotion state readback.
          content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PromotionResponse" } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
