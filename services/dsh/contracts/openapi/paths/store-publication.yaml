paths:
  /dsh/stores/{storeId}/fulfillment-modes:
    post:
      operationId: setStoreFulfillmentModes
      summary: Set enabled Store fulfillment modes as an active Control operator
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/SetStoreFulfillmentModesRequest"
      responses:
        "200":
          description: Canonical Store fulfillment modes after an update or idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StoreFulfillmentModesResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"

  /dsh/stores/{storeId}/publication:
    get:
      operationId: readStorePublication
      summary: Read canonical Store publication state for a control operator
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200":
          description: Canonical Store publication readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StorePublicationResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
    post:
      operationId: setStorePublication
      summary: Apply an idempotent, versioned Store publication transition
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/StorePublicationRequest"
      responses:
        "200":
          description: Canonical Store publication result, including idempotent replay state.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StorePublicationResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/public/stores:
    get:
      operationId: listPublishedStores
      summary: List only client-visible published Stores
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ServiceCityIdRequired"
      responses:
        "200":
          description: Published Store discovery result.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PublishedStoreListResponse"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/public/stores/{storeId}:
    get:
      operationId: readPublishedStore
      summary: Read one client-visible published Store
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ServiceCityIdRequired"
      responses:
        "200":
          description: Published Store detail.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PublicStoreView"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
