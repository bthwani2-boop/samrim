paths:
  /dsh/operator/stores/trash:
    get:
      operationId: listDeletedStores
      summary: Operator-only list of recoverable archived stores
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        "200": { description: Keyset-paginated archived stores. }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
  /dsh/operator/stores/{storeId}/trash:
    post:
      operationId: archiveStore
      summary: Reversibly archive an operational store and atomically hide it from customers without removing related records
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/StoreId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200": { description: Store archived and hidden, with audit record. }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
  /dsh/operator/stores/{storeId}/restore:
    post:
      operationId: restoreArchivedStore
      summary: Recover an archived store without automatically republishing
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/StoreId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [""] }
      responses:
        "200": { description: Store restored as hidden; normal publication workflow required before customer visibility. }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
  /dsh/operator/stores/partner-presence:
    post:
      operationId: readOperatorPartnerStorePresence
      summary: Bounded existence read for partner actor IDs; omits deleted stores and never returns store data
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerStorePresenceRequest" }
      responses:
        "200": { description: Partner IDs owning at least one non-deleted store, content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerStorePresenceResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }

  /dsh/stores:
    get:
      operationId: listOperatorStores
      summary: List canonical DSH stores; Catalog operators may read stores for catalog workflows, and published stores are selectable by marketing and platform-policy operators
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { name: limit, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 1024 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: serviceCityId, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: searchMode, in: query, required: false, description: "name_prefix requires state=published, a serviceCityId, at least two query characters, and sort=name_asc", schema: { type: string, enum: [contains, name_prefix], default: contains } }
        - { name: state, in: query, required: false, schema: { type: string, enum: [unpublished, published, hidden] } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [updated_desc, updated_asc, name_asc] } }
      responses:
        "200": { description: Bounded canonical store summaries for operator registry use., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorStoreListResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }

  /dsh/stores/{storeId}/fulfillment-modes:
    post:
      operationId: setStoreFulfillmentModes
      summary: Set enabled Store fulfillment modes as an active Control operator
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/SetStoreFulfillmentModesRequest"
      responses:
        "200":
          description: Canonical Store fulfillment modes after an update or idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StoreFulfillmentModesResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"

  /dsh/stores/{storeId}/commercial-type:
    post:
      operationId: setStoreCommercialType
      summary: Assign the canonical commercial type once to an existing unclassified store
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/StoreId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/SetStoreCommercialTypeRequest" }
      responses:
        "200":
          description: Canonical store commercial type assignment after idempotent replay.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/SetStoreCommercialTypeResponse" }
        "201":
          description: Canonical store commercial type assignment created.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/SetStoreCommercialTypeResponse" }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/operator/stores/{storeId}/internal-photos:
    get:
      operationId: listOperatorStoreInternalPhotos
      summary: List private Field premises photos for an authorized operator
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { name: storeId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        "200":
          description: Internal photo metadata; image bytes remain behind the authorized private download route.
          content:
            application/json:
              schema:
                type: object
                required: [storeId, photos]
                additionalProperties: false
                properties:
                  storeId: { type: string }
                  photos:
                    type: array
                    items: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreInternalPhotoSummary" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }

  /dsh/operator/stores/{storeId}/internal-photos/{photoId}:
    get:
      operationId: readOperatorStoreInternalPhoto
      summary: Read private Field premises photo bytes as an authorized operator
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { name: storeId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: photoId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        "200": { description: Private image bytes with no-store cache policy., content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }

  /dsh/stores/{storeId}/publication:
    get:
      operationId: readStorePublication
      summary: Read canonical Store publication state for a control operator
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200":
          description: Canonical Store publication readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StorePublicationResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
    post:
      operationId: setStorePublication
      summary: Apply an idempotent, versioned Store publication transition
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/StorePublicationRequest"
      responses:
        "200":
          description: Canonical Store publication result, including idempotent replay state.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StorePublicationResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/public/stores:
    get:
      operationId: listPublishedStores
      summary: List only client-visible published Stores
      description: Public discovery is anonymous. When favoritesOnly is true, an active authenticated app-client session is required and the page is restricted to that client's favorite Stores.
      security:
        - userBearer: []
        - {}
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ServiceCityIdRequired"
        - name: q
          in: query
          description: Case-insensitive Store-name substring, scoped to the selected Service City.
          schema: { type: string, maxLength: 160 }
        - name: categoryId
          in: query
          description: Return Stores with at least one currently customer-visible offer in this active category or one of its active descendants.
          schema: { type: string, maxLength: 128 }
        - name: verticalId
          in: query
          description: Restrict discovery to this active Commerce Vertical in the selected Service City.
          schema: { type: string, maxLength: 128 }
        - name: shortcutId
          in: query
          description: Customer-facing shortcut ID, resolved only by the server to eligible Store types or Product categories.
          schema: { type: string, maxLength: 128 }
        - name: favoritesOnly
          in: query
          description: Restrict results to the authenticated app-client's favorite Stores.
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          description: Stable Store ordering. `nearest` requires latitude and longitude; `all` uses distance when coordinates are supplied and name otherwise.
          schema: { type: string, enum: [all, newest, nearest], default: all }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Opaque keyset cursor bound to city, search, category, sort and coordinates.
          schema: { type: string, maxLength: 2048 }
        - name: latitude
          in: query
          description: Latitude paired with longitude for distance display or nearest ordering.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          description: Longitude paired with latitude for distance display or nearest ordering.
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Published Store discovery result.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PublishedStoreListResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/public/catalog/search:
    get:
      operationId: searchPublicCatalog
      summary: Search customer-visible product offers across published stores in one active service city
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ServiceCityIdRequired"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - name: categoryId
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: verticalId
          in: query
          required: false
          description: Restrict customer-visible product offers to Stores in this active Commerce Vertical.
          schema: { type: string, maxLength: 128 }
        - name: shortcutId
          in: query
          required: false
          description: Match eligible customer shopping shortcuts in product results and pagination.
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Stable, paginated search results limited to customer-visible offers in the requested service city.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PublicCatalogSearchResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/public/stores/{storeId}:
    get:
      operationId: readPublishedStore
      summary: Read one client-visible published Store
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ServiceCityIdRequired"
      responses:
        "200":
          description: Published Store detail.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PublicStoreView"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
