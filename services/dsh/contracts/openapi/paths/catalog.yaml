paths:
  /dsh/catalog/shopping-shortcuts:
    get:
      operationId: listShoppingShortcuts
      summary: Operator-only display shortcut configuration
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - { name: verticalId, in: query, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        "200":
          description: The Store types/categories target configuration is internal.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ShoppingShortcutListResponse" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
    post:
      operationId: createShoppingShortcut
      summary: Create a customer display shortcut from compatible internal targets
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ShoppingShortcutMutationRequest" }
      responses:
        "201":
          description: Created shortcut.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ShoppingShortcutMutationResponse" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
  /dsh/catalog/shopping-shortcuts/{shortcutId}:
    patch:
      operationId: updateShoppingShortcut
      summary: Update a display shortcut without changing internal Store ownership
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - { name: shortcutId, in: path, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ShoppingShortcutMutationRequest" }
      responses:
        "200":
          description: Updated shortcut.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ShoppingShortcutMutationResponse" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
  /dsh/catalog/category-trash:
    get:
      operationId: listDeletedCatalogCategories
      summary: Operator-only list of soft-deleted taxonomy leaf categories
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        "200": { description: Deleted categories with audit facts and pagination. }
  /dsh/catalog/categories/{categoryId}/trash:
    post:
      operationId: trashCatalogCategory
      summary: Soft-delete a leaf category without deleting products or media
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - { name: X-Expected-Version, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: categoryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200": { description: Category was moved to trash. }
        "409": { description: Category still has subcategories or version changed. }
  /dsh/catalog/categories/{categoryId}/restore:
    post:
      operationId: restoreCatalogCategory
      summary: Restore a deleted category as inactive until explicitly reactivated
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - { name: X-Expected-Version, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: categoryId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [""] }
      responses:
        "200": { description: Category restored as inactive, with explicit reactivation available through category editor. }
        "409": { description: Version conflict. }
  /dsh/stores/{storeId}/trash:
    get:
      operationId: listStoreDeletedCatalogProducts
      summary: List deleted products belonging only to the authenticated partner's store
      security:
        - userBearer: []
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        "200": { description: Bounded own-store deleted products. }
        "403": { description: Partner lacks ownership or store access. }
  /dsh/stores/{storeId}/products/{productId}/trash:
    post:
      operationId: trashStoreScopedProduct
      summary: Soft-delete one store-owned product without destroying orders or offers
      security:
        - userBearer: []
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - { name: productId, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - { name: X-Expected-Version, in: header, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200": { description: Product placed in own-store trash or replayed. }
        "403": { description: Product belongs to another store. }
        "409": { description: Version or idempotency conflict. }
  /dsh/stores/{storeId}/products/{productId}/restore:
    post:
      operationId: restoreStoreScopedProduct
      summary: Restore a store-owned product subject to current catalog publication rules
      security:
        - userBearer: []
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - { name: productId, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - { name: X-Expected-Version, in: header, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [""] }
      responses:
        "200": { description: Restored own-store product or replayed. }
        "403": { description: Product belongs to another store. }
        "409": { description: Version or idempotency conflict. }
  /dsh/catalog/trash:
    get:
      operationId: listDeletedCatalogProducts
      summary: List deleted shared products without exposing them in the active catalog
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Deleted shared products with deletion evidence and bounded keyset pagination.
          content:
            application/json:
              schema:
                type: object
                required: [products, nextCursor]
                properties:
                  products:
                    type: array
                    items:
                      type: object
                      required: [id, canonicalName, version]
                      properties:
                        id: { type: string }
                        canonicalName: { type: string }
                        version: { type: integer }
                        deletedAt: { type: string, format: date-time }
                        deletedBy: { type: string }
                        deletionReason: { type: string }
                  nextCursor: { type: string }
  /dsh/catalog/products/{productId}/trash:
    post:
      operationId: trashCatalogProduct
      summary: Soft-delete an active shared product without deleting its offers, audit, or order history
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - { name: X-Expected-Version, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: productId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        "200": { description: Product was moved to trash or operation replayed. }
        "409": { description: Current version differs or idempotency conflict. }
  /dsh/catalog/products/{productId}/restore:
    post:
      operationId: restoreCatalogProduct
      summary: Restore a deleted shared product without bypassing the existing offer publication rules
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - { name: X-Expected-Version, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: productId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [""] }
      responses:
        "200": { description: Product was restored or operation replayed. }
        "409": { description: Current version differs or idempotency conflict. }
  /dsh/catalog/product-registry:
    get:
      operationId: listCatalogProductRegistry
      summary: Read a bounded operator-facing canonical Product registry projection
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 160 } }
        - $ref: "../dsh.openapi.yaml#/components/parameters/VerticalId"
        - { name: categoryId, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: active, in: query, required: false, schema: { type: string, enum: [all, active, inactive], default: all } }
        - { name: minVariantCount, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: minStoreCount, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [name_asc, name_desc, updated_desc, updated_asc, variants_asc, variants_desc, stores_asc, stores_desc], default: name_asc } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 2048 } }
      responses:
        "200": { description: Bounded operator registry projection with keyset pagination., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductRegistryResponse" } } } }

  /dsh/catalog/verticals:
    get:
      operationId: listCatalogVerticals
      summary: Read the active Commerce Vertical registry
      responses:
        "200": { description: Bounded Commerce Vertical registry., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommerceVerticalListResponse" } } } }
    post:
      operationId: createCatalogVertical
      summary: Create a Commerce Vertical in the canonical registry
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCommerceVerticalRequest" } }
      responses:
        "201": { description: Commerce Vertical created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommerceVerticalResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommerceVerticalResponse" } } } }

  /dsh/catalog/verticals/{verticalId}:
    patch:
      operationId: updateCatalogVertical
      summary: Update one Commerce Vertical with expected-version concurrency and audit
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: verticalId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpdateCommerceVerticalRequest" } }
      responses:
        "200": { description: Vertical updated or idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommerceVerticalResponse" } } } }

  /dsh/catalog/verticals/{verticalId}/media/upload:
    post:
      operationId: uploadCommerceVerticalMedia
      summary: Upload and atomically attach a CommerceVertical image
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - name: verticalId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UploadCatalogCategoryMediaRequest" } }
      responses:
        "200": { description: CommerceVertical image upload readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommerceVerticalResponse" } } }

  /dsh/catalog/commercial-store-types:
    get:
      operationId: listCommercialStoreTypes
      summary: Read canonical commercial store types for one Commerce Vertical
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/VerticalIdRequired"
        - { name: includeInactive, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: X-Acting-Actor-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "200": { description: Commercial store types under the selected active Commerce Vertical., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommercialStoreTypeListResponse" } } } }
    post:
      operationId: createCommercialStoreType
      summary: Create a commercial store type under an active Commerce Vertical
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCommercialStoreTypeRequest" } }
      responses:
        "201": { description: Commercial store type created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommercialStoreTypeResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommercialStoreTypeResponse" } } } }

  /dsh/catalog/commercial-store-types/{storeTypeId}:
    patch:
      operationId: updateCommercialStoreType
      summary: Update one commercial store type with version and audit control
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: storeTypeId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,127}$' }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpdateCommercialStoreTypeRequest" } }
      responses:
        "200": { description: Commercial store type updated or idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommercialStoreTypeResponse" } } } }

  /dsh/catalog/categories:
    get:
      operationId: listCatalogCategories
      summary: Read a bounded page of canonical Categories, optionally across Commerce Verticals
      description: Active categories for one vertical are public. Omitting verticalId or requesting all or inactive categories requires service authentication and an acting operator.
      security:
        - {}
        - serviceBearer: []
      parameters:
        - { name: verticalId, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: X-Acting-Actor-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }
        - { name: query, in: query, required: false, schema: { type: string, maxLength: 160 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [all, active, inactive] } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [name_asc, name_desc, updated_desc], default: name_asc } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 2048 } }
      responses:
        "200": { description: Bounded Category registry page with ancestry paths., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogCategoryListResponse" } } } }
    post:
      operationId: createCatalogCategory
      summary: Create a Category in the canonical parent tree
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCatalogCategoryRequest" } }
      responses:
        "201": { description: Category created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogCategoryResponse" } } } }

  /dsh/catalog/categories/{categoryId}:
    get:
      operationId: readCatalogCategory
      summary: Read one Category and its ancestry path
      description: Active categories are public. Reading an inactive category requires service authentication and an acting operator.
      security:
        - {}
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CategoryId"
        - { name: X-Acting-Actor-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "200": { description: Category detail used by relationship drill-down., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogCategoryDetailResponse" } } } }
    patch:
      operationId: updateCatalogCategory
      summary: Update one Category parent, names, or state with cycle prevention and audit
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: categoryId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpdateCatalogCategoryRequest" } }
      responses:
        "200": { description: Category updated or idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogCategoryResponse" } } } }

  /dsh/catalog/categories/{categoryId}/media/upload:
    post:
      operationId: uploadCatalogCategoryMedia
      summary: Upload and atomically attach a Category image
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - name: categoryId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UploadCatalogCategoryMediaRequest" } }
      responses:
        "200": { description: Category image upload readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogCategoryResponse" } } } }

  /dsh/public/catalog/categories/{categoryId}/attribute-rules:
    get:
      operationId: listPublicCatalogCategoryAttributeRules
      summary: Read active public attribute requirements for one active category
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CategoryId"
      responses:
        "200": { description: Active category attribute rules used by product entry forms., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeRuleListResponse" } } } }

  /dsh/catalog/categories/{categoryId}/attribute-rules:
    get:
      operationId: listCatalogCategoryAttributeRules
      summary: Read category attribute rules for operator catalog maintenance
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: categoryId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: Canonical typed attribute rules., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeRuleListResponse" } } } }

  /dsh/catalog/attributes:
    get:
      operationId: listCatalogAttributeDefinitions
      summary: Read active typed Attribute definitions for a Commerce Vertical
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/VerticalIdRequired"
      responses:
        "200": { description: Bounded typed Attribute definitions., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeDefinitionListResponse" } } } }
    post:
      operationId: createCatalogAttributeDefinition
      summary: Create a canonical typed Attribute definition
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCatalogAttributeDefinitionRequest" } }
      responses:
        "201": { description: Attribute definition created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeDefinitionResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeDefinitionResponse" } } } }

  /dsh/catalog/attributes/{attributeId}:
    patch:
      operationId: updateCatalogAttributeDefinition
      summary: Update one Attribute label or active state with version and audit control
