paths:
  /v1/stores/{storeID}/catalog:
    get:
      operationId: listCurrentMerchantStoreCatalog
      summary: Read private draft and published Product/Variant/Offer facts for one owned Store
      description: >
        Current Identity Merchant session and DSH Store ownership are required.
        Returns a bounded keyset page from the one DSH catalog, including unpublished
        items. No orderability, editing or publication permission is implied.
        A revoked session, foreign Store and invalid selector fail closed.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: Use the same search term and status on subsequent pages; start without a cursor when either changes.
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
        - name: q
          in: query
          description: Case-insensitive literal Product name substring within the owned Store, including drafts. Outer whitespace is ignored; NUL and invalid UTF-8 are rejected.
          schema: { type: string, maxLength: 80 }
        - name: status
          in: query
          description: Optional Store-scoped filter applied before keyset pagination. Available and unavailable partition published Offers using catalog eligibility, not checkout or Store orderability. Stockout counts published Offers with zero stock. Omit for all Offers.
          schema: { type: string, enum: [published, unpublished, available, unavailable, stockout] }
      responses:
        '200':
          description: One DSH Store-owner private catalog page
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantCatalogPage' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreInvalidChange'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreForbidden'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreOperationalUnavailable'

    post:
      operationId: createCurrentMerchantCatalogDraft
      summary: Create one unpublished Store-owned Product, Variant and Offer draft
      description: >
        Requires current Identity Merchant session and DSH ownership of this Store.
        A single DSH PostgreSQL transaction creates inactive/unpublished records
        and one immutable idempotency result. No public listing, sellability,
        price authorization for checkout, inventory reservation or WLT effect.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantCatalogDraftChange' }
      responses:
        '200':
          description: Same previously created DSH draft replayed without additional writes
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantCatalogDraftResult' }
        '201':
          description: Newly committed inactive Store draft
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantCatalogDraftResult' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreInvalidChange'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreForbidden'
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreConflict'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreOperationalUnavailable'

  /v1/stores/{storeID}/catalog/{offerID}:
    patch:
      operationId: updateCurrentMerchantCatalogDraft
      summary: Change one inactive, unpublished Store-owned draft with optimistic version and immutable replay
      description: >
        DSH requires current Merchant Identity session and Store ownership.
        Only a previously DSH-created inactive Product/Variant/Offer draft can
        change. CAS expectedVersion, owner row locks and one immutable operation
        journal prevent lost updates and duplicate mutations. The mutation
        cannot publish the Product or Offer or create an Order/WLT effect.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
        - name: offerID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantCatalogDraftEditChange' }
      responses:
        '200':
          description: One committed draft edit or immutable historical retry result
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantCatalogDraftEditResult' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreInvalidChange'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreForbidden'
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreConflict'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreOperationalUnavailable'

  /v1/stores/{storeID}/catalog/{offerID}/draft-history:
    get:
      operationId: readCurrentMerchantCatalogDraftHistory
      summary: Read the immutable committed draft edit history for one owned Store Offer
      description: >
        Current Merchant session and DSH Store ownership are required. Returns only
        committed draft edit transitions, not published-price history, stock movements,
        orderability, or a reconstructed creation record. Missing or foreign Offers
        are denied. Descending result version is the exclusive keyset; the next
        page uses nextBeforeVersion. Times are the DSH commit timestamps in UTC.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
        - name: offerID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: beforeVersion
          in: query
          description: Exclusive result version cursor; canonical positive decimal, at most 9007199254740991.
          schema: { type: string, pattern: '^[1-9][0-9]{0,15}$' }
      responses:
        '200':
          description: Scoped page of recorded draft transitions; empty means none recorded for this selector.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [actorId, storeId, offerId, entries]
                properties:
                  actorId: { type: string, minLength: 1, maxLength: 128 }
                  storeId: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
                  offerId: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
                  nextBeforeVersion: { type: string, pattern: '^[1-9][0-9]{0,15}$' }
                  entries:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      additionalProperties: false
                      required: [version, previousPriceYer, priceYer, previousStockUnits, stockUnits, committedAt]
                      properties:
                        version: { type: integer, minimum: 2, maximum: 9007199254740991 }
                        previousPriceYer: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$', description: Exact nonnegative signed-int64 YER amount. }
                        priceYer: { type: string, pattern: '^[1-9][0-9]{0,18}$', description: Exact positive signed-int64 YER amount. }
                        previousStockUnits: { type: integer, minimum: 0, maximum: 2147483647 }
                        stockUnits: { type: integer, minimum: 0, maximum: 2147483647 }
                        committedAt: { type: string, format: date-time, description: Actual recorded UTC commit timestamp. }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreInvalidChange'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreForbidden'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreOperationalUnavailable'

  /v1/stores/{storeID}/inventory-summary:
    get:
      operationId: readCurrentMerchantInventorySummary
      summary: Read complete Store-owned inventory counts independent of catalog pagination
      description: >
        Requires a current Merchant session and DSH Store ownership. Counts all
        Store Offers, including unpublished drafts in totalOffers; available and
        unavailable partition published Offers. Stockout counts published Offers
        with zero stock. Availability is catalog eligibility only, not Store
        orderability, checkout, or inventory reservation. No query selectors.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
      responses:
        '200':
          description: One complete Store-scoped inventory summary
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantInventorySummary' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreInvalidChange'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreForbidden'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreOperationalUnavailable'

  /v1/stores/{storeID}/catalog-imports/{runID}:
    parameters:
      - name: storeID
        in: path
        required: true
        schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
      - name: runID
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,128}$' }
    get:
      operationId: readMerchantCatalogImport
      summary: Read durable scoped import results up to 25 rows
      security:
        - OpaqueSession: []
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      responses:
        '200':
          description: Manifest identity and bounded durable outcomes
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantCatalogImportResult' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreInvalidChange'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreForbidden'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string }
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreConflict'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreOperationalUnavailable'
    put:
      operationId: startMerchantCatalogImport
      summary: Record the confirmed immutable draft-edit manifest
      security:
        - OpaqueSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantCatalogImportChange' }
      responses:
        '200':
          description: Manifest identity and bounded durable outcomes
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantCatalogImportResult' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreInvalidChange'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreForbidden'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string }
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreConflict'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreOperationalUnavailable'
    patch:
      operationId: advanceMerchantCatalogImport
      summary: Process the next bounded group with the existing draft writer
      security:
        - OpaqueSession: []
      responses:
        '200':
          description: Manifest identity and bounded durable outcomes
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/MerchantCatalogImportResult' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreInvalidChange'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreForbidden'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { type: string }
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreConflict'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/StoreOperationalUnavailable'
