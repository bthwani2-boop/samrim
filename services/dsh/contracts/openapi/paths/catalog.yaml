paths:
  /dsh/catalog/product-registry:
    get:
      operationId: listCatalogProductRegistry
      summary: Read a bounded operator-facing canonical Product registry projection
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 160 } }
        - $ref: "../dsh.openapi.yaml#/components/parameters/VerticalId"
        - { name: categoryId, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: active, in: query, required: false, schema: { type: string, enum: [all, active, inactive], default: all } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [name_asc, name_desc, updated_desc, updated_asc], default: name_asc } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 2048 } }
      responses:
        "200": { description: Bounded operator registry projection with keyset pagination., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductRegistryResponse" } } } }

  /dsh/catalog/verticals:
    get:
      operationId: listCatalogVerticals
      summary: Read the active Commerce Vertical registry
      responses:
        "200": { description: Bounded Commerce Vertical registry., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommerceVerticalListResponse" } } } }
    post:
      operationId: createCatalogVertical
      summary: Create a Commerce Vertical in the canonical registry
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCommerceVerticalRequest" } }
      responses:
        "201": { description: Commerce Vertical created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommerceVerticalResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommerceVerticalResponse" } } } }

  /dsh/catalog/verticals/{verticalId}:
    patch:
      operationId: updateCatalogVertical
      summary: Update one Commerce Vertical with expected-version concurrency and audit
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: verticalId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpdateCommerceVerticalRequest" } }
      responses:
        "200": { description: Vertical updated or idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CommerceVerticalResponse" } } } }

  /dsh/catalog/categories:
    get:
      operationId: listCatalogCategories
      summary: Read a bounded page of canonical Categories for a Commerce Vertical
      description: Active categories are public. The all and inactive status filters require service authentication and an acting operator.
      security:
        - {}
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/VerticalIdRequired"
        - { name: X-Acting-Actor-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }
        - { name: query, in: query, required: false, schema: { type: string, maxLength: 160 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [all, active, inactive] } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [name_asc, name_desc, updated_desc], default: name_asc } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 2048 } }
      responses:
        "200": { description: Bounded Category registry page with ancestry paths., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogCategoryListResponse" } } } }
    post:
      operationId: createCatalogCategory
      summary: Create a Category in the canonical parent tree
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCatalogCategoryRequest" } }
      responses:
        "201": { description: Category created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogCategoryResponse" } } } }

  /dsh/catalog/categories/{categoryId}:
    get:
      operationId: readCatalogCategory
      summary: Read one Category and its ancestry path
      description: Active categories are public. Reading an inactive category requires service authentication and an acting operator.
      security:
        - {}
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CategoryId"
        - { name: X-Acting-Actor-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "200": { description: Category detail used by relationship drill-down., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogCategoryDetailResponse" } } } }
    patch:
      operationId: updateCatalogCategory
      summary: Update one Category parent, names, or state with cycle prevention and audit
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: categoryId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpdateCatalogCategoryRequest" } }
      responses:
        "200": { description: Category updated or idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogCategoryResponse" } } } }

  /dsh/catalog/categories/{categoryId}/media/upload:
    post:
      operationId: uploadCatalogCategoryMedia
      summary: Upload and atomically attach a Category image
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - name: categoryId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UploadCatalogCategoryMediaRequest" } }
      responses:
        "200": { description: Category image upload readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogCategoryResponse" } } } }

  /dsh/public/catalog/categories/{categoryId}/attribute-rules:
    get:
      operationId: listPublicCatalogCategoryAttributeRules
      summary: Read active public attribute requirements for one active category
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CategoryId"
      responses:
        "200": { description: Active category attribute rules used by product entry forms., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeRuleListResponse" } } } }

  /dsh/catalog/categories/{categoryId}/attribute-rules:
    get:
      operationId: listCatalogCategoryAttributeRules
      summary: Read category attribute rules for operator catalog maintenance
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: categoryId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: Canonical typed attribute rules., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeRuleListResponse" } } } }

  /dsh/catalog/attributes:
    get:
      operationId: listCatalogAttributeDefinitions
      summary: Read active typed Attribute definitions for a Commerce Vertical
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/VerticalIdRequired"
      responses:
        "200": { description: Bounded typed Attribute definitions., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeDefinitionListResponse" } } } }
    post:
      operationId: createCatalogAttributeDefinition
      summary: Create a canonical typed Attribute definition
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCatalogAttributeDefinitionRequest" } }
      responses:
        "201": { description: Attribute definition created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeDefinitionResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeDefinitionResponse" } } } }

  /dsh/public/catalog/attributes/{attributeId}/enum-options:
    get:
      operationId: listPublicCatalogAttributeEnumOptions
      summary: Read active public values for a typed ENUM Attribute
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/AttributeId"
      responses:
        "200": { description: Active public ENUM options., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeEnumOptionListResponse" } } } }

  /dsh/catalog/attributes/{attributeId}/enum-options:
    get:
      operationId: listCatalogAttributeEnumOptions
      summary: Read the active values of a typed ENUM Attribute
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/AttributeId"
      responses:
        "200": { description: Canonical ENUM options., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeEnumOptionListResponse" } } } }
    post:
      operationId: createCatalogAttributeEnumOption
      summary: Create a canonical value for a typed ENUM Attribute
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/AttributeId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCatalogAttributeEnumOptionRequest" } }
      responses:
        "201": { description: ENUM option created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeEnumOptionResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeEnumOptionResponse" } } } }

  /dsh/catalog/products/{productId}/attributes/{attributeId}:
    put:
      operationId: upsertCatalogProductAttribute
      summary: Upsert one typed Attribute value on a canonical Product
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ProductId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/AttributeId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpsertCatalogAttributeValueRequest" } }
      responses:
        "200": { description: Product Attribute readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductResponse" } } } }

  /dsh/catalog/variants/{variantId}/attributes/{attributeId}:
    put:
      operationId: upsertCatalogVariantAttribute
      summary: Upsert one typed Attribute value on a concrete Variant
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/VariantId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/AttributeId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpsertCatalogAttributeValueRequest" } }
      responses:
        "200": { description: Variant Attribute readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogVariantResponse" } } } }

  /dsh/catalog/categories/{categoryId}/attribute-rules/{attributeId}:
    put:
      operationId: upsertCatalogCategoryAttributeRule
      summary: Upsert the typed Attribute rule for a Category
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CategoryId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/AttributeId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpsertCatalogAttributeRuleRequest" } }
      responses:
        "200": { description: Category Attribute rule readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogAttributeRuleListResponse" } } } }

  /dsh/catalog/products:
    get:
      operationId: listCatalogProducts
      summary: Read bounded canonical Products with their concrete Variants
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 160 } }
        - $ref: "../dsh.openapi.yaml#/components/parameters/VerticalId"
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 2048 } }
      responses:
        "200": { description: Bounded canonical Product lookup., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductListResponse" } } } }
    post:
      operationId: createCatalogProduct
      summary: Create a canonical Product and its default Variant
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCatalogProductRequest" } }
      responses:
        "201": { description: Product created with at least one Variant., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductResponse" } } } }

  /dsh/catalog/products/{productId}:
    get:
      operationId: readCatalogProduct
      summary: Read one canonical Product with its Variants, categories, attributes, and media
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ProductId"
      responses:
        "200": { description: Canonical Product detail readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProduct" } } } }
    patch:
      operationId: updateCatalogProduct
      summary: Versioned canonical Product update
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpdateCatalogProductRequest" } }
      responses:
        "200": { description: Product update readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductResponse" } } } }

  /dsh/catalog/products/{productId}/media:
    put:
      operationId: replaceCatalogProductMedia
      summary: Atomically replace the ordered Product media gallery
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ReplaceCatalogProductMediaRequest" } }
      responses:
        "200": { description: Product media replacement readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductResponse" } } } }

  /dsh/catalog/products/{productId}/media/upload:
    post:
      operationId: uploadCatalogProductMedia
      summary: Upload and atomically attach one Product image
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UploadCatalogProductMediaRequest" } }
      responses:
        "200": { description: Product media upload readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductResponse" } } } }

  /dsh/stores/{storeId}/products/{productId}/media/upload:
    post:
      operationId: uploadStoreProductMedia
      summary: Upload and atomically attach one image to a Product owned by the authenticated Partner Store
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          multipart/form-data: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UploadCatalogProductMediaRequest" } }
      responses:
        "200": { description: Store-scoped Product media upload readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductResponse" } } } }

  /dsh/stores/{storeId}/products/{productId}/media:
    put:
      operationId: replaceStoreProductMedia
      summary: Atomically replace the ordered media gallery of a store-owned Product
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ReplaceCatalogProductMediaRequest" } }
      responses:
        "200": { description: Store-scoped Product media replacement readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductResponse" } } } }

  /dsh/catalog/products/{productId}/variants:
    post:
      operationId: createCatalogVariant
      summary: Create a concrete Variant for a canonical Product
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCatalogVariantRequest" } }
      responses:
        "201": { description: Variant created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogVariantResponse" } } } }

  /dsh/catalog/variants/{variantId}:
    patch:
      operationId: updateCatalogVariant
      summary: Versioned canonical Variant update
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/VariantId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpdateCatalogVariantRequest" } }
      responses:
        "200": { description: Variant update readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogVariantResponse" } } } }

  /dsh/stores/{storeId}/products:
    post:
      operationId: createStoreScopedProduct
      summary: Create a Product owned by exactly one Partner Store
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCatalogProductRequest" } }
      responses:
         "201": { description: Store-scoped Product created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CatalogProductResponse" } } } }

  /dsh/stores/{storeId}/products/{productId}:
    patch:
      operationId: updateStoreScopedProduct
      summary: Versioned update of a Product owned by the authenticated Partner Store
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpdateCatalogProductRequest" } }
      responses:
