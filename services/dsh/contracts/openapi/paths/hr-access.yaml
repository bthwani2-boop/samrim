paths:
  /dsh/hr/access-requests:
    get:
      operationId: listHRAccessRequests
      summary: List employee requests for Root Owner review
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { name: employeeId, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200": { description: Requested operator access., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestPage" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
    post:
      operationId: createHRAccessRequest
      summary: Propose Operator access for an existing BThwani employee, without granting access
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestInput" } }
      responses:
        "201": { description: Access request recorded., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestMutationResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
  /dsh/hr/access-requests/{requestId}:
    get:
      operationId: readHRAccessRequest
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Access request details., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestReadResponse" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
  /dsh/hr/access-requests/{requestId}/create-profile:
    post:
      operationId: createHRIdentityProfile
      summary: Root Owner provisions an Identity profile only through its canonical HR access request
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Canonical HR and Identity profile readback or idempotent retry., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRIdentityProfileCreationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
  /dsh/hr/access-requests/{requestId}/reject:
    post:
      operationId: rejectHRAccessRequest
      summary: Initial Operator decision, serialized before Identity provisioning
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessDecisionInput" } }
      responses:
        "200": { description: Decision recorded or idempotently replayed, content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
  /dsh/hr/access-requests/by-profile/{profileId}:
    get:
      operationId: readHRAccessRequestByProfile
      summary: Root Owner reads a request's canonical HR provenance for an Identity profile
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { name: profileId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Request provenance., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestReadResponse" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
  /dsh/hr/access-requests/{requestId}/admit:
    post:
      operationId: admitHROperator
      summary: Root Owner durably links the granted Identity operator actor to its HR employee
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Durable employee and operator actor link., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HROperatorAdmissionResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
