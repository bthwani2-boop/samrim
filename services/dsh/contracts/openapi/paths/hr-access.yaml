paths:
  /dsh/hr/access-requests:
    get:
      operationId: listHRAccessRequests
      summary: List employee requests for Root Owner review
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { name: employeeId, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200": { description: Requested operator access., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestPage" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
    post:
      operationId: createHRAccessRequest
      summary: Propose Operator access for an existing BThwani employee, without granting access
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestInput" } }
      responses:
        "201": { description: Access request recorded., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestMutationResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
  /dsh/hr/access-requests/{requestId}:
    get:
      operationId: readHRAccessRequest
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Access request details., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestReadResponse" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
  /dsh/hr/access-requests/{requestId}/link:
    post:
      operationId: linkHRAccessRequest
      summary: Root Owner links an Identity profile after independently-authorized Identity creation
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessLinkInput" } }
      responses:
        "200": { description: Identity profile linked., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/HRAccessRequestMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
