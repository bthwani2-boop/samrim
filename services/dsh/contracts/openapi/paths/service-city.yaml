paths:
  /dsh/service-cities:
    get:
      operationId: listServiceCities
      summary: List canonical service cities for an operator
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Service city list., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ServiceCityListResponse" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
    post:
      operationId: createServiceCity
      summary: Create one canonical service city
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateServiceCityRequest" } }
      responses:
        "201": { description: City created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ServiceCityResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ServiceCityResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/service-cities/{cityId}:
    get:
      operationId: readServiceCity
      summary: Read one canonical service city for an operator
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CityId" }
      responses:
        "200": { description: Service city readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ServiceCityResponse" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
    patch:
      operationId: updateServiceCity
      summary: Update or activate/deactivate one canonical service city
      security: [{ serviceBearer: [] }]
      parameters:
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired" }
        - { $ref: "../dsh.openapi.yaml#/components/parameters/CityId" }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/UpdateServiceCityRequest" } }
      responses:
        "200": { description: City updated., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ServiceCityResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/public/service-cities:
    get:
      operationId: listActiveServiceCities
      summary: List active service cities for client scope selection
      responses:
        "200": { description: Active city list., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/ServiceCityListResponse" } } } }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
