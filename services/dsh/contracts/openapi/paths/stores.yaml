paths:
  /v1/public/verticals:
    get:
      operationId: listPublicVerticals
      summary: List verticals with published MARKETPLACE Stores in one active Service City
      description: Return only active DSH vertical identities and public Store counts. These are browse categories, not checkout eligibility or editable taxonomy.
      security: []
      parameters:
        - name: city_id
          in: query
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Opaque continuation bound to the selected city and DSH public revision.
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Bounded public vertical identity and Store count page
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/VerticalPage' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/BadRequest'
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/StaleCursor'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/OwnerUnavailable'
  /v1/public/stores:
    get:
      operationId: listPublicStores
      summary: Discover published MARKETPLACE Stores in an active service city
      description: DIRECT or unpublished Stores never appear. Visibility never indicates checkout readiness.
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: Optional literal case-insensitive Store name substring. The wire value is limited to 80 Unicode code points including surrounding whitespace, then trimmed before matching. Empty means all Stores. Cursors are bound to city and trimmed search; changing either requires a fresh page.
          schema: { type: string, maxLength: 80 }
        - name: city_id
          in: query
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
        - name: vertical_id
          in: query
          required: false
          description: Optional exact active DSH Store vertical. Omit to browse all verticals; a continuation cursor is bound to this filter.
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Bounded server-filtered Store page, with durable DSH read revision
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/StorePage' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/BadRequest'
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/StaleCursor'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/OwnerUnavailable'
  /v1/public/stores/{id}:
    get:
      operationId: getPublicStore
      summary: Read one published Store via public link, including DIRECT Stores
      security: []
      parameters:
        - $ref: '../dsh.openapi.yaml#/components/parameters/StoreId'
      responses:
        '200':
          description: Only public Store projection fields; neither private Merchant nor Customer data
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicStore' }
        '404':
          $ref: '../dsh.openapi.yaml#/components/responses/NotFound'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/OwnerUnavailable'
