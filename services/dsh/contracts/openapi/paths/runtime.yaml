paths:
  /health:
    get:
      operationId: dshHealth
      summary: Check that the configured DSH discovery schema is readable
      description: Requires the discovery baseline revision row. A newly migrated schema may have an empty catalog.
      security: []
      responses:
        '200':
          description: The DSH public discovery baseline is ready
          content:
            application/json:
              schema:
                type: object
                required: [service, status]
                properties:
                  service: { type: string, const: dsh }
                  status: { type: string, const: ok }
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/OwnerUnavailable'
