paths:
  /v1/public/stores/{id}/offers:
    get:
      operationId: listPublicOffers
      summary: Read visible sellable Variant Offers in a published Store
      description: Store, city, vertical, Product, Variant, Offer, availability, inventory and positive YER price are rechecked.
      security: []
      parameters:
        - $ref: '../dsh.openapi.yaml#/components/parameters/StoreId'
        - name: q
          in: query
          required: false
          description: >-
            Optional literal case-insensitive Offer display-name substring. Matching normalizes Unicode to NFC,
            folds Arabic Alef variants and ignores common Arabic vowel marks and tatweel. The wire value is
            limited to 80 Unicode code points including surrounding whitespace, then trimmed. Empty means all
            eligible Offers. A nonempty query made only of ignored marks returns no matches. Cursors are bound
            to Store, trimmed search, matching rules and catalog revision. Percent and underscore are literal.
          schema: { type: string, maxLength: 80 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 512, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200':
          description: Current DSH approved Offer page; not a quote or checkout authorization
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/OfferPage' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../dsh.openapi.yaml#/components/responses/NotFound'
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/StaleCursor'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/OwnerUnavailable'
  /v1/public/stores/{id}/offers/{offerId}/estimate:
    get:
      operationId: estimatePublicOffer
      summary: Estimate the merchandise subtotal for one visible Store Offer and quantity
      description: Reads one current DSH publication, Offer, Variant, price and stock snapshot. It creates no cart, inventory hold, price promise, payment or Order. A Store that is closed or paused may still show current merchandise prices. This response carries neither current inventory counts nor fulfillment fees.
      security: []
      parameters:
        - $ref: '../dsh.openapi.yaml#/components/parameters/StoreId'
        - name: offerId
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
        - name: quantity
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        '200':
          description: Current YER merchandise subtotal for the specified quantity
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicOfferEstimate' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/BadRequest'
        '404':
          $ref: '../dsh.openapi.yaml#/components/responses/NotFound'
        '409':
          description: Quantity exceeds currently available units for the visible Offer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: { type: string, const: INSUFFICIENT_AVAILABLE_QUANTITY }
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/OwnerUnavailable'
