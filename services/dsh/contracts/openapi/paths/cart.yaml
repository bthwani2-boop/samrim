paths:
  /v1/carts:
    get:
      operationId: listCurrentCustomerCarts
      summary: List the current Customer's nonempty single-Store cart drafts
      description: Read-only bounded directory of existing DSH drafts. Actor comes only from verified Identity. Unpublished or inactive Store names are withheld. Neither combined checkout nor Order, stock or payment authorization.
      security:
        - OpaqueSession: []
      parameters:
        - name: after
          in: query
          required: false
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
      responses:
        '200':
          description: Current Customer draft page, sorted by Store ID
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/CustomerCartDirectory' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/CartForbidden'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnavailable'

  /v1/carts/{storeID}:
    get:
      operationId: getCurrentCustomerCart
      summary: Read one Customer's DSH-owned single-Store cart draft
      description: Authenticated Customer only; never accepts actorId from caller. Lines are advisory current Offer previews, not an Order, stock reservation, payable quote or WLT effect. Rechecks Identity after database read.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
      responses:
        '200':
          description: Current draft and DSH-owned Offer preview
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/CustomerCart' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/CartForbidden'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnavailable'
    put:
      operationId: replaceCurrentCustomerCart
      summary: Replace a Customer single-Store cart draft with optimistic version and stable operation ID
      description: DSH checks current Customer Identity, Store publication, Offer/Variant/stock and bound operation payload in one isolated owner transaction. An ambiguous connection or 503 after dispatch must be reconciled using the same operation identity; never assume a paid or confirmed Order.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../dsh.openapi.yaml#/components/schemas/CustomerCartChange' }
      responses:
        '200':
          description: One committed Cart draft mutation, or replay of that same operation
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/CustomerCartResult' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/CartForbidden'
        '404':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnavailableOffer'
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/CartConflict'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnavailable'

  /v1/carts/{storeID}/merchandise-estimate:
    get:
      operationId: estimateCurrentCustomerCartMerchandise
      summary: Recalculate a current Customer Cart's owner-priced merchandise subtotal
      description: Read-only, non-payable merchandise-only estimate. Verifies Customer Identity before and after a repeatable-read DSH Cart/Offer snapshot. Rejects stale Cart versions, unavailable offers and overflowing whole-YER amounts. Does not include delivery, serviceability, fulfillment, fees, promotions or WLT authorization, and never confirms an Order or holds stock.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
      responses:
        '200':
          description: Exact merchandise-only subtotal from one verified DSH owner snapshot; never checkout-ready
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/CustomerCartMerchandiseEstimate' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/CartForbidden'
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/CartConflict'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnavailable'

  /v1/carts/{storeID}/checkout-review:
    post:
      operationId: reviewCurrentCustomerCheckout
      summary: Review current cart, recipient and selected fulfillment in one DSH snapshot
      description: >-
        Authenticated non-mutating review. Rechecks Identity and the exact Cart version,
        current Offer quantities, stock and merchandise price. Delivery requires a current
        owned Address version and evaluates canonical geographic serviceability in the same
        snapshot. A valid versioned DSH distance-band tariff yields an optional
        non-payable distance fee estimate using the same geographic evidence. Missing or
        invalid tariffs and out-of-scope addresses produce no estimate.
        Recipient contact syntax is validated without storing or echoing PII.
        The selected mode is not admitted merely by this review. This is not a payable quote,
        reservation, WLT allocation, or Order confirmation.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { $ref: '../dsh.openapi.yaml#/components/schemas/PublicId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../dsh.openapi.yaml#/components/schemas/CustomerCheckoutReviewInput' }
      responses:
        '200':
          description: Current non-payable DSH review with explicit remaining blockers
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../dsh.openapi.yaml#/components/schemas/CustomerCheckoutReview' }
        '400':
          $ref: '../dsh.openapi.yaml#/components/responses/BadRequest'
        '401':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnauthorized'
        '403':
          $ref: '../dsh.openapi.yaml#/components/responses/CartForbidden'
        '409':
          $ref: '../dsh.openapi.yaml#/components/responses/CartConflict'
        '503':
          $ref: '../dsh.openapi.yaml#/components/responses/CartUnavailable'
