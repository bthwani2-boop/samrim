paths:
  /dsh/fields/admissions:
    get:
      operationId: listFieldAdmissions
      summary: Search and page Field candidates and admissions
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: state
          in: query
          schema: { type: string, enum: [all, pending, pending_review, pending_identity, eligible, suspended] }
        - name: sort
          in: query
          schema: { type: string, enum: [created_desc, created_asc] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Bounded Field admission registry page.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionListResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
    post:
      operationId: admitField
      summary: Create a Field candidate profile before role access
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionRequest"
      responses:
        "201":
          description: Field candidate profile created in review state.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionResponse"
        "200":
          description: Idempotent candidate profile readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/fields/admissions/{admissionId}/profile:
    patch:
      operationId: updateFieldAdmissionProfile
      summary: Complete the Arabic name on an unapproved Field candidate
      security:
        - serviceBearer: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionProfileRequest"
      responses:
        "200":
          description: Updated Field candidate profile.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/fields/admissions/{admissionId}/approve:
    post:
      operationId: approveFieldAdmission
      summary: Approve DSH Field eligibility before provisioning an Identity role
      security:
        - serviceBearer: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      responses:
        "200":
          description: DSH eligibility approved; Identity role remains unprovisioned.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/fields/admissions/{admissionId}/provision:
    post:
      operationId: provisionFieldAdmission
      summary: Provision and bind a Field Identity role for an approved candidate
      security:
        - serviceBearer: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      responses:
        "200":
          description: Identity role provisioned and bound to the approved Field admission.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/fields/me/financial-summary:
    get:
      operationId: readOwnFieldFinancialSummary
      summary: Read the WLT-derived Field commission summary
      security:
        - userBearer: []
      responses:
        "200":
          description: Field financial summary.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldFinancialSummaryResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/operator/fields/{fieldActorId}/financial-summary:
    get:
      operationId: readOperatorFieldFinancialSummary
      summary: Read a WLT-derived Field commission summary for Finance
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: fieldActorId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Field financial summary.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldFinancialSummaryResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/operator/field-commission-policies:
    get:
      operationId: readFieldCommissionPolicyByScope
      summary: Read the active WLT-owned field reward policy for an exact scope
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: scopeType
          in: query
          required: true
          schema:
            type: string
            enum: [DEFAULT, VERTICAL, STORE]
        - name: scopeId
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Active exact-scope field reward policy.
          content:
            application/json:
              schema:
                type: object
                required: [policy]
                properties:
                  policy:
                    $ref: "../dsh.openapi.yaml#/components/schemas/FieldCommissionPolicy"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
    post:
      operationId: createFieldCommissionPolicy
      summary: Create or replace one Finance-managed Field commission policy
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
               required: [scopeType, rewardMinor, roundingUnitMinor, expectedVersion, reason]
              properties:
                scopeType:
                  type: string
                  enum: [DEFAULT, VERTICAL, STORE]
                scopeId:
                  type: string
                  nullable: true
                rewardMinor:
                  type: integer
                  minimum: 50
                roundingUnitMinor:
                  type: integer
                  const: 50
                expectedVersion:
                  type: integer
                  minimum: 0
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
      responses:
        "201":
          description: Field commission policy created.
          content:
            application/json:
              schema:
                type: object
                required: [policy, idempotentReplay]
                properties:
                  policy:
                    $ref: "../dsh.openapi.yaml#/components/schemas/FieldCommissionPolicy"
                  idempotentReplay:
                    type: boolean
        "200":
          description: Idempotent policy replay.
          content:
            application/json:
              schema:
                type: object
                required: [policy, idempotentReplay]
                properties:
                  policy:
                    $ref: "../dsh.openapi.yaml#/components/schemas/FieldCommissionPolicy"
                  idempotentReplay:
                    type: boolean
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/operator/field-commission-policies/{policyId}:
    get:
      operationId: readFieldCommissionPolicy
      summary: Read a Finance-managed Field commission policy
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Field commission policy.
          content:
            application/json:
              schema:
                type: object
                required: [policy]
                properties:
                  policy:
                    $ref: "../dsh.openapi.yaml#/components/schemas/FieldCommissionPolicy"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/fields/admissions/{admissionId}:
    get:
      operationId: readFieldAdmission
      summary: Read one DSH-owned Field admission
      security:
        - serviceBearer: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
      responses:
        "200":
          description: Canonical Field admission readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/fields/actors/{actorId}/admission:
    get:
      operationId: readFieldAdmissionForOperatorActor
      summary: Read a Field admission by actor for an operator
      security:
        - serviceBearer: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
      responses:
        "200":
          description: Canonical Field admission readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/fields/me:
    get:
      operationId: readOwnFieldAdmission
      summary: Read the authenticated Field admission
      security:
        - userBearer: []
      responses:
        "200":
          description: Field admission readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FieldAdmissionResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/fields/{actorId}/identity-role:
    post:
      operationId: setFieldIdentityRoleEnabled
      summary: Enable or disable one Field role through the DSH admission owner
      security:
        - serviceBearer: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/ManagedRoleMutationRequest"
      responses:
        "204":
          description: Field Identity role and DSH admission are reconciled.
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/fields/{actorId}/reenrollment:
    post:
      operationId: authorizeFieldReenrollment
      summary: Reauthorize one active Field actor for one-time reenrollment after confirming current DSH eligibility
      security:
        - serviceBearer: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/FieldReenrollmentRequest"
      responses:
        "204":
          description: Field reauthorization succeeded only if DSH admission and Identity actor/role versions still match.
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/field/joining-cases:
    post:
      operationId: createFieldJoiningCase
      summary: Create a joining case attributed to the authenticated Field representative
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/CreateJoiningCaseRequest"
      responses:
        "201":
          description: Field-originated joining case.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/JoiningCaseResponse"
        "200":
          description: Idempotent joining-case replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/JoiningCaseResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
    get:
      operationId: listOwnFieldJoiningCases
      summary: List joining cases originated by the authenticated Field representative
      security:
        - userBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: Bounded Field joining-case page scoped to the authenticated representative and search query.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/JoiningCaseListResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/field/joining-cases/{caseId}:
    get:
      operationId: readOwnFieldJoiningCase
      summary: Read one joining case originated by the authenticated Field representative
      security:
        - userBearer: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Field-scoped joining-case readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/JoiningCaseResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/field/joining-cases/{caseId}/submit:
    post:
      operationId: submitFieldJoiningCase
      summary: Request Operator admission review for a Field-originated joining case
      security:
        - userBearer: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      responses:
        "200":
          description: Field admission request readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/JoiningCaseResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
