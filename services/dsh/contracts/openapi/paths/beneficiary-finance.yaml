        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: transferId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "200":
          description: Transfer independently verified.
          content:
            application/json:
              schema:
                type: object
                required: [transfer]
