  /dsh/operator/customer-withdrawal-intakes:
    get:
      operationId: listOperatorCustomerWithdrawalIntakes
      summary: Read the Finance queue of exceptional customer withdrawal requests
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [REQUESTED, DESTINATION_PENDING, PAYOUT_HELD, REJECTED, COMPLETED] }
        - name: search
          in: query
          required: false
          description: Prefix match on intake ID, customer actor ID, beneficiary name, or provider; exactly four digits match the masked wallet suffix.
          schema: { type: string, maxLength: 128 }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [requested_asc, requested_desc], default: requested_desc }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 1024 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Canonical WLT intake queue.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CustomerWithdrawalIntakeListResponse" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
    post:
      operationId: createOperatorCustomerWithdrawalIntake
      summary: Record an Operations-approved customer withdrawal request; no funds are moved at intake
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CreateCustomerWithdrawalIntakeRequest" }
      responses:
        "201":
          description: Intake created after identity and legal-name readback; no payout or hold exists yet.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CustomerWithdrawalIntakeResponse" }
        "200":
          description: Idempotent replay of the same Operations request.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/CustomerWithdrawalIntakeResponse" }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

