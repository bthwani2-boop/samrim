paths:
  /dsh/operator/actors/{actorId}/legal-name/pending:
    get:
      operationId: readOperatorPendingActorLegalName
      summary: Read the latest pending legal-name candidate for Operations verification
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: actorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Pending candidate and evidence reference from Identity.
          content:
            application/json:
              schema:
                type: object
                required: [legalName]
                properties:
                  legalName: { $ref: "../dsh.openapi.yaml#/components/schemas/ActorLegalName" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/actors/{actorId}/legal-name:
    post:
      operationId: submitOperatorActorLegalName
      summary: Submit four-part legal-name evidence for independent Operations verification
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: actorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/SubmitActorLegalNameRequest"
      responses:
        "201":
          description: Pending versioned legal-name evidence from Identity.
          content:
            application/json:
              schema:
                type: object
                required: [legalName]
                properties:
                  legalName: { $ref: "../dsh.openapi.yaml#/components/schemas/ActorLegalName" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/actors/{actorId}/legal-name/{version}/verify:
    post:
      operationId: verifyOperatorActorLegalName
      summary: Independently verify a pending legal-name version in Identity
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: actorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/VerifyActorLegalNameRequest"
      responses:
        "200":
          description: Verified legal-name version from Identity.
          content:
            application/json:
              schema:
                type: object
                required: [legalName]
                properties:
                  legalName: { $ref: "../dsh.openapi.yaml#/components/schemas/ActorLegalName" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/me/wallet:
    get:
      operationId: readOwnWallet
      summary: Read the authenticated customer's or admitted BThwani captain's WLT balance and Cash-In history
      security:
        - userBearer: []
      responses:
        "200":
          description: Canonical wallet state and recent funding intents from WLT.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/BeneficiaryWalletResponse"
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/me/funding-intents:
    post:
      operationId: createOwnFundingIntent
      summary: Request Cash-In for the authenticated customer or admitted BThwani captain
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountMinor]
              properties:
                amountMinor: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Funding intent accepted by the configured Cash-In rail.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/BeneficiaryFundingIntentResponse"
        "200":
          description: Idempotent replay of a prior funding intent.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/BeneficiaryFundingIntentResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "503": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/me/funding-intents/{fundingIntentId}:
    get:
      operationId: readOwnFundingIntent
      summary: Read a funding intent owned by the authenticated customer or captain
      security:
        - userBearer: []
      parameters:
        - name: fundingIntentId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Funding intent state from WLT.
          content:
            application/json:
              schema:
                type: object
                required: [intent]
                properties:
                  intent: { $ref: "../dsh.openapi.yaml#/components/schemas/CashInFundingIntent" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/me/funding-intents/{fundingIntentId}/simulate:
    post:
      operationId: simulateOwnFundingIntent
      summary: Apply a deterministic development-only simulated Cash-In outcome
      description: Available only when WLT is explicitly configured for the development simulator. Never enabled in production.
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: fundingIntentId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [SUCCESS, FAILURE, UNKNOWN, DELAYED]
      responses:
        "200":
          description: Simulated outcome applied in the non-production WLT simulator.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/BeneficiaryFundingIntentResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/me/payout-state:
    get:
      operationId: readOwnPayoutState
      summary: Read the authenticated beneficiary payout readiness and masked destination
      security:
        - userBearer: []
      responses:
        "200":
          description: Payout state derived by WLT for the authenticated partner, captain, or field actor.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/BeneficiaryPayoutStateResponse"
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/me/payout-intents:
    post:
      operationId: createOwnPayoutIntent
      summary: Create a server-resolved payout intent for the authenticated beneficiary
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountMode]
              properties:
                amountMode: { type: string, enum: [FULL_AVAILABLE, SPECIFIED] }
                amountMinor: { type: integer, minimum: 1, nullable: true }
      responses:
        "201":
          description: Payout intent held.
          content:
            application/json:
              schema:
                type: object
                required: [payout, idempotentReplay]
                properties:
                  payout: { $ref: "../dsh.openapi.yaml#/components/schemas/PayoutRequest" }
                  idempotentReplay: { type: boolean }
        "200":
          description: Idempotent payout intent replay.
          content:
            application/json:
              schema:
                type: object
                required: [payout, idempotentReplay]
                properties:
                  payout: { $ref: "../dsh.openapi.yaml#/components/schemas/PayoutRequest" }
                  idempotentReplay: { type: boolean }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/finance-evidence-documents:
    post:
      operationId: uploadOperatorFinanceEvidence
      summary: Upload a private transfer receipt or official wallet statement
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [purpose, file]
              properties:
                purpose: { type: string, enum: [TRANSFER_RECEIPT, SETTLEMENT_STATEMENT] }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Evidence metadata and content fingerprint.
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { $ref: "../dsh.openapi.yaml#/components/schemas/FinanceEvidenceDocument" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/finance-evidence-documents/{documentId}:
    get:
      operationId: readOperatorFinanceEvidence
      summary: Read a private Finance evidence file
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: documentId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Private document; never publicly cached.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
          content:
            application/pdf: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/settlement-statements:
    post:
      operationId: registerOperatorSettlementStatement
      summary: Register an uploaded period or batch wallet statement
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerKey, currency, periodStart, periodEnd, evidenceDocumentId]
              properties:
                batchId: { type: string, maxLength: 128 }
                providerKey: { type: string, minLength: 1, maxLength: 64 }
                currency: { type: string, const: YER }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                evidenceDocumentId: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "201": { description: Statement registered and linked to the batch or period. }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/settlement-statements/{statementId}/rows:
    post:
      operationId: recordOperatorStatementRow
      summary: Normalize an uploaded statement row for reconciliation
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: statementId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rowSequence, externalTransferReference, walletIdentifier, amountMinor, currency, transactionAt]
              properties:
                rowSequence: { type: integer, minimum: 1 }
                externalTransferReference: { type: string, minLength: 1, maxLength: 160 }
                walletIdentifier: { type: string, minLength: 9, maxLength: 16, pattern: '^\+[1-9][0-9]{7,14}$', writeOnly: true, description: 'Official-wallet phone number in canonical E.164 format.' }
                amountMinor: { type: integer, minimum: 1 }
                currency: { type: string, const: YER }
                transactionAt: { type: string, format: date-time }
      responses:
        "201": { description: Statement row recorded for exact settlement matching. }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/{actorType}/{actorId}/payout-state:
    get:
      operationId: readOperatorPayoutState
      summary: Read a partner, captain, or field payout state for Finance operations
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: actorType
          in: path
          required: true
          schema: { type: string, enum: [partner, captain, field] }
        - name: actorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Payout state.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/BeneficiaryPayoutStateResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/beneficiaries/{actorType}/{actorId}/financial-statement:
    get:
      operationId: readOperatorBeneficiaryFinancialStatement
      summary: Read a canonical WLT financial statement with authorized DSH order snapshots
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: actorType
          in: path
          required: true
          schema: { type: string, enum: [customer, partner, captain, field] }
        - name: actorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: WLT-derived period statement and authorized order-price snapshots.
          content:
            application/json:
              schema:
                type: object
                required: [statement]
                properties:
                  statement:
                    type: object
                    required: [actorType, actorId, currency, periodStart, periodEnd, openingBalanceMinor, creditsMinor, debitsMinor, closingBalanceMinor, currentBalanceMinor, entries, limit]
                    properties:
                      actorType: { type: string, enum: [customer, partner, captain, field] }
                      actorId: { type: string }
                      currency: { type: string, const: YER }
                      periodStart: { type: string, format: date }
                      periodEnd: { type: string, format: date }
                      openingBalanceMinor: { type: integer }
                      creditsMinor: { type: integer }
                      debitsMinor: { type: integer }
                      closingBalanceMinor: { type: integer }
                      currentBalanceMinor: { type: integer }
                      nextCursor: { type: string }
                      limit: { type: integer }
                      entries:
                        type: array
                        items:
                          type: object
                          required: [transactionId, transactionType, sourceType, sourceId, direction, amountMinor, currency, createdAt, balanceAfterMinor]
                          properties:
                            transactionId: { type: string }
                            transactionType: { type: string }
                            sourceType: { type: string }
                            sourceId: { type: string }
                            direction: { type: string, enum: [CREDIT, DEBIT] }
                            amountMinor: { type: integer }
                            currency: { type: string, const: YER }
                            createdAt: { type: string, format: date-time }
                            balanceAfterMinor: { type: integer }
                            store:
                              type: object
                              required: [storeId, name, publicationState]
                              properties:
                                storeId: { type: string }
                                name: { type: string }
                                publicationState: { type: string }
                            order:
                              type: object
                              required: [orderId, storeName, state, fulfillmentMode, subtotalAmountMinor, discountMinor, totalAmountMinor, currency, createdAt, lines]
                              properties:
                                orderId: { type: string }
                                storeName: { type: string }
                                state: { type: string }
                                fulfillmentMode: { type: string }
                                subtotalAmountMinor: { type: integer }
                                discountMinor: { type: integer }
                                totalAmountMinor: { type: integer }
                                currency: { type: string, const: YER }
                                createdAt: { type: string, format: date-time }
                                lines:
                                  type: array
                                  items:
                                    type: object
                                    required: [productName, variantTitle, quantityBaseUnits, unitPriceMinor, lineAmountMinor, currency]
                                    properties:
                                      productName: { type: string }
                                      variantTitle: { type: string }
                                      quantityBaseUnits: { type: integer }
                                      unitPriceMinor: { type: integer }
                                      lineAmountMinor: { type: integer }
                                      currency: { type: string, const: YER }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/financial-statements:
    get:
      operationId: listOperatorFinancialStatementSummaries
      summary: Read WLT period totals grouped by beneficiary for finance exports
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: actorType
          in: query
          required: true
          schema: { type: string, enum: [customer, partner, captain, field] }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Period totals derived by WLT and grouped by internal beneficiary wallet.
          content:
            application/json:
              schema:
                type: object
                required: [actorType, periodStart, periodEnd, summaries, totals, limit]
                properties:
                  actorType: { type: string }
                  periodStart: { type: string, format: date }
                  periodEnd: { type: string, format: date }
                  nextCursor: { type: string }
                  limit: { type: integer }
                  summaries:
                    type: array
                    items:
                      type: object
                      required: [actorType, actorId, beneficiaryName, walletIdentifierMasked, currency, openingBalanceMinor, creditsMinor, debitsMinor, closingBalanceMinor, currentBalanceMinor, heldMinor, availableMinor]
                      properties:
                        actorType: { type: string }
                        actorId: { type: string }
                        beneficiaryName: { type: string }
                        walletIdentifierMasked: { type: string }
                        currency: { type: string, const: YER }
                        openingBalanceMinor: { type: integer }
                        creditsMinor: { type: integer }
                        debitsMinor: { type: integer }
                        closingBalanceMinor: { type: integer }
                        currentBalanceMinor: { type: integer }
                        heldMinor: { type: integer, minimum: 0 }
                        availableMinor: { type: integer }
                  totals:
                    type: object
                    required: [openingBalanceMinor, creditsMinor, debitsMinor, closingBalanceMinor, currentBalanceMinor, heldMinor, availableMinor]
                    properties:
                      openingBalanceMinor: { type: integer }
                      creditsMinor: { type: integer }
                      debitsMinor: { type: integer }
                      closingBalanceMinor: { type: integer }
                      currentBalanceMinor: { type: integer }
                      heldMinor: { type: integer, minimum: 0 }
                      availableMinor: { type: integer }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/{actorType}/{actorId}/official-wallet-destination:
    get:
      operationId: readOperatorOfficialWalletDestination
      summary: Read a Finance-managed official-wallet destination
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: actorType
          in: path
          required: true
          schema: { type: string, enum: [customer, partner, captain, field] }
        - name: actorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Official-wallet destination.
          content:
            application/json:
              schema:
                type: object
                required: [destination]
                properties:
                  destination: { $ref: "../dsh.openapi.yaml#/components/schemas/OfficialWalletDestination" }
