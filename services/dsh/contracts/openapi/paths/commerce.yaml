  /dsh/operator/operations/{orderId}/cases:
    get:
      operationId: listOperatorOrderCases
      summary: Read bounded, owner-backed operational exceptions for a single Order.
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Order-scoped operational cases.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorOrderCasePage" }
        "403": { description: Operations permission is required. }
        "404": { description: Order not found. }
    post:
      operationId: openOperatorOrderCase
      summary: Open one Operations case per active order and reason, without changing financial or Order state.
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, priority, nextAction]
              properties:
                reason: { type: string, enum: [PARTNER_DELAY, DISPATCH_UNAVAILABLE, DELIVERY_BLOCKED, CUSTOMER_CONTACT, PAYMENT_EXCEPTION, OTHER] }
                priority: { type: string, enum: [NORMAL, URGENT] }
                nextAction: { type: string, minLength: 12, maxLength: 500 }
      responses:
        "200":
          description: Newly opened exception or verified replay.
          content:
            application/json:
              schema:
                type: object
                required: [item, idempotentReplay]
                properties:
                  item: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorOrderCase" }
                  idempotentReplay: { type: boolean }
        "400": { description: Invalid case facts. }
        "403": { description: Operations permission required. }
        "404": { description: Order not found. }
        "409": { description: Duplicate active reason or idempotency key conflict. }
