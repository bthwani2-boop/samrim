  /dsh/operator/operations/{orderId}/cases/{caseId}/transition:
    post:
      operationId: transitionOperatorOrderCase
      summary: Claim, set next action or resolve a case with version checks and an audit event.
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: caseId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, expectedVersion]
              properties:
                action: { type: string, enum: [CLAIM, ACTION_REQUIRED, NEXT_ACTION, RESOLVE] }
                note: { type: string, maxLength: 1000 }
                expectedVersion: { type: integer, minimum: 1 }
                evidenceRef: { type: string, maxLength: 128, description: Canonical settlement or delivery proof reference required for sensitive resolution. }
      responses:
        "200":
          description: Case event confirmed and current case state.
          content:
            application/json:
              schema:
                type: object
                required: [item, idempotentReplay]
                properties:
                  item: { $ref: "../dsh.openapi.yaml#/components/schemas/OperatorOrderCase" }
                  idempotentReplay: { type: boolean }
        "400": { description: Invalid action. }
        "403": { description: Case is owned by another operator. }
        "404": { description: Order or case not found. }
        "409": { description: Stale version or case already resolved. }

