paths:
  /dsh/client/favorite-stores:
    get:
      operationId: listClientFavoriteStores
      summary: List the authenticated client's favorite Store identifiers
      security:
        - userBearer: []
      responses:
        "200":
          description: Client favorite Store identifiers.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FavoriteStoreListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/client/favorite-stores/{storeId}:
    put:
      operationId: addClientFavoriteStore
      summary: Add one currently published Store to the authenticated client's favorites
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200":
          description: Favorite Store mutation result.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FavoriteStoreResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
    delete:
      operationId: removeClientFavoriteStore
      summary: Remove one Store from the authenticated client's favorites
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200":
          description: Favorite Store mutation result.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FavoriteStoreResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/client/favorite-store-offers:
    get:
      operationId: listClientFavoriteStoreOffers
      summary: List the authenticated client's favorite StoreOffer identifiers for one Store
      security:
        - userBearer: []
      parameters:
        - name: storeId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Favorite StoreOffer identifiers scoped to the requested Store.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FavoriteStoreOfferListResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/client/favorite-store-offers/{storeOfferId}:
    put:
      operationId: addClientFavoriteStoreOffer
      summary: Add one currently customer-visible StoreOffer to the authenticated client's favorites
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: storeOfferId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Favorite StoreOffer mutation result.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FavoriteStoreOfferResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
    delete:
      operationId: removeClientFavoriteStoreOffer
      summary: Remove one StoreOffer from the authenticated client's favorites
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: storeOfferId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Favorite StoreOffer mutation result.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/FavoriteStoreOfferResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/client/favorite-store-catalog:
    get:
      operationId: readClientFavoriteStoreCatalog
      summary: Read the authenticated client's paginated favorite and currently visible StoreOffers from one Store
      security:
        - userBearer: []
      parameters:
        - name: storeId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: serviceCityId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
      responses:
        "200":
          description: Customer-visible favorite offers from the scoped Store, with a cursor for the next page.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PublicCatalogResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/client/open-carts:
    get:
      operationId: listClientOpenCarts
      summary: List the authenticated client's open carts with their current Store checkout eligibility
      security:
        - userBearer: []
      responses:
        "200":
          description: Canonical open carts owned by the authenticated client.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/ClientOpenCartListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/cart:
    get:
      operationId: readOpenCart
      summary: Read the authenticated client's open Store cart
      security:
        - userBearer: []
      parameters:
        - name: storeId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Canonical open cart readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/cart/quote:
    post:
      operationId: quoteCheckout
      summary: Revalidate the open cart and serviceability, then return the WLT delivery fee and expected checkout total without creating an Order
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Current customer-visible checkout quote.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CheckoutQuoteResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/cart/lines:
    post:
      operationId: upsertCartLine
      summary: Add or replace one canonical customer-visible StoreOffer in the open cart
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CartExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/UpsertCartLineRequest"
      responses:
        "201":
          description: Cart line created.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/cart/lines/{lineId}:
    patch:
      operationId: updateCartLine
      summary: Update one open cart line with optimistic concurrency
      security:
        - userBearer: []
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/UpdateCartLineRequest"
      responses:
        "201":
          description: Cart line updated.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
    delete:
      operationId: removeCartLine
      summary: Remove one open cart line with optimistic concurrency
      security:
        - userBearer: []
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      responses:
        "201":
          description: Cart line removed.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/cart/checkout:
    post:
      operationId: checkoutCart
      summary: Revalidate serviceability and customer-visible offers, provision COD collection, then create a CREATED Order
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Canonical Order created from the cart with an explicit fulfillment mode and a linked CASH_ON_DELIVERY payment intent requiring collection at delivery.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/multi-store-checkouts:
    post:
      operationId: createMultiStoreCheckout
      summary: Create independent Store Orders from two to ten client carts and reconcile their outcomes
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/MultiStoreCheckoutRequest"
      responses:
        "201":
          description: Parent checkout created; each child records an independent Order outcome.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/MultiStoreCheckoutResponse"
        "200":
          description: Idempotent replay or recovery readback of the same parent checkout.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/MultiStoreCheckoutResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/multi-store-checkouts/{checkoutId}:
    get:
      operationId: readMultiStoreCheckout
      summary: Read a client-owned multi-store checkout and all independent child outcomes
      security:
        - userBearer: []
      parameters:
        - name: checkoutId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Canonical parent and child readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/MultiStoreCheckoutResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/multi-store-checkouts/{checkoutId}/cancel:
    post:
      operationId: cancelMultiStoreCheckout
      summary: Cancel every cancellable child Order and reconcile parent cancellation or partial failure
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - name: checkoutId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "201":
          description: Parent cancellation reconciled across child Orders.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/MultiStoreCheckoutResponse"
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/MultiStoreCheckoutResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/orders:
    get:
      operationId: listClientOrders
      summary: List the authenticated client's Orders
      security:
        - userBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cartId
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: cursor
          in: query
          required: false
          description: Keyset continuation for the client's history. Not combined with cartId.
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: Paginated client Order history; cartId performs bounded checkout recovery.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/orders/{orderId}:
    get:
      operationId: readOrder
      summary: Read one Order owned by the authenticated client or Store partner
      security:
        - userBearer: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Canonical Order readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/orders/{orderId}/adjustments/{adjustmentId}/decision:
    post:
      operationId: decideClientOrderAdjustment
      summary: Accept or reject an adjustment proposed for the authenticated client's Order
      security:
        - userBearer: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: adjustmentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/OrderAdjustmentDecisionRequest"
      responses:
        "200":
          description: Canonical Order and adjustment decision readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/orders/{orderId}/conversation:
    get:
      operationId: readOrderConversation
      summary: Read the authenticated participant's bounded Order conversation
      security:
        - userBearer: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Canonical Order conversation readback, including the current write window and unread count.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderConversationResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
