paths:
  /dsh/cart:
    get:
      operationId: readOpenCart
      summary: Read the authenticated client's open Store cart
      security:
        - userBearer: []
      parameters:
        - name: storeId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Canonical open cart readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/cart/lines:
    post:
      operationId: upsertCartLine
      summary: Add or replace one canonical customer-visible StoreOffer in the open cart
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CartExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/UpsertCartLineRequest"
      responses:
        "201":
          description: Cart line created.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/cart/lines/{lineId}:
    patch:
      operationId: updateCartLine
      summary: Update one open cart line with optimistic concurrency
      security:
        - userBearer: []
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/UpdateCartLineRequest"
      responses:
        "201":
          description: Cart line updated.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
    delete:
      operationId: removeCartLine
      summary: Remove one open cart line with optimistic concurrency
      security:
        - userBearer: []
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      responses:
        "201":
          description: Cart line removed.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CartResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/cart/checkout:
    post:
      operationId: checkoutCart
      summary: Revalidate serviceability and customer-visible offers, provision COD collection, then create a CREATED Order
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Canonical Order created from the cart with a linked CASH_ON_DELIVERY payment intent requiring collection at delivery.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/orders:
    get:
      operationId: listClientOrders
      summary: List the authenticated client's Orders
      security:
        - userBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Bounded client Order list.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/orders/{orderId}:
    get:
      operationId: readOrder
      summary: Read one Order owned by the authenticated client or Store partner
      security:
        - userBearer: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Canonical Order readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/orders/{orderId}/cancel:
    post:
      operationId: cancelClientOrder
      summary: Cancel the authenticated client's CREATED COD Order and cancel its WLT collection intent
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "201":
          description: Order cancelled and its WLT cash-collection intent cancelled.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "200":
          description: Idempotent replay.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/operator/operations:
    get:
      operationId: listOperatorOperations
      summary: List the bounded operator operations read model
      security:
        - serviceBearer: []
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "../dsh.openapi.yaml#/components/schemas/OrderState"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
      responses:
        "200":
          description: Bounded DSH-owned operations read model for the authenticated Operator.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OperatorOperationsResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/operator/operations/{orderId}:
    get:
      operationId: readOperatorOperation
      summary: Read one decision-sufficient operator operation
      security:
        - serviceBearer: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
      responses:
        "200":
          description: DSH-owned operator operation detail read model.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OperatorOperationResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/stores/{storeId}/orders:
    get:
      operationId: listStoreOrders
      summary: List Orders belonging to the authenticated partner's Store
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Bounded partner Order list.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/stores/{storeId}/orders/{orderId}:
    get:
      operationId: readStoreOrder
      summary: Read one Order belonging to the authenticated partner's Store
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Canonical partner Order readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/stores/{storeId}/orders/{orderId}/transition:
    post:
      operationId: transitionStoreOrder
      summary: Advance or reject a Store Order through the DSH pre-dispatch lifecycle
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/OrderTransitionRequest"
      responses:
        "200":
          description: Canonical Order transition result, including idempotent replay state.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/OrderResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
