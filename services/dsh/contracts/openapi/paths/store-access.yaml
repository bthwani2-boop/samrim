paths:
  /dsh/partner/stores:
    get:
      operationId: listPartnerAccessibleStores
      summary: List owned and actively delegated Store scopes for the current Partner actor
      security: [{ userBearer: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        "200": { description: Canonical owned and actively granted Store scopes with their exact permissions., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerAccessibleStorePage" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/access:
    get:
      operationId: listPartnerStoreAccessGrants
      summary: Read Store-scoped invitations and grants for its owner
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
      responses:
        "200": { description: Canonical Store access grants., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantListResponse" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/access/invitations:
    post:
      operationId: createPartnerStoreAccessInvitation
      summary: Invite a verified Human Actor by phone to one Store with bounded permissions
      description: DSH resolves the submitted phone through Identity and stores the canonical Actor internally. The invitee must accept before any Partner-role admission or Store access can begin.
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessInvitationCreateRequest" }
      responses:
        "201": { description: Canonical invitation created., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantMutationResponse" } } } }
        "200": { description: Idempotent invitation replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/access/{grantId}:
    patch:
      operationId: transitionPartnerStoreAccessGrant
      summary: Suspend, restore or revoke a Store access grant
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - name: grantId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantTransitionRequest" }
      responses:
        "200": { description: Canonical updated grant., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/access/{grantId}/permissions:
    put:
      operationId: updatePartnerStoreAccessPermissions
      summary: Replace an invitation or grant's bounded Store permissions as its owner
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - name: grantId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantPermissionsRequest" }
      responses:
        "200": { description: Canonical versioned grant permission readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/store-payout-recipients:
    get:
      operationId: listPartnerStorePayoutRecipients
      summary: Read the effective payout recipient per Store for the current Partner owner
      security: [{ userBearer: [] }]
      responses:
        "200": { description: WLT-owned payout-recipient readback with Store names and masked beneficiary phones., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StorePayoutRecipientListResponse" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/payout-requests:
    post:
      operationId: createPartnerPayoutRequest
      summary: Create a Store-scoped Partner payout request that WLT partitions by effective recipient and destination
      description: The requested scope must sit inside the actor's payout_request authority. WLT resolves each Store's effective recipient, groups Stores by beneficiary and verified destination, and never mixes two beneficiaries in one external transfer. Identity facts are resolved server-side from canonical Identity.
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerPayoutRequestCreateRequest" }
      responses:
        "201": { description: Partitioned payout request recorded with immutable per-Store allocations., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerPayoutRequestResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerPayoutRequestResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/payout-requests/{partnerActorId}/{requestId}:
    get:
      operationId: readPartnerPayoutRequest
      summary: Read one partitioned Partner payout request with its Store allocations
      security: [{ userBearer: [] }]
      parameters:
        - name: partnerActorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: requestId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: Canonical partitioned payout request readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerPayoutRequestResponse" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/payout-recipient:
    put:
      operationId: selectPartnerStorePayoutRecipient
      summary: Select a verified team member as the Store's future payout recipient
      description: Owner-only. References an active Store access grant; DSH resolves the canonical actor and forwards verified Identity facts to WLT, which owns the assignment, its version, audit and readiness. Never accepts wallet numbers, beneficiary names or destinations.
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StorePayoutRecipientSelectRequest" }
      responses:
        "201": { description: Canonical assignment recorded., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StorePayoutRecipientMutationResponse" } } } }
        "200": { description: Idempotent replay., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StorePayoutRecipientMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/stores/{storeId}/payout-recipient/revert:
    post:
      operationId: revertPartnerStorePayoutRecipient
      summary: Revert the Store's payout recipient to the Partner owner
      description: Owner-only. Deletes the explicit assignment so future unpinned payout intents route to the owner; the immutable WLT event ledger preserves history.
      security: [{ userBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/StoreId"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StorePayoutRecipientRevertRequest" }
      responses:
        "200": { description: Canonical DEFAULT_OWNER readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StorePayoutRecipientRevertResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/actor/store-access-invitations:
    get:
      operationId: listActorStoreAccessInvitations
      summary: Read Store invitations addressed to the authenticated Human Actor
      security: [{ userBearer: [] }]
      responses:
        "200": { description: Canonical invitations and grants addressed only to this authenticated actor., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantListResponse" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/actor/store-access-invitations/{grantId}/decision:
    post:
      operationId: decideActorStoreAccessInvitation
      summary: Accept or decline a Store access invitation as its invited Human Actor
      security: [{ userBearer: [] }]
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessInvitationDecisionRequest" }
      responses:
        "200": { description: Canonical decision readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partner/store-access-invitations/{grantId}/activate:
    post:
      operationId: activatePartnerStoreAccessInvitation
      summary: Activate an accepted Store grant from the delegate's Partner session
      description: Requires the invited actor's active Partner session. This operation commits Store access only after invitation acceptance and Partner-role authentication.
      security: [{ userBearer: [] }]
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantActivationRequest" }
      responses:
        "200": { description: Canonical active Store grant readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operations/store-access-role-admissions:
    get:
      operationId: listStoreAccessRoleAdmissionsForOperator
      summary: List pending Partner role admissions for an authorized Operator
      security: [{ serviceBearer: [] }]
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
      responses:
        "200": { description: Pending admissions; requires an active Operator with Partners permission., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantListResponse" } } } }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operations/store-access-role-admissions/{grantId}/provision:
    post:
      operationId: provisionPartnerRoleForStoreAccessForOperator
      summary: Admit the existing invited actor to the Partner role
      description: Requires an active Operator with Partners permission and an accepted DSH invitation in pending_role_admission. Identity admits only the existing canonical actorId and never resolves a phone or creates an Actor.
      security: [{ serviceBearer: [] }]
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
      responses:
        "200": { description: Canonical DSH pending_partner_activation readback., content: { application/json: { schema: { $ref: "../dsh.openapi.yaml#/components/schemas/StoreAccessGrantMutationResponse" } } } }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
