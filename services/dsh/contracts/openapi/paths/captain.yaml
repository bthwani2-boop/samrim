paths:
  /dsh/partners/me/stores/{storeId}/captain-memberships:
    get:
      operationId: listPartnerStoreCaptainMemberships
      summary: Read Captain membership and invitation state for an owned Store
      security:
        - userBearer: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Current membership and invitation readback for the Store.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StoreCaptainMembershipListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/partners/me/stores/{storeId}/captain-memberships/invitations:
    post:
      operationId: createPartnerStoreCaptainInvitation
      summary: Create a one-time invitation for an existing Captain actor
      security:
        - userBearer: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      responses:
        "201":
          description: Invitation created. The code is returned once and only its hash is retained.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StoreCaptainInvitationResponse"
        "200":
          description: Idempotent replay; the one-time code is not returned again.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StoreCaptainInvitationResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/partners/me/stores/{storeId}/captain-memberships/{membershipId}:
    patch:
      operationId: transitionPartnerStoreCaptainMembership
      summary: Suspend, reactivate, or revoke an owned Store Captain membership
      security:
        - userBearer: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/StoreCaptainMembershipTransitionRequest"
      responses:
        "200":
          description: Canonical Store Captain membership state after the requested transition.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StoreCaptainMembershipResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/partners/me/stores/{storeId}/orders/{orderId}/captain-offer:
    get:
      operationId: readPartnerStoreCaptainDispatchOffer
      summary: Read the latest Store Captain offer for an owned order
      security:
        - userBearer: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Latest Store Captain dispatch offer.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainOfferResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
    post:
      operationId: createPartnerStoreCaptainDispatchOffer
      summary: Offer a ready Partner Captain order to an active Captain member of that Store
      security:
        - userBearer: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/StoreCaptainDispatchRequest"
      responses:
        "201":
          description: Store Captain offer created.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainOfferResponse"
        "200":
          description: Idempotent replay of the same Store Captain offer.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainOfferResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/me/store-memberships:
    get:
      operationId: listOwnStoreCaptainMemberships
      summary: Read Store affiliations for the authenticated Captain
      security:
        - userBearer: []
      responses:
        "200":
          description: Current Store membership readback for the Captain.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StoreCaptainMembershipListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/me/store-memberships/accept:
    post:
      operationId: acceptOwnStoreCaptainInvitation
      summary: Accept a Store invitation using the authenticated Captain identity
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/AcceptStoreCaptainInvitationRequest"
      responses:
        "200":
          description: Store Captain membership after acceptance.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StoreCaptainMembershipResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/admissions:
    get:
      operationId: listCaptainAdmissions
      summary: Search and page Captain candidates and admissions
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: state
          in: query
          schema: { type: string, enum: [all, pending, pending_review, pending_identity, eligible, suspended] }
        - name: sort
          in: query
          schema: { type: string, enum: [created_desc, created_asc] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Bounded Captain admission registry page.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionListResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
    post:
      operationId: admitCaptain
      summary: Create a Captain candidate profile before role access
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionRequest"
      responses:
        "201":
          description: Captain candidate profile created in review state.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionResponse"
        "200":
          description: Idempotent candidate profile readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/captains/admissions/{admissionId}/profile:
    patch:
      operationId: updateCaptainAdmissionProfile
      summary: Complete the Arabic name on an unapproved Captain candidate
      security:
        - serviceBearer: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionProfileRequest"
      responses:
        "200":
          description: Updated Captain candidate profile.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/captains/admissions/{admissionId}/approve:
    post:
      operationId: approveCaptainAdmission
      summary: Approve DSH Captain eligibility before provisioning an Identity role
      security:
        - serviceBearer: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      responses:
        "200":
          description: DSH eligibility approved; Identity role remains unprovisioned.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }

  /dsh/captains/admissions/{admissionId}/provision:
    post:
      operationId: provisionCaptainAdmission
      summary: Provision and bind a Captain Identity role for an approved candidate
      security:
        - serviceBearer: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      responses:
        "200":
          description: Identity role provisioned and bound to the approved Captain admission.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/captains/admissions/{admissionId}:
    get:
      operationId: readCaptainAdmission
      summary: Read one DSH-owned Captain admission
      security:
        - serviceBearer: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
      responses:
        "200":
          description: Canonical Captain admission readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/actors/{actorId}/admission:
    get:
      operationId: readCaptainAdmissionForOperatorActor
      summary: Read a Captain admission by actor for an operator
      security:
        - serviceBearer: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
      responses:
        "200":
          description: Canonical DSH Captain admission readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/actors/{actorId}/availability:
    post:
      operationId: setOperatorCaptainAvailability
      summary: Set an eligible Captain's availability by an active operator
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/ManagedCaptainAvailabilityRequest"
      responses:
        "200":
          description: Canonical Captain admission and availability readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/me:
    get:
      operationId: readOwnCaptainAdmission
      summary: Read the authenticated Captain's DSH admission
      security:
        - userBearer: []
      responses:
        "200":
          description: Captain admission readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/me/availability:
    post:
      operationId: setCaptainAvailability
      summary: Set availability for the authenticated eligible Captain
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAvailabilityRequest"
      responses:
        "200":
          description: Availability readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAdmissionResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/me/offers:
    get:
      operationId: listOwnCaptainOffers
      summary: List offers addressed to the authenticated Captain
      security:
        - userBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Bounded Captain offer list.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainOfferListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/me/offers/{offerId}/respond:
    post:
      operationId: respondToCaptainOffer
      summary: Accept or reject one unexpired Captain offer
      security:
        - userBearer: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/ExpectedVersionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../dsh.openapi.yaml#/components/schemas/CaptainOfferDecisionRequest"
      responses:
        "200":
          description: Offer and optional assignment readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainOfferResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/me/assignments:
    get:
      operationId: listOwnCaptainAssignments
      summary: List assignments for the authenticated Captain
      security:
        - userBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Bounded Captain assignment list.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CaptainAssignmentListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/me/cash-liability:
    get:
      operationId: readOwnCaptainCashLiability
      summary: Read unremitted cash collected by the authenticated Captain
      security:
        - userBearer: []
      responses:
        "200":
          description: Cash liability readback owned by the authenticated Captain.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/CashLiabilityResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/captains/me/cash-liability/{paymentIntentId}/remit:
    post:
      operationId: remitOwnCaptainCash
      summary: Record remittance of one collected COD payment by the authenticated Captain
      security:
        - userBearer: []
      parameters:
        - name: paymentIntentId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
