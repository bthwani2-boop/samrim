paths:
  /dsh/notifications:
    get:
      operationId: listNotifications
      summary: List the authenticated actor's in-app notifications
      security:
        - userBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Bounded notification inbox with the complete unread count.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/NotificationListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one visible notification as read
      security:
        - userBearer: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Canonical read-state writeback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/NotificationReadResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"
