paths:
  /dsh/notifications:
    get:
      operationId: listNotifications
      summary: List the authenticated actor's in-app notifications, including operational notifications for control operators
      security:
        - userBearer: []
        - serviceBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
        - name: X-Acting-Actor-ID
          in: header
          required: false
          description: Required with serviceBearer; identifies the authenticated control operator whose operational notifications are being read.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Bounded notification inbox with the complete unread count.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/NotificationListResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one visible notification as read
      security:
        - userBearer: []
        - serviceBearer: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: X-Acting-Actor-ID
          in: header
          required: false
          description: Required with serviceBearer; identifies the authenticated control operator whose read state is being updated.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Canonical read-state writeback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/NotificationReadResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/notifications/devices:
    post:
      operationId: registerNotificationDevice
      summary: Bind or update an Expo push installation to the current mobile actor-role session
      security: [{ userBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installationId, expoPushToken, tone]
              properties:
                installationId: { type: string, format: uuid }
                expoPushToken: { type: string, minLength: 1 }
                tone: { type: string, enum: [classic, soft, urgent] }
      responses:
        "200":
          description: Push registration state and whether server push dispatch is enabled.
          content:
            application/json:
              schema:
                type: object
                required: [registered, pushEnabled]
                properties:
                  registered: { type: boolean }
                  pushEnabled: { type: boolean }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/notifications/devices/{installationId}:
    delete:
      operationId: unregisterNotificationDevice
      summary: Unbind an Expo push installation from the current mobile actor-role session
      security: [{ userBearer: [] }]
      parameters:
        - name: installationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Installation unregistered for the authorized actor.
          content:
            application/json:
              schema:
                type: object
                required: [unregistered]
                properties:
                  unregistered: { type: boolean }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
