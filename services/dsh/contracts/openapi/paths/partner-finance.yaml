paths:
  /dsh/partners/me/financial-summary:
    get:
      operationId: readOwnPartnerFinancialSummary
      summary: Read the authenticated partner's WLT-derived earning summary
      security:
        - userBearer: []
      responses:
        "200":
          description: Partner financial summary.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PartnerFinancialSummaryResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/operator/partners/{partnerActorId}/financial-summary:
    get:
      operationId: readOperatorPartnerFinancialSummary
      summary: Read a WLT-derived partner earning summary for Finance operations
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: partnerActorId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Partner financial summary.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PartnerFinancialSummaryResponse"
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "404":
          $ref: "../dsh.openapi.yaml#/components/responses/NotFound"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/partners/me/payout-state:
    get:
      operationId: readOwnPartnerPayoutState
      summary: Read the authenticated partner payout readiness and masked destination
      security:
        - userBearer: []
      responses:
        "200":
          description: Partner payout state.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PartnerPayoutStateResponse"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/partners/me/payout-intents:
    post:
      operationId: createOwnPartnerPayoutIntent
      summary: Create a server-resolved partner payout intent
      security:
        - userBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountMode]
              properties:
                amountMode: { type: string, enum: [FULL_AVAILABLE, SPECIFIED] }
                amountMinor: { type: integer, minimum: 1, nullable: true }
      responses:
        "201":
          description: Payout intent held.
          content:
            application/json:
              schema:
                type: object
                required: [payout, idempotentReplay]
                properties:
                  payout: { $ref: "../dsh.openapi.yaml#/components/schemas/PayoutRequest" }
                  idempotentReplay: { type: boolean }
        "400":
          $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput"
        "401":
          $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated"
        "403":
          $ref: "../dsh.openapi.yaml#/components/responses/Forbidden"
        "409":
          $ref: "../dsh.openapi.yaml#/components/responses/Conflict"
        "502":
          $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable"

  /dsh/operator/partners/{partnerActorId}/payout-state:
    get:
      operationId: readOperatorPartnerPayoutState
      summary: Read a partner payout state for Finance operations
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: partnerActorId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Partner payout state.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PartnerPayoutStateResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/partners/{partnerActorId}/official-wallet-destination:
    get:
      operationId: readOperatorPartnerWalletDestination
      summary: Read a partner official-wallet destination
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: partnerActorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Official-wallet destination.
          content:
            application/json:
              schema:
                type: object
                required: [destination]
                properties:
                  destination: { $ref: "../dsh.openapi.yaml#/components/schemas/OfficialWalletDestination" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
    post:
      operationId: createOperatorPartnerWalletDestination
      summary: Create a Finance-managed partner official-wallet destination candidate
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: partnerActorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerKey, walletIdentifier, beneficiaryName, changeReason, verificationEvidenceReference, changeEvidenceReference]
              properties:
                providerKey: { type: string }
                walletIdentifier: { type: string, writeOnly: true }
                beneficiaryName: { type: string }
                changeReason: { type: string }
                verificationEvidenceReference: { type: string }
                changeEvidenceReference: { type: string }
      responses:
        "201":
          description: Destination candidate created.
          content:
            application/json:
              schema:
                type: object
                required: [destination, idempotentReplay]
                properties:
                  destination: { $ref: "../dsh.openapi.yaml#/components/schemas/OfficialWalletDestination" }
                  idempotentReplay: { type: boolean }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/partners/{partnerActorId}/official-wallet-destination/{destinationId}/verify:
    post:
      operationId: verifyOperatorPartnerWalletDestination
      summary: Verify a partner official-wallet destination
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: partnerActorId
          in: path
          required: true
          schema: { type: string }
        - name: destinationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [evidenceReference]
              properties:
                evidenceReference: { type: string }
      responses:
        "200":
          description: Destination verified.
          content:
            application/json:
              schema:
                type: object
                required: [destination]
                properties:
                  destination: { $ref: "../dsh.openapi.yaml#/components/schemas/OfficialWalletDestination" }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/partners/{partnerActorId}/official-wallet-destination/{destinationId}/activate:
    post:
      operationId: activateOperatorPartnerWalletDestination
      summary: Activate an already verified partner official-wallet destination
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
        - name: partnerActorId
          in: path
          required: true
          schema: { type: string }
        - name: destinationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "200":
          description: Destination activated for payout.
          content:
            application/json:
              schema:
                type: object
                required: [destination]
                properties:
                  destination: { $ref: "../dsh.openapi.yaml#/components/schemas/OfficialWalletDestination" }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }
