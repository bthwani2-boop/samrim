paths:
  /dsh/partners/me/financial-summary:
    get:
      operationId: readOwnPartnerFinancialSummary
      summary: Read financial data for every Store granting finance_read
      description: Ownership includes all owned Stores. Delegated reads include only active finance_read grants; payout_request is independent. Store amounts derive from WLT earnings, ledger and immutable payout allocations.
      security:
        - userBearer: []
      parameters:
        - name: storeId
          in: query
          required: false
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        "200":
          description: Partner financial summary.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PartnerScopedFinancialSummaryResponse"
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/partner-commission-receivables:
    get:
      operationId: listOperatorPartnerCommissionReceivables
      summary: List WLT-current partner cash-commission receivables in bounded searchable pages
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: search
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [actor_asc, actor_desc], default: actor_asc }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 1024 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Current receivables in one bounded page.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerCommissionReceivableRegistryResponse" }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/partners/{partnerActorId}/financial-summary:
    get:
      operationId: readOperatorPartnerFinancialSummary
      summary: Read a WLT-derived partner earning summary for Finance operations
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: partnerActorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Partner financial summary.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/PartnerFinancialSummaryResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "404": { $ref: "../dsh.openapi.yaml#/components/responses/NotFound" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }


  /dsh/operator/partners/{partnerActorId}/store-payout-recipients:
    get:
      operationId: readOperatorPartnerStorePayoutRecipients
      summary: Read canonical per-Store payout recipients for Finance operations
      description: Finance-only operator readback. WLT owns assignment state; DSH enriches it with Store names and masked beneficiary wallet presentation. Raw Actor IDs remain transport facts and are not operator-facing identity.
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: partnerActorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Canonical Store payout-recipient readback.
          content:
            application/json:
              schema:
                $ref: "../dsh.openapi.yaml#/components/schemas/StorePayoutRecipientListResponse"
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/operator/partners/{partnerActorId}/commission-remittances:
    post:
      operationId: recordPartnerCommissionRemittance
      summary: Record an operator-verified Partner remittance against its WLT commission receivable
      security:
        - serviceBearer: []
      parameters:
        - $ref: "../dsh.openapi.yaml#/components/parameters/ActingActorIdRequired"
        - name: partnerActorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: "../dsh.openapi.yaml#/components/parameters/CorrelationIdRequired"
        - $ref: "../dsh.openapi.yaml#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerCommissionRemittanceRequest" }
      responses:
        "201":
          description: Remittance was verified and posted to the WLT ledger.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerCommissionRemittanceResponse" }
        "200":
          description: Idempotent replay of the verified remittance.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerCommissionRemittanceResponse" }
        "400": { $ref: "../dsh.openapi.yaml#/components/responses/InvalidInput" }
        "401": { $ref: "../dsh.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../dsh.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../dsh.openapi.yaml#/components/responses/Conflict" }
        "502": { $ref: "../dsh.openapi.yaml#/components/responses/DependencyUnavailable" }

  /dsh/partners/me/payout-summary:
    get:
      operationId: readOwnPartnerPayoutSummary
      summary: Read canonical available allocations for the actor's payout_request Store scope.
      security: [{ userBearer: [] }]
      parameters:
        - name: storeId
          in: query
          required: false
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        "200":
          description: Authorized per-Store payout availability and readiness.
          content:
            application/json:
              schema: { $ref: "../dsh.openapi.yaml#/components/schemas/PartnerPayoutSummaryResponse" }
        "403": { description: payout_request is not granted for every included Store. }
