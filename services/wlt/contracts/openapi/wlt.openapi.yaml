components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    IntentId:
      name: intentId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CaptainActorId:
      name: captainActorId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    ExpectedVersion:
      name: X-Expected-Version
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
    ActingActorId:
      name: X-Acting-Actor-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    WalletState:
