openapi: 3.1.0
info:
  title: BThwani WLT API
  version: 0.1.0
  description: Isolated development projection of posted Customer wallet funding.
paths:
  /v1/wallets/me:
    $ref: './paths/wallets.yaml#/paths/~1v1~1wallets~1me'
  /v1/wallets/me/transactions:
    $ref: './paths/wallets.yaml#/paths/~1v1~1wallets~1me~1transactions'
components:
  securitySchemes:
    OpaqueSession:
      type: http
      scheme: bearer
  schemas:
    CustomerWalletBalance:
      type: object
      additionalProperties: false
      required: [actorId, currency, balanceYer]
      properties:
        actorId: { type: string, minLength: 1, maxLength: 128 }
        currency: { type: string, const: YER }
        balanceYer:
          type: string
          pattern: '^(0|[1-9][0-9]{0,37})$'
          description: Exact whole YER in canonical decimal notation. Zero is returned only after a successful owner read of an empty wallet.
    CustomerFundingTransaction:
      type: object
      additionalProperties: false
      required: [fundingId, amountYer, postedAt]
      properties:
        fundingId:
          type: string
          pattern: '^[A-Za-z0-9._-]{8,128}$'
        amountYer:
          type: string
          pattern: '^[1-9][0-9]{0,37}$'
        postedAt: { type: string, format: date-time }
    CustomerFundingHistory:
      type: object
      additionalProperties: false
      required: [actorId, currency, items, hasMore]
      properties:
        actorId: { type: string, minLength: 1, maxLength: 128 }
        currency: { type: string, const: YER }
        items:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/CustomerFundingTransaction' }
        hasMore: { type: boolean }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, enum: [INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, OWNER_UNAVAILABLE] }
