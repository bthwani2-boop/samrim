openapi: 3.1.0
info:
  title: Samrim WLT Internal Payment API
  version: 0.1.0
  description: Canonical internal payment-intent and cash-collection boundary.
servers:
  - url: http://localhost:18083
paths:
  /wlt/v1/operator/promotion-settlement/{promotionId}:
    get:
      operationId: readOperatorPromotionSettlement
      summary: WLT-owned posted promotion settlement totals, not reservation or net refund totals
      security: [{ serviceToken: [] }]
      parameters:
        - name: promotionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Posted order settlement readback from WLT, without inferred refund or delivery totals.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [promotionId, settledOrderCount, settledDiscountMinor, partnerFundedMinor, platformFrozenMinor, platformPostedExpenseMinor, currency, basis]
                properties:
                  promotionId: { type: string }
                  settledOrderCount: { type: integer, minimum: 0 }
                  settledDiscountMinor: { type: integer, minimum: 0 }
                  partnerFundedMinor: { type: integer, minimum: 0 }
                  platformFrozenMinor: { type: integer, minimum: 0 }
                  platformPostedExpenseMinor: { type: integer }
                  currency: { type: string, enum: [YER] }
                  basis: { type: string, enum: [POSTED_SETTLEMENT_NOT_NET_REFUNDS] }
        '400': { description: Invalid promotion identifier. }
        '401': { description: WLT service authorization required. }
        '502': { description: WLT storage unavailable. }
  /wlt/v1/operator/distance-band-fee-policies:
    get:
      operationId: readDistanceBandFeePolicy
      security: [{ serviceToken: [] }]
      parameters:
        - name: serviceCityId
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        '200': { description: Current policy version; legacy versions have null bands until configured. }
        '404': { description: No active policy for the requested scope. }
    post:
      operationId: createDistanceBandFeePolicy
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/ActingActorId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceCityId, distanceBands, expectedVersion, reason]
              properties:
                serviceCityId: { type: string, maxLength: 128 }
                distanceBands:
                  type: array
                  minItems: 1
                  maxItems: 30
                  description: Increasing tier upper bounds in metres; last bound is null (unlimited).
                  items:
                    type: object
                    required: [upToMeters, ratePerKmMinor]
                    properties:
                      upToMeters: { type: [integer, 'null'], minimum: 1, maximum: 500000 }
                      ratePerKmMinor: { type: integer, minimum: 1, maximum: 100000000 }
                expectedVersion: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201': { description: New effective distance-only pricing version. }
        '200': { description: Idempotent replay of that version. }
        '409': { description: Stale version or changed idempotent facts. }
  /wlt/v1/operator/policy-history:
    get:
      operationId: readOperatorPolicyHistory
      security: [{ serviceToken: [] }]
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string, enum: [delivery-fees, field-acquisition, partner-financial-terms, captain-minimum-balance] }
        - name: scopeId
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        '200': { description: Latest 50 WLT-owned versioned policy changes with actor and reason. }
  /wlt/v1/operator/policy-registry:
    get:
      operationId: readOperatorPolicyRegistry
      security: [{ serviceToken: [] }]
      responses:
        '200': { description: Active WLT fee and Store Type reward policies, with total counts. }
  /wlt/v1/operator/captain-minimum-balance-policy:
    get:
      operationId: readCaptainMinimumBalancePolicy
      security: [{ serviceToken: [] }]
      responses:
        '200': { description: The active platform-wide captain minimum available balance in YER. }
        '404': { description: No active policy has been configured. }
    post:
      operationId: createCaptainMinimumBalancePolicy
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/ActingActorId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minimumAvailableMinor, expectedVersion, reason]
              properties:
                minimumAvailableMinor: { type: integer, format: int64, minimum: 1 }
                expectedVersion: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201': { description: Versioned activation. }
        '200': { description: Idempotent replay. }
        '409': { description: Stale version or idempotency conflict. }
  /wlt/v1/operator/captain-minimum-balance-policy/history:
    get:
      operationId: listCaptainMinimumBalanceHistory
      security: [{ serviceToken: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200': { description: Most recent WLT-owned versions, including actor and change reason. }
  /wlt/v1/payment-intents:
    post:
      operationId: createPaymentIntent
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
  /wlt/v1/order-adjustment-reconciliation-cases:
    post:
      operationId: recordOrderAdjustmentReconciliationCase
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/ActingActorId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderAdjustmentReconciliationCaseRequest' }
      responses:
        '201':
          description: Financial reconciliation case recorded without moving ledger value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAdjustmentReconciliationCaseResponse' }
        '200':
          description: Idempotent replay of the existing reconciliation case.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAdjustmentReconciliationCaseResponse' }
        '400': { description: Invalid case facts or request headers. }
        '401': { description: WLT service authorization is required. }
        '403': { description: Acting customer does not match the canonical order customer. }
        '409': { description: Payment allocation or idempotent request conflicts with canonical facts. }
        '502': { description: WLT persistence is unavailable. }
    get:
      operationId: listOrderAdjustmentReconciliationCases
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/ActingActorId' }
        - name: orderId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Financial reconciliation cases for the order. Only cases whose canonical payment payer matches X-Acting-Actor-ID are returned; a mismatch returns an empty list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderAdjustmentReconciliationCasesResponse' }
        '400': { description: Invalid query. }
        '401': { description: WLT service authorization is required. }
        '502': { description: WLT persistence is unavailable. }
  /wlt/v1/operator/order-adjustment-reconciliation-cases/{caseId}/wallet-credit:
    post:
      operationId: creditReviewedCustomerWallet
      summary: Credit the existing customer wallet once after Finance review of a collected adjustment
      description: Service-to-service only. DSH authorizes the acting Finance operator and independently derives the exact amount from original Order evidence. WLT rejects uncollected, mismatched or excessive compensation.
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/ActingActorId' }
        - name: caseId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountMinor, evidenceReference]
              properties:
                amountMinor: { type: integer, format: int64, minimum: 1 }
                evidenceReference: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201': { description: A balanced platform-expense to Customer Wallet entry was committed with canonical compensation readback. }
        '200': { description: Existing customer credit returned safely after an idempotent retry. }
        '400': { description: Invalid amount or attribution. }
        '401': { description: WLT service token is missing or invalid. }
        '404': { description: Canonical WLT adjustment case is not found. }
        '409': { description: Payment not collected, amount exceeds original Order or prior decision conflicts. }
        '502': { description: WLT persistence is unavailable. }
  /wlt/v1/payment-intents/by-external-reference:
    get:
      operationId: readPaymentIntentByExternalReference
      security: [{ serviceToken: [] }]
      parameters:
        - name: externalReference
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: The single payment intent matching the external reference.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
        '400':
          description: Missing or invalid external reference.
        '401':
          description: WLT service authorization is required.
        '404':
          description: No payment intent matches the external reference.
        '409':
          description: The external reference is ambiguous across payment methods.
        '502':
          description: WLT persistence is unavailable.
  /wlt/v1/payment-intents/{intentId}:
    get:
      operationId: readPaymentIntent
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IntentId' }
      responses:
        '200':
          description: Payment intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
  /wlt/v1/payment-intents/{intentId}/collect:
    post:
      operationId: collectPaymentIntent
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IntentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectPaymentIntentRequest' }
      responses:
        '200':
          description: Collected payment intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
  /wlt/v1/payment-intents/{intentId}/cancel:
    post:
      operationId: cancelPaymentIntent
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IntentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelPaymentIntentRequest' }
      responses:
        '200':
          description: Cancelled payment intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
  /wlt/v1/captains/{captainActorId}/cash-liability:
    get:
      operationId: listCaptainCashLiability
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/CaptainActorId' }
      responses:
        '200':
          description: Unremitted cash collected by the Captain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashLiabilityResponse' }
  /wlt/v1/operator/cash-liability:
    get:
      operationId: listOperatorCashLiability
      security: [{ serviceToken: [] }]
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [collected_asc, collected_desc], default: collected_asc } }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Server-searched, sorted, and cursor-paginated unremitted COD cash collected by Captains
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashLiabilityRegistryResponse' }
  /wlt/v1/operator/cash-remittances/{remittanceId}/reconcile:
    post:
      operationId: reconcileCaptainCashRemittance
      security: [{ serviceToken: [] }]
      parameters:
        - name: remittanceId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/ActingActorId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconcileCashRemittanceRequest' }
      responses:
        '200':
          description: Finance receipt reconciled and WLT receivable/exposure closed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashRemittanceResponse' }
        '400': { description: Invalid input or missing/invalid receipt evidence. }
        '403': { description: The Captain who submitted the cash cannot reconcile it. }
        '404': { description: The submitted remittance was not found. }
        '409': { description: The remittance is not awaiting reconciliation. }
  /wlt/v1/captains/{captainActorId}/wallet-state:
    get:
      operationId: readCaptainWalletState
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/CaptainActorId' }
      responses:
        '200':
          description: Canonical Captain internal wallet projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainWalletStateResponse' }
  /wlt/v1/captain-cod-reservations:
    post:
      operationId: reserveCaptainCOD
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptainCODReservationRequest' }
      responses:
        '201':
          description: Order-specific COD exposure reserved atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainCODReservationResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainCODReservationResponse' }
  /wlt/v1/captain-cod-reservations/{orderId}/release:
    post:
      operationId: releaseCaptainCOD
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptainCODTransitionRequest' }
      responses:
        '200':
          description: COD reservation released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainCODReservationResponse' }
  /wlt/v1/captain-cod-reservations/{orderId}/finalize:
    post:
      operationId: finalizeCaptainCOD
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptainCODTransitionRequest' }
      responses:
        '200':
          description: COD reservation converted to the final ledger debit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainCODReservationResponse' }
  /wlt/v1/payment-intents/{intentId}/remit:
    post:
      operationId: remitCashForPaymentIntent
      deprecated: true
      description: Retired. New Captain COD cash is settled by WLT wallet debit exactly once; no new remittance is accepted.
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IntentId' }
      responses:
        '410':
          description: CAPTAIN_CASH_REMITTANCE_DISABLED. Historical remittances remain accessible for governed reconciliation only.
  /wlt/v1/delivery-quotes:
    post:
      operationId: quoteDeliveryFee
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryFeeQuoteRequest' }
      responses:
        '200':
          description: Server-derived delivery fee quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryFeeQuoteResponse' }
  /wlt/v1/operator/delivery-fee-policies:
    get:
      operationId: readDeliveryFeePolicy
      security: [{ serviceToken: [] }]
      parameters:
        - name: serviceCityId
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Active delivery fee policy for the exact requested service-city scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryFeePolicyResponse' }
    post:
      operationId: createDeliveryFeePolicy
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeliveryFeePolicyRequest' }
      responses:
        '201':
          description: New immutable policy activated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryFeePolicyResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryFeePolicyResponse' }
  /wlt/v1/operator/partner-financial-terms-policy:
    get:
      operationId: readPartnerFinancialTermsPolicy
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Active partner financial terms policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialTermsPolicyResponse' }
        '404': { description: No active policy is configured. }
    post:
      operationId: createPartnerFinancialTermsPolicy
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/ActingActorId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePartnerFinancialTermsPolicyRequest' }
      responses:
        '201':
          description: New immutable policy activated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialTermsPolicyResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialTermsPolicyResponse' }
        '409': { description: Expected policy version or idempotency key conflicts. }
  /wlt/v1/partner-financial-profiles:
    post:
      operationId: preparePartnerFinancialProfile
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreparePartnerFinancialProfileRequest' }
      responses:
        '201':
          description: Prepared financial profile awaiting DSH binding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialProfileResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialProfileResponse' }
  /wlt/v1/partner-financial-profiles/{profileId}:
    get:
      operationId: readPartnerFinancialProfile
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProfileId' }
      responses:
        '200':
          description: Partner financial profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialProfileResponse' }
  /wlt/v1/partner-financial-profiles/{profileId}/activate:
    post:
      operationId: activatePartnerFinancialProfile
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProfileId' }
        - { $ref: '#/components/parameters/ExpectedVersion' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/ActingActorId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Activated financial profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialProfileResponse' }
  /wlt/v1/operator/commercial-store-type-commission-defaults:
    get:
      operationId: readOperatorCommercialStoreTypeCommissionDefaults
      security: [{ serviceToken: [] }]
      parameters:
        - name: commercialStoreTypeId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Suggested commission defaults by fulfillment mode for a commercial store type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreTypeCommissionDefaultsResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: updateOperatorCommercialStoreTypeCommissionDefault
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/ActingActorId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStoreTypeCommissionDefaultRequest' }
      responses:
        '200':
          description: Changed default or idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreTypeCommissionDefaultUpdateResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /wlt/v1/store-commercial-agreements:
    get:
      operationId: readStoreCommercialAgreements
      security: [{ serviceToken: [] }]
      parameters:
        - name: storeId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Commercial agreement history for a store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreCommercialAgreementListResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '502': { $ref: '#/components/responses/DependencyUnavailable' }
    post:
      operationId: proposeStoreCommercialAgreement
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/ActingActorId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProposeStoreCommercialAgreementRequest' }
      responses:
        '201':
          description: Store commercial agreement proposed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreCommercialAgreementResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreCommercialAgreementResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DependencyUnavailable' }
  /wlt/v1/operator/store-commercial-agreements:
    get:
      operationId: listStoreCommercialAgreementsForFinance
      security: [{ serviceToken: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, default: PARTNER_ACCEPTED }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Cursor-paged store commercial agreements for finance review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreCommercialAgreementPageResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '502': { $ref: '#/components/responses/DependencyUnavailable' }
  /wlt/v1/store-commercial-agreements/{agreementId}/accept:
