openapi: 3.1.0
info:
  title: Samrim WLT Internal Payment API
  version: 0.1.0
  description: Canonical internal payment-intent and cash-collection boundary.
servers:
  - url: http://localhost:18083
paths:
  /wlt/v1/payment-intents:
    post:
      operationId: createPaymentIntent
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
  /wlt/v1/payment-intents/{intentId}:
    get:
      operationId: readPaymentIntent
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IntentId' }
      responses:
        '200':
          description: Payment intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
  /wlt/v1/payment-intents/{intentId}/collect:
    post:
      operationId: collectPaymentIntent
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IntentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectPaymentIntentRequest' }
      responses:
        '200':
          description: Collected payment intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
  /wlt/v1/payment-intents/{intentId}/cancel:
    post:
      operationId: cancelPaymentIntent
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IntentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelPaymentIntentRequest' }
      responses:
        '200':
          description: Cancelled payment intent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntentResponse' }
  /wlt/v1/captains/{captainActorId}/cash-liability:
    get:
      operationId: listCaptainCashLiability
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/CaptainActorId' }
      responses:
        '200':
          description: Unremitted cash collected by the Captain
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashLiabilityResponse' }
  /wlt/v1/operator/cash-liability:
    get:
      operationId: listOperatorCashLiability
      security: [{ serviceToken: [] }]
      responses:
        '200':
          description: Bounded read of unremitted COD cash collected by Captains
          content:
            application/json:
               schema: { $ref: '#/components/schemas/CashLiabilityResponse' }
  /wlt/v1/captains/{captainActorId}/wallet-state:
    get:
      operationId: readCaptainWalletState
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/CaptainActorId' }
      responses:
        '200':
          description: Canonical Captain internal wallet projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainWalletStateResponse' }
  /wlt/v1/operator/captains/{captainActorId}/opening-funding:
    post:
      operationId: createCaptainOpeningFunding
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/CaptainActorId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptainOpeningFundingRequest' }
      responses:
        '201':
          description: Operator-governed opening funding posted to the WLT ledger.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainWalletFundingResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainWalletFundingResponse' }
  /wlt/v1/captain-cod-reservations:
    post:
      operationId: reserveCaptainCOD
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptainCODReservationRequest' }
      responses:
        '201':
          description: Order-specific COD exposure reserved atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainCODReservationResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainCODReservationResponse' }
  /wlt/v1/captain-cod-reservations/{orderId}/release:
    post:
      operationId: releaseCaptainCOD
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptainCODTransitionRequest' }
      responses:
        '200':
          description: COD reservation released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainCODReservationResponse' }
  /wlt/v1/captain-cod-reservations/{orderId}/finalize:
    post:
      operationId: finalizeCaptainCOD
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptainCODTransitionRequest' }
      responses:
        '200':
          description: COD reservation converted to the final ledger debit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptainCODReservationResponse' }
  /wlt/v1/payment-intents/{intentId}/remit:
    post:
      operationId: remitCashForPaymentIntent
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/IntentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemitCashRequest' }
      responses:
        '200':
          description: Cash remittance recorded or idempotently replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashRemittanceResponse' }
  /wlt/v1/delivery-quotes:
    post:
      operationId: quoteDeliveryFee
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliveryFeeQuoteRequest' }
      responses:
        '200':
          description: Server-derived delivery fee quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryFeeQuoteResponse' }
  /wlt/v1/operator/delivery-fee-policies:
    get:
      operationId: readDeliveryFeePolicy
      security: [{ serviceToken: [] }]
      parameters:
        - name: serviceCityId
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Active delivery fee policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryFeePolicyResponse' }
    post:
      operationId: createDeliveryFeePolicy
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeliveryFeePolicyRequest' }
      responses:
        '201':
          description: New immutable policy activated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryFeePolicyResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryFeePolicyResponse' }
  /wlt/v1/partner-financial-profiles:
    post:
      operationId: preparePartnerFinancialProfile
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreparePartnerFinancialProfileRequest' }
      responses:
        '201':
          description: Prepared financial profile awaiting DSH binding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialProfileResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialProfileResponse' }
  /wlt/v1/partner-financial-profiles/{profileId}:
    get:
      operationId: readPartnerFinancialProfile
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProfileId' }
      responses:
        '200':
          description: Partner financial profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialProfileResponse' }
  /wlt/v1/partner-financial-profiles/{profileId}/activate:
    post:
      operationId: activatePartnerFinancialProfile
      security: [{ serviceToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProfileId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Activated financial profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialProfileResponse' }
  /wlt/v1/partner-order-earnings/finalize:
    post:
      operationId: finalizePartnerOrderEarning
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizePartnerOrderEarningRequest' }
      responses:
        '201':
          description: Partner earning finalized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerOrderEarningResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerOrderEarningResponse' }
  /wlt/v1/partners/{partnerActorId}/financial-summary:
    get:
      operationId: readPartnerFinancialSummary
      security: [{ serviceToken: [] }]
      parameters:
        - name: partnerActorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Partner financial summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerFinancialSummaryResponse' }
  /wlt/v1/partner-store-cash-commissions/finalize:
    post:
      operationId: finalizePartnerStoreCashCommission
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizePartnerStoreCashCommissionRequest' }
      responses:
        '201':
          description: Store-collected cash and Partner commission receivable recorded for customer pickup or Partner Captain delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerStoreCashCommissionResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerStoreCashCommissionResponse' }
  /wlt/v1/operator/partners/{partnerActorId}/commission-remittances:
    post:
      operationId: recordVerifiedPartnerCommissionRemittance
      security: [{ serviceToken: [] }]
      parameters:
        - name: partnerActorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ActingActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordPartnerCommissionRemittanceRequest' }
      responses:
        '201':
          description: Direct Partner remittance verified and posted against the receivable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerCommissionRemittanceResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerCommissionRemittanceResponse' }
  /wlt/v1/operator/field-commission-policies:
    post:
      operationId: createFieldCommissionPolicy
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFieldCommissionPolicyRequest' }
      responses:
        '201':
          description: Field commission policy created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldCommissionPolicyResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldCommissionPolicyResponse' }
  /wlt/v1/field-commission-policies/{policyId}:
    get:
      operationId: readFieldCommissionPolicy
      security: [{ serviceToken: [] }]
      parameters:
        - name: policyId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Field commission policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldCommissionPolicyResponse' }
  /wlt/v1/field-commission-earnings/finalize:
    post:
      operationId: finalizeFieldCommission
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizeFieldCommissionRequest' }
      responses:
        '201':
          description: Field earning finalized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldCommissionEarningResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldCommissionEarningResponse' }
  /wlt/v1/fields/{fieldActorId}/financial-summary:
    get:
      operationId: readFieldFinancialSummary
      security: [{ serviceToken: [] }]
      parameters:
        - name: fieldActorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Field financial summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldFinancialSummaryResponse' }
  /wlt/v1/operator/official-wallet-destinations:
    post:
      operationId: createOfficialWalletDestination
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOfficialWalletDestinationRequest' }
      responses:
        '201':
          description: Official wallet destination submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficialWalletDestinationResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficialWalletDestinationResponse' }
  /wlt/v1/operator/official-wallet-destinations/{destinationId}/verify:
    post:
      operationId: verifyOfficialWalletDestination
      security: [{ serviceToken: [] }]
      parameters:
        - name: destinationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionOfficialWalletDestinationRequest' }
      responses:
        '200':
          description: Destination verification recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficialWalletDestinationResponse' }
  /wlt/v1/operator/official-wallet-destinations/{destinationId}/activate:
    post:
      operationId: activateOfficialWalletDestination
      security: [{ serviceToken: [] }]
      parameters:
        - name: destinationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Destination activated for payout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficialWalletDestinationResponse' }
  /wlt/v1/official-wallet-destinations/{actorType}/{actorId}:
    get:
      operationId: readOfficialWalletDestination
      security: [{ serviceToken: [] }]
      parameters:
        - name: actorType
          in: path
          required: true
          schema: { type: string, enum: [partner, captain, field] }
        - name: actorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Active/current official wallet destination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfficialWalletDestinationResponse' }
  /wlt/v1/payout-intents:
    post:
      operationId: createPayoutIntent
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutIntentRequest' }
      responses:
        '201':
          description: Payout intent created and held.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequestResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequestResponse' }
  /wlt/v1/payout-state/{actorType}/{actorId}:
    get:
      operationId: readPayoutState
      security: [{ serviceToken: [] }]
      parameters:
        - name: actorType
          in: path
          required: true
          schema: { type: string, enum: [partner, captain, field] }
        - name: actorId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Beneficiary payout state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutStateResponse' }
  /wlt/v1/operator/payout-requests:
    get:
      operationId: listPayoutRequests
      security: [{ serviceToken: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Operator payout queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutListResponse' }
  /wlt/v1/operator/payout-requests/{payoutId}:
    get:
      operationId: readOperatorPayoutRequest
      security: [{ serviceToken: [] }]
      parameters:
        - name: payoutId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Operator payout request readback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequestResponse' }
  /wlt/v1/operator/payout-requests/{payoutId}/prepare:
    post:
      operationId: preparePayout
      security: [{ serviceToken: [] }]
      parameters:
        - name: payoutId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutActionRequest' }
      responses:
        '200':
          description: Payout prepared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequestResponse' }
  /wlt/v1/operator/payout-requests/{payoutId}/approve:
    post:
      operationId: approvePayout
      security: [{ serviceToken: [] }]
      parameters:
        - name: payoutId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutActionRequest' }
      responses:
        '200':
          description: Payout independently approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequestResponse' }
  /wlt/v1/operator/payout-requests/{payoutId}/cancel:
    post:
      operationId: cancelPayout
      security: [{ serviceToken: [] }]
      parameters:
        - name: payoutId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutActionRequest' }
      responses:
        '200':
          description: Payout cancelled and hold released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutRequestResponse' }
  /wlt/v1/operator/settlement-batches:
    post:
      operationId: createSettlementBatch
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettlementBatchCreateRequest' }
      responses:
        '201':
          description: Settlement batch created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementBatchResponse' }
  /wlt/v1/operator/settlement-batches/{batchId}:
    get:
      operationId: readSettlementBatch
      security: [{ serviceToken: [] }]
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Settlement batch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementBatchResponse' }
  /wlt/v1/operator/settlement-batches/{batchId}/approve:
    post:
      operationId: approveSettlementBatch
      security: [{ serviceToken: [] }]
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutActionRequest' }
      responses:
        '200':
          description: Settlement batch approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementBatchResponse' }
  /wlt/v1/operator/settlement-batches/{batchId}/freeze:
    post:
      operationId: freezeSettlementBatch
      security: [{ serviceToken: [] }]
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutActionRequest' }
      responses:
        '200':
          description: Settlement batch frozen for execution.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettlementBatchResponse' }
  /wlt/v1/operator/settlement-batches/{batchId}/transfers:
    post:
      operationId: recordManualTransfer
      security: [{ serviceToken: [] }]
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRecordRequest' }
      responses:
        '201':
          description: Manual transfer execution recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
  /wlt/v1/operator/transfers/{transferId}/verify:
    post:
      operationId: verifyManualTransfer
      security: [{ serviceToken: [] }]
      parameters:
        - name: transferId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferVerifyRequest' }
      responses:
        '200':
          description: Transfer evidence verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }
  /wlt/v1/operator/transfers/{transferId}/reconcile:
    post:
      operationId: reconcileManualTransfer
      security: [{ serviceToken: [] }]
      parameters:
        - name: transferId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferReconcileRequest' }
      responses:
        '200':
          description: Transfer reconciled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferResponse' }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    IntentId:
      name: intentId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CaptainActorId:
      name: captainActorId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    OrderId:
