        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Recent server-owned Cash-In funding intents.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashInFundingIntentListResponse' }
    post:
      operationId: createCashInFundingIntent
      security: [{ serviceToken: [] }]
      parameters:
        - { name: actorType, in: path, required: true, schema: { type: string, enum: [customer, captain] } }
        - { name: actorId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCashInFundingIntentRequest' }
      responses:
        '201':
          description: Funding intent created through the configured rail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashInFundingIntentResponse' }
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashInFundingIntentResponse' }
        '503':
          description: No approved production Cash-In rail is configured.
  /wlt/v1/funding-intents/{fundingIntentId}:
    get:
      operationId: readCashInFundingIntent
      security: [{ serviceToken: [] }]
      parameters:
        - { name: fundingIntentId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200':
          description: Canonical funding intent readback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashInFundingIntentReadResponse' }
  /wlt/v1/development/funding-intents/{fundingIntentId}/reconcile:
    post:
      operationId: reconcileDevelopmentCashInProvider
      description: Development-only authenticated mock provider inquiry and financial reconciliation.
      security: [{ serviceToken: [] }]
      parameters:
        - { name: fundingIntentId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
      responses:
        '200': { description: Canonical provider-verified funding result or still-pending intent. }
  /wlt/v1/development/funding-intents/{fundingIntentId}/simulate:
    post:
      operationId: simulateCashInFundingOutcome
      description: Development-only test route; registered only when BTHWANI_ENV=development and WLT_CASH_IN_MODE is simulator or wiremock. In wiremock mode the outcome must match the HTTP mock provider inquiry; the caller cannot dictate it.
      security: [{ serviceToken: [] }]
      parameters:
        - { name: fundingIntentId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/ActingActorId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateCashInFundingOutcomeRequest' }
      responses:
        '200':
          description: Simulated result applied to WLT, if valid for the current funding-intent state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashInFundingIntentResponse' }

components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    IntentId:
      name: intentId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CaptainActorId:
      name: captainActorId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    ExpectedVersion:
      name: X-Expected-Version
      in: header
      required: true
      schema: { type: integer, minimum: 1 }
    ActingActorId:
      name: X-Acting-Actor-ID
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    WalletState:
      type: object
      additionalProperties: false
      required: [actorType, actorId, currency, ledgerBalanceMinor, heldMinor, availableMinor, cashInEnabled, simulator]
      properties:
        actorType: { type: string, enum: [customer, captain] }
        actorId: { type: string }
        currency: { type: string, const: YER }
        ledgerBalanceMinor: { type: integer }
        heldMinor: { type: integer, minimum: 0 }
        availableMinor: { type: integer }
        cashInEnabled: { type: boolean }
        simulator: { type: boolean }
        providerMock: { type: boolean }
        recentCompensations:
          type: array
          items: { $ref: '#/components/schemas/CustomerWalletCompensationSummary' }
    CustomerWalletCompensationSummary:
      type: object
      additionalProperties: false
      required: [id, orderId, amountMinor, currency, createdAt]
      properties:
        id: { type: string, minLength: 1 }
        orderId: { type: string, minLength: 1 }
        amountMinor: { type: integer, minimum: 1 }
        currency: { type: string, const: YER }
        createdAt: { type: string, format: date-time }
    WalletStateResponse:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/WalletState' }
    CreateCashInFundingIntentRequest:
      type: object
      additionalProperties: false
      required: [amountMinor]
      properties:
        amountMinor: { type: integer, minimum: 1 }
        providerKey: { type: string, description: "Configured wallet provider key for development HTTP emulation." }
    CashInFundingIntent:
      type: object
      additionalProperties: false
      required: [id, actorType, actorId, fundingPurpose, providerKey, externalReference, amountMinor, providerFeeMinor, currency, state, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        actorType: { type: string, enum: [customer, captain] }
        actorId: { type: string }
        fundingPurpose: { type: string, enum: [CUSTOMER_TOPUP, CAPTAIN_TOPUP] }
        providerKey: { type: string }
        externalReference: { type: string }
        providerReference: { type: string }
        providerTransactionReference: { type: string }
        amountMinor: { type: integer, minimum: 1 }
        providerFeeMinor: { type: integer, minimum: 0, description: 'Verified provider settlement charge borne by the platform; beneficiary receives the full amountMinor.' }
        currency: { type: string, const: YER }
        state: { type: string, enum: [PENDING_PROVIDER, UNKNOWN, FAILED, SETTLED] }
        version: { type: integer, minimum: 1 }
        ledgerTransactionId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CashInFundingIntentResponse:
      type: object
      additionalProperties: false
      required: [intent, simulator, idempotentReplay]
      properties:
        intent: { $ref: '#/components/schemas/CashInFundingIntent' }
        simulator: { type: boolean }
        idempotentReplay: { type: boolean }
    CashInFundingIntentReadResponse:
      type: object
      additionalProperties: false
      required: [intent]
      properties:
        intent: { $ref: '#/components/schemas/CashInFundingIntent' }
    CashInFundingIntentListResponse:
      type: object
      additionalProperties: false
      required: [items, simulator]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CashInFundingIntent' }
        simulator: { type: boolean }
    SimulateCashInFundingOutcomeRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [SUCCESS, FAILURE, UNKNOWN, DELAYED] }
    FinalizePartnerOrderEarningRequest:
