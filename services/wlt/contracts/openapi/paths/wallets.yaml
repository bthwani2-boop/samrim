paths:
  /v1/wallets/me:
    get:
      operationId: getCurrentCustomerWalletBalance
      summary: Read the verified Customer's posted balance
      description: The isolated WLT owner resolves the active Identity Customer, reads that actor's durable posted funding journal, and rechecks the current binding before returning the balance. Query parameters and request bodies are rejected.
      security:
        - OpaqueSession: []
      responses:
        '200':
          description: Posted balance with the verified actor binding
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/CustomerWalletBalance' }
        '400':
          description: Request contained a body or query
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '401':
          description: A current verified Identity session is required
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '403':
          description: The session does not carry the Customer role
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '503':
          description: Identity or WLT could not verify the current balance
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }

  /v1/wallets/me/transactions:
    get:
      operationId: listCurrentCustomerWalletTransactions
      summary: Read the verified Customer's ten most recent posted funding transactions
      description: Read-only isolated development projection. Identity is checked before and after the owner-scoped SQL read. The response contains no provider credentials or references; hasMore flags additional older transactions not included in this bounded read. Query parameters and request bodies are rejected.
      security:
        - OpaqueSession: []
      responses:
        '200':
          description: Most recent posted funding transactions for the current Customer only
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/CustomerFundingHistory' }
        '400':
          description: Request contained a body or query
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '401':
          description: A current verified Identity session is required
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '403':
          description: The session does not carry the Customer role
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '503':
          description: Identity or WLT could not verify the current transaction history
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
