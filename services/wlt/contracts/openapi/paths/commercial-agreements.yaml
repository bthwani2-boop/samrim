paths:
  /v1/operators/stores/{storeID}/commercial-agreement:
    get:
      operationId: getOperatorCommercialAgreementReview
      summary: Read the latest Store agreement proposal and its review state
      description: Requires a current Operator session and explicit Identity finance grant, rechecked after the WLT owner read. Missing proposal is null. No actor/reason history, effective agreement, checkout authority or money mutation is returned or inferred.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
      responses:
        '200':
          description: Latest recorded proposal or explicit absence
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/CommercialAgreementReview' }
        '400':
          description: Invalid path identity, query or body
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '401':
          description: Current Identity session required
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '403':
          description: Explicit current Finance permission required
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '405':
          description: Read-only resource permits GET only
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '503':
          description: Owner unavailable or cannot verify current authorization
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
  /v1/merchants/stores/{storeID}/commercial-agreement:
    get:
      operationId: getOwnedMerchantCommercialAgreementReview
      summary: Read the latest proposal for a Store owned by the current Merchant
      description: Read-only isolated development. Requires a current Merchant session and canonical DSH Store ownership and relation before and after the WLT read. Missing proposal is null only for an owned Store. No acceptance, activation, delegated permission or financial mutation is implied.
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
      responses:
        '200':
          description: Latest owned Store proposal or explicit absence
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/CommercialAgreementReview' }
        '400':
          description: Invalid path identity, query or body
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '401':
          description: Current Identity session required
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '403':
          description: Current Merchant Store ownership required
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '405':
          description: Read-only resource permits GET only
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
        '503':
          description: Owner unavailable or cannot verify current scope or relation
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/Error' }
  /v1/merchants/stores/{storeID}/commercial-agreement/decisions:
    post:
      operationId: recordIsolatedMerchantAgreementDecision
      summary: Record isolated Merchant consent or refusal
      description: Disposable isolated owner integration only, not mounted by the read-only serving binary. Requires current Merchant session and owned DSH Store relation for the exact proposal. Retry an uncertain result only with the identical operation ID and payload. Does not activate terms, allocate money or create an Order.
      x-bthwani-isolated-only: true
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionInput'
                - type: object
                  properties:
                    decision: { type: string, enum: [ACCEPTED, DECLINED] }
      responses:
        '200':
          description: Exact recorded or replayed review decision
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionReceipt' }
        '400':
          description: Invalid path or command representation
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
        '401':
          description: Current Identity session required
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
        '403':
          description: Current owner authority denied
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
        '405':
          description: POST only
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
        '409':
          description: Immutable decision or proposal conflict
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
        '503':
          description: Decision unconfirmed; retry only identical identity and payload
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
  /v1/operators/stores/{storeID}/commercial-agreement/proposals:
    post:
      operationId: recordIsolatedFinanceAgreementProposal
      summary: Record proposed terms for an isolated Store agreement
      description: >-
        Disposable owner integration only. Identity verifies the Finance Operator and DSH verifies current
        Store standing. WLT records a proposal at the next version and replays identical operations.
        Reconcile an uncertain result using the same operation ID and payload. This operation creates
        neither consent nor agreement activation, and does not change wallet balances.
      x-bthwani-isolated-only: true
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementProposalInput' }
      responses:
        '200':
          description: Exact recorded or replayed proposal identity
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementProposalReceipt' }
        '400':
          description: Invalid path or proposal input
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementProposalError' }
        '401':
          description: Current Identity session required
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementProposalError' }
        '403':
          description: Finance or Store authority denied
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementProposalError' }
        '405':
          description: POST only
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementProposalError' }
        '409':
          description: Proposal version or operation identity conflicts with recorded terms
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementProposalError' }
        '503':
          description: Proposal unconfirmed; retry only identical identity and payload
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementProposalError' }
  /v1/operators/stores/{storeID}/commercial-agreement/decisions:
    post:
      operationId: recordIsolatedFinanceAgreementDecision
      summary: Record an isolated Finance review decision
      description: Disposable isolated owner integration only, not mounted by the read-only serving binary. Requires current explicit Finance permission and DSH standing, exact consented proposal and distinct authority. Retry an uncertain result only with the identical operation ID and payload. Does not activate terms, allocate money or create an Order.
      x-bthwani-isolated-only: true
      security:
        - OpaqueSession: []
      parameters:
        - name: storeID
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionInput'
                - type: object
                  properties:
                    decision: { type: string, enum: [FINANCE_APPROVED, FINANCE_REJECTED] }
      responses:
        '200':
          description: Exact recorded or replayed review decision
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionReceipt' }
        '400':
          description: Invalid path or command representation
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
        '401':
          description: Current Identity session required
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
        '403':
          description: Current owner authority denied
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
        '405':
          description: POST only
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
        '409':
          description: Immutable decision or proposal conflict
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
        '503':
          description: Decision unconfirmed; retry only identical identity and payload
          content:
            application/json:
              schema: { $ref: '../wlt.openapi.yaml#/components/schemas/AgreementDecisionError' }
