paths:
  /internal/actors/{actorId}:
    get:
      tags: [internal-actor-roles]
      operationId: readCanonicalActor
      security: [{ internalServiceToken: [] }]
      description: DSH-only read of the canonical Actor ID and security eligibility for Store-access invitation resolution. Returns no phone or credential data and does not mutate Identity state.
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
      responses:
        "200": { description: Canonical Actor resolution used before a Store-access invitation is recorded., content: { application/json: { schema: { $ref: "#/components/schemas/CanonicalActorResolution" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/operator-profiles:
    get:
      tags: [internal-actor-roles]
      operationId: listOperatorProfiles
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: state, in: query, schema: { type: string, enum: [all, pending_review, approved, admitted], default: all } }
        - { name: sort, in: query, schema: { type: string, enum: [created_asc, created_desc], default: created_desc } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
      responses:
        "200": { description: Server-paged Identity-owned operator profiles., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfilePage" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [internal-actor-roles]
      operationId: createOperatorProfile
      security: [{ internalServiceToken: [] }]
      description: Creates an Identity-owned operator candidate profile only. No actor or role is created until an authorized reviewer approves and grants the role.
      parameters:
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileCreateRequest" } } }
      responses:
        "201": { description: Profile created without an actor role., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileResponse" } } }
        "200": { description: Exact idempotent replay., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileResponse" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/operator-profiles/{profileId}:
    patch:
      tags: [internal-actor-roles]
      operationId: updateOperatorProfile
      security: [{ internalServiceToken: [] }]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileUpdateRequest" } } }
      responses:
        "200": { description: Updated pre-review profile., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileResponse" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/operator-profiles/{profileId}/approve:
    post:
      tags: [internal-actor-roles]
      operationId: approveOperatorProfile
      security: [{ internalServiceToken: [] }]
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileMutationRequest" } } }
      responses:
        "200": { description: Reviewed operator profile; role is still absent., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileResponse" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/operator-profiles/{profileId}/grant:
    post:
      tags: [internal-actor-roles]
      operationId: grantOperatorProfile
      security: [{ internalServiceToken: [] }]
      description: Creates or binds the Identity actor and grants the operator role only after approval. Profile binding and role admission commit atomically.
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileMutationRequest" } } }
      responses:
        "200": { description: Existing approved Identity role readback., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileGrantResponse" } } }
        "201": { description: Identity actor and operator role granted after review., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileGrantResponse" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/operator-profiles/{profileId}/invitation:
    post:
      tags: [internal-actor-roles]
      operationId: issueOperatorProfileInvitation
      security: [{ internalServiceToken: [] }]
      description: Issues enrollment only for an admitted, enabled, not-yet-activated operator profile. It cannot provision a role or reactivate an existing operator.
      parameters:
        - { name: profileId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
      responses:
        "201": { description: Single-use operator enrollment token returned once., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorProfileInvitationResponse" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actor-roles/provision:
    post:
      tags: [internal-actor-roles]
      operationId: provisionActorRole
      security: [{ internalServiceToken: [] }]
      description: Identity alone creates actor_id and persists role admission. DSH may request partner, captain, or field only after the owning DSH eligibility transition; Field admission and lifecycle remain owned by the DSH Field workflow. Operator role admission uses the reviewed operator-profile path. First-operator bootstrap is a separate one-time lifecycle.
      parameters:
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionActorRoleRequest" } } }
      responses:
        "200": { description: Existing exact actor-role readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "201": { description: Canonical actor and/or role created., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}/provision:
    post:
      tags: [internal-actor-roles]
      operationId: provisionExistingActorRole
      security: [{ internalServiceToken: [] }]
      description: DSH may admit an already-resolved canonical Human Actor to the Partner role after its separately authorized Store-access eligibility transition. This operation never resolves phone or creates an Actor and does not admit other roles.
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
      responses:
        "200": { description: Existing exact Partner role readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "201": { description: Partner role admitted for the existing canonical actor., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actor-roles/search:
    get:
      tags: [internal-actor-roles]
      operationId: searchActorRoles
      security: [{ internalServiceToken: [] }]
      parameters:
        - { name: role, in: query, required: true, schema: { $ref: "#/components/schemas/ActorType" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: sort, in: query, description: Stable phone and actor ID ordering; cursor is valid only for the same sort., schema: { type: string, enum: [phone_asc, phone_desc], default: phone_asc } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Role-scoped actor readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleSearchPage" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /internal/actor-roles/read:
    post:
      tags: [internal-actor-roles]
      operationId: readActorRoles
      security: [{ internalServiceToken: [] }]
      description: Bounded role readback for a known set of actor identifiers. Identity remains the sole owner of role admission and current role eligibility.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleReadBatchRequest" } } }
      responses:
        "200": { description: Existing actor roles for the requested role and identifiers; unknown identifiers are omitted., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleReadBatchResponse" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /internal/operators/{actorId}/permissions/{permission}:
    get:
      tags: [internal-actor-roles]
      operationId: readOperatorPermission
      security: [{ internalServiceToken: [] }]
      description: The Control Panel permission administrator may read another Operator's explicit permission state. DSH may read an Operator's permission for server-side authorization checks.
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/OperatorPermission" }
        - { $ref: "#/components/parameters/OptionalActingActorId" }
      responses:
        "200": { description: Current versioned Operator permission state., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorPermissionAccess" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [internal-actor-roles]
      operationId: setOperatorPermission
      security: [{ internalServiceToken: [] }]
      description: Changes only another enabled Operator's allowlisted explicit permission. The one-time bootstrapped first Operator is the sole permission administrator; each change requires a current version and reason and revokes affected sessions.
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/OperatorPermission" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/OperatorPermissionExpectedVersion" }
        - { $ref: "#/components/parameters/OperatorPermissionReason" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetOperatorPermissionRequest" } } }
      responses:
        "200": { description: Exact committed Operator permission state., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorPermissionAccess" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}:
    get:
      tags: [internal-actor-roles]
      operationId: readActorRole
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }]
      responses:
        "200": { description: Exact actor-role readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/disable:
    post:
      tags: [internal-actor-roles]
      operationId: disableActorRole
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
        - { $ref: "#/components/parameters/ExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Exact role disabled and its sessions/challenges revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}/enable:
    post:
      tags: [internal-actor-roles]
      operationId: enableActorRole
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
        - { $ref: "#/components/parameters/ExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Existing role enabled; no session or activation eligibility is silently recreated. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}/reenrollment:
    post:
      tags: [internal-actor-roles]
      operationId: authorizeManagedRoleReenrollment
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
        - { $ref: "#/components/parameters/ReenrollmentExpectedVersion" }
        - { $ref: "#/components/parameters/ExpectedActorVersion" }
        - { $ref: "#/components/parameters/ReenrollmentReasonRequired" }
      responses:
        "204": { description: An active domain-managed role is moved to fresh one-time activation only when current DSH eligibility and actor and role versions match; active sessions and challenges are revoked. The request is actor_id-addressed and operator-attributed. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/security/disable:
    post:
      tags: [internal-security]
      operationId: disableActorSecurity
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/ControlPanelExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Identity-wide authentication disabled and active sessions/challenges revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/security/enable:
    post:
      tags: [internal-security]
      operationId: enableActorSecurity
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/ControlPanelExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Identity-wide authentication eligibility restored; no session is resurrected. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}/sessions:
    get:
      tags: [internal-sessions]
      operationId: listActorRoleSessions
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }]
      responses:
        "200":
          description: Active sessions for the exact actor-role.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [internal-sessions]
      operationId: revokeActorRoleSessions
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
      responses:
        "204": { description: Active sessions for the exact actor-role revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/sessions/{sessionId}:
    delete:
      tags: [internal-sessions]
      operationId: revokeActorRoleSession
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
      responses:
        "204": { description: Exact session revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
