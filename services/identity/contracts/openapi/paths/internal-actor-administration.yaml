paths:
  /v1/operators/me/permissions/{permission}:
    get:
      operationId: getEffectiveOperatorPermission
      summary: Read an explicit currently active Operator permission
      description: Never grant from role=operator alone. Verify the bearer session, current actor/role standing and matching security versions, and an explicit active Identity-owned Operator permission in one repeatable-read database transaction. A finance workspace grant is not authorization to mutate the WLT ledger or reroute a beneficiary. This GET does not grant scopes; a separate original-Operator-only PATCH is gated by Identity and versioned audit.
      security:
        - OpaqueSession: []
      parameters:
        - name: permission
          in: path
          required: true
          schema:
            type: string
            enum: [operations, merchant, catalog, marketing, finance, hr, platform_policies]
      responses:
        '200':
          description: The verified Operator currently holds this explicit permission
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [actorId, permission]
                properties:
                  actorId: { type: string, minLength: 1, maxLength: 128 }
                  permission:
                    type: string
                    enum: [operations, merchant, catalog, marketing, finance, hr, platform_policies]
        '400':
          description: Invalid query or body
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
        '401':
          description: Missing, invalid, revoked, expired or stale session
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
        '403':
          description: Active actor lacks this effective Operator permission
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
        '404':
          description: Unknown or unapproved permission scope
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
        '503':
          description: Identity cannot verify its current owner state
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
  /v1/operators/{actorId}/permissions/{permission}:
    patch:
      operationId: manageOriginalOperatorPermission
      summary: Grant or revoke a finite Operator scope as the original bootstrapped Operator
      description: >
        Isolated synthetic Identity owner command only until reviewed Operator
        Passkey login, original-actor continuity and activation gates are satisfied.
        The authenticated bearer must identify the current original one-time
        bootstrap Operator, not merely an Operator with finance or platform_policies.
        The target must be a different active Operator. Identity updates the scope
        version, invalidates target Operator role sessions and appends one immutable
        idempotent audit entry within the same SQL transaction. No header or body
        may assert the acting actor. This endpoint cannot create the original
        Operator or recover an authenticator.
      security:
        - OpaqueSession: []
      parameters:
        - name: actorId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$'
        - name: permission
          in: path
          required: true
          schema:
            type: string
            enum: [operations, merchant, catalog, marketing, finance, hr, platform_policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, expectedVersion, operationId, reason]
              properties:
                state: { type: string, enum: [ACTIVE, REVOKED] }
                expectedVersion: { type: integer, format: int64, minimum: 0 }
                operationId:
                  type: string
                  minLength: 8
                  maxLength: 64
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{7,63}$'
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: Mutation committed, or exact idempotent replay returned unchanged
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [targetActorId, permission, state, version]
                properties:
                  targetActorId: { type: string, minLength: 1, maxLength: 128 }
                  permission:
                    type: string
                    enum: [operations, merchant, catalog, marketing, finance, hr, platform_policies]
                  state: { type: string, enum: [ACTIVE, REVOKED] }
                  version: { type: integer, format: int64, minimum: 1 }
        '400':
          description: Invalid or ambiguous JSON, query, path or mutation command
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
        '401':
          description: Missing, malformed or forged bearer
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
        '403':
          description: Not the current original Operator or prohibited self-grant
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
        '404':
          description: Unknown or inactive target Operator or unsupported path
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
        '409':
          description: Expected permission version mismatch or conflicting idempotency key
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
        '503':
          description: Identity SQL owner or current authority cannot be verified
          content:
            application/json:
              schema: { $ref: '../identity.openapi.yaml#/components/schemas/Error' }
