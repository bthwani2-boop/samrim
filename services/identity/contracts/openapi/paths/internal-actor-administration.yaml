paths:
  /internal/actor-roles/provision:
    post:
      tags: [internal-actor-roles]
      operationId: provisionActorRole
      security: [{ internalServiceToken: [] }]
      description: Identity alone creates actor_id and persists role admission. DSH may request partner, captain, or field only after the owning DSH eligibility transition; Field admission and lifecycle remain owned by the DSH Field workflow. The control-panel service may provision an operator through the separate operator invite path. First-operator bootstrap is a separate one-time lifecycle.
      parameters:
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionActorRoleRequest" } } }
      responses:
        "200": { description: Existing exact actor-role readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "201": { description: Canonical actor and/or role created., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actor-roles/search:
    get:
      tags: [internal-actor-roles]
      operationId: searchActorRoles
      security: [{ internalServiceToken: [] }]
      parameters:
        - { name: role, in: query, required: true, schema: { $ref: "#/components/schemas/ActorType" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Role-scoped actor readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleSearchPage" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /internal/operators/{actorId}/permissions/{permission}:
    get:
      tags: [internal-actor-roles]
      operationId: readOperatorPermission
      security: [{ internalServiceToken: [] }]
      description: The Control Panel permission administrator may read another Operator's explicit permission state. DSH may read an Operator's permission for server-side authorization checks.
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/OperatorPermission" }
        - { $ref: "#/components/parameters/OptionalActingActorId" }
      responses:
        "200": { description: Current versioned Operator permission state., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorPermissionAccess" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [internal-actor-roles]
      operationId: setOperatorPermission
      security: [{ internalServiceToken: [] }]
      description: Changes only another enabled Operator's allowlisted explicit permission. The one-time bootstrapped first Operator is the sole permission administrator; each change requires a current version and reason and revokes affected sessions.
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/OperatorPermission" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/OperatorPermissionExpectedVersion" }
        - { $ref: "#/components/parameters/OperatorPermissionReason" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SetOperatorPermissionRequest" } } }
      responses:
        "200": { description: Exact committed Operator permission state., content: { application/json: { schema: { $ref: "#/components/schemas/OperatorPermissionAccess" } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}:
    get:
      tags: [internal-actor-roles]
      operationId: readActorRole
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }]
      responses:
        "200": { description: Exact actor-role readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/disable:
    post:
      tags: [internal-actor-roles]
      operationId: disableActorRole
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
        - { $ref: "#/components/parameters/ExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Exact role disabled and its sessions/challenges revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}/enable:
    post:
      tags: [internal-actor-roles]
      operationId: enableActorRole
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
        - { $ref: "#/components/parameters/ExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Existing role enabled; no session or activation eligibility is silently recreated. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}/reenrollment:
    post:
      tags: [internal-actor-roles]
      operationId: authorizeManagedRoleReenrollment
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
        - { $ref: "#/components/parameters/ReenrollmentExpectedVersion" }
        - { $ref: "#/components/parameters/ExpectedActorVersion" }
        - { $ref: "#/components/parameters/ReenrollmentReasonRequired" }
      responses:
        "204": { description: An active domain-managed role is moved to fresh one-time activation only when actor and role versions match; active sessions and challenges are revoked. The request is actor_id-addressed and operator-attributed. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/security/disable:
    post:
      tags: [internal-security]
      operationId: disableActorSecurity
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/ControlPanelExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Identity-wide authentication disabled and active sessions/challenges revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/security/enable:
    post:
      tags: [internal-security]
      operationId: enableActorSecurity
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/ControlPanelExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Identity-wide authentication eligibility restored; no session is resurrected. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}/sessions:
    get:
      tags: [internal-sessions]
      operationId: listActorRoleSessions
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }]
      responses:
        "200":
          description: Active sessions for the exact actor-role.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [internal-sessions]
      operationId: revokeActorRoleSessions
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
      responses:
        "204": { description: Active sessions for the exact actor-role revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/sessions/{sessionId}:
    delete:
      tags: [internal-sessions]
      operationId: revokeActorRoleSession
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
      responses:
        "204": { description: Exact session revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
