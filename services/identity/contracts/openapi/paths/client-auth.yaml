paths:
  /auth/client/registration/request:
    post:
      tags: [client-auth]
      operationId: requestClientRegistrationVerification
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/PhoneRequest" } } }
      responses:
        "201": { $ref: "../identity.openapi.yaml#/components/responses/ChallengeIssued" }
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "429": { $ref: "../identity.openapi.yaml#/components/responses/RateLimited" }
        "503": { $ref: "../identity.openapi.yaml#/components/responses/Unavailable" }

  /auth/client/register:
    post:
      tags: [client-auth]
      operationId: registerClient
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/ClientCredentialProofRequest" } } }
      responses:
        "201": { $ref: "../identity.openapi.yaml#/components/responses/TokenPair" }
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "401": { $ref: "../identity.openapi.yaml#/components/responses/Unauthenticated" }
        "409": { $ref: "../identity.openapi.yaml#/components/responses/Conflict" }

  /auth/client/login:
    post:
      tags: [client-auth]
      operationId: loginClient
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/PasswordLoginRequest" } } }
      responses:
        "200": { $ref: "../identity.openapi.yaml#/components/responses/TokenPair" }
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "401": { $ref: "../identity.openapi.yaml#/components/responses/Unauthenticated" }
        "429": { $ref: "../identity.openapi.yaml#/components/responses/RateLimited" }

  /auth/client/recovery/request:
    post:
      tags: [client-auth]
      operationId: requestClientRecoveryVerification
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/PhoneRequest" } } }
      responses:
        "201": { $ref: "../identity.openapi.yaml#/components/responses/ChallengeIssued" }
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "429": { $ref: "../identity.openapi.yaml#/components/responses/RateLimited" }
        "503": { $ref: "../identity.openapi.yaml#/components/responses/Unavailable" }

  /auth/client/recover:
    post:
      tags: [client-auth]
      operationId: recoverClient
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/ClientRecoveryProofRequest" } } }
      responses:
        "200": { $ref: "../identity.openapi.yaml#/components/responses/RecoveryComplete" }
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "401": { $ref: "../identity.openapi.yaml#/components/responses/Unauthenticated" }
