paths:
  /auth/client/registration/request:
    post:
      tags: [client-auth]
      operationId: requestClientRegistrationVerification
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/PhoneRequest" } } }
      responses:
        "201": { $ref: "../identity.openapi.yaml#/components/responses/ChallengeIssued" }
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "429": { $ref: "../identity.openapi.yaml#/components/responses/RateLimited" }
        "503": { $ref: "../identity.openapi.yaml#/components/responses/Unavailable" }

  /auth/client/register:
    post:
      tags: [client-auth]
      operationId: registerClient
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/ClientCredentialProofRequest" } } }
      responses:
        "201":
          description: Native clients receive a token pair; approved Client web origins receive an HttpOnly refresh cookie and a refresh-token-free JSON response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../identity.openapi.yaml#/components/schemas/TokenPair"
                  - $ref: "../identity.openapi.yaml#/components/schemas/ClientBrowserAccessPair"
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "401": { $ref: "../identity.openapi.yaml#/components/responses/Unauthenticated" }
        "409": { $ref: "../identity.openapi.yaml#/components/responses/Conflict" }

  /auth/partner/self/register:
    post:
      tags: [client-auth]
      operationId: registerVerifiedSelfPartner
      description: A verified client session may create its own first Partner role without a staff joining request. Existing or disabled Partner roles are never overwritten. No Store is published.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/PartnerSelfRegistrationRequest" } } }
      responses:
        "201":
          description: Native app receives a Partner token pair; trusted Partner web origin receives a Partner HttpOnly refresh cookie and a refresh-token-free access response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../identity.openapi.yaml#/components/schemas/TokenPair"
                  - $ref: "../identity.openapi.yaml#/components/schemas/ClientBrowserAccessPair"
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "401": { $ref: "../identity.openapi.yaml#/components/responses/Unauthenticated" }
        "403": { $ref: "../identity.openapi.yaml#/components/responses/Forbidden" }
        "409": { $ref: "../identity.openapi.yaml#/components/responses/Conflict" }

  /auth/client/login:
    post:
      tags: [client-auth]
      operationId: loginClient
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/PasswordLoginRequest" } } }
      responses:
        "200":
          description: Native clients receive a token pair; approved Client web origins receive an HttpOnly refresh cookie and a refresh-token-free JSON response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "../identity.openapi.yaml#/components/schemas/TokenPair"
                  - $ref: "../identity.openapi.yaml#/components/schemas/ClientBrowserAccessPair"
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "401": { $ref: "../identity.openapi.yaml#/components/responses/Unauthenticated" }
        "429": { $ref: "../identity.openapi.yaml#/components/responses/RateLimited" }

  /auth/client/recovery/request:
    post:
      tags: [client-auth]
      operationId: requestClientRecoveryVerification
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/PhoneRequest" } } }
      responses:
        "201": { $ref: "../identity.openapi.yaml#/components/responses/ChallengeIssued" }
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "429": { $ref: "../identity.openapi.yaml#/components/responses/RateLimited" }
        "503": { $ref: "../identity.openapi.yaml#/components/responses/Unavailable" }

  /auth/client/recover:
    post:
      tags: [client-auth]
      operationId: recoverClient
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "../identity.openapi.yaml#/components/schemas/ClientRecoveryProofRequest" } } }
      responses:
        "200": { $ref: "../identity.openapi.yaml#/components/responses/RecoveryComplete" }
        "400": { $ref: "../identity.openapi.yaml#/components/responses/Invalid" }
        "401": { $ref: "../identity.openapi.yaml#/components/responses/Unauthenticated" }
