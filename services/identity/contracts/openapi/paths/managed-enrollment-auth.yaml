paths:
  /auth/managed/activation/request:
    post:
      tags: [managed-auth]
      operationId: requestManagedActivation
      description: Partner, captain, and field activation requires admitted role plus phone proof.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedChallengeRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/managed/activate:
    post:
      tags: [managed-auth]
      operationId: activateManagedRole
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedActivationRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/managed/login:
    post:
      tags: [managed-auth]
      operationId: loginManagedRole
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedPasswordLoginRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/managed/recovery/request:
    post:
      tags: [managed-auth]
      operationId: requestManagedRecoveryVerification
      description: Issues a phone proof for password recovery without disclosing role admission. Never grants or activates a role.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedChallengeRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/managed/recover:
    post:
      tags: [managed-auth]
      operationId: recoverManagedRole
      description: Resets an admitted role's password after phone proof and revokes that role's sessions. Never creates a session, grants a role, or substitutes for first enrollment.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRecoveryProofRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/RecoveryComplete" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
