paths:
  /auth/refresh:
    post:
      tags: [session]
      operationId: refreshSession
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/logout:
    post:
      tags: [session]
      operationId: logoutSession
      security: [{ accessToken: [] }]
      responses:
        "204": { description: Current session revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/session:
    get:
      tags: [session]
      operationId: readCurrentSession
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: Current single-role session identity.
          content: { application/json: { schema: { $ref: "#/components/schemas/ActorIdentity" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/development/session:
    post:
      tags: [session]
      operationId: createDevelopmentSession
      description: Development-only convenience that mints a role-scoped session only when exactly one existing enabled, security-enabled, authentication-ready actor/role has completed its required activation or enrollment. The route is not registered outside BTHWANI_ENV=development, never creates actors or roles, and fails with 409 rather than selecting an actor when more than one candidate is ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, clientInstanceId]
              properties:
                role:
                  $ref: "#/components/schemas/ActorType"
                clientInstanceId:
                  type: string
                  minLength: 8
                  maxLength: 256
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
