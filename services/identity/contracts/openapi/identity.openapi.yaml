openapi: 3.1.0
info:
  title: BThwani Identity API
  version: 0.2.0
  description: Isolated Identity session verification and logout, explicit Operator permission reads, and verified Customer-to-Merchant role admission with one new role-scoped bearer. No first-factor verification provider, Operator bootstrap, protected grant mutation, or production admission.
paths:
  /v1/sessions/current:
    get:
      operationId: getVerifiedIdentitySession
      summary: Read current verified Identity actor and active role
      description: Verify opaque 256-bit bearer session against canonical active actor/role, issue time, expiry, revocation and authorization versions; role never implies a DSH Store grant or Operator permission.
      security:
        - OpaqueSession: []
      responses:
        '200':
          description: Verified Identity principal only, never a Store grant
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Principal' }
        '400':
          description: Invalid body or query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: No current valid Identity session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Canonical Identity owner unavailable; fail closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: revokeCurrentIdentitySession
      summary: Revoke the current authenticated Identity session
      description: Atomically revoke only the presented active bearer digest through the canonical Identity owner. A stale, suspended, revoked, future-issued or expired session cannot log out another actor or change a different session. This does not revoke the entire session family or authorize admission.
      security:
        - OpaqueSession: []
      responses:
        '204':
          description: The current bearer was durably revoked, with no response body
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
        '400':
          description: Invalid body or query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: The bearer is absent, malformed or no longer current; no mutation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Canonical Identity writer unavailable; no success is claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/actors/me/merchant-role:
    post:
      operationId: admitVerifiedCurrentCustomerAsMerchant
      summary: Admit a currently verified Customer as a Merchant without assigning a Store
      description: Requires an active Identity Customer bearer and verified_at from the canonical Identity actor. Serializes actor and role creation in PostgreSQL and returns exactly one new short-lived Merchant bearer on first admission. Already-provisioned, disabled or suspended Merchant roles may not self-reactivate. This is not an initial authentication factor, a Store grant, or Operator admission. Development-only synthetic namespaces.
      security:
        - OpaqueSession: []
      responses:
        '201':
          description: One new Merchant role and role-scoped Identity session, with no Store rights
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantAdmission' }
        '400':
          description: Query parameters, request body or streaming payload rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing, invalid, revoked, expired, wrong-role or stale Customer bearer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Current Customer lacks a recorded Identity verification event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Merchant role already provisioned, including disabled or suspended; never reactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Identity canonical owner unavailable or verification migration not admitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/operators/me/permissions/{permission}:
    get:
      operationId: getEffectiveOperatorPermission
      summary: Read an explicit currently active Operator permission
      description: Never grant from role=operator alone. Verify the bearer session, current actor/role standing and matching security versions, and an explicit active Identity-owned Operator permission in one repeatable-read database transaction. A finance workspace grant is not authorization to mutate the WLT ledger or reroute a beneficiary. No permission administration endpoint is exposed.
      security:
        - OpaqueSession: []
      parameters:
        - name: permission
          in: path
          required: true
          schema:
            type: string
            enum: [operations, partners, catalog, marketing, finance, hr, platform_policies]
      responses:
        '200':
          description: The verified Operator currently holds this explicit permission
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [actorId, permission]
                properties:
                  actorId: { type: string, minLength: 1, maxLength: 128 }
                  permission:
                    type: string
                    enum: [operations, partners, catalog, marketing, finance, hr, platform_policies]
        '400':
          description: Invalid query or body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing, invalid, revoked, expired or stale session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Active actor lacks this effective Operator permission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown or unapproved permission scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Identity cannot verify its current owner state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    OpaqueSession:
      type: http
      scheme: bearer
      description: Identity-issued opaque high-entropy session secret, never a client-asserted actor or role header
  schemas:
    Principal:
      type: object
      additionalProperties: false
      required: [actorId, role, sessionExpiresAt]
      properties:
        actorId: { type: string, minLength: 1, maxLength: 128 }
        role: { type: string, enum: [customer, merchant, captain, operator] }
        sessionExpiresAt: { type: string, format: date-time }
    MerchantAdmission:
      type: object
      additionalProperties: false
      required: [accessToken, sessionExpiresAt]
      properties:
        accessToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        sessionExpiresAt: { type: string, format: date-time }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, enum: [INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, VERIFICATION_REQUIRED, ALREADY_PROVISIONED, OWNER_UNAVAILABLE, NOT_FOUND, METHOD_NOT_ALLOWED] }
