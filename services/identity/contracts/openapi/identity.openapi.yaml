openapi: 3.1.0
info:
  title: BThwani Identity API
  version: 1.0.0
  description: |
    Identity alone creates actor_id. Phone is a mutable verified identifier rather than the cross-boundary primary identity.
    Public client verification, governed managed-role activation, operator access, normal authentication and recovery/re-enrollment are distinct lifecycles.
servers:
  - url: http://localhost:18082

paths:
  /identity/health:
    $ref: "./paths/runtime.yaml#/paths/~1identity~1health"
  /identity/readiness:
    $ref: "./paths/runtime.yaml#/paths/~1identity~1readiness"
  /auth/client/registration/request:
    $ref: "./paths/client-auth.yaml#/paths/~1auth~1client~1registration~1request"
  /auth/client/register:
    $ref: "./paths/client-auth.yaml#/paths/~1auth~1client~1register"
  /auth/client/login:
    $ref: "./paths/client-auth.yaml#/paths/~1auth~1client~1login"
  /auth/client/recovery/request:
    $ref: "./paths/client-auth.yaml#/paths/~1auth~1client~1recovery~1request"
  /auth/client/recover:
    $ref: "./paths/client-auth.yaml#/paths/~1auth~1client~1recover"
  /auth/managed/activation/request:
    $ref: "./paths/managed-enrollment-auth.yaml#/paths/~1auth~1managed~1activation~1request"
  /auth/managed/activate:
    $ref: "./paths/managed-enrollment-auth.yaml#/paths/~1auth~1managed~1activate"
  /auth/managed/login:
    $ref: "./paths/managed-enrollment-auth.yaml#/paths/~1auth~1managed~1login"
  /internal/operator-enrollment-tokens:
    $ref: "./paths/managed-enrollment-auth.yaml#/paths/~1internal~1operator-enrollment-tokens"
  /auth/operator/enrollment/request:
    $ref: "./paths/operator-passkey-access.yaml#/paths/~1auth~1operator~1enrollment~1request"
  /auth/operator/enrollment/registration/options:
    $ref: "./paths/operator-passkey-access.yaml#/paths/~1auth~1operator~1enrollment~1registration~1options"
  /auth/operator/enrollment/registration/finish:
    $ref: "./paths/operator-passkey-access.yaml#/paths/~1auth~1operator~1enrollment~1registration~1finish"
  /auth/operator/authentication/options:
    $ref: "./paths/operator-passkey-access.yaml#/paths/~1auth~1operator~1authentication~1options"
  /auth/operator/authentication/finish:
    $ref: "./paths/operator-passkey-access.yaml#/paths/~1auth~1operator~1authentication~1finish"
  /auth/operator/recovery/request:
    $ref: "./paths/operator-passkey-access.yaml#/paths/~1auth~1operator~1recovery~1request"
  /auth/operator/recovery/registration/options:
    $ref: "./paths/operator-passkey-access.yaml#/paths/~1auth~1operator~1recovery~1registration~1options"
  /auth/operator/recovery/registration/finish:
    $ref: "./paths/operator-passkey-access.yaml#/paths/~1auth~1operator~1recovery~1registration~1finish"
  /internal/bootstrap/operator:
    $ref: "./paths/operator-passkey-access.yaml#/paths/~1internal~1bootstrap~1operator"
  /auth/refresh:
    $ref: "./paths/session.yaml#/paths/~1auth~1refresh"
  /auth/logout:
    $ref: "./paths/session.yaml#/paths/~1auth~1logout"
  /auth/session:
    $ref: "./paths/session.yaml#/paths/~1auth~1session"
  /auth/development/session:
    $ref: "./paths/session.yaml#/paths/~1auth~1development~1session"
  /internal/actor-roles/provision:
    $ref: "./paths/internal-actor-administration.yaml#/paths/~1internal~1actor-roles~1provision"
  /internal/actor-roles/search:
    $ref: "./paths/internal-actor-administration.yaml#/paths/~1internal~1actor-roles~1search"
  /internal/actors/{actorId}/roles/{role}:
    $ref: "./paths/internal-actor-administration.yaml#/paths/~1internal~1actors~1{actorId}~1roles~1{role}"
  /internal/actors/{actorId}/roles/{role}/disable:
    $ref: "./paths/internal-actor-administration.yaml#/paths/~1internal~1actors~1{actorId}~1roles~1{role}~1disable"
  /internal/actors/{actorId}/roles/{role}/enable:
    $ref: "./paths/internal-actor-administration.yaml#/paths/~1internal~1actors~1{actorId}~1roles~1{role}~1enable"
  /internal/actors/{actorId}/roles/{role}/reenrollment:
    $ref: "./paths/internal-actor-administration.yaml#/paths/~1internal~1actors~1{actorId}~1roles~1{role}~1reenrollment"
  /internal/actors/{actorId}/security/disable:
    $ref: "./paths/internal-actor-administration.yaml#/paths/~1internal~1actors~1{actorId}~1security~1disable"
  /internal/actors/{actorId}/security/enable:
    $ref: "./paths/internal-actor-administration.yaml#/paths/~1internal~1actors~1{actorId}~1security~1enable"
  /internal/actors/{actorId}/roles/{role}/sessions:
    $ref: "./paths/internal-actor-administration.yaml#/paths/~1internal~1actors~1{actorId}~1roles~1{role}~1sessions"
  /internal/actors/{actorId}/roles/{role}/sessions/{sessionId}:
    $ref: "./paths/internal-actor-administration.yaml#/paths/~1internal~1actors~1{actorId}~1roles~1{role}~1sessions~1{sessionId}"
components:
  securitySchemes:
    accessToken: { type: http, scheme: bearer, bearerFormat: opaque }
    internalServiceToken: { type: http, scheme: bearer, bearerFormat: opaque-service-token }

  parameters:
    ActorId: { name: actorId, in: path, required: true, schema: { type: string } }
    Role: { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/ActorType" } }
    CorrelationId: { name: X-Correlation-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }
    ActingActorId: { name: X-Acting-Actor-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }
    ControlPanelActingActorId: { name: X-Acting-Actor-ID, in: header, required: true, schema: { type: string, maxLength: 128 } }
    ExpectedVersion: { name: X-Expected-Version, in: header, required: false, schema: { type: integer, minimum: 1 } }
    ControlPanelExpectedVersion: { name: X-Expected-Version, in: header, required: true, schema: { type: integer, minimum: 1 } }
    MutationReason: { name: X-Reason, in: header, required: false, schema: { type: string, maxLength: 500 } }

  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          const: identity
        status:
          type: string
          enum: [ok, not_ready]

    ActorType:
      type: string
      enum: [client, partner, captain, field, operator]

    ManagedActorType:
      type: string
      enum: [partner, captain, field]

    ManagedActivationRole:
      type: string
      enum: [partner, captain, field]

    ControlPanelRole:
      type: string
      enum: [operator]

    PhoneRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string

    ManagedChallengeRequest:
      type: object
      additionalProperties: false
      required: [phone, role]
      properties:
        phone:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"

    OperatorEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [phone, operatorEnrollmentToken]
      properties:
        phone:
          type: string
        operatorEnrollmentToken:
          type: string
          minLength: 24
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]{24,256}$"

    OperatorEnrollmentTokenIssueRequest:
      type: object
      additionalProperties: false
      required: [phoneE164, role]
      properties:
        phoneE164:
          type: string
        role:
          type: string
          enum: [operator]

    OperatorEnrollmentToken:
      type: object
      additionalProperties: false
      required: [code, maskedPhone, role, expiresAt]
      properties:
        code:
          type: string
        maskedPhone:
          type: string
        role:
          type: string
          enum: [operator]
        expiresAt:
          type: string
          format: date-time

    ClientCredentialProofRequest:
      type: object
      additionalProperties: false
      required: [phone, code, password, clientInstanceId]
      properties:
        phone:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
        password:
          type: string
          minLength: 8
          maxLength: 8
        clientInstanceId:
          type: string
          minLength: 8
          maxLength: 256

    ClientRecoveryProofRequest:
      type: object
      additionalProperties: false
      required: [phone, code, password]
      properties:
        phone:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
        password:
          type: string
          minLength: 8
          maxLength: 8

    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password, clientInstanceId]
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 8
        clientInstanceId:
          type: string
          minLength: 8
          maxLength: 256

    ManagedPasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password, role, clientInstanceId]
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 8
        role:
          $ref: "#/components/schemas/ManagedActorType"
        clientInstanceId:
          type: string
          minLength: 8
          maxLength: 256

    ManagedActivationRequest:
      type: object
      additionalProperties: false
      required: [phone, role, verificationCode, password, clientInstanceId]
      properties:
        phone:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"
        verificationCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
        password:
          type: string
          minLength: 8
          maxLength: 8
        clientInstanceId:
          type: string
          minLength: 8
          maxLength: 256

    OperatorPasskeyRegistrationOptionsRequest:
      type: object
      additionalProperties: false
      required: [phone, operatorEnrollmentToken, verificationCode]
      properties:
        phone:
          type: string
        operatorEnrollmentToken:
          type: string
          minLength: 24
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]{24,256}$"
        verificationCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"

    WebAuthnJSON:
      type: object
      additionalProperties: true

    PasskeyOptions:
      type: object
      additionalProperties: false
      required: [ceremonyId, publicKey]
      properties:
        ceremonyId:
          type: string
        publicKey:
          $ref: "#/components/schemas/WebAuthnJSON"

    OperatorPasskeyRegistrationFinishRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential, clientInstanceId]
      properties:
        ceremonyId:
          type: string
        credential:
          $ref: "#/components/schemas/WebAuthnJSON"
        clientInstanceId:
          type: string
          minLength: 8
          maxLength: 256

    OperatorPasskeyAuthenticationFinishRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential, clientInstanceId]
      properties:
        ceremonyId:
          type: string
        credential:
          $ref: "#/components/schemas/WebAuthnJSON"
        clientInstanceId:
          type: string
          minLength: 8
          maxLength: 256

    OperatorRecoveryRequest:
      type: object
      additionalProperties: false
      required: [phone, recoveryCredential]
      properties:
        phone:
          type: string
        recoveryCredential:
          type: string
          minLength: 24
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]{24,256}$"

    OperatorPasskeyRecoveryRegistrationOptionsRequest:
      type: object
      additionalProperties: false
      required: [phone, recoveryCredential, verificationCode]
      properties:
        phone:
          type: string
        recoveryCredential:
          type: string
          minLength: 24
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]{24,256}$"
        verificationCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"

    OperatorPasskeyRecoveryFinishRequest:
      type: object
      additionalProperties: false
      required: [ceremonyId, credential, clientInstanceId]
      properties:
        ceremonyId:
          type: string
        credential:
          $ref: "#/components/schemas/WebAuthnJSON"
        clientInstanceId:
          type: string
          minLength: 8
          maxLength: 256

    OperatorPasskeyRegistrationResponse:
      type: object
      additionalProperties: false
      required: [tokenPair, recoveryCredential]
      properties:
        tokenPair:
          $ref: "#/components/schemas/TokenPair"
        recoveryCredential:
          type: string
          minLength: 24
          maxLength: 256

    Challenge:
      type: object
      additionalProperties: false
      required: [challengeId, maskedPhone, expiresAt]
      properties:
        challengeId:
          type: string
        maskedPhone:
          type: string
        expiresAt:
          type: string
          format: date-time

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken, clientInstanceId, refreshRequestId]
      properties:
        refreshToken:
          type: string
        clientInstanceId:
          type: string
          minLength: 8
          maxLength: 256
        refreshRequestId:
          type: string
          minLength: 24
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]{24,256}$"

    ActorIdentity:
      type: object
      additionalProperties: false
      required: [subject, sessionId, role, surface, expiresAt]
      properties:
        subject:
          type: string
        sessionId:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        surface:
          type: string
        expiresAt:
          type: string
          format: date-time

    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, accessExpiresAt, identity]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        identity:
          $ref: "#/components/schemas/ActorIdentity"

    RecoveryResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [recovery_complete]

    BootstrapOperatorRequest:
      type: object
      additionalProperties: false
      required: [phoneE164, role]
      properties:
        phoneE164:
          type: string
        role:
          type: string
          enum: [operator]

    BootstrapOperatorResponse:
      type: object
      additionalProperties: false
      required: [role, enrollmentToken]
      properties:
        role:
          $ref: "#/components/schemas/ActorRoleView"
        enrollmentToken:
          $ref: "#/components/schemas/OperatorEnrollmentToken"

    ProvisionActorRoleRequest:
      type: object
      additionalProperties: false
      required: [phoneE164, role]
      properties:
        phoneE164:
          type: string
        role:
          type: string
          enum: [partner, captain, field, operator]

    ActorRoleView:
      type: object
      additionalProperties: false
      required: [actorId, phoneE164, role, enabled, securityEnabled, actorVersion, roleVersion]
      properties:
        actorId:
          type: string
        phoneE164:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        enabled:
          type: boolean
        activatedAt:
          type: string
          format: date-time
        securityEnabled:
          type: boolean
        actorVersion:
          type: integer
          minimum: 1
        roleVersion:
          type: integer
          minimum: 1
        credentialVersion:
          type: integer
          minimum: 1
        actorCreated:
          type: boolean
        roleCreated:
          type: boolean

    ActorRoleSearchPage:
      type: object
      additionalProperties: false
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActorRoleView"
        limit:
          type: integer
        nextCursor:
          type: string

    SessionInfo:
      type: object
      additionalProperties: false
      required: [sessionId, role, surface, version, createdAt, expiresAt]
      properties:
        sessionId:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        surface:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        compromisedAt:
          type: string
          format: date-time

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false

  responses:
    ChallengeIssued:
      description: Challenge-shaped acknowledgement; raw codes and provider delivery outcomes are not exposed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } }
    OperatorEnrollmentTokenIssued:
      description: One-time operator enrollment token returned only in this authorized response.
      content: { application/json: { schema: { $ref: "#/components/schemas/OperatorEnrollmentToken" } } }
    TokenPair:
      description: Role-scoped authenticated session.
      content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } }
    RecoveryComplete:
      description: Credential recovery completed without creating a session.
      content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryResult" } } }
    Invalid:
      description: Request validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: Authentication proof failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated principal is not authorized for the operation.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource does not exist in the caller-owned role boundary.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Canonical identity state conflicts with the requested mutation.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Attempt limit reached.
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: Identity dependency is unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
