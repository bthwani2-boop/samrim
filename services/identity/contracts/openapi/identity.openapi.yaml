openapi: 3.1.0
info:
  title: BThwani Identity API
  version: 0.2.0
  description: Isolated Identity phone verification, session verification and logout, Operator permission reads and direct Merchant admission.
paths:
  /health:
    $ref: './paths/runtime.yaml#/paths/~1health'
  /v1/customer-auth/phone-challenges:
    $ref: './paths/client-auth.yaml#/paths/~1v1~1customer-auth~1phone-challenges'
  /v1/customer-auth/phone-verification:
    $ref: './paths/client-auth.yaml#/paths/~1v1~1customer-auth~1phone-verification'
  /v1/sessions/current:
    $ref: './paths/session.yaml#/paths/~1v1~1sessions~1current'
  /v1/actors/me/merchant-role:
    $ref: './paths/managed-enrollment-auth.yaml#/paths/~1v1~1actors~1me~1merchant-role'
  /v1/actors/me/merchant-session:
    $ref: './paths/managed-enrollment-auth.yaml#/paths/~1v1~1actors~1me~1merchant-session'
  /v1/actors/me/captain-role:
    $ref: './paths/captain-admission.yaml#/paths/~1v1~1actors~1me~1captain-role'
  /v1/actors/me/captain-session:
    $ref: './paths/captain-admission.yaml#/paths/~1v1~1actors~1me~1captain-session'
  /v1/operators/me/permissions/{permission}:
    $ref: './paths/internal-actor-administration.yaml#/paths/~1v1~1operators~1me~1permissions~1{permission}'
  /v1/operators/{actorId}/permissions/{permission}:
    $ref: './paths/operator-passkey-access.yaml#/paths/~1v1~1operators~1{actorId}~1permissions~1{permission}'
components:
  securitySchemes:
    OpaqueSession:
      type: http
      scheme: bearer
      description: Identity-issued opaque high-entropy session secret, never a client-asserted actor or role header
  schemas:
    Principal:
      type: object
      additionalProperties: false
      required: [actorId, role, sessionExpiresAt]
      properties:
        actorId: { type: string, minLength: 1, maxLength: 128 }
        role: { type: string, enum: [customer, merchant, captain, operator] }
        sessionExpiresAt: { type: string, format: date-time }
    MerchantAdmission:
      $ref: '#/components/schemas/IssuedRoleSession'
    IssuedRoleSession:
      type: object
      additionalProperties: false
      required: [accessToken, sessionExpiresAt]
      properties:
        accessToken: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        sessionExpiresAt: { type: string, format: date-time }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string, enum: [INVALID_REQUEST, UNAUTHORIZED, FORBIDDEN, VERIFICATION_REQUIRED, ALREADY_PROVISIONED, MERCHANT_NOT_ACTIVE, CONFLICT, OWNER_UNAVAILABLE, NOT_FOUND, METHOD_NOT_ALLOWED, PHONE_CHALLENGE_LIMIT, CAPTAIN_NOT_APPROVED, CAPTAIN_NOT_ACTIVE] }
