openapi: 3.1.0
info:
  title: BThwani Identity API
  version: 1.0.0
  description: |
    Identity alone creates actor_id. Phone is a mutable verified identifier rather than the cross-boundary primary identity.
    Public client verification, governed managed-role activation, operator access, normal authentication and recovery/re-enrollment are distinct lifecycles.
servers:
  - url: http://127.0.0.1:18082

paths:
  /identity/health:
    get:
      operationId: identityHealth
      responses:
        "200":
          description: Process health.
          content: { application/json: { schema: { $ref: "#/components/schemas/StatusResponse" } } }

  /identity/readiness:
    get:
      operationId: identityReadiness
      responses:
        "200":
          description: Canonical schema is ready.
          content: { application/json: { schema: { $ref: "#/components/schemas/StatusResponse" } } }
        "503":
          description: Canonical schema is not ready.
          content: { application/json: { schema: { $ref: "#/components/schemas/StatusResponse" } } }

  /auth/client/registration/request:
    post:
      tags: [client-auth]
      operationId: requestClientRegistrationVerification
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PhoneRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/client/register:
    post:
      tags: [client-auth]
      operationId: registerClient
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClientCredentialProofRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/client/login:
    post:
      tags: [client-auth]
      operationId: loginClient
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordLoginRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/client/recovery/request:
    post:
      tags: [client-auth]
      operationId: requestClientRecoveryVerification
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PhoneRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/client/recover:
    post:
      tags: [client-auth]
      operationId: recoverClient
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClientCredentialProofRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/managed/activation/request:
    post:
      tags: [managed-auth]
      operationId: requestManagedActivation
      description: Operator enrollment requires the one-time operator enrollment token issued by the authenticated control-panel operator; partner/captain/field activation requires admitted role plus phone proof.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedChallengeRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/managed/activate:
    post:
      tags: [managed-auth]
      operationId: activateManagedRole
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedActivationRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/managed/login:
    post:
      tags: [managed-auth]
      operationId: loginManagedRole
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedPasswordLoginRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/managed/recovery/request:
    post:
      tags: [managed-auth]
      operationId: requestManagedRecoveryVerification
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRecoveryChallengeRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/managed/recover:
    post:
      tags: [managed-auth]
      operationId: recoverManagedRole
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedRecoveryRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/RecoveryComplete" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/operator/login/start:
    post:
      tags: [operator-auth]
      operationId: startOperatorLogin
      description: Validates the operator password and issues the required second-factor challenge. Password proof alone never creates a control-panel session.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatorLoginStartRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/operator/login/complete:
    post:
      tags: [operator-auth]
      operationId: completeOperatorLogin
      description: Consumes the required second-factor challenge and only then creates the operator session.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatorLoginCompleteRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/refresh:
    post:
      tags: [session]
      operationId: refreshSession
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/logout:
    post:
      tags: [session]
      operationId: logoutSession
      security: [{ accessToken: [] }]
      responses:
        "204": { description: Current session revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/session:
    get:
      tags: [session]
      operationId: readCurrentSession
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: Current single-role session identity.
          content: { application/json: { schema: { $ref: "#/components/schemas/ActorIdentity" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /internal/actor-roles/provision:
    post:
      tags: [internal-actor-roles]
      operationId: provisionActorRole
      security: [{ internalServiceToken: [] }]
      description: Identity alone creates actor_id. DSH may provision partner/captain/field; the control-panel service may provision a later operator. First-operator bootstrap is a separate one-time lifecycle.
      parameters:
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionActorRoleRequest" } } }
      responses:
        "200": { description: Existing exact actor-role readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "201": { description: Canonical actor and/or role created., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/bootstrap/operator:
    post:
      tags: [internal-actor-roles]
      operationId: bootstrapFirstOperator
      security: [{ internalServiceToken: [] }]
      description: Irreversible one-time first-operator bootstrap. It creates the initial operator actor-role and password credential, records bootstrap completion, and never creates a second human role.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionActorRoleRequest" } } }
      responses:
        "201": { description: First operator created., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/operator-enrollment-tokens:
    post:
      tags: [internal-actor-roles]
      operationId: issueOperatorEnrollmentToken
      security: [{ internalServiceToken: [] }]
      description: Issues a single-use enrollment token for an already admitted, enabled operator role. The token is returned once, stored only as a digest, and never creates or grants a role.
      parameters:
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatorEnrollmentTokenIssueRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/OperatorEnrollmentTokenIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actor-roles/search:
    get:
      tags: [internal-actor-roles]
      operationId: searchActorRoles
      security: [{ internalServiceToken: [] }]
      parameters:
        - { name: role, in: query, required: true, schema: { $ref: "#/components/schemas/ActorType" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Role-scoped actor readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleSearchPage" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /internal/actors/{actorId}/roles/{role}:
    get:
      tags: [internal-actor-roles]
      operationId: readActorRole
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }]
      responses:
        "200": { description: Exact actor-role readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/disable:
    post:
      tags: [internal-actor-roles]
      operationId: disableActorRole
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
        - { $ref: "#/components/parameters/ExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Exact role disabled and its sessions/challenges revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}/enable:
    post:
      tags: [internal-actor-roles]
      operationId: enableActorRole
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
        - { $ref: "#/components/parameters/ExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Existing role enabled; no session or activation eligibility is silently recreated. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}/reenrollment:
    post:
      tags: [internal-actor-roles]
      operationId: authorizeManagedRoleReenrollment
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ActingActorId" }
      responses:
        "204": { description: Managed role is eligible for a fresh one-time activation. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/security/disable:
    post:
      tags: [internal-security]
      operationId: disableActorSecurity
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/ControlPanelExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Identity-wide authentication disabled and active sessions/challenges revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/security/enable:
    post:
      tags: [internal-security]
      operationId: enableActorSecurity
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
        - { $ref: "#/components/parameters/ControlPanelExpectedVersion" }
        - { $ref: "#/components/parameters/MutationReason" }
      responses:
        "204": { description: Identity-wide authentication eligibility restored; no session is resurrected. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/roles/{role}/sessions:
    get:
      tags: [internal-sessions]
      operationId: listActorRoleSessions
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }]
      responses:
        "200":
          description: Active sessions for the exact actor-role.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [internal-sessions]
      operationId: revokeActorRoleSessions
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
      responses:
        "204": { description: Active sessions for the exact actor-role revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/sessions/{sessionId}:
    delete:
      tags: [internal-sessions]
      operationId: revokeActorRoleSession
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CorrelationId" }
        - { $ref: "#/components/parameters/ControlPanelActingActorId" }
      responses:
        "204": { description: Exact session revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    accessToken: { type: http, scheme: bearer, bearerFormat: opaque }
    internalServiceToken: { type: http, scheme: bearer, bearerFormat: opaque-service-token }

  parameters:
    ActorId: { name: actorId, in: path, required: true, schema: { type: string } }
    Role: { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/ActorType" } }
    CorrelationId: { name: X-Correlation-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }
    ActingActorId: { name: X-Acting-Actor-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }
    ControlPanelActingActorId: { name: X-Acting-Actor-ID, in: header, required: true, schema: { type: string, maxLength: 128 } }
    ExpectedVersion: { name: X-Expected-Version, in: header, required: false, schema: { type: integer, minimum: 1 } }
    ControlPanelExpectedVersion: { name: X-Expected-Version, in: header, required: true, schema: { type: integer, minimum: 1 } }
    MutationReason: { name: X-Reason, in: header, required: false, schema: { type: string, maxLength: 500 } }

  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          const: identity
        status:
          type: string
          enum: [ok, not_ready]

    ActorType:
      type: string
      enum: [client, partner, captain, field, operator]

    ManagedActorType:
      type: string
      enum: [partner, captain, field]

    ManagedActivationRole:
      type: string
      enum: [partner, captain, field, operator]

    ControlPanelRole:
      type: string
      enum: [operator]

    PhoneRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string

    ManagedChallengeRequest:
      type: object
      additionalProperties: false
      required: [phone, role]
      properties:
        phone:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"
        operatorEnrollmentToken:
          type: string
          minLength: 24
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]{24,256}$"

    ManagedRecoveryChallengeRequest:
      type: object
      additionalProperties: false
      required: [phone, role]
      properties:
        phone:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"

    OperatorEnrollmentTokenIssueRequest:
      type: object
      additionalProperties: false
      required: [phoneE164, role]
      properties:
        phoneE164:
          type: string
        role:
          type: string
          enum: [operator]

    OperatorEnrollmentToken:
      type: object
      additionalProperties: false
      required: [code, maskedPhone, role, expiresAt]
      properties:
        code:
          type: string
        maskedPhone:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"
        expiresAt:
          type: string
          format: date-time

    ClientCredentialProofRequest:
      type: object
      additionalProperties: false
      required: [phone, code, password, deviceFingerprint]
      properties:
        phone:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
        password:
          type: string
          minLength: 15
          maxLength: 128
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password, deviceFingerprint]
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 15
          maxLength: 128
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    ManagedPasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password, role, deviceFingerprint]
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 15
          maxLength: 128
        role:
          $ref: "#/components/schemas/ManagedActorType"
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    ManagedActivationRequest:
      type: object
      additionalProperties: false
      required: [phone, role, verificationCode, password, deviceFingerprint]
      properties:
        phone:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"
        operatorEnrollmentToken:
          type: string
          minLength: 24
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]{24,256}$"
        verificationCode:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
        password:
          type: string
          minLength: 15
          maxLength: 128
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    ManagedRecoveryRequest:
      type: object
      additionalProperties: false
      required: [phone, role, code, password]
      properties:
        phone:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
        password:
          type: string
          minLength: 15
          maxLength: 128

    OperatorLoginStartRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 15
          maxLength: 128

    OperatorLoginCompleteRequest:
      type: object
      additionalProperties: false
      required: [phone, code, deviceFingerprint]
      properties:
        phone:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    Challenge:
      type: object
      additionalProperties: false
      required: [challengeId, maskedPhone, expiresAt]
      properties:
        challengeId:
          type: string
        maskedPhone:
          type: string
        expiresAt:
          type: string
          format: date-time

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken, deviceFingerprint]
      properties:
        refreshToken:
          type: string
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    ActorIdentity:
      type: object
      additionalProperties: false
      required: [subject, sessionId, role, surface, expiresAt]
      properties:
        subject:
          type: string
        sessionId:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        surface:
          type: string
        expiresAt:
          type: string
          format: date-time

    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, accessExpiresAt, identity]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        identity:
          $ref: "#/components/schemas/ActorIdentity"

    RecoveryResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [recovery_complete]

    ProvisionActorRoleRequest:
      type: object
      additionalProperties: false
      required: [phoneE164, role]
      properties:
        phoneE164:
          type: string
        role:
          type: string
          enum: [partner, captain, field, operator]
        password:
          type: string
          minLength: 15
          maxLength: 128

    ActorRoleView:
      type: object
      additionalProperties: false
      required: [actorId, phoneE164, role, enabled, securityEnabled, actorVersion, roleVersion]
      properties:
        actorId:
          type: string
        phoneE164:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        enabled:
          type: boolean
        activatedAt:
          type: string
          format: date-time
        securityEnabled:
          type: boolean
        actorVersion:
          type: integer
          minimum: 1
        roleVersion:
          type: integer
          minimum: 1
        credentialVersion:
          type: integer
          minimum: 1
        actorCreated:
          type: boolean
        roleCreated:
          type: boolean

    ActorRoleSearchPage:
      type: object
      additionalProperties: false
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActorRoleView"
        limit:
          type: integer
        nextCursor:
          type: string

    SessionInfo:
      type: object
      additionalProperties: false
      required: [sessionId, role, surface, version, createdAt, expiresAt]
      properties:
        sessionId:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        surface:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        compromisedAt:
          type: string
          format: date-time

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false

  responses:
    ChallengeIssued:
      description: Challenge-shaped acknowledgement; raw codes and provider delivery outcomes are not exposed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } }
    OperatorEnrollmentTokenIssued:
      description: One-time operator enrollment token returned only in this authorized response.
      content: { application/json: { schema: { $ref: "#/components/schemas/OperatorEnrollmentToken" } } }
    TokenPair:
      description: Role-scoped authenticated session.
      content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } }
    RecoveryComplete:
      description: Credential recovery completed without creating a session.
      content: { application/json: { schema: { $ref: "#/components/schemas/RecoveryResult" } } }
    Invalid:
      description: Request validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: Authentication proof failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated principal is not authorized for the operation.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource does not exist in the caller-owned role boundary.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Canonical identity state conflicts with the requested mutation.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Attempt limit reached.
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: Identity dependency is unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
