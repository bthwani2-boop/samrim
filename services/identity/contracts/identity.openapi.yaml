openapi: 3.1.0
info:
  title: BThwani Identity API
  version: 1.0.0
  description: |
    Identity alone creates actor_id. Phone is a mutable verified identifier rather than the cross-boundary primary identity.
    Public customer verification, governed managed-role activation, normal authentication and recovery/re-enrollment are distinct lifecycles.
servers:
  - url: http://127.0.0.1:18082

paths:
  /identity/health:
    get:
      operationId: identityHealth
      responses:
        "200":
          description: Process health.
          content: { application/json: { schema: { $ref: "#/components/schemas/StatusResponse" } } }

  /identity/readiness:
    get:
      operationId: identityReadiness
      responses:
        "200":
          description: Canonical schema is ready.
          content: { application/json: { schema: { $ref: "#/components/schemas/StatusResponse" } } }
        "503":
          description: Canonical schema is not ready.
          content: { application/json: { schema: { $ref: "#/components/schemas/StatusResponse" } } }

  /auth/client/registration/request:
    post:
      tags: [client-auth]
      operationId: requestClientRegistrationVerification
      description: Requests phone verification for client registration without creating an actor before proof. Delivery is asynchronous and the acknowledgement does not report provider outcome.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PhoneRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/client/register:
    post:
      tags: [client-auth]
      operationId: registerClient
      description: Consumes phone-verification proof, creates/reuses the canonical actor, creates the client role and client-only password credential, then creates a client session.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClientCredentialProofRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/client/login:
    post:
      tags: [client-auth]
      operationId: loginClient
      description: Normal customer re-authentication is phone plus the client password credential; a valid stored session is restored instead of requiring login on every app open.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordLoginRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/client/recovery/request:
    post:
      tags: [client-auth]
      operationId: requestClientRecoveryVerification
      description: Requests phone proof for client-password recovery without exposing whether an admissible client credential exists. Delivery is asynchronous and the acknowledgement does not report provider outcome.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PhoneRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/client/recover:
    post:
      tags: [client-auth]
      operationId: recoverClient
      description: Consumes recovery phone proof, replaces only the client credential, revokes existing client sessions and creates a fresh client session.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClientCredentialProofRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/managed/activation/request:
    post:
      tags: [managed-auth]
      operationId: requestManagedActivation
      description: Validates a one-time activation code issued by an authorized control surface, then requests a separate phone-verification challenge. The two proofs are distinct and neither grants role admission.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedChallengeRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/managed/activate:
    post:
      tags: [managed-auth]
      operationId: activateManagedRole
      description: Consumes the one-time control-surface activation code and the separate phone-verification challenge, creates the role-scoped password credential, permanently records that enrollment, and creates the first role-scoped device-bound session. Repeated activation is not normal login.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedActivationRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/managed/login:
    post:
      tags: [managed-auth]
      operationId: loginManagedRole
      description: Normal re-authentication for an activated partner, captain, or field role is phone plus that role's password credential. A valid stored session is restored instead of requiring login on every app open.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedPasswordLoginRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/operator/login/start:
    post:
      tags: [operator-auth]
      operationId: startOperatorLogin
      description: Validates the operator password internally and returns a challenge-shaped response. A password proof alone never creates an operator session; second-factor delivery is asynchronous and provider outcome is not exposed by this response.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatorLoginStartRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ChallengeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /auth/operator/login/complete:
    post:
      tags: [operator-auth]
      operationId: completeOperatorLogin
      description: Consumes the required second-factor challenge and only then creates the operator session.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OperatorLoginCompleteRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/refresh:
    post:
      tags: [session]
      operationId: refreshSession
      description: Refresh token rotated atomically while the exact role remains enabled and the presented device fingerprint still matches.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/TokenPair" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/logout:
    post:
      tags: [session]
      operationId: logoutSession
      security: [{ accessToken: [] }]
      responses:
        "204": { description: Current session revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/session:
    get:
      tags: [session]
      operationId: readCurrentSession
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: Current single-role session identity.
          content: { application/json: { schema: { $ref: "#/components/schemas/ActorIdentity" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /internal/actor-roles/provision:
    post:
      tags: [internal-actor-roles]
      operationId: provisionActorRole
      security: [{ internalServiceToken: [] }]
      description: The authenticated service token determines the caller. Identity alone creates actor_id. DSH may provision partner/captain/field; Platform Control may provision an operator. Platform-owner creation is forbidden on this general route and is available only through the one-time platform bootstrap route.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionActorRoleRequest" } } }
      responses:
        "200": { description: Existing exact actor-role readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "201": { description: Canonical actor and/or role created., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/bootstrap/platform-owner:
    post:
      tags: [internal-actor-roles]
      operationId: bootstrapPlatformOwner
      security: [{ internalServiceToken: [] }]
      description: One-time platform-owner bootstrap. The dedicated bootstrap secret is accepted only while no platform-owner role exists; subsequent attempts and platform-control tokens are rejected.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProvisionActorRoleRequest" } } }
      responses:
        "201": { description: Platform owner created., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/managed-activation-codes:
    post:
      tags: [internal-actor-roles]
      operationId: issueManagedActivationCode
      security: [{ internalServiceToken: [] }]
      description: Issues a single-use activation code for an already admitted, enabled partner/captain/field/operator role. The code is returned once, stored only as a digest, and never creates or grants a role.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManagedActivationCodeIssueRequest" } } }
      responses:
        "201": { $ref: "#/components/responses/ManagedActivationCodeIssued" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actor-roles/search:
    get:
      tags: [internal-actor-roles]
      operationId: searchActorRoles
      security: [{ internalServiceToken: [] }]
      parameters:
        - { name: role, in: query, required: true, schema: { $ref: "#/components/schemas/ActorType" } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200": { description: Role-scoped actor readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleSearchPage" } } } }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /internal/actors/{actorId}/roles/{role}:
    get:
      tags: [internal-actor-roles]
      operationId: readActorRole
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }]
      responses:
        "200": { description: Exact actor-role readback., content: { application/json: { schema: { $ref: "#/components/schemas/ActorRoleView" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/disable:
    post:
      tags: [internal-actor-roles]
      operationId: disableActorRole
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }, { $ref: "#/components/parameters/CorrelationId" }]
      responses:
        "204": { description: Exact role disabled and its sessions/challenges revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/enable:
    post:
      tags: [internal-actor-roles]
      operationId: enableActorRole
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }, { $ref: "#/components/parameters/CorrelationId" }]
      responses:
        "204": { description: Existing role enabled; no session or activation eligibility is silently recreated. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/reenrollment:
    post:
      tags: [internal-actor-roles]
      operationId: authorizeManagedRoleReenrollment
      security: [{ internalServiceToken: [] }]
      description: DSH-only explicit recovery action for partner/captain/field. Revokes that role's sessions and reopens one-time activation eligibility without changing role admission.
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }, { $ref: "#/components/parameters/CorrelationId" }]
      responses:
        "204": { description: Managed role is eligible for a fresh one-time activation. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /internal/actors/{actorId}/security/disable:
    post:
      tags: [internal-security]
      operationId: disableActorSecurity
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/CorrelationId" }]
      responses:
        "204": { description: Identity-wide authentication disabled and active sessions/challenges revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/security/enable:
    post:
      tags: [internal-security]
      operationId: enableActorSecurity
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/CorrelationId" }]
      responses:
        "204": { description: Identity-wide authentication eligibility restored; no session is resurrected. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/operator-password/reset:
    post:
      tags: [internal-credentials]
      operationId: resetOperatorPassword
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/CorrelationId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PasswordResetRequest" } } }
      responses:
        "204": { description: Operator password replaced; operator sessions and pending operator challenges revoked. }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/sessions:
    get:
      tags: [internal-sessions]
      operationId: listActorRoleSessions
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }]
      responses:
        "200":
          description: Active sessions for the exact actor-role.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SessionInfo" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [internal-sessions]
      operationId: revokeActorRoleSessions
      security: [{ internalServiceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ActorId" }, { $ref: "#/components/parameters/Role" }, { $ref: "#/components/parameters/CorrelationId" }]
      responses:
        "204": { description: Active sessions for the exact actor-role revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /internal/actors/{actorId}/roles/{role}/sessions/{sessionId}:
    delete:
      tags: [internal-sessions]
      operationId: revokeActorRoleSession
      security: [{ internalServiceToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ActorId" }
        - { $ref: "#/components/parameters/Role" }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/CorrelationId" }
      responses:
        "204": { description: Exact session revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    accessToken: { type: http, scheme: bearer, bearerFormat: opaque }
    internalServiceToken: { type: http, scheme: bearer, bearerFormat: opaque-service-token }

  parameters:
    ActorId: { name: actorId, in: path, required: true, schema: { type: string } }
    Role: { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/ActorType" } }
    CorrelationId: { name: X-Correlation-ID, in: header, required: false, schema: { type: string, maxLength: 128 } }

  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          const: identity
        status:
          type: string
          enum: [ok, not_ready]

    ActorType:
      type: string
      enum: [client, partner, captain, field, operator, platform_owner]

    ManagedActorType:
      type: string
      enum: [partner, captain, field]

    ManagedActivationRole:
      type: string
      enum: [partner, captain, field, operator]

    ControlPanelRole:
      type: string
      enum: [operator, platform_owner]

    PhoneRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string

    ManagedChallengeRequest:
      type: object
      additionalProperties: false
      required: [phone, role, activationCode]
      properties:
        phone:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"
        activationCode:
          type: string
          minLength: 4
          maxLength: 4
          pattern: "^[0-9]{6}$"

    ClientCredentialProofRequest:
      type: object
      additionalProperties: false
      required: [phone, code, password, deviceFingerprint]
      properties:
        phone:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
        password:
          type: string
          minLength: 15
          maxLength: 128
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password, deviceFingerprint]
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 15
          maxLength: 128
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    ManagedPasswordLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password, role, deviceFingerprint]
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 15
          maxLength: 128
        role:
          $ref: "#/components/schemas/ManagedActorType"
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    ManagedActivationRequest:
      type: object
      additionalProperties: false
      required: [phone, role, activationCode, verificationCode, password, deviceFingerprint]
      properties:
        phone:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"
        activationCode:
          type: string
          minLength: 4
          maxLength: 4
          pattern: "^[0-9]{6}$"
        verificationCode:
          type: string
          pattern: "^[0-9]{6}$"
        password:
          type: string
          minLength: 15
          maxLength: 128
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    OperatorLoginStartRequest:
      type: object
      additionalProperties: false
      required: [phone, password, role]
      properties:
        phone:
          type: string
        password:
          type: string
          minLength: 15
          maxLength: 128
        role:
          $ref: "#/components/schemas/ControlPanelRole"

    OperatorLoginCompleteRequest:
      type: object
      additionalProperties: false
      required: [phone, code, role, deviceFingerprint]
      properties:
        phone:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
        role:
          $ref: "#/components/schemas/ControlPanelRole"
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    Challenge:
      type: object
      additionalProperties: false
      required: [challengeId, maskedPhone, expiresAt]
      properties:
        challengeId:
          type: string
        maskedPhone:
          type: string
        expiresAt:
          type: string
          format: date-time

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken, deviceFingerprint]
      properties:
        refreshToken:
          type: string
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    ActorIdentity:
      type: object
      additionalProperties: false
      required: [subject, sessionId, role, surface, expiresAt]
      properties:
        subject:
          type: string
        sessionId:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        surface:
          type: string
        expiresAt:
          type: string
          format: date-time

    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, accessExpiresAt, identity]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        identity:
          $ref: "#/components/schemas/ActorIdentity"

    ProvisionActorRoleRequest:
      type: object
      additionalProperties: false
      required: [phoneE164, role]
      properties:
        phoneE164:
          type: string
        role:
          type: string
          enum: [partner, captain, field, operator, platform_owner]
        password:
          type: string
          minLength: 15
          maxLength: 128

    ManagedActivationCodeIssueRequest:
      type: object
      additionalProperties: false
      required: [phoneE164, role]
      properties:
        phoneE164:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"

    ManagedActivationCode:
      type: object
      additionalProperties: false
      required: [code, maskedPhone, role, expiresAt]
      properties:
        code:
          type: string
        maskedPhone:
          type: string
        role:
          $ref: "#/components/schemas/ManagedActivationRole"
        expiresAt:
          type: string
          format: date-time

    ActorRoleView:
      type: object
      additionalProperties: false
      required: [actorId, phoneE164, role, enabled, securityEnabled, actorVersion, roleVersion]
      properties:
        actorId:
          type: string
        phoneE164:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        enabled:
          type: boolean
        activatedAt:
          type: string
          format: date-time
        securityEnabled:
          type: boolean
        actorVersion:
          type: integer
          minimum: 1
        roleVersion:
          type: integer
          minimum: 1
        actorCreated:
          type: boolean
        roleCreated:
          type: boolean

    ActorRoleSearchPage:
      type: object
      additionalProperties: false
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActorRoleView"
        limit:
          type: integer
        nextCursor:
          type: string

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 15
          maxLength: 128

    SessionInfo:
      type: object
      additionalProperties: false
      required: [sessionId, role, surface, version, createdAt, expiresAt]
      properties:
        sessionId:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        surface:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        compromisedAt:
          type: string
          format: date-time

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false

  responses:
    ChallengeIssued:
      description: Challenge-shaped acknowledgement. Public decoys use the same shape, raw codes are never exposed, and provider delivery outcome is not reported.
      content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } }
    ManagedActivationCodeIssued:
      description: One-time managed-role activation code. The plaintext code is returned only in this authorized response and is never stored.
      content: { application/json: { schema: { $ref: "#/components/schemas/ManagedActivationCode" } } }
    TokenPair:
      description: Role-scoped authenticated session.
      content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } }
    Invalid:
      description: Request validation failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: Authentication proof failed.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authenticated principal is not authorized for the operation.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource does not exist in the caller-owned role boundary.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Canonical identity state conflicts with the requested mutation.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Attempt limit reached.
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: Identity dependency is unavailable.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
