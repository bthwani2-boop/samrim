openapi: 3.1.0
info:
  title: Samrim Identity API
  version: 1.0.0-stage-b
  description: Canonical Identity contract for one actor_id, explicit actor roles, authentication, and role-scoped sessions.
servers:
  - url: http://localhost:18082
tags:
  - name: auth
  - name: internal-actor-roles
  - name: internal-security
  - name: internal-sessions

paths:
  /identity/health:
    get:
      operationId: identityHealth
      responses:
        "200":
          description: Liveness only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /identity/readiness:
    get:
      operationId: identityReadiness
      responses:
        "200":
          description: Configuration, database, schema, relation, and clock readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      description: Client may self-provision its client role. Partner, captain and field roles must already exist and be enabled. Operator OTP is forbidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "201":
          description: A generic activation challenge response. Governed roles are never granted by this endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationChallenge"
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/activate:
    post:
      tags: [auth]
      operationId: activateRoleSession
      description: Consumes one OTP proof and creates a session only for the requested enabled role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
      responses:
        "200":
          description: Activation consumed exactly once and a role-scoped session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/login:
    post:
      tags: [auth]
      operationId: loginOperator
      description: Password login is currently restricted to the operator role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated operator session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh token rotated atomically while the session role remains enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logoutSession
      security:
        - accessToken: []
      responses:
        "204":
          description: Current session revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/session:
    get:
      tags: [auth]
      operationId: readCurrentSession
      security:
        - accessToken: []
      responses:
        "200":
          description: Minimal current session identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorIdentity"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /internal/actor-roles/provision:
    post:
      tags: [internal-actor-roles]
      operationId: provisionActorRole
      security:
        - internalServiceToken: []
      description: The authenticated service token determines the caller. Identity alone creates actor_id. Exact role retries are idempotent; disabled roles are never silently re-enabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionActorRoleRequest"
      responses:
        "200":
          description: Existing canonical actor-role readback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorRoleView"
        "201":
          description: A canonical actor and/or role was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorRoleView"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /internal/actor-roles/search:
    get:
      tags: [internal-actor-roles]
      operationId: searchActorRoles
      security:
        - internalServiceToken: []
      parameters:
        - name: role
          in: query
          required: true
          description: Must be owned by the authenticated service principal.
          schema:
            $ref: "#/components/schemas/ActorType"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Stable role-scoped actor readback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorRoleSearchPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /internal/actors/{actorId}/roles/{role}:
    get:
      tags: [internal-actor-roles]
      operationId: readActorRole
      security:
        - internalServiceToken: []
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/Role"
      responses:
        "200":
          description: Exact role-scoped actor readback.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorRoleView"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/actors/{actorId}/roles/{role}/disable:
    post:
      tags: [internal-actor-roles]
      operationId: disableActorRole
      security:
        - internalServiceToken: []
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/Role"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: Role disabled; only sessions and pending activations for that actor-role are revoked.

  /internal/actors/{actorId}/roles/{role}/enable:
    post:
      tags: [internal-actor-roles]
      operationId: enableActorRole
      security:
        - internalServiceToken: []
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/Role"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: Existing role enabled. No session is created.

  /internal/actors/{actorId}/security/disable:
    post:
      tags: [internal-security]
      operationId: disableActorSecurity
      security:
        - internalServiceToken: []
      description: Platform Control only. Disables Identity-wide authentication for the actor and revokes all active sessions and pending activation challenges without deleting role bindings.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: Global Identity security access disabled.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/actors/{actorId}/security/enable:
    post:
      tags: [internal-security]
      operationId: enableActorSecurity
      security:
        - internalServiceToken: []
      description: Platform Control only. Re-enables Identity-wide authentication eligibility without restoring any revoked session.
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: Global Identity security access enabled; re-authentication is required.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/actors/{actorId}/operator-password/reset:
    post:
      tags: [internal-actor-roles]
      operationId: resetOperatorPassword
      security:
        - internalServiceToken: []
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Operator credential replaced and existing operator sessions revoked.
        "400":
          $ref: "#/components/responses/Invalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /internal/actors/{actorId}/roles/{role}/sessions:
    get:
      tags: [internal-sessions]
      operationId: listActorRoleSessions
      security:
        - internalServiceToken: []
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/Role"
      responses:
        "200":
          description: Active sessions for the exact actor-role.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
    delete:
      tags: [internal-sessions]
      operationId: revokeActorRoleSessions
      security:
        - internalServiceToken: []
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/Role"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: All active sessions for the exact actor-role revoked.

  /internal/actors/{actorId}/roles/{role}/sessions/{sessionId}:
    delete:
      tags: [internal-sessions]
      operationId: revokeActorRoleSession
      security:
        - internalServiceToken: []
      parameters:
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/Role"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: Exact session revoked.

components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
    internalServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token

  parameters:
    ActorId:
      name: actorId
      in: path
      required: true
      schema:
        type: string
    Role:
      name: role
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ActorType"
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128

  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          const: identity
        status:
          type: string
          enum: [ok, not_ready]

    ActorType:
      type: string
      enum: [client, partner, captain, field, operator]

    OtpRequest:
      type: object
      additionalProperties: false
      required: [phone, role]
      properties:
        phone:
          type: string
        role:
          type: string
          enum: [client, partner, captain, field]

    ActivationRequest:
      type: object
      additionalProperties: false
      required: [phone, role, code, deviceFingerprint]
      properties:
        phone:
          type: string
        role:
          type: string
          enum: [client, partner, captain, field]
        code:
          type: string
          pattern: "^[0-9]{6}$"
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    ActivationChallenge:
      type: object
      additionalProperties: false
      required: [activationId, maskedPhone, expiresAt]
      properties:
        activationId:
          type: string
        maskedPhone:
          type: string
        expiresAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, deviceFingerprint]
      properties:
        username:
          type: string
        password:
          type: string
          minLength: 12
          maxLength: 128
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken, deviceFingerprint]
      properties:
        refreshToken:
          type: string
        deviceFingerprint:
          type: string
          minLength: 8
          maxLength: 256

    ActorIdentity:
      type: object
      additionalProperties: false
      required: [subject, sessionId, role, surface, expiresAt]
      properties:
        subject:
          type: string
        sessionId:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        surface:
          type: string
        expiresAt:
          type: string
          format: date-time

    TokenPair:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, accessExpiresAt, identity]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
        identity:
          $ref: "#/components/schemas/ActorIdentity"

    ProvisionActorRoleRequest:
      type: object
      additionalProperties: false
      required: [phoneE164, role]
      properties:
        phoneE164:
          type: string
        role:
          type: string
          enum: [partner, captain, field, operator]
        username:
          type: string
        password:
          type: string
          minLength: 12
          maxLength: 128

    ActorRoleView:
      type: object
      additionalProperties: false
      required: [actorId, phoneE164, role, enabled, securityEnabled, actorVersion, roleVersion]
      properties:
        actorId:
          type: string
        phoneE164:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        enabled:
          type: boolean
        securityEnabled:
          type: boolean
          description: Identity-wide security eligibility. This is not a domain-operational lifecycle status.
        actorVersion:
          type: integer
          minimum: 1
        roleVersion:
          type: integer
          minimum: 1
        actorCreated:
          type: boolean
        roleCreated:
          type: boolean

    ActorRoleSearchPage:
      type: object
      additionalProperties: false
      required: [items, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActorRoleView"
        limit:
          type: integer
        nextCursor:
          type: string

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128

    SessionInfo:
      type: object
      additionalProperties: false
      required: [sessionId, role, surface, version, createdAt, expiresAt]
      properties:
        sessionId:
          type: string
        role:
          $ref: "#/components/schemas/ActorType"
        surface:
          type: string
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        compromisedAt:
          type: string
          format: date-time

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

  responses:
    Invalid:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Authentication proof failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated principal is not authorized for the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist in the caller-owned role boundary.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Canonical identity state conflicts with the requested mutation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Attempt limit reached.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Identity dependency is unavailable or not ready.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
