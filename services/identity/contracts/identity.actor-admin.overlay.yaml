overlay: 1.0.0
info:
  title: Identity governed actor administration
  version: 1.0.0
actions:
  - target: $.components.parameters
    description: Add the trusted operator context required by every internal actor administration operation.
    update:
      OperatorContext:
        in: header
        name: X-Operator-Context-ID
        required: true
        description: Trusted runtime operator context; client body and query values never override it.
        schema:
          type: string
          minLength: 1
  - target: $.components.parameters.ServiceCaller.schema
    update:
      const: workforce
  - target: $.paths['/internal/actors/provision'].post
    update:
      description: >-
        Service-to-service only. Creates one inactive Workforce-managed actor.
        Exact canonical phone, username, role, and operator-context retries are
        idempotent; any mismatched retry fails with an explicit conflict.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/OperatorContext'
  - target: $.paths['/internal/actors/search'].get
    update:
      description: >-
        Service-to-service only. Returns a stable page of actors in the trusted
        operator context, including provisioned and inactive lifecycle states.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/ServiceCaller'
        - $ref: '#/components/parameters/OperatorContext'
        - name: role
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PROVISIONED, PENDING_ACTIVATION, ACTIVE, INACTIVE, SUSPENDED, DEACTIVATED]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Stable paginated actor results from the trusted operator context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorSearchPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  - target: $.paths['/internal/actors/{actorId}'].get.parameters
    update:
      - $ref: '#/components/parameters/ActorId'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/ServiceCaller'
      - $ref: '#/components/parameters/OperatorContext'
  - target: $.paths['/internal/actors/{actorId}'].delete.parameters
    update:
      - $ref: '#/components/parameters/ActorId'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/ServiceCaller'
      - $ref: '#/components/parameters/OperatorContext'
  - target: $.paths['/internal/actors/{actorId}/deactivate'].post.parameters
    update:
      - $ref: '#/components/parameters/ActorId'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/ServiceCaller'
      - $ref: '#/components/parameters/OperatorContext'
  - target: $.paths['/internal/actors/{actorId}/reactivate'].post.parameters
    update:
      - $ref: '#/components/parameters/ActorId'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/ServiceCaller'
      - $ref: '#/components/parameters/OperatorContext'
  - target: $.paths['/internal/actors/{actorId}/activations'].post.parameters
    update:
      - $ref: '#/components/parameters/ActorId'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/ServiceCaller'
      - $ref: '#/components/parameters/OperatorContext'
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      - in: header
        name: X-Correlation-ID
        required: false
        schema:
          type: string
  - target: $.paths['/internal/actors/{actorId}/activations/latest'].get.parameters
    update:
      - $ref: '#/components/parameters/ActorId'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/ServiceCaller'
      - $ref: '#/components/parameters/OperatorContext'
  - target: $.paths['/internal/actors/{actorId}/activations/revoke'].post.parameters
    update:
      - $ref: '#/components/parameters/ActorId'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/ServiceCaller'
      - $ref: '#/components/parameters/OperatorContext'
  - target: $.components.schemas.ProvisionActorRequest.properties.username
    update:
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
  - target: $.components.schemas.ActorAdminView.required
    update: [actorId, username, phoneE164, roles, status, version]
  - target: $.components.schemas.ActorAdminView.properties
    update:
      status:
        type: string
        enum: [PROVISIONED, PENDING_ACTIVATION, ACTIVE, INACTIVE, SUSPENDED, DEACTIVATED]
  - target: $.components.schemas
    update:
      ActorSearchPage:
        type: object
        additionalProperties: false
        required: [items, limit, total]
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ActorAdminView'
          limit:
            type: integer
            minimum: 1
            maximum: 100
          nextCursor:
            type: string
            minLength: 1
          total:
            type: integer
            minimum: 0
