openapi: 3.1.0
info:
  title: BThwani Identity Employee Access API
  version: 0.2.0
  description: >-
    Workforce-only administrative employee provisioning. Identity owns and
    publishes the canonical permission-bundle catalogue, derives effective
    control-panel roles and permissions, and rejects arbitrary permission
    submissions. Employee activation remains actor-bound through the canonical
    Identity activation endpoint with actorType=employee and
    surface=control-panel.
x-bthwani-contract-state: CONTRACT_ACTIVE
x-bthwani-owner: services/identity
x-bthwani-runtime-dependency: true
x-bthwani-extends: ./identity.openapi.yaml
servers:
  - url: http://localhost:18082
    description: Local Identity runtime
paths:
  /internal/employees/permission-bundles:
    get:
      operationId: listAdministrativeEmployeePermissionBundles
      tags: [internal-employees]
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/WorkforceServiceCaller'
        - $ref: '#/components/parameters/OperatorContextId'
      responses:
        '200':
          description: Canonical Identity-owned administrative permission bundles.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [permissionBundles]
                properties:
                  permissionBundles:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeePermissionBundleDescriptor'
        '401':
          description: Invalid Workforce service token.
        '403':
          description: Caller or operator context is forbidden.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /internal/employees/provision:
    post:
      operationId: provisionAdministrativeEmployee
      tags: [internal-employees]
      security:
        - serviceToken: []
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/WorkforceServiceCaller'
        - $ref: '#/components/parameters/OperatorContextId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeProvisionRequest'
      responses:
        '201':
          description: New employee actor created with an Identity-owned permission bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorAdminView'
        '400':
          description: Invalid bundle, department, phone, or username.
        '401':
          description: Invalid Workforce service token.
        '403':
          description: Caller or operator context is forbidden.
        '409':
          description: Phone or username is already bound to an existing actor.
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    WorkforceServiceCaller:
      name: X-Service-Caller
      in: header
      required: true
      schema:
        const: workforce
    OperatorContextId:
      name: X-Operator-Context-ID
      in: header
      required: true
      description: Trusted runtime scope. The request body cannot select or override it.
      schema:
        type: string
        minLength: 1
  schemas:
    EmployeePermissionBundleCode:
      type: string
      enum:
        - staff
        - platform_owner
        - platform_coordinator
        - operations_manager
        - partners_manager
        - finance_manager
        - support_manager
        - hr_manager
    EmployeePermissionBundleDescriptor:
      type: object
      additionalProperties: false
      required:
        - code
        - nameAr
        - nameEn
        - allowedEmploymentClasses
        - departmentSelectionAllowed
      properties:
        code:
          $ref: '#/components/schemas/EmployeePermissionBundleCode'
        nameAr:
          type: string
          minLength: 1
        nameEn:
          type: string
          minLength: 1
        allowedEmploymentClasses:
          type: array
          minItems: 1
          items:
            type: string
        defaultDepartmentScope:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
        departmentSelectionAllowed:
          type: boolean
    EmployeeProvisionRequest:
      type: object
      additionalProperties: false
      required: [username, phoneE164, departmentScope]
      properties:
        username:
          type: string
          minLength: 1
        phoneE164:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        permissionBundle:
          $ref: '#/components/schemas/EmployeePermissionBundleCode'
        departmentScope:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{1,63}$'
