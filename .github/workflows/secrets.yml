name: Secrets Assurance

on:
  workflow_call:
    inputs:
      candidate_sha: {required: true, type: string}
      base_sha: {required: false, type: string, default: ""}
  workflow_dispatch:
    inputs:
      candidate_sha: {description: Exact candidate SHA, required: true, type: string}
      base_sha: {description: Optional base SHA, required: false, default: "", type: string}

permissions:
  contents: read

jobs:
  gitleaks:
    name: secrets-gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks
        run: bash tools/ci/install-assurance-tools.sh gitleaks
      - name: Scan reachable Git history
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -u
          source tools/ci/tool-versions.env
          report="${RUNNER_TEMP}/gitleaks.json"; started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; code=0
          gitleaks git --redact=100 --report-format json --report-path "${report}" . >/dev/null 2>&1 || code="${?}"
          if [[ ! -f "${report}" ]]; then
            echo "::error::Gitleaks did not produce the required JSON report"
            code=2; findings=0; status=TOOL_ERROR; reason="missing Gitleaks report"
            printf '[]\n' >"${RUNNER_TEMP}/gitleaks-missing-report-marker.json"; report="${RUNNER_TEMP}/gitleaks-missing-report-marker.json"
          else
            findings="$(jq 'length' "${report}" 2>/dev/null || echo 0)"
            status=PASS; reason=""; [[ "${code}" -eq 0 ]] || { status=FAIL; reason="Gitleaks detected secret material"; }
          fi
          echo "Gitleaks findings: ${findings}"
          node tools/ci/evidence.mjs --claim secrets.gitleaks --tool gitleaks --version "${GITLEAKS_VERSION}" --candidate "${CANDIDATE_SHA}" --base "${BASE_SHA}" --scope git-history --expected-scope git-history --status "${status}" --findings "${findings}" --started "${started}" --report "${report}" --format json --reason "${reason}"
          exit "${code}"
      - name: Upload Gitleaks evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-secrets-gitleaks-${{ github.run_id }}
          path: .ci-evidence/secrets.gitleaks.json
          if-no-files-found: error
          retention-days: 14
