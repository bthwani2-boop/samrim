name: Secrets Assurance

on:
  workflow_call:
    inputs:
      candidate_sha: {required: true, type: string}
      base_sha: {required: false, type: string, default: ""}
      full_history: {required: false, type: boolean, default: false}
  workflow_dispatch:
    inputs:
      candidate_sha: {description: Exact candidate SHA, required: true, type: string}
      base_sha: {description: Optional base SHA, required: false, default: "", type: string}
      full_history: {description: Scan complete reachable history, required: false, default: true, type: boolean}

permissions:
  contents: read

jobs:
  gitleaks:
    name: secrets-gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks
        run: bash tools/ci/install-assurance-tools.sh gitleaks
      - name: Scan required Git history scope
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          set -u
          source tools/ci/tool-versions.env
          report="${RUNNER_TEMP}/gitleaks.json"; started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; code=0
          scope="git-history"

          if [[ "${FULL_HISTORY}" == "true" || ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            git rev-list --all --count >/dev/null || { echo "::error::Unable to enumerate Git history"; exit 2; }
            gitleaks git --redact=100 --report-format json --report-path "${report}" . >/dev/null 2>&1 || code="${?}"
          else
            range="${BASE_SHA}..${CANDIDATE_SHA}"
            git rev-list --count "${range}" >/dev/null || { echo "::error::Unable to enumerate candidate range"; exit 2; }
            scope="git-range:${range}"
            gitleaks git --redact=100 --log-opts="${range}" --report-format json --report-path "${report}" . >/dev/null 2>&1 || code="${?}"
          fi

          status=PASS; reason=""; findings=0
          if [[ ! -f "${report}" ]] || ! jq -e . "${report}" >/dev/null 2>&1; then
            printf '[]\n' >"${report}"
            status=TOOL_ERROR; findings=1; reason="Gitleaks did not produce a valid JSON report"
          else
            findings="$(jq 'length' "${report}")"
            if [[ "${findings}" -gt 0 ]]; then status=FAIL; reason="Gitleaks detected secret material"
            elif [[ "${code}" -ne 0 ]]; then status=TOOL_ERROR; findings=1; reason="Gitleaks failed without findings"
            fi
          fi

          echo "Gitleaks scope: ${scope}; findings: ${findings}"
          node tools/ci/evidence.mjs --claim secrets.gitleaks --tool gitleaks --version "${GITLEAKS_VERSION}" --candidate "${CANDIDATE_SHA}" --base "${BASE_SHA}" --scope "${scope}" --expected-scope "${scope}" --status "${status}" --findings "${findings}" --started "${started}" --report "${report}" --format json --reason "${reason}"
          [[ "${status}" == "PASS" ]]
      - name: Upload Gitleaks evidence and raw report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-secrets-gitleaks-${{ github.run_id }}
          path: .ci-evidence
          if-no-files-found: error
          retention-days: 14
