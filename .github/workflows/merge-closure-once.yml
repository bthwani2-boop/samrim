name: Merge Closure Once

on:
  push:
    branches:
      - 4-sonar-code-closure
    paths:
      - tools/dev/_merge_closure_patch.py

permissions:
  contents: write

jobs:
  merge-closure:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4-sonar-code-closure
          fetch-depth: 0
      - name: Apply bounded repair
        run: |
          python3 tools/dev/_merge_closure_patch.py
          gofmt -w services/dsh/backend/internal/storage/postgres/store_publication.go
          node --check tools/dev/runtime-proof/resolve.mjs
          node --check tools/dev/verify-local-speed-contract.mjs
          git diff --check
      - name: Commit repaired tree
        run: |
          rm -f tools/dev/_merge_closure_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close runtime and Sonar quality blockers"
          git push origin HEAD:4-sonar-code-closure
