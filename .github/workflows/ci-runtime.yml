name: CI Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: repository-backend-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NX_NO_CLOUD: "true"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Decide runtime scope with Nx
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run=false
          browser=false
          for target in migration-proof runtime-proof schema-proof financial-invariants baseline-proof location-proof; do
            projects="$(pnpm exec nx show projects --affected --with-target="$target" --base="$NX_BASE" --head="$NX_HEAD" --sep=, --no-cloud)"
            if [[ -n "$projects" ]]; then
              echo "RUNTIME_TARGET $target -> $projects"
              run=true
            fi
          done
          browser_projects="$(pnpm exec nx show projects --affected --with-target=browser-live-proof --base="$NX_BASE" --head="$NX_HEAD" --sep=, --no-cloud)"
          if [[ -n "$browser_projects" ]]; then
            echo "RUNTIME_TARGET browser-live-proof -> $browser_projects"
            run=true
            browser=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "browser=$browser" >> "$GITHUB_OUTPUT"

      - name: Create isolated runtime environment
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = "infra/local/.env";
          const example = fs.readFileSync("infra/local/.env.example", "utf8");
          const names = [
            "SAMRIM_POSTGRES_PASSWORD",
            "IDENTITY_CHALLENGE_HMAC_SECRET",
            "IDENTITY_DSH_SERVICE_TOKEN",
            "CONTROL_PANEL_SERVICE_TOKEN",
            "WLT_DSH_SERVICE_TOKEN",
            "IDENTITY_ABUSE_HMAC_SECRET",
            "OPERATOR_BOOTSTRAP_SECRET"
          ];
          const values = new Map(names.map((name) => [name, crypto.randomBytes(32).toString("hex")]));
          values.set("DSH_DELIVERY_PROOF_KEYRING", JSON.stringify({ "local-v1": crypto.randomBytes(32).toString("base64") }));
          const output = example.split(/\r?\n/).map((line) => {
            const separator = line.indexOf("=");
            if (separator < 1) return line;
            const name = line.slice(0, separator).trim();
            return values.has(name) ? `${name}=${values.get(name)}` : line;
          }).join("\n");
          fs.writeFileSync(path, output.endsWith("\n") ? output : `${output}\n`, { mode: 0o600 });
          NODE

      - name: Start backend runtime
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: docker compose --project-name samrim-local --env-file infra/local/.env -f infra/local/compose/compose.yaml up -d --build --wait --wait-timeout 300 --remove-orphans postgres mailpit media identity dsh wlt

      - name: Run affected backend runtime proofs
        if: steps.scope.outputs.run == 'true' && github.event_name != 'schedule'
        env:
          CI: "true"
          BTHWANI_IDENTITY_PROOF_SCOPE: disposable-ci
        run: pnpm exec nx affected -t migration-proof,runtime-proof,schema-proof,financial-invariants,baseline-proof,location-proof --base=$NX_BASE --head=$NX_HEAD --outputStyle=stream --parallel=1 --nxBail=true

      - name: Run weekly backend runtime regression
        if: steps.scope.outputs.run == 'true' && github.event_name == 'schedule'
        env:
          CI: "true"
          BTHWANI_IDENTITY_PROOF_SCOPE: disposable-ci
        run: pnpm exec nx run-many -t migration-proof,runtime-proof,schema-proof,financial-invariants,baseline-proof,location-proof --all --outputStyle=stream --parallel=1 --skip-nx-cache

      - name: Install Chromium
        if: steps.scope.outputs.browser == 'true'
        run: pnpm --dir apps/control-panel exec playwright install --with-deps chromium

      - name: Start Control Panel
        if: steps.scope.outputs.browser == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/local/.env
          set +a
          export NODE_ENV=development NEXT_TELEMETRY_DISABLED=1
          pnpm --dir apps/control-panel exec next dev -H 127.0.0.1 -p "$SAMRIM_CONTROL_PORT" > "$RUNNER_TEMP/control-panel.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/control-panel.pid"
          for attempt in {1..120}; do
            if curl --fail --silent --output /dev/null "http://127.0.0.1:$SAMRIM_CONTROL_PORT/"; then exit 0; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/control-panel.log"
          exit 1

      - name: Run affected browser proof
        if: steps.scope.outputs.browser == 'true' && github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/local/.env
          set +a
          export PLAYWRIGHT_BASE_URL="$CONTROL_PANEL_PUBLIC_ORIGIN"
          export PLAYWRIGHT_IDENTITY_API_BASE_URL="$IDENTITY_API_BASE_URL"
          export PLAYWRIGHT_DSH_API_BASE_URL="$DSH_API_BASE_URL"
          export PLAYWRIGHT_MAILPIT_BASE_URL="http://127.0.0.1:$SAMRIM_MAILPIT_WEB_PORT"
          export PLAYWRIGHT_IDENTITY_BOOTSTRAP_TOKEN="$OPERATOR_BOOTSTRAP_SECRET"
          export PLAYWRIGHT_CONTROL_PANEL_SERVICE_TOKEN="$CONTROL_PANEL_SERVICE_TOKEN"
          pnpm exec nx affected -t browser-live-proof --base=$NX_BASE --head=$NX_HEAD --outputStyle=stream --parallel=1 --nxBail=true

      - name: Run weekly browser regression
        if: steps.scope.outputs.browser == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/local/.env
          set +a
          export PLAYWRIGHT_BASE_URL="$CONTROL_PANEL_PUBLIC_ORIGIN"
          export PLAYWRIGHT_IDENTITY_API_BASE_URL="$IDENTITY_API_BASE_URL"
          export PLAYWRIGHT_DSH_API_BASE_URL="$DSH_API_BASE_URL"
          export PLAYWRIGHT_MAILPIT_BASE_URL="http://127.0.0.1:$SAMRIM_MAILPIT_WEB_PORT"
          export PLAYWRIGHT_IDENTITY_BOOTSTRAP_TOKEN="$OPERATOR_BOOTSTRAP_SECRET"
          export PLAYWRIGHT_CONTROL_PANEL_SERVICE_TOKEN="$CONTROL_PANEL_SERVICE_TOKEN"
          pnpm exec nx run-many -t browser-live-proof --all --outputStyle=stream --parallel=1 --skip-nx-cache

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/control-panel.pid" ]]; then kill "$(cat "$RUNNER_TEMP/control-panel.pid")" 2>/dev/null || true; fi
          if [[ -f infra/local/.env ]]; then
            docker compose --project-name samrim-local --env-file infra/local/.env -f infra/local/compose/compose.yaml down --volumes --remove-orphans || true
            rm -f infra/local/.env
          fi
