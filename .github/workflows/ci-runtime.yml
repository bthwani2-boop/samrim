name: CI Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 2 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: repository-backend-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NX_NO_CLOUD: "true"
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: node tools/dev/verify-ci-exact-sha.mjs

      - name: Resolve canonical affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      - name: Verify exact affected candidate
        shell: bash
        env:
          REQUIRE_NX_HEAD: "true"
        run: node tools/dev/verify-ci-exact-sha.mjs

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace once
        shell: bash
        run: node tools/dev/run-ci-command.mjs runtime-install -- pnpm install --frozen-lockfile

      - name: Resolve runtime integration scope through Nx
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "CI_RUNTIME_SCOPE=FULL_REGRESSION head=$CANDIDATE_SHA"
            exit 0
          fi
          affected="$(pnpm exec nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --projects=repository-ci --sep=,)"
          if [[ -n "$affected" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "CI_RUNTIME_SCOPE=AFFECTED owner=$affected base=$NX_BASE head=$NX_HEAD"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "CI_RUNTIME_SCOPE=UNAFFECTED base=$NX_BASE head=$NX_HEAD"
          fi

      - name: Install Chromium runtime
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: node tools/dev/run-ci-command.mjs runtime-playwright-install -- pnpm --dir apps/control-panel exec playwright install --with-deps chromium

      - name: Materialize isolated CI runtime environment
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = "infra/local/.env";
          const example = fs.readFileSync("infra/local/.env.example", "utf8");
          const names = [
            "SAMRIM_POSTGRES_PASSWORD",
            "IDENTITY_CHALLENGE_HMAC_SECRET",
            "IDENTITY_DSH_SERVICE_TOKEN",
            "CONTROL_PANEL_SERVICE_TOKEN",
            "WLT_DSH_SERVICE_TOKEN",
            "IDENTITY_ABUSE_HMAC_SECRET",
            "OPERATOR_BOOTSTRAP_SECRET",
          ];
          const values = new Map(names.map((name) => [name, crypto.randomBytes(32).toString("hex")]));
          values.set("DSH_DELIVERY_PROOF_KEYRING", JSON.stringify({ "local-v1": crypto.randomBytes(32).toString("base64") }));
          const output = example.split(/\r?\n/).map((line) => {
            const separator = line.indexOf("=");
            if (separator < 1) return line;
            const name = line.slice(0, separator).trim();
            return values.has(name) ? `${name}=${values.get(name)}` : line;
          }).join("\n");
          fs.writeFileSync(path, output.endsWith("\n") ? output : `${output}\n`, { mode: 0o600 });
          NODE

      - name: Set up Buildx
        if: steps.scope.outputs.run == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Expose GitHub Actions runtime to BuildKit
        if: steps.scope.outputs.run == 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487

      - name: Build runtime images through Nx and BuildKit
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          CI: "true"
        run: node tools/dev/run-ci-command.mjs runtime-images -- pnpm exec nx run repository-ci:runtime-images --outputStyle=stream

      - name: Start exact backend services
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: node tools/dev/run-ci-command.mjs runtime-start -- docker compose --project-name samrim-local --env-file infra/local/.env -f infra/local/compose/compose.yaml up -d --no-build --wait --wait-timeout 300 postgres mailpit identity dsh wlt

      - name: Start Control Panel host
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/local/.env
          set +a
          export NODE_ENV=development NEXT_TELEMETRY_DISABLED=1 NEXT_PRIVATE_DISABLE_DEV_OVERLAY_UX=1
          pnpm --dir apps/control-panel exec next dev -H 127.0.0.1 -p "$SAMRIM_CONTROL_PORT" > "$RUNNER_TEMP/control-panel.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/control-panel.pid"
          for attempt in {1..120}; do
            if curl --fail --silent --output /dev/null "http://127.0.0.1:$SAMRIM_CONTROL_PORT/"; then exit 0; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/control-panel.log" || true
          exit 1

      - name: Run canonical runtime integration through Nx
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          CI: "true"
        run: node tools/dev/run-ci-command.mjs runtime-integration -- pnpm exec nx run repository-ci:runtime-integration --outputStyle=stream

      - name: Report WLT payout registry diagnostics
        if: failure() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          docker compose \
            --project-name samrim-local \
            --env-file infra/local/.env \
            -f infra/local/compose/compose.yaml \
            logs --no-color --since=5m wlt 2>&1 | grep -F "WLT_PAYOUT_ERROR" || true

      - name: Report DSH publication diagnostics
        if: failure() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f infra/local/.env ]]; then
            echo "No isolated runtime environment is available."
            exit 0
          fi
          if ! docker compose \
            --project-name samrim-local \
            --env-file infra/local/.env \
            -f infra/local/compose/compose.yaml \
            logs --no-color dsh 2>&1 | grep -E 'DSH_CATALOG_PRODUCT_|DSH_CATALOG_PROPOSAL_|store publication (persistence|internal) failure'; then
            echo "No classified DSH runtime diagnostics were emitted."
          fi

      - name: Verify backend proof is non-mutating
        if: always() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          [[ -z "${drift}" ]] || { printf '%s\n' "${drift}"; git diff -- . || true; exit 1; }

      - name: Capture runtime failure package
        id: failure_package
        if: failure()
        shell: bash
        run: node tools/dev/capture-ci-failure.mjs --kind=runtime

      - name: Upload runtime failure package
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-failure-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ steps.failure_package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Report runtime CI performance
        if: always()
        shell: bash
        run: node tools/dev/report-ci-performance.mjs

      - name: Stop Control Panel host
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/control-panel.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/control-panel.pid")" 2>/dev/null || true
          fi

      - name: Purge backend services
        if: always() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          if [[ -f infra/local/.env ]]; then
            docker compose \
              --project-name samrim-local \
              --env-file infra/local/.env \
              -f infra/local/compose/compose.yaml \
              down --volumes --remove-orphans
            cleanup_status=$?
            rm -f infra/local/.env
            echo "CI_RUNTIME_CLEANUP status=$cleanup_status"
          else
            echo "CI_RUNTIME_CLEANUP status=skipped-no-env"
          fi
          exit 0
