name: CI Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  policy:
    name: repository-pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: node tools/dev/verify-ci-exact-sha.mjs

      - name: Validate bounded promotion and Governance policy batch
        shell: bash
        env:
          GH_EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/dev/verify-pr-policy.mjs
