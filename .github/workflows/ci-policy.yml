name: CI Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: repository-pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Use GitHub ruleset as policy owner
        run: echo "PR policy is enforced by the active repository ruleset."
