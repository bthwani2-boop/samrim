name: Repository Pull Request Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  policy:
    name: repository-pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate concise promotion evidence
        shell: bash
        env:
          GH_EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [[ "${GH_EVENT}" == "push" ]]; then
            echo "PR_POLICY_MAIN_PUSH=PASS"
            exit 0
          fi

          [[ ${#PR_TITLE} -ge 8 ]] || { echo "::error::PR title is too short"; exit 1; }

          if [[ "${PR_DRAFT}" == "true" ]]; then
            echo "PR_POLICY_DRAFT=DEFERRED_UNTIL_READY"
            exit 0
          fi

          if [[ "${PR_AUTHOR}" == "dependabot[bot]" ]]; then
            [[ "${PR_HEAD}" == dependabot/* ]] || { echo "::error::Unexpected Dependabot branch"; exit 1; }
            echo "PR_POLICY_DEPENDABOT=PASS"
            exit 0
          fi

          [[ ${#PR_BODY} -ge 120 ]] || { echo "::error::PR body is too short to explain the change"; exit 1; }
          for heading in "## Summary" "## Scope" "## Verification" "## Remaining limits"; do
            grep -Fq -- "${heading}" <<<"${PR_BODY}" || { echo "::error::Missing PR section: ${heading}"; exit 1; }
          done

          echo "PR_POLICY=PASS"
