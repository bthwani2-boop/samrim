name: Repository Pull Request Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: repository-pr-policy-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  policy:
    name: repository-pr-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate promotion pull request evidence
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            [[ "${GITHUB_REF}" == "refs/heads/main" ]]
            echo "PR_POLICY_MAIN_PUSH=PASS"
            exit 0
          fi

          base="$(jq -r '.pull_request.base.ref' "${GITHUB_EVENT_PATH}")"
          head="$(jq -r '.pull_request.head.ref' "${GITHUB_EVENT_PATH}")"
          actor="$(jq -r '.sender.login // ""' "${GITHUB_EVENT_PATH}")"
          author="$(jq -r '.pull_request.user.login // ""' "${GITHUB_EVENT_PATH}")"
          draft="$(jq -r '.pull_request.draft // false' "${GITHUB_EVENT_PATH}")"
          title="$(jq -r '.pull_request.title // ""' "${GITHUB_EVENT_PATH}")"
          body="$(jq -r '.pull_request.body // ""' "${GITHUB_EVENT_PATH}")"

          [[ "${base}" == "main" ]] || { echo "::error::Canonical promotion target must be main"; exit 1; }
          (( ${#title} >= 8 )) || { echo "::error::PR title is too short"; exit 1; }

          if [[ "${draft}" == "true" ]]; then
            echo "PR_POLICY_DRAFT=DEFERRED_UNTIL_READY"
            exit 0
          fi

          if [[ "${author}" == "dependabot[bot]" || "${actor}" == "dependabot[bot]" ]]; then
            [[ "${author}" == "dependabot[bot]" ]] || { echo "::error::Dependabot machine policy requires Dependabot PR author"; exit 1; }
            [[ "${head}" == dependabot/* ]] || { echo "::error::Dependabot machine policy requires dependabot/* head branch"; exit 1; }
            (( ${#body} >= 120 )) || { echo "::error::Dependabot PR body is unexpectedly incomplete"; exit 1; }
            echo "PR_POLICY_DEPENDABOT_BOUNDED=PASS"
            exit 0
          fi

          (( ${#body} >= 240 )) || { echo "::error::PR body is too short for canonical promotion evidence"; exit 1; }

          required_headings=(
            '## Summary'
            '## Exact candidate and authorized objective'
            '## Affected cone and ownership'
            '## Diagnosis and decision'
            '## Migration / Cutover'
            '## Deployable identity / runtime'
            '## Dependencies / external references'
            '## Verification'
            '## Security / Secrets'
            '## Docs / knowledge'
            '## Negative space'
          )

          for heading in "${required_headings[@]}"; do
            grep -Fq -- "${heading}" <<<"${body}" || {
              echo "::error::PR body missing required section: ${heading}"
              exit 1
            }
          done

          echo "PR_POLICY_HUMAN_AGENT_EVIDENCE=PASS"
