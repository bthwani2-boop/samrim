name: Repository Policy

on:
  workflow_call:
    inputs:
      candidate_sha: {required: true, type: string}
      base_sha: {required: false, type: string, default: ""}
  workflow_dispatch:
    inputs:
      candidate_sha: {description: Exact candidate SHA, required: true, type: string}
      base_sha: {description: Optional base SHA, required: false, default: "", type: string}

permissions:
  contents: read

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce durable repository policy
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -u
          report="${RUNNER_TEMP}/repository-policy.txt"
          : >"${report}"
          code=0
          for required in README.md SECURITY.md CONTRIBUTING.md governance docs tools/prompting/bthwani-orchestrator/00-ORCHESTRATOR.md; do
            [[ -e "${required}" ]] || { echo "missing required path: ${required}" >>"${report}"; code=1; }
          done
          for forbidden_root in core shared; do
            [[ ! -e "${forbidden_root}" ]] || { echo "forbidden top-level ownership class: ${forbidden_root}" >>"${report}"; code=1; }
          done
          if [[ -d apps ]] && find apps -mindepth 2 -maxdepth 2 -type d -name runtime -print -quit | grep -q .; then
            echo "forbidden pass-through apps/*/runtime topology" >>"${report}"; code=1
          fi
          bad_names="$(git ls-files | grep -E -i -- '(^|/)(credentials\.json|google-services\.json|GoogleService-Info\.plist)$|\.(jks|keystore|p12|p8|pem|key)$|(^|/)\.env($|\.)' | grep -E -v -- '(^|/)\.env\.example$' || true)"
          [[ -z "${bad_names}" ]] || { printf 'forbidden secret-bearing file class:\n%s\n' "${bad_names}" >>"${report}"; code=1; }
          if grep -R -n -E --exclude=repository-policy.yml --exclude=baseline-guard.yml -- '^[[:space:]]*pull_request_target:' .github/workflows >>"${report}" 2>&1; then
            echo "pull_request_target is forbidden" >>"${report}"; code=1
          fi
          if grep -R -n -E --exclude=repository-policy.yml --exclude=baseline-guard.yml -- '^[[:space:]]*permissions:[[:space:]]*write-all' .github/workflows >>"${report}" 2>&1; then
            echo "write-all workflow permissions are forbidden" >>"${report}"; code=1
          fi
          donor='bthwani2-boop/bthwani-suite-next|D:\\bthwani-suite-next|C:\\bthwani-secrets|origin/h|RE_PIN_h|UNKNOWN_CURRENT_h_HEAD|H_TRUSTWORTHY_CANONICAL_BASELINE_REFOUNDATION_COMPLETE'
          if git grep -n -I -E -- "${donor}" -- . ':(exclude).github/workflows/repository-policy.yml' ':(exclude).github/workflows/baseline-guard.yml' >>"${report}" 2>&1; then
            echo "donor/campaign-specific authority residue found" >>"${report}"; code=1
          fi
          if [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            git diff --check "${BASE_SHA}" "${CANDIDATE_SHA}" >>"${report}" 2>&1 || code=1
          else
            git show --check --format= "${CANDIDATE_SHA}" >>"${report}" 2>&1 || code=1
          fi
          [[ -s "${report}" ]] || echo "repository policy checks passed" >"${report}"
          cat "${report}"
          status=PASS; reason=""
          [[ "${code}" -eq 0 ]] || { status=FAIL; reason="repository policy violation"; }
          node tools/ci/evidence.mjs --claim repository.policy --tool samrim-repository-policy --version 1 --candidate "${CANDIDATE_SHA}" --base "${BASE_SHA}" --scope repository --expected-scope repository --status "${status}" --findings "${code}" --report "${report}" --format text --reason "${reason}"
          exit "${code}"
      - name: Upload repository policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-repository-policy-${{ github.run_id }}
          path: .ci-evidence/repository.policy.json
          if-no-files-found: error
          retention-days: 14
