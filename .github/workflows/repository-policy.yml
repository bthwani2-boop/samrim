name: Repository Policy

on:
  workflow_call:
    inputs:
      candidate_sha: {required: true, type: string}
      base_sha: {required: false, type: string, default: ""}

permissions:
  contents: read

jobs:
  repository-policy:
    name: repository-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Enforce durable repository policy
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -u
          report="${RUNNER_TEMP}/repository-policy.txt"
          : >"${report}"
          findings=0
          violation() { echo "$*" >>"${report}"; findings=$((findings + 1)); }

          [[ "$(git rev-parse HEAD)" == "${CANDIDATE_SHA}" ]] || violation "exact candidate checkout failed"

          for required in README.md SECURITY.md CONTRIBUTING.md governance docs tools/prompting/bthwani-orchestrator/00-ORCHESTRATOR.md; do
            [[ -e "${required}" ]] || violation "missing required path: ${required}"
          done

          for forbidden_root in core shared; do
            [[ ! -e "${forbidden_root}" ]] || violation "forbidden top-level ownership class: ${forbidden_root}"
          done

          if [[ -d apps ]] && find apps -mindepth 2 -maxdepth 2 -type d -name runtime -print -quit | grep -q .; then
            violation "forbidden pass-through apps/*/runtime topology"
          fi

          bad_names="$(git ls-files | grep -E -i -- '(^|/)(credentials\.json|google-services\.json|GoogleService-Info\.plist)$|\.(jks|keystore|p12|p8|pem|key)$|(^|/)\.env($|\.)' | grep -E -v -- '(^|/)\.env\.example$' || true)"
          if [[ -n "${bad_names}" ]]; then
            printf 'forbidden secret-bearing file class:\n%s\n' "${bad_names}" >>"${report}"
            findings=$((findings + $(printf '%s\n' "${bad_names}" | grep -c .)))
          fi

          diff_report="${RUNNER_TEMP}/diff-check.txt"
          : >"${diff_report}"
          if [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            git diff --check "${BASE_SHA}" "${CANDIDATE_SHA}" >"${diff_report}" 2>&1 || true
          else
            git show --check --format= "${CANDIDATE_SHA}" >"${diff_report}" 2>&1 || true
          fi
          if [[ -s "${diff_report}" ]]; then
            cat "${diff_report}" >>"${report}"
            findings=$((findings + $(grep -c . "${diff_report}")))
          fi

          status=PASS; reason=""
          if [[ "${findings}" -gt 0 ]]; then status=FAIL; reason="repository policy violation"; fi
          [[ -s "${report}" ]] || echo "repository policy checks passed" >"${report}"
          cat "${report}"

          node tools/ci/evidence.mjs --claim repository.policy --tool samrim-repository-policy --version 1 --candidate "${CANDIDATE_SHA}" --base "${BASE_SHA}" --scope repository --expected-scope repository --status "${status}" --findings "${findings}" --report "${report}" --format text --reason "${reason}"
          [[ "${status}" == "PASS" ]]

      - name: Upload repository policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-repository-policy-${{ github.run_id }}
          path: .ci-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
