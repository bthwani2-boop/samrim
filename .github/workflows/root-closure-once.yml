name: Root Closure Once

on:
  push:
    branches:
      - 4-sonar-code-closure

permissions:
  contents: write
  actions: write

jobs:
  root-closure:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4-sonar-code-closure
          fetch-depth: 0
      - name: Apply root closure
        run: |
          python3 tools/dev/_root_closure_patch.py
          gofmt -w services/dsh/backend/internal/storage/postgres/catalog_refoundation_test.go services/dsh/backend/internal/storage/postgres/store_fulfillment_modes_test.go
          git diff --check
      - name: Commit closure without temporary residue
        run: |
          rm -f tools/dev/_root_closure_patch.py .github/workflows/root-closure-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: close current contract and persistence proof gaps"
          git push origin HEAD:4-sonar-code-closure
