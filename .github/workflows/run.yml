name: Manual Assurance

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base SHA
        required: false
        default: ""
        type: string
      mode:
        description: Verification mode; manual runs never satisfy promotion-closure
        required: true
        default: technical-full
        type: choice
        options: [technical-full, repository-policy, workflow-integrity, secrets]

permissions:
  contents: read

jobs:
  validate:
    name: manual-request
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.validate.outputs.base_sha }}
      mode: ${{ steps.validate.outputs.mode }}
    steps:
      - id: validate
        shell: bash
        env:
          SELECTED_REF: ${{ github.ref }}
          BASE: ${{ inputs.base_sha }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ -z "${BASE}" || "${BASE}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::base_sha must be empty or exact SHA"; exit 1; }
          {
            echo "base_sha=${BASE}"
            echo "mode=${MODE}"
          } >>"${GITHUB_OUTPUT}"
          echo "### Manual assurance" >>"${GITHUB_STEP_SUMMARY}"
          echo "This workflow is diagnostic/technical assurance and cannot satisfy the canonical promotion-closure check." >>"${GITHUB_STEP_SUMMARY}"

  repository:
    if: needs.validate.outputs.mode == 'technical-full' || needs.validate.outputs.mode == 'repository-policy'
    needs: validate
    uses: ./.github/workflows/repository-policy.yml

  workflow-integrity:
    if: needs.validate.outputs.mode == 'technical-full' || needs.validate.outputs.mode == 'workflow-integrity'
    needs: validate
    uses: ./.github/workflows/workflow-integrity.yml

  secrets:
    if: needs.validate.outputs.mode == 'technical-full' || needs.validate.outputs.mode == 'secrets'
    needs: validate
    uses: ./.github/workflows/secrets.yml
    with:
      full_history: true

  manual-assurance:
    name: manual-assurance
    if: always()
    needs: [validate, repository, workflow-integrity, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce selected technical mode
        shell: bash
        env:
          MODE: ${{ needs.validate.outputs.mode }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e '.validate.result == "success"' <<<"${NEEDS_JSON}" >/dev/null
          case "${MODE}" in
            technical-full) jq -e '.repository.result == "success" and .["workflow-integrity"].result == "success" and .secrets.result == "success"' <<<"${NEEDS_JSON}" >/dev/null ;;
            repository-policy) jq -e '.repository.result == "success"' <<<"${NEEDS_JSON}" >/dev/null ;;
            workflow-integrity) jq -e '.["workflow-integrity"].result == "success"' <<<"${NEEDS_JSON}" >/dev/null ;;
            secrets) jq -e '.secrets.result == "success"' <<<"${NEEDS_JSON}" >/dev/null ;;
            *) echo "::error::Unknown mode: ${MODE}"; exit 1 ;;
          esac
