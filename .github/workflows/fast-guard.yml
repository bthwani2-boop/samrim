name: Fast Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fast-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: fast-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
      NX_NO_CLOUD: "true"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scope changed files and check patch integrity
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          base="${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git diff --check "$base" "$CANDIDATE_SHA"
          git diff --name-only "$base" "$CANDIDATE_SHA" > "$RUNNER_TEMP/changed-files"
          cat "$RUNNER_TEMP/changed-files"
          changed() { grep -Eq "$1" "$RUNNER_TEMP/changed-files"; }
          if changed '^(services/dsh/backend/|services/identity/clients/go/|go\.work(\.sum)?$)'; then echo 'dsh=true' >> "$GITHUB_OUTPUT"; fi
          if changed '^(services/wlt/backend/|go\.work(\.sum)?$)'; then echo 'wlt=true' >> "$GITHUB_OUTPUT"; fi
          if changed '^(services/identity/backend/|services/identity/clients/go/|go\.work(\.sum)?$)'; then echo 'identity=true' >> "$GITHUB_OUTPUT"; fi
          if changed '^(\.github/workflows/fast-guard\.yml$|services/(dsh|wlt)/backend/.*(captain|dispatch|assignment|delivery|payment|financial|wallet|order|checkout|settlement|promotion|payout|compensation|postgres)|services/(dsh|wlt)/database/)'; then echo 'finance=true' >> "$GITHUB_OUTPUT"; fi
          if changed '^(apps/|packages/|services/(dsh|identity)/((clients|tools)/|project\.json$)|services/wlt/((clients|tools)/|project\.json$)|tools/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|nx\.json$|tsconfig\.base\.json$|biome\.json$)'; then echo 'node=true' >> "$GITHUB_OUTPUT"; fi

      - name: Reject committed secrets
        run: node tools/security/verify-secrets.mjs

      - name: Set up Go only for affected services
        if: steps.changed.outputs.dsh == 'true' || steps.changed.outputs.wlt == 'true' || steps.changed.outputs.identity == 'true' || steps.changed.outputs.node == 'true' || steps.changed.outputs.finance == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: |
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum
            services/identity/backend/go.sum

      - name: Check DSH checkout and financial handoffs
        if: steps.changed.outputs.dsh == 'true'
        working-directory: services/dsh/backend
        run: go test ./... -count=1

      - name: Check wallet invariants and payment replay
        if: steps.changed.outputs.wlt == 'true'
        working-directory: services/wlt/backend
        run: go test ./... -count=1

      - name: Check Identity sessions and authorization
        if: steps.changed.outputs.identity == 'true'
        working-directory: services/identity/backend
        run: go test ./... -count=1

      - name: Verify affected financial paths against disposable PostgreSQL
        if: steps.changed.outputs.finance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          container="bthwani-fast-guard-postgres"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          password="$(openssl rand -hex 16)"
          docker run -d --rm --name "$container" -e "POSTGRES_PASSWORD=$password" -e POSTGRES_DB=wlt_proof -p 127.0.0.1:19432:5432 postgis/postgis:16-3.4-alpine
          ready=false
          for i in $(seq 1 50); do
            if docker exec "$container" pg_isready -h 127.0.0.1 -p 5432 -U postgres -d wlt_proof >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE dsh_proof;"
          export BTHWANI_EXPECTED_DATABASE_HOST=127.0.0.1
          export BTHWANI_EXPECTED_DATABASE_PORT=19432
          export BTHWANI_EXPECTED_DATABASE_USER=postgres
          export BTHWANI_EXPECTED_DATABASE_NAME=wlt_proof
          export WLT_TEST_DATABASE_URL="postgres://postgres:$password@127.0.0.1:19432/wlt_proof?sslmode=disable"
          (cd services/wlt/backend && go test ./internal/storage/postgres -run "TestFundedPromotionPaymentPersistedReplayHasOneFrozenSplit|TestFundedStoreCashCollectionPostsPlatformSubsidyExactlyOnce" -count=1 -timeout 7m)
          unset WLT_TEST_DATABASE_URL
          export BTHWANI_EXPECTED_DATABASE_NAME=dsh_proof
          export DSH_DATABASE_URL="postgres://postgres:$password@127.0.0.1:19432/dsh_proof?sslmode=disable"
          # DSH migrations are applied only inside child databases created by
          # the existing integration tests; never touch the persistent local DB.
          export BTHWANI_ENV=test
          export BTHWANI_FINANCIAL_PROOF_ISOLATED=1
          export DSH_FINANCIAL_HANDOFF_TEST_DATABASE_URL="$DSH_DATABASE_URL"
          (cd services/dsh/backend && go test ./internal/storage/postgres -run '^(TestPartnerFinanceAndPayoutStoreAuthorityBoundary|TestCaptainParallelDispatchThreeOnlyOneWins|TestFinancialHandoffUnknownOutcomeAndConcurrentWorkers|TestMultiStoreCheckoutPersistsPartialOutcomesAndCancelReplay)$' -count=1 -timeout 9m)
          unset DSH_FINANCIAL_HANDOFF_TEST_DATABASE_URL
          # Existing end-to-end adapter proof needs two pristine databases and
          # the real WLT HTTP handler. Never point it at the durable local world.
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE wlt_a04_realfunding;"
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE dsh_a04_realfunding;"
          export BTHWANI_ENV=test
          export BTHWANI_FINANCIAL_PROOF_ISOLATED=1
          export BTHWANI_EXPECTED_DATABASE_NAME=wlt_a04_realfunding
          export WLT_TEST_DATABASE_URL="postgres://postgres:$password@127.0.0.1:19432/wlt_a04_realfunding?sslmode=disable"
          export DSH_FINANCIAL_HANDOFF_TEST_DATABASE_URL="postgres://postgres:$password@127.0.0.1:19432/dsh_a04_realfunding?sslmode=disable"
          (cd services/wlt/backend && go test ./cmd/api -run '^TestIsolatedDSHToRealWLTStorePickupMixedPayment$' -count=1 -v -timeout 7m)

      - name: Set up pnpm
        if: steps.changed.outputs.node == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node
        if: steps.changed.outputs.node == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.17.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace only for affected JS or TS code
        if: steps.changed.outputs.node == 'true'
        run: pnpm install --frozen-lockfile

      - name: Protect checkout, finance, access, and user-facing handoffs
        if: steps.changed.outputs.node == 'true'
        run: >-
          node --test
          apps/app-captain/src/features/captain-operations/captain-no-live-tracking.test.mjs
          apps/app-captain/src/features/captain-operations/captain-presence-policy.test.mjs
          apps/app-captain/src/features/captain-operations/captain-session-scope.test.mjs
          apps/app-captain/src/features/captain-operations/captain-task-eligibility.test.mjs
          apps/app-client/src/features/location-core/address-pagination.test.mjs
          apps/app-client/src/features/orders/order-session-scope.test.mjs
          apps/app-client/tests/cart-checkout-single-flight.test.mjs
          apps/app-client/tests/discovery-click-attribution.test.mjs
          apps/app-client/tests/multi-store-quote-consent.test.mjs
          apps/app-client/tests/store-discovery-marketing-slots.test.mjs
          apps/app-client/tests/store-promotion-handoff.test.mjs
          apps/app-partner/src/features/order-management/order-page-records.test.mjs
          apps/app-partner/src/features/partner-onboarding/store-access-canonical-readback.test.mjs
          apps/control-panel/src/features/notifications/notification-operation-link.test.mjs
          apps/control-panel/src/features/notifications/notification-readback.test.mjs
          apps/control-panel/src/features/operations/operational-age.test.mjs
          apps/control-panel/src/server/field/scoped-page.test.mjs
          apps/control-panel/tests/marketing-budget-route.test.mjs

      - name: Lint and typecheck affected projects
        if: steps.changed.outputs.node == 'true'
        shell: bash
        run: pnpm exec nx affected -t lint,typecheck,contract --base="${{ steps.changed.outputs.base }}" --head="$CANDIDATE_SHA" --parallel=3 --nxBail=true --outputStyle=static
