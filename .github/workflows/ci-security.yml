name: CI Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: repository-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
      GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
      GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
      GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
      GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/identity/backend/go.sum
            services/identity/clients/go/go.mod
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52
        with:
          languages: javascript-typescript,go

      - name: Verify current candidate and introduced history
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/dev/verify-secret-safety.mjs

      - name: Autobuild CodeQL languages
        uses: github/codeql-action/autobuild@1190a975f95ce23525efb6a3fc21ea29567c1b52

      - name: Analyze CodeQL database
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52
