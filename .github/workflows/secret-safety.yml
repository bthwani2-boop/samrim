name: Repository Secret Safety

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: repository-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact push/PR-head candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Attribute exact security proof target
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            expected="${PR_HEAD_SHA}"
            target="PR_HEAD"
          else
            expected="${GITHUB_SHA}"
            target="PUSH_HEAD"
          fi
          [[ "${observed}" == "${expected}" ]] || { echo "::error::Security proof target mismatch: observed=${observed} expected=${expected}"; exit 1; }
          echo "PROOF_TARGET=${target}"
          echo "PROOF_SHA=${observed}"

      - name: Reject forbidden secret artifacts and high-confidence markers
        shell: bash
        run: |
          set -euo pipefail

          bad_names="$(git ls-files | grep -E -i -- '(^|/)(credentials\.json|google-services\.json|GoogleService-Info\.plist)$|\.(jks|keystore|p12|p8|pem|key)$|(^|/)\.env($|\.)' | grep -E -v -- '(^|/)\.env\.example$' || true)"
          if [[ -n "${bad_names}" ]]; then
            printf '%s\n' "${bad_names}"
            echo "::error::Forbidden secret-bearing artifact name is tracked"
            exit 1
          fi

          markers='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|"private_key"[[:space:]]*:|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}'
          if git grep -n -I -E -- "${markers}" -- . ':(exclude).github/workflows/secret-safety.yml'; then
            echo "::error::High-confidence secret/private-key marker found"
            exit 1
          fi

          history_matches="$(mktemp)"
          trap 'rm -f "${history_matches}"' EXIT
          while IFS= read -r commit; do
            git grep -n -I -E -- "${markers}" "${commit}" -- . ':(exclude).github/workflows/secret-safety.yml' >>"${history_matches}" || true
          done < <(git rev-list --all)

          if [[ -s "${history_matches}" ]]; then
            cat "${history_matches}"
            echo "::error::High-confidence secret/private-key marker found in repository history"
            exit 1
          fi
