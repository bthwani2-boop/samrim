name: Repository Secret Safety

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: repository-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reject forbidden secret artifacts and high-confidence markers
        shell: bash
        run: |
          set -euo pipefail

          bad_names="$(git ls-files | grep -E -i -- '(^|/)(credentials\.json|google-services\.json|GoogleService-Info\.plist)$|\.(jks|keystore|p12|p8|pem|key)$|(^|/)\.env($|\.)' | grep -E -v -- '(^|/)\.env\.example$' || true)"
          if [[ -n "${bad_names}" ]]; then
            printf '%s\n' "${bad_names}"
            echo "::error::Forbidden secret-bearing artifact name is tracked"
            exit 1
          fi

          markers='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|"private_key"[[:space:]]*:|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}'
          if git grep -n -I -E -- "${markers}" -- . ':(exclude).github/workflows/secret-safety.yml'; then
            echo "::error::High-confidence secret/private-key marker found"
            exit 1
          fi
