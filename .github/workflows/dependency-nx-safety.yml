name: Dependency and Nx Safety

# Free standard runner: no Nx Cloud credits, agents, or paid services.
# Scheduled checks begin only when this workflow exists on the default branch.
on:
  workflow_dispatch:
  # Every current and future development branch is eligible.
  # Archived donor refs stay read-only, outside development CI.
  push:
    branches:
      - '**'
      - '!archive/**'
      - '!41'
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/picomatch@*.patch'
      - 'tools/security/picomatch-redos.test.mjs'
      - 'nx.json'
      - '**/project.json'
      - 'services/**/contracts/**'
      - 'services/**/database/migrations/**'
      - 'tools/dev/verify-nx-project-graph.test.mjs'
      - 'tools/mobile/verify-application-boundaries.mjs'
      - 'tools/mobile/verify-application-boundaries.test.mjs'
      - '.github/workflows/dependency-nx-safety.yml'
  schedule:
    - cron: '17 3 * * 1'
  # Main is the protected integration target; branch names are never pinned.
  pull_request:
    branches:
      - main
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/picomatch@*.patch'
      - 'tools/security/picomatch-redos.test.mjs'
      - 'nx.json'
      - '**/project.json'
      - 'services/**/contracts/**'
      - 'services/**/database/migrations/**'
      - 'tools/dev/verify-nx-project-graph.test.mjs'
      - 'tools/mobile/verify-application-boundaries.mjs'
      - 'tools/mobile/verify-application-boundaries.test.mjs'
      - '.github/workflows/dependency-nx-safety.yml'

permissions:
  contents: read

concurrency:
  group: dependency-nx-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency_and_boundaries:
    name: Dependency audit and Nx graph (high+)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      CI: 'true'
    steps:
      - name: Checkout exact candidate and comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned workspace without lifecycle scripts
        id: workspace
        run: |
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify picomatch backports in installed consumers
        run: node --test tools/security/picomatch-redos.test.mjs
      - name: Audit all JavaScript dependencies (high and critical fail)
        run: pnpm audit --audit-level high
      # Audit remains fail-closed; unaffected graph checks still provide evidence.
      - name: Verify Nx dependency graph builds
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          pnpm exec nx show projects
          pnpm exec nx graph --print > "$RUNNER_TEMP/nx-project-graph.json"
      - name: Prove actual Nx contract, Go, design and renderer impact edges
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: node --test tools/dev/verify-nx-project-graph.test.mjs
      - name: Enforce existing application and service import boundaries
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        run: |
          node --test tools/mobile/verify-application-boundaries.test.mjs
          node tools/mobile/verify-application-boundaries.mjs
      - name: Report affected projects for pull requests
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          NX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec nx show projects --affected --base="$NX_BASE_SHA" --head=HEAD
