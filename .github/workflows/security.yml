name: Security

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - &checkout
        name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm --version
      - name: Audit locked dependencies
        run: pnpm audit --audit-level high

  go:
    name: Go Vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - *checkout
      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Scan all Go service owners
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/govulncheck.XXXXXX")"
          trap 'rm -rf -- "$scanner_dir"' EXIT
          GOBIN="$scanner_dir" GOSUMDB=sum.golang.org go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c
          scanner="$scanner_dir/govulncheck"
          go version -m "$scanner"
          result=0
          for service in identity dsh wlt; do
            echo "::group::Go vulnerabilities: $service"
            if (cd "services/$service/backend" && "$scanner" ./...); then
              echo 'Scan passed'
            else
              status=$?
              printf '::error::Go vulnerability scan failed for %s (exit %s)\n' "$service" "$status"
              result=1
            fi
            echo '::endgroup::'
          done
          exit "$result"

  dependency_review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - name: Review introduced dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
