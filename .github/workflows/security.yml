name: Security

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout locked dependency graph
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm --version
      # Native pnpm audits the complete lockfile without installing it.
      - name: Audit all locked JavaScript dependencies (high and critical fail)
        run: pnpm audit --audit-level high

  go:
    name: Go Vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use pinned Go (source-compatible action)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Scan deployed Go owner source for reachable vulnerabilities
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/govulncheck.XXXXXX")"
          trap 'rm -rf -- "$scanner_dir"' EXIT
          GOBIN="$scanner_dir" GOSUMDB=sum.golang.org go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c
          scanner="$scanner_dir/govulncheck"
          go version -m "$scanner"
          for service in identity dsh wlt; do
            echo "Scanning Go owner: $service (CGO_ENABLED=0)"
            (cd "services/$service/backend" && "$scanner" ./...)
          done
