name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Validation
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'archive/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - &checkout
        name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - &node
        name: Set up pinned Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check required Node and working tree
        run: |
          node --version
          node tools/dev/verify-workspace.mjs
          node tools/security/verify-secrets.mjs
          git status --short
          test -z "$(git status --porcelain)"
      - name: Validate GitHub Actions definitions with checksum-pinned Actionlint
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          trap 'rm -rf -- "$dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir" actionlint
          "$dir/actionlint" -version
          "$dir/actionlint" -color=false

  quality:
    name: TypeScript Quality & Contracts
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *node
      - &pnpm
        name: Activate pinned pnpm
        id: pnpm-store
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm --version
          printf 'path=%s\n' "$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - &store
        name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**') }}
      - &install
        name: Install locked dependencies
        id: dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate OpenAPI contracts and generated clients
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm check:contracts
      - name: Reject orphaned source files
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm knip:files
      - name: Validate design
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm check:design
      - name: Validate application configuration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm check:apps:source
      - name: Check source quality
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm check:lint --diagnostic-level=warn --max-diagnostics=none
      - name: Typecheck all workspace projects
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: pnpm -r --no-bail --if-present run typecheck

  typescript_tests:
    name: TypeScript Tests
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - *pnpm
      - *store
      - *install
      - name: Run source tests and measure coverage
        run: pnpm check:coverage
      - name: Attest JavaScript coverage to the exact committed candidate
        run: node tools/dev/ci-coverage-evidence.mjs publish js
      - name: Publish measured JavaScript coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-js
          path: |
            coverage/lcov.info
            coverage/tree.txt
            coverage/reports.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  application_build:
    name: Application Build
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - *pnpm
      - *store
      - *install
      - name: Export Expo Web presentation hosts (SSR artifacts only)
        run: |
          pnpm --dir apps/customer exec expo export --platform web
          pnpm --dir apps/merchant exec expo export --platform web
      - name: Smoke-test approved Customer/Merchant Expo Web SSR on loopback
        run: node tools/mobile/verify-expo-web-http.mjs
      - name: Export Customer/Merchant Android JavaScript (NOT a native binary)
        run: |
          pnpm --dir apps/customer exec expo export --platform android
          pnpm --dir apps/merchant exec expo export --platform android
      - name: Export Captain Android JavaScript (NOT a native binary)
        run: pnpm --dir apps/captain exec expo export --platform android
      - name: Build the pinned Next.js Operator presentation host
        run: pnpm --dir apps/control-panel build
      - name: Smoke-test production Operator SSR, RTL and headers on loopback
        run: |
          node tools/dev/verify-operator-http.mjs
      - name: Execute discovered production Operator runtime suite
        run: node tools/dev/run-coverage.mjs --operator-runtime

  backend:
    name: Go Quality & Tests
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      CGO_ENABLED: '1'
      CC: gcc
    steps:
      - *checkout
      - *node
      - &go
        name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Verify Linux C toolchain for the race detector
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(go env CGO_ENABLED)" != '1' ]]; then
            echo 'Race detector requires CGO_ENABLED=1' >&2
            exit 1
          fi
          if ! command -v "$CC" >/dev/null 2>&1; then
            echo "Race detector requires the configured C compiler: $CC" >&2
            exit 1
          fi
          "$CC" --version
      - name: Verify real Go modules with race detector and measured coverage
        run: node tools/dev/check-go.mjs --ci --sonar-report
      - name: Attest Go coverage to the exact committed candidate
        run: node tools/dev/ci-coverage-evidence.mjs publish go
      - name: Publish measured Go coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-go
          path: |
            coverage/identity-go.out
            coverage/dsh-go.out
            coverage/wlt-go.out
            coverage/tree.txt
            coverage/reports.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  postgres:
    name: PostgreSQL Integration
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - *checkout
      - *node
      - *go
      - name: Validate expected owner test names and reject incomplete passing output
        shell: bash
        run: bash tests/infra/test-owner-postgres-output.sh
      - name: Run isolated, network-disabled owner PostgreSQL tests
        shell: bash
        run: bash tests/infra/verify-owner-postgres-ci.sh --coverage
      - name: Attest complete PostgreSQL coverage to the exact committed candidate
        run: node tools/dev/ci-coverage-evidence.mjs publish postgres
      - name: Publish measured PostgreSQL coverage and complete profile inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-postgres
          path: |
            coverage/owner-postgres/*.out
            coverage/owner-postgres/tree.txt
            coverage/owner-postgres/reports.sha256
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Verify fresh Identity, DSH and WLT baselines, restore and least-privilege access
        shell: pwsh
        run: ./tests/infra/verify-isolated-postgres.ps1 -DockerContext default
      - name: Exercise synthetic payment provider in disposable Docker
        shell: bash
        run: bash tests/infra/payment-mock/smoke.sh

  containers:
    name: Container Build & Security
    needs: workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - *checkout
      - *go
      - name: Build and inspect isolated service images
        shell: bash
        run: |
          set -euo pipefail
          expected_go="$(cat .go-version)"
          for service in identity dsh wlt; do
            image="bthwani-go-check-$service:$GITHUB_SHA"
            docker build --file "services/$service/backend/Dockerfile" \
              --build-arg "SAMRIM_SOURCE_REVISION=$GITHUB_SHA" \
              --tag "$image" "services/$service"
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            [[ "$user" == "65532:65532" ]] || { echo "Unsafe container user: $service" >&2; exit 1; }
            revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            [[ "$revision" == "$GITHUB_SHA" ]] || { echo "Missing source provenance: $service" >&2; exit 1; }
            # DSH alone currently needs SQL for its explicit bootstrap command.
            if [[ "$service" == "dsh" ]]; then
              docker run --rm --network none --read-only --entrypoint /bin/sh "$image" -ec 'test -d /app/database/schema'
            else
              docker run --rm --network none --read-only --entrypoint /bin/sh "$image" -ec 'test ! -e /app/database/schema'
            fi
            binary="$(mktemp)"
            container="$(docker create --network none "$image")"
            docker cp "$container:/usr/local/bin/$service" "$binary"
            docker rm "$container" >/dev/null
            [[ "$(go version "$binary")" == "$binary: go$expected_go" ]]
            rm -f "$binary"
          done
      - name: Scan the built container images for high and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d "$RUNNER_TEMP/trivy.XXXXXX")"
          trap 'rm -rf -- "$dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            --output "$dir/trivy.tar.gz"
          printf '%s  %s\n' 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf' \
            "$dir/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/trivy.tar.gz" -C "$dir" trivy
          "$dir/trivy" --version
          result=0
          for service in identity dsh wlt; do
            "$dir/trivy" image --image-src docker --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress \
              "bthwani-go-check-$service:$GITHUB_SHA" || result=1
          done
          exit "$result"

  windows:
    name: Windows Tooling
    needs: workspace
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - *checkout
      - *node
      - name: Require PowerShell 7 and resolve locked dependency store
        id: pnpm-store
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'PowerShell 7 required' }
          $PSVersionTable.PSVersion.ToString()
          corepack enable pnpm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $store = pnpm store path --silent
          if ($LASTEXITCODE -ne 0 -or !$store) { throw 'Package store unavailable' }
          "path=$store" >> $env:GITHUB_OUTPUT
      - *store
      - *install
      - name: Run native Windows behavior through the existing Node runner
        run: node tools/dev/run-coverage.mjs --windows-platform

  security:
    needs: workspace
    uses: ./.github/workflows/security.yml

  sonar:
    # Retain the exact required GitHub Actions check name.
    name: SonarQube Cloud Quality Gate
    needs: [typescript_tests, backend, postgres]
    if: ${{ success() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR source and base history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download JavaScript coverage from this CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-js
          path: ${{ runner.temp }}/sonar-js
      - name: Download Go coverage from this CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-go
          path: ${{ runner.temp }}/sonar-go
      - name: Download PostgreSQL coverage from this CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-postgres
          path: ${{ runner.temp }}/sonar-postgres
      - *node
      - name: Admit complete coverage for the exact analyzed source tree
        id: coverage
        env:
          CI_ANALYSIS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/dev/ci-coverage-evidence.mjs admit
      - *pnpm
      - *store
      - *install
      - name: Use repository-pinned Go for fresh coverage only
        if: ${{ steps.coverage.outputs.reuse == 'false' }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Measure PR source only when the tested tree differs
        if: ${{ steps.coverage.outputs.reuse == 'false' }}
        env:
          CI_ANALYSIS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          set -euo pipefail
          pnpm check:coverage
          node tools/dev/check-go.mjs --coverage --sonar-report
          bash tests/infra/test-owner-postgres-output.sh
          bash tests/infra/verify-owner-postgres-ci.sh --coverage
          GITHUB_SHA="$CI_ANALYSIS_SHA" node tools/dev/ci-coverage-evidence.mjs publish postgres
      - name: Analyze using existing Sonar project and enforce its Quality Gate
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.event.pull_request.head.ref, github.event.pull_request.base.ref) || '-Dsonar.branch.name=main' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  required_ci:
    # Stable protected check context until a separately verified ruleset cutover.
    name: fast-guard
    needs: [workspace, quality, typescript_tests, application_build, backend, postgres, containers, windows, security, sonar]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all integration evidence
        env:
          WORKSPACE: ${{ needs.workspace.result }}
          QUALITY: ${{ needs.quality.result }}
          TYPESCRIPT_TESTS: ${{ needs.typescript_tests.result }}
          APPLICATION_BUILD: ${{ needs.application_build.result }}
          BACKEND: ${{ needs.backend.result }}
          POSTGRES: ${{ needs.postgres.result }}
          CONTAINERS: ${{ needs.containers.result }}
          WINDOWS: ${{ needs.windows.result }}
          SECURITY: ${{ needs.security.result }}
          SONAR: ${{ needs.sonar.result }}
        shell: bash
        run: |
          set -euo pipefail
          result=0
          for check in WORKSPACE QUALITY TYPESCRIPT_TESTS APPLICATION_BUILD BACKEND POSTGRES CONTAINERS WINDOWS SECURITY SONAR; do
            if [[ "${!check:-}" != success ]]; then
              printf '::error::Required check %s: %s\n' "$check" "${!check:-missing}"
              result=1
            fi
          done
          exit "$result"
