name: Development Assurance

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  classify:
    name: semantic-classification
    runs-on: ubuntu-24.04
    outputs:
      repository_policy: ${{ steps.classify.outputs.repository_policy }}
      secrets: ${{ steps.classify.outputs.secrets }}
      workflow_integrity: ${{ steps.classify.outputs.workflow_integrity }}
      high_risk: ${{ steps.classify.outputs.high_risk }}
      unimplemented_required: ${{ steps.classify.outputs.unimplemented_required }}
      candidate_sha: ${{ steps.meta.outputs.candidate_sha }}
      base_sha: ${{ steps.meta.outputs.base_sha }}
    steps:
      - id: meta
        shell: bash
        env:
          CANDIDATE: ${{ github.sha }}
          BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          echo "candidate_sha=${CANDIDATE}" >>"${GITHUB_OUTPUT}"
          echo "base_sha=${BASE}" >>"${GITHUB_OUTPUT}"
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        name: Derive required claims
        env:
          CANDIDATE_SHA: ${{ steps.meta.outputs.candidate_sha }}
          BASE_SHA: ${{ steps.meta.outputs.base_sha }}
        run: node tools/ci/classify.mjs --head "${CANDIDATE_SHA}" --base "${BASE_SHA}"
      - name: Upload classification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-classification-${{ github.run_id }}
          path: .ci-evidence/classification.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  repository:
    needs: classify
    uses: ./.github/workflows/repository-policy.yml

  workflow-integrity:
    if: needs.classify.outputs.workflow_integrity == 'true'
    needs: classify
    uses: ./.github/workflows/workflow-integrity.yml

  secrets:
    if: needs.classify.outputs.secrets == 'true'
    needs: classify
    uses: ./.github/workflows/secrets.yml
    with:
      full_history: false

  development-ci:
    name: development-ci
    if: always()
    needs: [classify, repository, workflow-integrity, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce classified development proof
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRE_WORKFLOW: ${{ needs.classify.outputs.workflow_integrity }}
          REQUIRE_SECRETS: ${{ needs.classify.outputs.secrets }}
          UNIMPLEMENTED: ${{ needs.classify.outputs.unimplemented_required }}
        run: |
          set -euo pipefail
          jq -e '.classify.result == "success" and .repository.result == "success"' <<<"${NEEDS_JSON}" >/dev/null
          [[ "${REQUIRE_WORKFLOW}" != "true" ]] || jq -e '.["workflow-integrity"].result == "success"' <<<"${NEEDS_JSON}" >/dev/null
          [[ "${REQUIRE_SECRETS}" != "true" ]] || jq -e '.secrets.result == "success"' <<<"${NEEDS_JSON}" >/dev/null
          if [[ -n "${UNIMPLEMENTED}" ]]; then
            echo "::error::Required claims have no installed canonical owner yet: ${UNIMPLEMENTED}"
            exit 1
          fi
