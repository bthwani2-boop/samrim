name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'refoundation/clean-house-20261112'
  pull_request:
    branches:
      - main
      - 'refoundation/clean-house-20261112'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation structure only (NOT product acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check required Node and working tree
        run: |
          node --version
          git status --short
      - name: Test guard sensitivity
        run: node --test tools/governance/verify-foundation.test.mjs tools/governance/review-examples.test.mjs
      - name: Verify exclusive shared Git-turn handoff
        run: node --test tools/dev/git-turn.test.mjs
      - name: Verify foundation without asserting business readiness
        run: node tools/governance/verify-foundation.mjs
      - name: Verify Stage-4 source versions and external app identities (static only)
        run: node tools/mobile/verify-app-foundations.mjs
      - name: Reject manual RTL overrides in Expo screens and confirm native config
        run: |
          node --test tools/mobile/verify-rtl.test.mjs
          node tools/mobile/verify-rtl.mjs
      - name: Record limits explicitly
        run: |
          echo 'FOUNDATION_ONLY: governance cutover is NOT_READY'
          echo 'NOT_RUN: SQL, source services, runtime, security, finance, full Product acceptance'

  presentation:
    name: Presentation config, design and TypeScript (NOT runtime)
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact locked dependencies (no lifecycle scripts)
        run: |
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate design, native config, source ownership, appearance races and all app types
        run: |
          pnpm check:design
          pnpm check:apps
      - name: Export Expo Web presentation hosts (SSR artifacts only)
        run: |
          pnpm --dir apps/customer exec expo export --platform web
          pnpm --dir apps/merchant exec expo export --platform web
      - name: Smoke-test approved Customer/Merchant Expo Web SSR on loopback
        run: node tools/mobile/verify-expo-web-http.mjs
      - name: Export Expo Android JavaScript (NOT a native binary)
        run: |
          pnpm --dir apps/customer exec expo export --platform android
          pnpm --dir apps/merchant exec expo export --platform android
          pnpm --dir apps/captain exec expo export --platform android
      - name: Build the pinned Next.js Operator presentation host
        run: pnpm --dir apps/control-panel build
      - name: Smoke-test production Operator SSR, RTL and headers on loopback
        run: node tools/dev/verify-operator-http.mjs
      - name: Record missing live platform proof
        run: |
          echo 'NOT_RUN: Android/iOS binary, actual browser hydration/CSP, owner APIs, finance and security'

  fast_guard:
    # Existing main protection requires this exact check context. It depends on
    # the actual source/build jobs; it never substitutes for old Go/SQL E2E.
    name: fast-guard
    needs: [foundation, presentation]
    # A skipped required check may be treated as successful by branch protection.
    # Evaluate failed prerequisites and explicitly fail this required context.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject failed required predecessors
        if: ${{ always() }}
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          PRESENTATION_RESULT: ${{ needs.presentation.result }}
        run: |
          if [ "$FOUNDATION_RESULT" != "success" ] || [ "$PRESENTATION_RESULT" != "success" ]; then
            echo 'A required predecessor job did not succeed'
            exit 1
          fi
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Confirm foundation and tracked-secret guards after presentation admission
        # The TypeScript-backed app source guard and negative tests run in
        # presentation after its frozen pnpm install. GitHub jobs are isolated.
        run: |
          node tools/governance/verify-foundation.mjs
          node --test tools/security/verify-secrets.test.mjs
          node tools/security/verify-secrets.mjs
      - name: State the scoped check boundary
        run: |
          echo 'fast-guard: only currently implemented foundation/presentation sources'
          echo 'NOT_RUN: missing Go backends, SQL upgrade, financial and security E2E'
