name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  # Every current and future development branch is eligible.
  # Archived donor refs stay read-only, outside development CI.
  push:
    branches:
      - '**'
      - '!archive/**'
  # Main is the protected integration target; branch names are never pinned.
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.sha) || github.event_name }}
  cancel-in-progress: true

jobs:
  workspace_validation:
    if: ${{ github.event_name != 'schedule' }}
    name: Workspace validation (source checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check required Node and working tree
        run: |
          node --version
          node tools/dev/verify-workspace.mjs
          node tools/security/verify-secrets.mjs
          git status --short
      # All source regression tests run in the coverage suite below.
      - name: Record limits explicitly
        run: |
          echo 'WORKSPACE_ONLY: governance policy cutover is separately assessed'
          echo 'NOT_RUN: SQL, source services, runtime, security, finance, full Product acceptance'

  application_quality:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    name: Application quality, contracts, tests and builds
    needs: workspace_validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact locked dependencies (no lifecycle scripts)
        run: |
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit the installed locked JavaScript dependency graph (high and critical fail)
        run: pnpm audit --audit-level high
      - name: Validate owner OpenAPI 3.1 contracts and reject broken references
        run: |
          pnpm --dir services/identity contract
          pnpm --dir services/dsh contract
          pnpm --dir services/wlt contract
      - name: Run discovered Feature tests and collect measured coverage
        run: pnpm check:coverage
      - name: Bind JavaScript coverage to the tested source tree
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          test -s coverage/lcov.info
          git rev-parse 'HEAD^{tree}' > coverage/tree.txt
      - name: Publish measured JavaScript coverage
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-js
          path: |
            coverage/lcov.info
            coverage/tree.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Reject orphaned JavaScript and TypeScript files
        run: pnpm knip:files
      - name: Validate design, app identity, native configuration, source boundaries and types
        run: |
          pnpm check:design
          pnpm check:apps:source
      - name: Typecheck all workspace projects
        run: pnpm -r --if-present run typecheck
      - name: Export Expo Web presentation hosts (SSR artifacts only)
        run: |
          pnpm --dir apps/customer exec expo export --platform web
          pnpm --dir apps/merchant exec expo export --platform web
      - name: Smoke-test approved Customer/Merchant Expo Web SSR on loopback
        run: node tools/mobile/verify-expo-web-http.mjs
      - name: Export Customer/Merchant Android JavaScript (NOT a native binary)
        run: |
          pnpm --dir apps/customer exec expo export --platform android
          pnpm --dir apps/merchant exec expo export --platform android
      - name: Export Captain Android JavaScript (NOT a native binary)
        run: pnpm --dir apps/captain exec expo export --platform android
      - name: Build the pinned Next.js Operator presentation host
        run: pnpm --dir apps/control-panel build
      - name: Smoke-test production Operator SSR, RTL and headers on loopback
        run: |
          node tools/dev/verify-operator-http.mjs
      - name: Exercise production Operator session and policy routes
        env:
          BTHWANI_OPERATOR_HTTP_TEST: '1'
        run: |
          node --test --test-concurrency=1 \
            apps/control-panel/tests/operator-protected-routes.test.mjs \
            apps/control-panel/tests/operator-*-http.test.mjs
      - name: Record missing live platform proof
        run: |
          echo 'NOT_RUN: Android/iOS binary, actual browser hydration/CSP, owner APIs, finance and security'

  # Development feedback is not a merge gate. Native Nx owns affected tasks.

  development_feedback:
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    name: Development feedback (Nx)
    needs: workspace_validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact locked dependencies (no lifecycle scripts)
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Use repository-pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Run affected native Nx targets (full fallback for unknown comparison)
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ ]] &&
             git merge-base --is-ancestor "$BEFORE_SHA" "$GITHUB_SHA"; then
            pnpm exec nx affected -t typecheck,test --base="$BEFORE_SHA" --head="$GITHUB_SHA" --skip-nx-cache
          else
            pnpm exec nx run-many -t typecheck,test --skip-nx-cache
          fi
      - name: Record development feedback boundary
        run: echo 'Development feedback only; full source tests, builds, isolated SQL and Sonar belong to PR/main verification or explicit full verification.'

  dependency_security:
    if: ${{ github.event_name == 'schedule' }}
    name: Scheduled dependency audit (high+)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact locked dependencies (no lifecycle scripts)
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit all JavaScript dependencies (high and critical fail)
        run: pnpm audit --audit-level high

  backend_quality:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    uses: ./.github/workflows/go-quality.yml

  required_ci:
    # Keep the protected PR context distinct from feedback and manual runs.
    name: ${{ github.event_name == 'pull_request' && 'fast-guard' || 'full-ci' }}
    needs: [workspace_validation, application_quality, backend_quality]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject archive source and failed required predecessors
        env:
          HEAD_REF: ${{ github.head_ref }}
          CI_REF: ${{ github.ref }}
          CI_EVENT: ${{ github.event_name }}
          WORKSPACE_RESULT: ${{ needs.workspace_validation.result }}
          APPLICATION_RESULT: ${{ needs.application_quality.result }}
          BACKEND_RESULT: ${{ needs.backend_quality.result }}
        shell: bash
        run: |
          set -euo pipefail
          case "$HEAD_REF:$CI_REF" in
            archive/*:*|*:refs/heads/archive/*) exit 1 ;;
          esac
          case "$CI_EVENT" in
            pull_request|workflow_dispatch) ;;
            push) test "$CI_REF" = refs/heads/main ;;
            *) exit 1 ;;
          esac
          for result in "$WORKSPACE_RESULT" "$APPLICATION_RESULT" "$BACKEND_RESULT"; do
            test "$result" = success
          done
      - name: State verification boundary
        run: echo 'Full CI source, build and isolated owner checks; production and complete business journeys remain separate.'

  sonar:
    # Retain the exact required GitHub Actions check name.
    name: ${{ github.event_name == 'pull_request' && 'SonarQube Cloud Quality Gate' || 'SonarQube main analysis' }}
    needs: [application_quality, backend_quality]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require trusted source and successful coverage producers
        env:
          PRESENTATION_RESULT: ${{ needs.application_quality.result }}
          GO_RESULT: ${{ needs.backend_quality.result }}
          TRUSTED_SOURCE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TRUSTED_SOURCE" = true
          test "$PRESENTATION_RESULT" = success
          test "$GO_RESULT" = success
      - name: Checkout exact PR source and base history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download JavaScript coverage from this CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-js
          path: ${{ runner.temp }}/sonar-js
      - name: Download Go coverage from this CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-go
          path: ${{ runner.temp }}/sonar-go
      - name: Download PostgreSQL coverage from this CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-postgres
          path: ${{ runner.temp }}/sonar-postgres
      - name: Admit complete coverage for the exact analyzed source tree
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          js="$RUNNER_TEMP/sonar-js"
          go="$RUNNER_TEMP/sonar-go"
          pg="$RUNNER_TEMP/sonar-postgres"
          for dir in "$js" "$go" "$pg"; do
            test -s "$dir/tree.txt"
          done
          tree="$(cat "$js/tree.txt")"
          [[ "$tree" =~ ^[a-f0-9]{40}$ ]]
          test "$(cat "$go/tree.txt")" = "$tree"
          test "$(cat "$pg/tree.txt")" = "$tree"
          test -s "$js/lcov.info"
          for service in identity dsh wlt; do test -s "$go/$service-go.out"; done
          # The producer owns the complete dynamic profile set. Compare names
          # and bytes without trusting downloaded filenames as shell input.
          test -s "$pg/profiles.sha256"
          shopt -s nullglob
          profiles=("$pg"/*.out)
          test "${#profiles[@]}" -gt 0
          for profile in "${profiles[@]}"; do test -f "$profile" && test ! -L "$profile" && test -s "$profile" || exit 1; done
          (cd "$pg" && sha256sum -- *.out | cmp - profiles.sha256)
          if [[ "$tree" == "$(git rev-parse 'HEAD^{tree}')" ]]; then
            mkdir -p coverage/owner-postgres
            cp "$js/lcov.info" coverage/lcov.info
            for service in identity dsh wlt; do cp "$go/$service-go.out" coverage/; done
            cp "${profiles[@]}" coverage/owner-postgres/
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            # Main may have advanced since the PR branch. Preserve the tested
            # merge candidate and separately measure the actual PR source.
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies for source analysis
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Use repository-pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Measure PR source only when the tested tree differs
        if: ${{ steps.coverage.outputs.reuse == 'false' }}
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          set -euo pipefail
          pnpm check:coverage
          node tools/dev/check-go.mjs --coverage --sonar-report
          bash tests/infra/test-owner-postgres-output.sh
          bash tests/infra/verify-owner-postgres-ci.sh --coverage
      - name: Analyze using existing Sonar project and enforce its Quality Gate
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.event.pull_request.head.ref, github.event.pull_request.base.ref) || '-Dsonar.branch.name=main' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
