name: CI

on:
  workflow_dispatch:
  # Every current and future development branch is eligible.
  # Archived donor refs stay read-only, outside development CI.
  push:
    branches:
      - '**'
      - '!archive/**'
      - '!41'
  # Main is the protected integration target; branch names are never pinned.
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.sha) || github.event_name }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Pinned workspace and source checks (NOT product acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check required Node and working tree
        run: |
          node --version
          node tools/dev/verify-workspace.mjs
          git status --short
      - name: Test active Node runtime enforcement
        run: node --test tools/dev/verify-workspace.test.mjs
      - name: Guard branch-agnostic CI routing
        run: node --test tools/dev/verify-ci-branch-routing.test.mjs
      - name: Verify Stage-4 source versions and external app identities (static only)
        run: node tools/mobile/verify-app-foundations.mjs
      - name: Reject manual RTL overrides in Expo screens and confirm native config
        run: |
          node --test tools/mobile/verify-rtl.test.mjs
          node tools/mobile/verify-rtl.mjs
      - name: Record limits explicitly
        run: |
          echo 'WORKSPACE_ONLY: governance policy cutover is separately assessed'
          echo 'NOT_RUN: SQL, source services, runtime, security, finance, full Product acceptance'

  presentation:
    name: Presentation config, design and TypeScript (NOT runtime)
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact locked dependencies (no lifecycle scripts)
        run: |
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate owner OpenAPI 3.1 contracts and reject broken references
        run: |
          node --test tools/dev/check-openapi.test.mjs tests/infra/compose-policy.test.mjs tests/infra/verify-runtime-provenance.test.mjs
          pnpm --dir services/identity contract
          pnpm --dir services/dsh contract
          pnpm --dir services/wlt contract
      - name: Reject unadmitted new Feature tests
        run: pnpm check:test-inclusion
      - name: Run discovered Feature tests and collect measured coverage
        run: pnpm check:coverage
      - name: Bind JavaScript coverage to the tested source tree
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          test -s coverage/lcov.info
          git rev-parse 'HEAD^{tree}' > coverage/tree.txt
      - name: Publish measured JavaScript coverage
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-js
          path: |
            coverage/lcov.info
            coverage/tree.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Reject orphaned JavaScript and TypeScript files
        run: pnpm knip:files
      - name: Validate design, native config, source ownership, appearance races and all app types
        run: |
          pnpm check:design
          pnpm check:apps
      - name: Export Expo Web presentation hosts (SSR artifacts only)
        run: |
          pnpm --dir apps/customer exec expo export --platform web
          pnpm --dir apps/merchant exec expo export --platform web
      - name: Smoke-test approved Customer/Merchant Expo Web SSR on loopback
        run: node tools/mobile/verify-expo-web-http.mjs
      - name: Export Expo Android JavaScript (NOT a native binary)
        run: |
          pnpm --dir apps/customer exec expo export --platform android
          pnpm --dir apps/merchant exec expo export --platform android
          pnpm --dir apps/captain exec expo export --platform android
      - name: Build the pinned Next.js Operator presentation host
        run: pnpm --dir apps/control-panel build
      - name: Smoke-test production Operator SSR, RTL and headers on loopback
        run: |
          node tools/dev/verify-operator-http.mjs
      - name: Exercise production Operator session and policy routes
        env:
          BTHWANI_OPERATOR_HTTP_TEST: '1'
        run: |
          node --test --test-concurrency=1 \
            apps/control-panel/tests/operator-protected-routes.test.mjs \
            apps/control-panel/tests/operator-workspace-http.test.mjs \
            apps/control-panel/tests/operator-policy-http.test.mjs \
            apps/control-panel/tests/operator-captain-review-http.test.mjs
      - name: Record missing live platform proof
        run: |
          echo 'NOT_RUN: Android/iOS binary, actual browser hydration/CSP, owner APIs, finance and security'

  # All main PRs run the existing owner checks on the same candidate.
  # Standalone path-filtered push workflows retain fast development feedback.
  dependency_pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/dependency-nx-safety.yml

  go_pr:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    uses: ./.github/workflows/go-quality.yml

  fast_guard:
    # Preserve the existing required check context; fail closed on every PR.
    name: fast-guard
    needs: [foundation, presentation, dependency_pr, go_pr]
    # A skipped required check may be treated as successful by branch protection.
    # Evaluate failed prerequisites and explicitly fail this required context.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse read-only archive as main PR source
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            archive/*|41)
              echo 'Archived donor source must remain read-only; refuse merging to main'
              exit 1
              ;;
          esac
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Reject failed required predecessors
        if: ${{ !cancelled() }}
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          PRESENTATION_RESULT: ${{ needs.presentation.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency_pr.result }}
          GO_RESULT: ${{ needs.go_pr.result }}
        run: |
          node --input-type=module <<'CI_GATE'
          const { CI_EVENT, CI_REF, FOUNDATION_RESULT, PRESENTATION_RESULT, DEPENDENCY_RESULT, GO_RESULT } = process.env;
          if (!["pull_request", "push", "workflow_dispatch"].includes(CI_EVENT)) {
            throw new Error("Unexpected CI event");
          }
          const ownerExpected = CI_EVENT === "pull_request" ? "success" : "skipped";
          const goExpected = CI_EVENT === "pull_request" || (CI_EVENT === "push" && CI_REF === "refs/heads/main") ? "success" : "skipped";
          const checks = [
            ["foundation", FOUNDATION_RESULT, "success"],
            ["presentation", PRESENTATION_RESULT, "success"],
            ["dependency_pr", DEPENDENCY_RESULT, ownerExpected],
            ["go_pr", GO_RESULT, goExpected],
          ];
          for (const [job, result, expected] of checks) {
            if (result !== expected) {
              console.error(job + ": expected " + expected + ", got " + (result || "missing"));
              process.exitCode = 1;
            }
          }
          CI_GATE
      - name: Confirm tracked-secret checks after presentation admission
        # The TypeScript-backed app source guard and negative tests run in
        # presentation after its frozen pnpm install. GitHub jobs are isolated.
        run: |
          node --test tools/security/verify-secrets.test.mjs
          node tools/security/verify-secrets.mjs
      - name: State the scoped check boundary
        run: |
          echo 'fast-guard: foundation and presentation; main PR requires Go, disposable owner PostgreSQL and dependency/Nx; main push also requires Go and owner PostgreSQL'
          echo 'NOT_RUN: full business journey, protected SQL upgrade, device, financial and security E2E'

  sonar:
    # Retain the exact required GitHub Actions check name.
    name: SonarQube Cloud Quality Gate
    needs: [presentation, go_pr]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require trusted source and successful coverage producers
        env:
          PRESENTATION_RESULT: ${{ needs.presentation.result }}
          GO_RESULT: ${{ needs.go_pr.result }}
          TRUSTED_SOURCE: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TRUSTED_SOURCE" = true
          test "$PRESENTATION_RESULT" = success
          test "$GO_RESULT" = success
      - name: Checkout exact PR source and base history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download JavaScript coverage from this CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-js
          path: ${{ runner.temp }}/sonar-js
      - name: Download Go coverage from this CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-go
          path: ${{ runner.temp }}/sonar-go
      - name: Download PostgreSQL coverage from this CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-postgres
          path: ${{ runner.temp }}/sonar-postgres
      - name: Admit coverage only for the exact analyzed source tree
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          js="$RUNNER_TEMP/sonar-js"
          go="$RUNNER_TEMP/sonar-go"
          pg="$RUNNER_TEMP/sonar-postgres"
          for dir in "$js" "$go" "$pg"; do
            test -s "$dir/tree.txt"
          done
          tree="$(cat "$js/tree.txt")"
          [[ "$tree" =~ ^[a-f0-9]{40}$ ]]
          test "$(cat "$go/tree.txt")" = "$tree"
          test "$(cat "$pg/tree.txt")" = "$tree"
          test -s "$js/lcov.info"
          for service in identity dsh wlt; do test -s "$go/$service-go.out"; done
          shopt -s nullglob
          profiles=("$pg"/*.out)
          test "${#profiles[@]}" -gt 0
          for profile in "${profiles[@]}"; do test -s "$profile"; done
          if [[ "$tree" == "$(git rev-parse 'HEAD^{tree}')" ]]; then
            mkdir -p coverage/owner-postgres
            cp "$js/lcov.info" coverage/lcov.info
            for service in identity dsh wlt; do cp "$go/$service-go.out" coverage/; done
            cp "${profiles[@]}" coverage/owner-postgres/
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            # Main may have advanced since the PR branch. Preserve the tested
            # merge candidate and separately measure the actual PR source.
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked dependencies for source analysis
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Use repository-pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Measure PR source only when the tested tree differs
        if: ${{ steps.coverage.outputs.reuse == 'false' }}
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          set -euo pipefail
          pnpm check:coverage
          node tools/dev/check-go.mjs --coverage --sonar-report
          bash tests/infra/test-owner-postgres-output.sh
          bash tests/infra/verify-owner-postgres-ci.sh --coverage
      - name: Analyze using existing Sonar project and enforce its Quality Gate
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.event.pull_request.head.ref, github.event.pull_request.base.ref) || '-Dsonar.branch.name=main' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
