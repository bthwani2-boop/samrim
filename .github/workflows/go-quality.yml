name: Go Quality and Isolated Owner PostgreSQL

on:
  workflow_call:
  workflow_dispatch:
  # Every current and future development branch is eligible.
  # Archived donor refs stay read-only, outside development CI.
  push:
    branches:
      - '**'
      - '!archive/**'
      - '!main'
    paths:
      - '.go-version'
      - '.node-version'
      - '.github/workflows/go-quality.yml'
      - 'tools/dev/check-go.mjs'
      - 'tools/dev/check-go.test.mjs'
      - 'services/**/backend/**'
      - 'services/**/contracts/openapi/**'
      - 'services/**/database/migrations/**'
      - 'services/**/database/schema/**'
      - 'services/wlt/database/sandbox/**'
      - 'services/**/.dockerignore'
      - 'tools/dev/docker/build-owner-image.ps1'
      - 'infra/compose*.yaml'
      - 'tests/infra/compose.operator-webauthn-sandbox.yaml'
      - 'tests/infra/payment-mock/**'
      - 'tests/infra/verify-owner-postgres-ci.sh'
      - 'tests/infra/verify-isolated-postgres.ps1'
      - 'tools/dev/docker/owner-baseline-transition.mjs'
      - 'tests/infra/test-owner-postgres-output.sh'
      - 'nx.json'
  # Main pull requests invoke this workflow from CI's required gate.

permissions:
  contents: read

concurrency:
  group: go-quality-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.sha) || github.event_name }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go format, modules, vet, race and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      CGO_ENABLED: '1'
      CC: gcc
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Use pinned Go (source-compatible action)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Verify Linux C toolchain for the race detector
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(go env CGO_ENABLED)" != '1' ]]; then
            echo 'Race detector requires CGO_ENABLED=1' >&2
            exit 1
          fi
          if ! command -v "$CC" >/dev/null 2>&1; then
            echo "Race detector requires the configured C compiler: $CC" >&2
            exit 1
          fi
          "$CC" --version
      - name: Test Go runner argument, pin and module safety
        run: node --test tools/dev/check-go.test.mjs
      - name: Verify real Go modules with race detector and measured coverage
        run: node tools/dev/check-go.mjs --ci --sonar-report
      - name: Bind Go coverage to the tested source tree
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          for service in identity dsh wlt; do test -s "coverage/$service-go.out"; done
          git rev-parse 'HEAD^{tree}' > coverage/tree.txt
      - name: Publish measured Go coverage
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-go
          path: |
            coverage/identity-go.out
            coverage/dsh-go.out
            coverage/wlt-go.out
            coverage/tree.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Scan deployed Go owner source for reachable vulnerabilities
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "$RUNNER_TEMP/govulncheck.XXXXXX")"
          trap 'rm -rf -- "$scanner_dir"' EXIT
          GOBIN="$scanner_dir" GOSUMDB=sum.golang.org go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c
          scanner="$scanner_dir/govulncheck"
          go version -m "$scanner"
          for service in identity dsh wlt; do
            echo "Scanning Go owner: $service (CGO_ENABLED=0)"
            (cd "services/$service/backend" && "$scanner" ./...)
          done
      - name: Build and inspect isolated service images
        shell: bash
        run: |
          set -euo pipefail
          expected_go="$(cat .go-version)"
          for service in identity dsh wlt; do
            image="bthwani-go-check-$service:$GITHUB_SHA"
            docker build --file "services/$service/backend/Dockerfile" \
              --build-arg "SAMRIM_SOURCE_REVISION=$GITHUB_SHA" \
              --tag "$image" "services/$service"
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            [[ "$user" == "65532:65532" ]] || { echo "Unsafe container user: $service" >&2; exit 1; }
            revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            [[ "$revision" == "$GITHUB_SHA" ]] || { echo "Missing source provenance: $service" >&2; exit 1; }
            # DSH alone currently needs SQL for its explicit bootstrap command.
            if [[ "$service" == "dsh" ]]; then
              docker run --rm --network none --read-only --entrypoint /bin/sh "$image" -ec 'test -d /app/database/schema'
            else
              docker run --rm --network none --read-only --entrypoint /bin/sh "$image" -ec 'test ! -e /app/database/schema'
            fi
            binary="$(mktemp)"
            container="$(docker create --network none "$image")"
            docker cp "$container:/usr/local/bin/$service" "$binary"
            docker rm "$container" >/dev/null
            go version -m "$binary" | grep -F "go$expected_go"
            rm -f "$binary"
          done
      - name: Exercise synthetic payment provider in disposable Docker
        shell: bash
        run: bash tests/infra/payment-mock/smoke.sh
      - name: State validation limits
        run: echo 'This Go source job does not prove PostgreSQL integration; see the separate disposable owner-postgres-integration job. NOT_RUN - golangci-lint, gosec and fuzz campaigns'


  owner-postgres-integration:
    name: Disposable PostgreSQL owner authorization, concurrency and readback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Use pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Validate expected owner test names and reject incomplete passing output
        shell: bash
        run: bash tests/infra/test-owner-postgres-output.sh
      - name: Run isolated, network-disabled owner PostgreSQL tests
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request || ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ) ]]; then
            bash tests/infra/verify-owner-postgres-ci.sh --coverage
          else
            bash tests/infra/verify-owner-postgres-ci.sh
          fi
      - name: Bind PostgreSQL coverage to the tested source tree
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet HEAD --
          git rev-parse 'HEAD^{tree}' > coverage/owner-postgres/tree.txt
      - name: Publish measured PostgreSQL coverage
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-postgres
          path: |
            coverage/owner-postgres/*.out
            coverage/owner-postgres/tree.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Verify fresh Identity, DSH and WLT baselines, restore and least-privilege access
        shell: pwsh
        run: ./tests/infra/verify-isolated-postgres.ps1 -DockerContext default
