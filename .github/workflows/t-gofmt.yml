name: Temporary t gofmt

on:
  push:
    branches: [t]

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
      - name: Canonical gofmt
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            services/dsh/backend/cmd/api/financial_handoff_reconciler.go \
            services/dsh/backend/internal/contract/dsh_types_generated.go \
            services/dsh/backend/internal/financialhandoff/service.go \
            services/dsh/backend/internal/integrations/wlt/client.go \
            services/dsh/backend/internal/order/service.go \
            services/dsh/backend/internal/storage/postgres/captain.go \
            services/dsh/backend/internal/storage/postgres/financial_handoff.go \
            services/dsh/backend/internal/storage/postgres/order.go \
            services/wlt/backend/internal/storage/postgres/captain_wallet.go \
            services/wlt/backend/internal/storage/postgres/payment.go \
            services/wlt/backend/internal/storage/postgres/payment_allocation.go \
            services/wlt/backend/internal/storage/postgres/payment_allocation_test.go \
            services/wlt/backend/internal/transport/http/captain_wallet.go \
            services/wlt/backend/internal/transport/http/server.go
          git diff --check
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "GOFMT_NO_CHANGES=1"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "style(go): apply canonical gofmt"
          git push origin HEAD:t
