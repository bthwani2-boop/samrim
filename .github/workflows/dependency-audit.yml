name: Dependency Audit

on:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  dependency_security:
    name: Scheduled dependency audit (high+)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout locked dependency graph
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Activate repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable pnpm
          pnpm --version
      # Native pnpm audits the complete lockfile without installing it.
      - name: Audit all locked JavaScript dependencies (high and critical fail)
        run: pnpm audit --audit-level high
