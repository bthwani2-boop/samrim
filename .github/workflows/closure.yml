name: Canonical Promotion Closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    name: closure-metadata
    runs-on: ubuntu-24.04
    outputs:
      candidate_sha: ${{ steps.meta.outputs.candidate_sha }}
      base_sha: ${{ steps.meta.outputs.base_sha }}
    steps:
      - id: meta
        shell: bash
        env:
          CANDIDATE: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BASE}" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate_sha=${CANDIDATE}" >>"${GITHUB_OUTPUT}"
          echo "base_sha=${BASE}" >>"${GITHUB_OUTPUT}"

  repository:
    needs: metadata
    uses: ./.github/workflows/repository-policy.yml
    with:
      candidate_sha: ${{ needs.metadata.outputs.candidate_sha }}
      base_sha: ${{ needs.metadata.outputs.base_sha }}

  workflow-integrity:
    needs: metadata
    uses: ./.github/workflows/workflow-integrity.yml
    with:
      candidate_sha: ${{ needs.metadata.outputs.candidate_sha }}
      base_sha: ${{ needs.metadata.outputs.base_sha }}

  secrets:
    needs: metadata
    uses: ./.github/workflows/secrets.yml
    with:
      candidate_sha: ${{ needs.metadata.outputs.candidate_sha }}
      base_sha: ${{ needs.metadata.outputs.base_sha }}

  promotion-policy:
    needs: metadata
    uses: ./.github/workflows/promotion-policy.yml
    with:
      candidate_sha: ${{ needs.metadata.outputs.candidate_sha }}
      base_sha: ${{ needs.metadata.outputs.base_sha }}

  promotion-closure:
    name: promotion-closure
    if: always()
    needs: [metadata, repository, workflow-integrity, secrets, promotion-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download all evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "evidence-*"
          path: .closure-evidence
          merge-multiple: true
      - name: Validate exact-SHA evidence closure
        shell: bash
        env:
          CANDIDATE_SHA: ${{ needs.metadata.outputs.candidate_sha }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e '.repository.result == "success" and .["workflow-integrity"].result == "success" and .secrets.result == "success" and .["promotion-policy"].result == "success"' <<<"${NEEDS_JSON}" >/dev/null
          node tools/ci/aggregate-evidence.mjs --root .closure-evidence --candidate "${CANDIDATE_SHA}" --require repository.policy,workflow.actionlint,workflow.zizmor,workflow.pinact,secrets.gitleaks,promotion.policy
