name: Repository Baseline Guard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Materialize exact pinned Governance and Docs
        shell: bash
        run: node tools/dev/knowledge-source.mjs

      - name: Enforce canonical repository invariants
        shell: bash
        run: |
          set -euo pipefail

          required=(
            README.md
            SECURITY.md
            CONTRIBUTING.md
            knowledge.sources.json
            AGENTS.md
            .github/CODEOWNERS
            .github/pull_request_template.md
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            nx.json
            go.work
            go.work.sum
          )

          for path in "${required[@]}"; do
            [[ -e "${path}" ]] || {
              echo "::error::Required repository path missing: ${path}"
              exit 1
            }
          done

          if [[ -e tools/prompting ]]; then
            echo "::error::Retired prompt-package root must not exist; methods belong in pinned Docs and agent safety belongs in AGENTS.md plus machine safeguards"
            exit 1
          fi

          for root in core shared; do
            [[ ! -e "${root}" ]] || {
              echo "::error::Forbidden top-level ownership class: ${root}"
              exit 1
            }
          done

          if [[ -d apps ]] && find apps -mindepth 2 -maxdepth 2 -type d -name runtime -print -quit | grep -q .; then
            echo "::error::Pass-through apps/*/runtime topology is forbidden"
            exit 1
          fi

          if grep -R -n -E -- '^[[:space:]]*pull_request_target:' .github/workflows; then
            echo "::error::pull_request_target is forbidden in baseline workflows"
            exit 1
          fi

          if grep -R -n -E -- '^[[:space:]]*permissions:[[:space:]]*write-all' .github/workflows; then
            echo "::error::write-all workflow permissions are forbidden"
            exit 1
          fi

          while IFS= read -r use; do
            ref="${use#*uses:}"
            ref="${ref%%#*}"
            ref="${ref//[[:space:]]/}"

            [[ "${ref}" == ./* ]] && continue

            [[ "${ref}" =~ @[0-9a-fA-F]{40}$ ]] || {
              echo "::error::Action is not pinned to a full commit SHA: ${ref}"
              exit 1
            }
          done < <(grep -R -h -E -- '^[[:space:]]*uses:[[:space:]]*' .github/workflows || true)

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Verify donor residue
        shell: bash
        run: node tools/dev/verify-donor-residue.mjs

      - name: Verify durable repository structure
        shell: bash
        run: node tools/dev/verify-repository-structure.mjs

      - name: Verify tracked-artifact structural hygiene
        shell: bash
        run: node tools/dev/verify-structural-hygiene.mjs

      - name: Verify local runtime ownership
        shell: bash
        run: node tools/dev/verify-local-runtime-ownership.mjs

      - name: Verify removed human-domain residue is zero
        shell: bash
        run: node tools/dev/verify-removed-human-domain-residue.mjs

      - name: Verify docs command parity
        shell: bash
        run: node tools/dev/verify-doc-command-parity.mjs

      - name: Verify docs configuration parity
        shell: bash
        run: node tools/dev/verify-doc-config-parity.mjs

      - name: Verify knowledge-system invariants
        shell: bash
        run: node tools/dev/verify-knowledge-system.mjs

      - name: Verify knowledge references and orphan docs
        shell: bash
        run: node tools/dev/verify-knowledge-references.mjs

      - name: Verify source-derived knowledge queries
        shell: bash
        run: |
          set -euo pipefail
          node tools/dev/query-knowledge.mjs list capabilities | grep -Fx 'IDENTITY_ACTIVATION_SESSIONS'
          node tools/dev/query-knowledge.mjs capability IDENTITY_ACTIVATION_SESSIONS | grep -F 'SOURCE=governance/product/capabilities/access/identity-activation-sessions.md'
          node tools/dev/query-knowledge.mjs capability IDENTITY_ACTIVATION_SESSIONS | grep -F 'public_auth_state_enumeration'
          node tools/dev/query-knowledge.mjs journey J1 | grep -F 'SOURCE=governance/product/JOURNEYS.md'
          node tools/dev/query-knowledge.mjs list owners | grep -F 'governance/product/FINANCIAL-MODEL.md'
          node tools/dev/query-knowledge.mjs owner provider | grep -F 'governance/policies/providers-and-integrations.md'

      - name: Verify adversarial agent knowledge contract
        shell: bash
        run: node tools/dev/verify-agent-knowledge-contract.mjs

      - name: Verify Identity vertical boundaries
        shell: bash
        run: |
          node services/identity/tools/generate-types.mjs --check
          node services/dsh/tools/generate-types.mjs --check
          node tools/dev/verify-identity-boundaries.mjs

      - name: Install pinned pnpm
        shell: bash
        run: npm install --global pnpm@10.34.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/identity/backend/go.mod
            services/dsh/backend/go.mod

      - name: Verify pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v24.17.0" ]]
          [[ "$(pnpm --version)" == "10.34.0" ]]
          [[ "$(go version)" == *"go1.27.1"* ]]

      - name: Verify Go workspace synchronization
        shell: bash
        run: |
          set -euo pipefail
          go work sync
          drift="$(git status --porcelain -- go.work go.work.sum services/*/backend)"
          if [[ -n "${drift}" ]]; then
            printf '%s\n' "${drift}"
            git diff -- go.work go.work.sum services/*/backend || true
            echo "::error::go work sync changed tracked or untracked Go workspace files"
            exit 1
          fi

      - name: Verify PowerShell runtime scripts parse
        shell: pwsh
        run: ./tools/dev/verify-powershell-syntax.ps1

      - name: Verify Go source formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l services/*/backend)"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::Unformatted Go files detected: ${unformatted}"
            exit 1
          fi

      - name: Frozen workspace install
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript and JavaScript lint
        shell: bash
        run: pnpm run quality:lint

      - name: Verify theme authority and WCAG AA contrast
        shell: bash
        run: |
          pnpm run theme:check
          pnpm run theme:verify

      - name: Verify mobile deployable identities
        shell: bash
        run: pnpm run mobile:verify-config

      - name: Verify canonical brand asset projections
        shell: bash
        run: pnpm run brand:check

      - name: Verify workspace dependency references
        shell: bash
        run: node tools/dev/verify-workspace-dependencies.mjs

      - name: Verify canonical static candidate
        shell: bash
        run: pnpm run candidate:verify:static

      - name: Verify Nx project tags
        shell: bash
        run: pnpm run nx:verify-tags

      - name: Discover Nx projects
        shell: bash
        run: pnpm run nx:projects

      - name: Verify developer bootstrap
        shell: pwsh
        run: ./tools/dev/bootstrap.ps1

      - name: Verify dependency vulnerability surface
        shell: bash
        run: |
          set -euo pipefail
          pnpm audit --audit-level=moderate
          (
            cd services/identity/backend
            go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          )
          (
            cd services/dsh/backend
            go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          )

      - name: Verify canonical Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose --project-name samrim-local --env-file infra/local/compose/.env.example -f infra/local/compose/compose.yaml config >/dev/null

      - name: Verify developer tooling is non-mutating
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          if [[ -n "${drift}" ]]; then
            printf '%s\n' "${drift}"
            git diff -- . || true
            echo "::error::Developer tooling mutated repository state"
            exit 1
          fi

  windows-eol:
    name: repository-windows-eol
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Configure hostile Windows Git default
        shell: pwsh
        run: git config --global core.autocrlf true

      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: false

      - name: Verify canonical LF checkout and Go workspace stability
        shell: pwsh
        run: |
          $bad = @(
            git ls-files --eol |
              Where-Object { $_ -match '\bw/(crlf|mixed)\b' }
          )

          if ($bad.Count -gt 0) {
            $bad | Write-Host
            throw "Fresh Windows checkout contains CRLF/mixed tracked text."
          }

          go work sync
          if ($LASTEXITCODE -ne 0) {
            throw "go work sync failed."
          }

          $drift = @(git status --porcelain --untracked-files=all)
          if ($drift.Count -gt 0) {
            $drift | Write-Host
            throw "go work sync mutated the fresh Windows checkout."
          }

          Write-Host "WINDOWS_EOL_REGRESSION=PASS"

      - name: Set up Node for Windows mobile export proof
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Install pinned pnpm for Windows mobile export proof
        shell: pwsh
        run: npm install --global pnpm@10.34.0

      - name: Install workspace for Windows mobile export proof
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify Windows mobile exports
        shell: pwsh
        run: |
          pnpm run workspace:mobile-export-smoke
          if ($LASTEXITCODE -ne 0) {
            throw "Windows mobile export smoke failed."
          }
          Write-Host "WINDOWS_MOBILE_EXPORT=PASS"

  runtime:
    name: repository-runtime
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node for semantic runtime proof
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Set up pnpm for browser runtime proof
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          pnpm --version

      - name: Set up Go for runtime migration verification
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: false

      - name: Start canonical repository runtime through the sole lifecycle owner
        shell: pwsh
        run: |
          pnpm runtime:up
          if ($LASTEXITCODE -ne 0) { throw "runtime:up failed." }
          pnpm runtime:doctor
          if ($LASTEXITCODE -ne 0) { throw "runtime:doctor failed." }

      - name: Export canonical runtime values for proof consumers
        shell: bash
        run: |
          set -euo pipefail
          env_value() {
            sed -n "s/^${1}=//p" infra/local/compose/.env
          }
          for key in \
            BTHWANI_ENV \
            IDENTITY_API_BASE_URL \
            DSH_API_BASE_URL \
            IDENTITY_PLATFORM_CONTROL_SERVICE_TOKEN \
            DSH_PLATFORM_CONTROL_SERVICE_TOKEN \
            SAMRIM_MAILPIT_WEB_PORT \
            SAMRIM_IDENTITY_PORT \
            SAMRIM_DSH_PORT \
            CONTROL_PANEL_PUBLIC_ORIGIN; do
            value="$(env_value "$key")"
            [[ -n "$value" ]] || { echo "::error::Missing canonical runtime value: $key"; exit 1; }
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          printf 'PLAYWRIGHT_BASE_URL=%s\n' "$(env_value CONTROL_PANEL_PUBLIC_ORIGIN)" >> "$GITHUB_ENV"

      - name: Install browser-runtime workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build and start canonical Control Panel through the sole runtime owner
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/control-panel build
          setsid pnpm control >/tmp/samrim-control-panel.log 2>&1 &
          echo $! >/tmp/samrim-control-panel.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 5 "${CONTROL_PANEL_PUBLIC_ORIGIN}/" >/dev/null; then
              echo "CONTROL_PANEL_RUNTIME=PASS"
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              cat /tmp/samrim-control-panel.log || true
              echo "::error::Canonical Control Panel did not become ready"
              exit 1
            fi
            sleep 2
          done

      - name: Install required Chromium runtime
        shell: bash
        run: pnpm --dir apps/control-panel exec playwright install --with-deps chromium

      - name: Verify repository runtime composition
        shell: bash
        run: |
          set -euo pipefail

          verify_json_endpoint() {
            local service="$1"
            local uri="$2"
            local body
            body="$(curl --fail --silent --show-error --max-time 5 "$uri")" || return 1
            jq -e --arg service "$service" '.service == $service and .status == "ok"' <<<"$body" >/dev/null
          }

          for attempt in $(seq 1 60); do
            ok=1

            docker compose --project-name samrim-local --env-file infra/local/compose/.env -f infra/local/compose/compose.yaml exec -T postgres pg_isready -h 127.0.0.1 -U samrim_local -d samrim_local >/dev/null 2>&1 || ok=0
            curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${SAMRIM_MAILPIT_WEB_PORT}/" >/dev/null || ok=0

            verify_json_endpoint identity "${IDENTITY_API_BASE_URL}/identity/health" || ok=0
            verify_json_endpoint identity "${IDENTITY_API_BASE_URL}/identity/readiness" || ok=0
            verify_json_endpoint dsh "${DSH_API_BASE_URL}/dsh/health" || ok=0
            verify_json_endpoint dsh "${DSH_API_BASE_URL}/dsh/readiness" || ok=0

            if [[ "$ok" -eq 1 ]]; then
              echo "REPOSITORY_RUNTIME_ENDPOINTS=PASS"
              break
            fi

            if [[ "$attempt" -eq 60 ]]; then
              echo "::error::Repository runtime did not become ready"
              docker compose --project-name samrim-local --env-file infra/local/compose/.env -f infra/local/compose/compose.yaml ps -a
              docker compose --project-name samrim-local --env-file infra/local/compose/.env -f infra/local/compose/compose.yaml logs --tail 200
              exit 1
            fi

            sleep 2
          done

          mapfile -t running < <(docker compose --project-name samrim-local --env-file infra/local/compose/.env -f infra/local/compose/compose.yaml ps --status running --services | sort)
          expected=(dsh identity mailpit postgres)

          if [[ "${running[*]}" != "${expected[*]}" ]]; then
            printf 'running=%s\n' "${running[*]}"
            printf 'expected=%s\n' "${expected[*]}"
            echo "::error::Repository compose service census mismatch"
            exit 1
          fi

          for migration in identity-migrate dsh-migrate; do
            cid="$(docker compose --project-name samrim-local --env-file infra/local/compose/.env -f infra/local/compose/compose.yaml ps -a -q "$migration")"
            [[ -n "$cid" ]]
            [[ "$(docker inspect --format '{{.State.Status}}|{{.State.ExitCode}}' "$cid")" == "exited|0" ]]
          done

          echo "REPOSITORY_COMPOSE_SERVICES=PASS"
          echo "REPOSITORY_MIGRATION_JOBS=PASS"

      - name: Verify DSH image trust store and non-root runtime
        shell: bash
        run: |
          set -euo pipefail
          docker compose --project-name samrim-local --env-file infra/local/compose/.env -f infra/local/compose/compose.yaml exec -T dsh sh -ceu '
            test -s /etc/ssl/certs/ca-certificates.crt
            test "$(id -u)" -ne 0
          '
          echo "DSH_RUNTIME_TRUST_STORE=PASS"
          echo "DSH_RUNTIME_NON_ROOT=PASS"

      - name: Verify canonical runtime candidate
        shell: bash
        run: pnpm run candidate:verify:runtime -- --env-file=infra/local/compose/.env

      - name: Verify runtime proof did not mutate repository
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$drift" ]]; then
            printf '%s\n' "$drift"
            git diff -- . || true
            echo "::error::Repository runtime proof mutated repository state"
            exit 1
          fi
          echo "REPOSITORY_RUNTIME_REPOSITORY_MUTATION=0"

      - name: Stop and purge repository runtime through the sole lifecycle owner
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/samrim-control-panel.pid ]]; then
            pgid="$(cat /tmp/samrim-control-panel.pid)"
            kill -- "-${pgid}" 2>/dev/null || true
          fi
          if [[ -f /tmp/samrim-control-panel.log ]]; then
            tail -n 200 /tmp/samrim-control-panel.log || true
          fi
          pnpm runtime:reset
