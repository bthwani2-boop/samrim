name: Foundation Baseline Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: foundation-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Enforce canonical foundation invariants
        shell: bash
        run: |
          set -euo pipefail

          required=(
            README.md
            SECURITY.md
            CONTRIBUTING.md
            governance
            docs
            tools/prompting/bthwani-orchestrator/00-ORCHESTRATOR.md
            tools/prompting/bthwani-refoundation/00-ENTRYPOINT.md
            .github/CODEOWNERS
            .github/pull_request_template.md
          )
          for path in "${required[@]}"; do
            [[ -e "${path}" ]] || { echo "::error::Required foundation path missing: ${path}"; exit 1; }
          done

          for root in core shared; do
            [[ ! -e "${root}" ]] || { echo "::error::Forbidden top-level ownership class: ${root}"; exit 1; }
          done

          if [[ -d apps ]] && find apps -mindepth 2 -maxdepth 2 -type d -name runtime -print -quit | grep -q .; then
            echo "::error::Pass-through apps/*/runtime topology is forbidden on main"
            exit 1
          fi

          forbidden='bthwani2-boop/bthwani-suite-next|bthwani-suite-next|D:\\bthwani-suite-next|C:\\bthwani-secrets|origin/h|RE_PIN_h|UNKNOWN_CURRENT_h_HEAD|H_TRUSTWORTHY_CANONICAL_BASELINE_REFOUNDATION_COMPLETE'
          if git grep -n -I -E -- "${forbidden}" -- . ':(exclude).github/workflows/baseline-guard.yml' ; then
            echo "::error::Donor/campaign-specific authority residue found"
            exit 1
          fi

          if grep -R -n -E -- '^[[:space:]]*pull_request_target:' .github/workflows; then
            echo "::error::pull_request_target is forbidden in foundation workflows"
            exit 1
          fi

          if grep -R -n -E -- '^[[:space:]]*permissions:[[:space:]]*write-all' .github/workflows; then
            echo "::error::write-all workflow permissions are forbidden"
            exit 1
          fi

          while IFS= read -r use; do
            ref="${use#*uses:}"
            ref="${ref%%#*}"
            ref="${ref//[[:space:]]/}"
            [[ "${ref}" == ./* ]] && continue
            [[ "${ref}" =~ @[0-9a-fA-F]{40}$ ]] || {
              echo "::error::Action is not pinned to a full commit SHA: ${ref}"
              exit 1
            }
          done < <(grep -R -h -E -- '^[[:space:]]*uses:[[:space:]]*' .github/workflows || true)

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi
