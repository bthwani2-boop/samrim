name: Repository Baseline Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.NX_CLOUD_RW_TOKEN || secrets.NX_CLOUD_RO_TOKEN }}
    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve affected base
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          elif [[ -n "${PUSH_BEFORE_SHA}" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            base="${PUSH_BEFORE_SHA}"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git merge-base --is-ancestor "${base}" HEAD
          echo "sha=${base}" >> "${GITHUB_OUTPUT}"
          echo "PROOF_BASE=${base}"
          echo "PROOF_HEAD=$(git rev-parse HEAD)"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Verify Nx Cloud CI access configuration
        shell: bash
        run: node tools/dev/verify-nx-cloud-ci.mjs

      - name: Install pinned pnpm
        shell: bash
        run: npm install --global pnpm@10.34.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/identity/backend/go.sum
            services/identity/clients/go/go.mod
            services/dsh/backend/go.sum

      - name: Install workspace once
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Materialize exact pinned Governance and Docs
        shell: bash
        run: node tools/dev/knowledge-source.mjs

      - name: Verify repository invariants through Nx
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: |
          set -euo pipefail
          pnpm exec nx run-many \
            -t donor-residue,repository-structure,structural-hygiene,runtime-ownership,removed-domain-residue,docs-command-parity,docs-config-parity,knowledge-system,knowledge-references,agent-contract,workspace-dependencies,nx-project-tags,mobile-config,brand,theme-check,theme-verify,powershell-syntax,knip \
            --projects=workspace-tooling \
            --outputStyle=stream \
            --parallel=3
          pnpm exec nx run infra:compose-config --outputStyle=stream

      - name: Verify Go workspace synchronization
        shell: bash
        run: |
          set -euo pipefail
          go work sync
          drift="$(git status --porcelain -- go.work go.work.sum services/*/backend services/identity/clients/go)"
          if [[ -n "${drift}" ]]; then
            printf '%s\n' "${drift}"
            git diff -- go.work go.work.sum services/*/backend services/identity/clients/go || true
            exit 1
          fi

      - name: Verify changed source style
        shell: bash
        run: pnpm exec biome ci apps packages services tools --changed --since=${{ steps.base.outputs.sha }} --no-errors-on-unmatched --enforce-assist=false

      - name: Verify affected workspace tasks with config-only map placeholders
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: pnpm exec nx affected -t typecheck,unit,contract,build,export-smoke,vet --base=${{ steps.base.outputs.sha }} --head=HEAD --outputStyle=stream

      - name: Verify tooling is non-mutating
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          [[ -z "${drift}" ]] || { printf '%s\n' "${drift}"; git diff -- . || true; exit 1; }

  windows:
    name: repository-windows
    runs-on: windows-2025
    timeout-minutes: 12
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.NX_CLOUD_RW_TOKEN || secrets.NX_CLOUD_RO_TOKEN }}
    steps:
      - name: Configure hostile Windows Git default
        shell: pwsh
        run: git config --global core.autocrlf true

      - name: Checkout integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify LF checkout
        shell: pwsh
        run: |
          $bad = @(git ls-files --eol | Where-Object { $_ -match '\bw/(crlf|mixed)\b' })
          if ($bad.Count -gt 0) { $bad | Write-Host; throw "Tracked CRLF/mixed text detected." }

      - name: Detect mobile-affecting integration change
        id: mobile
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $base = $env:PR_BASE_SHA
          }
          elseif ($env:PUSH_BEFORE_SHA -and $env:PUSH_BEFORE_SHA -ne '0000000000000000000000000000000000000000') {
            $base = $env:PUSH_BEFORE_SHA
          }
          else {
            $base = (git rev-parse HEAD^).Trim()
          }
          git merge-base --is-ancestor $base HEAD
          if ($LASTEXITCODE -ne 0) { throw "Windows affected base is not an ancestor of HEAD: $base" }

          $changed = @(git diff --name-only $base HEAD)
          $run = $false
          foreach ($file in $changed) {
            if ($file -match '^(apps/app-|packages/design-system/|services/(identity|dsh)/|tools/mobile/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)') { $run = $true }
          }
          "base=$base" >> $env:GITHUB_OUTPUT
          "run=$($run.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Set up Node
        if: steps.mobile.outputs.run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Verify Nx Cloud CI access configuration
        if: steps.mobile.outputs.run == 'true'
        shell: pwsh
        run: node tools/dev/verify-nx-cloud-ci.mjs

      - name: Install pinned pnpm
        if: steps.mobile.outputs.run == 'true'
        shell: pwsh
        run: npm install --global pnpm@10.34.0

      - name: Install workspace
        if: steps.mobile.outputs.run == 'true'
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify affected Windows Android exports with config-only map placeholders
        if: steps.mobile.outputs.run == 'true'
        shell: pwsh
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: pnpm exec nx affected -t export-smoke --base=${{ steps.mobile.outputs.base }} --head=HEAD --outputStyle=stream
