name: Foundation Baseline Guard

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: foundation-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Enforce canonical foundation invariants
        shell: bash
        run: |
          set -euo pipefail

          required=(
            README.md
            SECURITY.md
            CONTRIBUTING.md
            governance
            docs
            tools/prompting/bthwani-orchestrator/00-ORCHESTRATOR.md
            .github/CODEOWNERS
            .github/pull_request_template.md
            package.json
            pnpm-workspace.yaml
            pnpm-lock.yaml
            nx.json
            go.work
          )

          for path in "${required[@]}"; do
            [[ -e "${path}" ]] || {
              echo "::error::Required foundation path missing: ${path}"
              exit 1
            }
          done

          if [[ -d tools/prompting/bthwani-refoundation ]]; then
            [[ -f tools/prompting/bthwani-refoundation/00-ENTRYPOINT.md ]] || {
              echo "::error::Refoundation package exists without its entrypoint"
              exit 1
            }

            orchestrator_profile="$(awk -F': ' '/^REFOUNDATION_PROFILE_REVISION:/ {print $2; exit}' tools/prompting/bthwani-orchestrator/00-ORCHESTRATOR.md)"
            refoundation_revision="$(awk -F': ' '/^PACKAGE_REVISION:/ {print $2; exit}' tools/prompting/bthwani-refoundation/00-ENTRYPOINT.md)"

            [[ -n "${orchestrator_profile}" && "${orchestrator_profile}" == "${refoundation_revision}" ]] || {
              echo "::error::Orchestrator/refoundation revision mismatch: orchestrator=${orchestrator_profile:-missing} refoundation=${refoundation_revision:-missing}"
              exit 1
            }
          fi

          for root in core shared; do
            [[ ! -e "${root}" ]] || {
              echo "::error::Forbidden top-level ownership class: ${root}"
              exit 1
            }
          done

          if [[ -d apps ]] && find apps -mindepth 2 -maxdepth 2 -type d -name runtime -print -quit | grep -q .; then
            echo "::error::Pass-through apps/*/runtime topology is forbidden"
            exit 1
          fi

          forbidden='bthwani2-boop/bthwani-suite-next|bthwani-suite-next|D:\\bthwani-suite-next|C:\\bthwani-secrets|origin/h|RE_PIN_h|UNKNOWN_CURRENT_h_HEAD|H_TRUSTWORTHY_CANONICAL_BASELINE_REFOUNDATION_COMPLETE'

          if git grep -n -I -E -- "${forbidden}" -- .             ':(exclude).github/workflows/baseline-guard.yml'             ':(exclude)tools/prompting/bthwani-refoundation/**' ; then
            echo "::error::Donor/campaign-specific authority residue found"
            exit 1
          fi

          if grep -R -n -E -- '^[[:space:]]*pull_request_target:' .github/workflows; then
            echo "::error::pull_request_target is forbidden in foundation workflows"
            exit 1
          fi

          if grep -R -n -E -- '^[[:space:]]*permissions:[[:space:]]*write-all' .github/workflows; then
            echo "::error::write-all workflow permissions are forbidden"
            exit 1
          fi

          while IFS= read -r use; do
            ref="${use#*uses:}"
            ref="${ref%%#*}"
            ref="${ref//[[:space:]]/}"

            [[ "${ref}" == ./* ]] && continue

            [[ "${ref}" =~ @[0-9a-fA-F]{40}$ ]] || {
              echo "::error::Action is not pinned to a full commit SHA: ${ref}"
              exit 1
            }
          done < <(grep -R -h -E -- '^[[:space:]]*uses:[[:space:]]*' .github/workflows || true)

          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Install pinned pnpm
        shell: bash
        run: npm install --global pnpm@10.34.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/identity/backend/go.mod
            services/workforce/backend/go.mod
            services/dsh/backend/go.mod
            services/wlt/backend/go.mod

      - name: Verify pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v24.17.0" ]]
          [[ "$(pnpm --version)" == "10.34.0" ]]
          [[ "$(go version)" == *"go1.27.1"* ]]

      - name: Frozen workspace install
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify mobile deployable identities
        shell: bash
        run: pnpm run mobile:verify-config

      - name: Verify workspace dependency references
        shell: bash
        run: node tools/dev/verify-workspace-dependencies.mjs

      - name: Verify Nx project tags
        shell: bash
        run: pnpm run nx:verify-tags

      - name: Discover Nx projects
        shell: bash
        run: pnpm run nx:projects

      - name: Verify PowerShell runtime scripts parse
        shell: pwsh
        run: ./tools/dev/verify-powershell-syntax.ps1

      - name: Verify workspace
        shell: bash
        run: pnpm run workspace:verify

      - name: Verify Foundation compose configuration
        shell: bash
        run: docker compose --env-file infra/local/compose/.env.example -f infra/local/compose/compose.yaml --profile foundation config >/dev/null
