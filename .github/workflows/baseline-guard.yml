name: Repository Baseline Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve affected base
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          elif [[ -n "${PUSH_BEFORE_SHA}" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            base="${PUSH_BEFORE_SHA}"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git merge-base --is-ancestor "${base}" HEAD
          echo "sha=${base}" >> "${GITHUB_OUTPUT}"
          echo "PROOF_BASE=${base}"
          echo "PROOF_HEAD=$(git rev-parse HEAD)"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Install pinned pnpm
        shell: bash
        run: npm install --global pnpm@10.34.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/identity/backend/go.sum
            services/identity/clients/go/go.mod
            services/dsh/backend/go.sum

      - name: Install workspace once
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Materialize exact pinned Governance and Docs
        shell: bash
        run: node tools/dev/knowledge-source.mjs

      - name: Verify repository and knowledge invariants
        shell: bash
        run: |
          set -euo pipefail
          node tools/dev/verify-donor-residue.mjs
          node tools/dev/verify-repository-structure.mjs
          node tools/dev/verify-structural-hygiene.mjs
          node tools/dev/verify-local-runtime-ownership.mjs
          node tools/dev/verify-removed-human-domain-residue.mjs
          node tools/dev/verify-doc-command-parity.mjs
          node tools/dev/verify-doc-config-parity.mjs
          node tools/dev/verify-knowledge-system.mjs
          node tools/dev/verify-knowledge-references.mjs
          node tools/dev/verify-agent-knowledge-contract.mjs
          node tools/dev/verify-workspace-dependencies.mjs
          node tools/dev/verify-nx-project-tags.mjs
          pnpm run mobile:verify-config
          pnpm run brand:check
          pnpm run theme:check
          pnpm run theme:verify
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/dev/verify-powershell-syntax.ps1

      - name: Verify Go workspace synchronization
        shell: bash
        run: |
          set -euo pipefail
          go work sync
          drift="$(git status --porcelain -- go.work go.work.sum services/*/backend services/identity/clients/go)"
          if [[ -n "${drift}" ]]; then
            printf '%s\n' "${drift}"
            git diff -- go.work go.work.sum services/*/backend services/identity/clients/go || true
            exit 1
          fi

      - name: Verify changed source style
        shell: bash
        run: pnpm exec biome ci apps packages services tools --changed --since=${{ steps.base.outputs.sha }} --enforce-assist=false

      - name: Verify affected workspace tasks
        shell: bash
        run: pnpm exec nx affected -t typecheck,test,build,export-smoke,vet --base=${{ steps.base.outputs.sha }} --head=HEAD --outputStyle=stream

      - name: Verify repository liveness for source changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "${{ steps.base.outputs.sha }}" HEAD -- apps packages services tools package.json pnpm-lock.yaml pnpm-workspace.yaml; then
            echo "KNIP=SKIPPED reason=no_source_or_dependency_change"
          else
            pnpm exec knip --no-progress --reporter compact --no-config-hints
          fi

      - name: Verify canonical Compose configuration
        shell: bash
        run: docker compose --project-name samrim-local --env-file infra/local/compose/.env.example -f infra/local/compose/compose.yaml config --quiet

      - name: Verify tooling is non-mutating
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          [[ -z "${drift}" ]] || { printf '%s\n' "${drift}"; git diff -- . || true; exit 1; }

  windows:
    name: repository-windows
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Configure hostile Windows Git default
        shell: pwsh
        run: git config --global core.autocrlf true

      - name: Checkout integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify LF checkout
        shell: pwsh
        run: |
          $bad = @(git ls-files --eol | Where-Object { $_ -match '\bw/(crlf|mixed)\b' })
          if ($bad.Count -gt 0) { $bad | Write-Host; throw "Tracked CRLF/mixed text detected." }

      - name: Detect mobile-affecting integration change
        id: mobile
        shell: pwsh
        run: |
          $changed = @(git diff --name-only HEAD^ HEAD)
          $run = $false
          foreach ($file in $changed) {
            if ($file -match '^(apps/app-|packages/design-system/|services/(identity|dsh)/|tools/mobile/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)') { $run = $true }
          }
          "run=$($run.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Set up Node
        if: steps.mobile.outputs.run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Install pinned pnpm
        if: steps.mobile.outputs.run == 'true'
        shell: pwsh
        run: npm install --global pnpm@10.34.0

      - name: Install workspace
        if: steps.mobile.outputs.run == 'true'
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify affected Windows mobile exports
        if: steps.mobile.outputs.run == 'true'
        shell: pwsh
        run: pnpm exec nx affected -t export-smoke --base=HEAD^ --head=HEAD --outputStyle=stream
