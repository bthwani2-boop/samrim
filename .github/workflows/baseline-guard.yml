name: CI Static

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.NX_CLOUD_RW_TOKEN || secrets.NX_CLOUD_RO_TOKEN }}
    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve canonical affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      - name: Report exact affected SHAs
        shell: bash
        run: |
          echo "PROOF_BASE=${NX_BASE}"
          echo "PROOF_HEAD=${NX_HEAD}"

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Nx Cloud CI access configuration
        shell: bash
        run: node tools/dev/verify-nx-cloud-ci.mjs

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/identity/backend/go.sum
            services/identity/clients/go/go.mod
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum

      - name: Install workspace once
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Materialize exact pinned Governance and Docs
        shell: bash
        run: node tools/dev/knowledge-source.mjs

      - name: Verify repository invariants through Nx
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: |
          set -euo pipefail
          pnpm exec nx run-many \
            -t donor-residue,repository-structure,structural-hygiene,runtime-ownership,removed-domain-residue,docs-command-parity,docs-config-parity,knowledge-system,knowledge-references,agent-contract,workspace-dependencies,nx-project-tags,mobile-config,brand,theme-check,theme-verify,powershell-syntax,knip \
            --projects=workspace-tooling \
            --outputStyle=stream \
            --parallel=3
          pnpm exec nx run repository-ci:tooling-lint --outputStyle=stream
          pnpm exec nx run repository-ci:execution-proof-system --outputStyle=stream
          pnpm exec nx run repository-ci:go-workspace-sync --outputStyle=stream
          pnpm exec nx run infra:compose-config --outputStyle=stream

      - name: Verify affected workspace tasks with config-only map placeholders
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: pnpm exec nx affected -t lint,format-check,typecheck,unit,contract,build,export-smoke,vet --base=$NX_BASE --head=$NX_HEAD --outputStyle=stream

      - name: Verify tooling is non-mutating
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          [[ -z "${drift}" ]] || { printf '%s\n' "${drift}"; git diff -- . || true; exit 1; }

  windows:
    name: repository-windows
    runs-on: windows-2025
    timeout-minutes: 12
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.NX_CLOUD_RW_TOKEN || secrets.NX_CLOUD_RO_TOKEN }}
    steps:
      - name: Configure hostile Windows Git default
        shell: pwsh
        run: git config --global core.autocrlf true

      - name: Checkout integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify LF checkout
        shell: pwsh
        run: |
          $bad = @(git ls-files --eol | Where-Object { $_ -match '\bw/(crlf|mixed)\b' })
          if ($bad.Count -gt 0) { $bad | Write-Host; throw "Tracked CRLF/mixed text detected." }

      - name: Resolve canonical affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Nx Cloud CI access configuration
        shell: pwsh
        run: node tools/dev/verify-nx-cloud-ci.mjs

      - name: Install workspace
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify affected Windows Android exports with config-only map placeholders
        shell: pwsh
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: pnpm exec nx affected -t export-smoke --base=$env:NX_BASE --head=$env:NX_HEAD --outputStyle=stream
