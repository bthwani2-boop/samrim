name: Control Panel Browser Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:


permissions:
  actions: read
  contents: read

concurrency:
  group: control-panel-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-panel-e2e:
    name: control-panel-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve canonical affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace once
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Resolve Control Panel runtime scope through Nx
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          affected="$(pnpm exec nx show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --projects=tag:ci-control-runtime --sep=,)"
          if [[ -n "$affected" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "CONTROL_PANEL_RUNTIME_SCOPE=AFFECTED projects=$affected"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "CONTROL_PANEL_RUNTIME_SCOPE=UNAFFECTED"
          fi

      - name: Install Chromium runtime
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: pnpm --dir apps/control-panel exec playwright install --with-deps chromium

      - name: Materialize isolated CI runtime environment
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = "infra/local/.env";
          const example = fs.readFileSync("infra/local/.env.example", "utf8");
          const names = [
            "SAMRIM_POSTGRES_PASSWORD",
            "IDENTITY_CHALLENGE_HMAC_SECRET",
            "IDENTITY_DSH_SERVICE_TOKEN",
            "CONTROL_PANEL_SERVICE_TOKEN",
            "IDENTITY_ABUSE_HMAC_SECRET",
            "OPERATOR_BOOTSTRAP_SECRET",
          ];
          const values = new Map(names.map((name) => [name, crypto.randomBytes(32).toString("hex")]));
          values.set("DSH_DELIVERY_PROOF_KEYRING", JSON.stringify({ "local-v1": crypto.randomBytes(32).toString("base64") }));
          const output = example.split(/\r?\n/).map((line) => {
            const separator = line.indexOf("=");
            if (separator < 1) return line;
            const name = line.slice(0, separator).trim();
            return values.has(name) ? `${name}=${values.get(name)}` : line;
          }).join("\n");
          fs.writeFileSync(path, output.endsWith("\n") ? output : `${output}\n`, { mode: 0o600 });
          NODE

      - name: Start Control Panel backend cone
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            --project-name samrim-local \
            --env-file infra/local/.env \
            -f infra/local/compose/compose.yaml \
            up -d --build --wait --wait-timeout 300 \
            postgres mailpit identity dsh

      - name: Start Control Panel host
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/local/.env
          set +a
          export NODE_ENV=development NEXT_TELEMETRY_DISABLED=1 NEXT_PRIVATE_DISABLE_DEV_OVERLAY_UX=1
          pnpm --dir apps/control-panel exec next dev -H 127.0.0.1 -p "$SAMRIM_CONTROL_PORT" > "$RUNNER_TEMP/control-panel.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/control-panel.pid"
          for attempt in {1..120}; do
            if curl --fail --silent --output /dev/null "http://127.0.0.1:$SAMRIM_CONTROL_PORT/"; then exit 0; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/control-panel.log" || true
          exit 1

      - name: Run Control Panel browser shell through Nx
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:13000
          CONTROL_PANEL_PUBLIC_ORIGIN: http://localhost:13000
        run: pnpm exec nx run control-panel:e2e --outputStyle=stream

      - name: Run live Identity browser proof
        if: steps.scope.outputs.run == 'true'
        env:
          BTHWANI_IDENTITY_PROOF_SCOPE: disposable-ci
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/local/.env
          set +a
          export PLAYWRIGHT_BASE_URL="$CONTROL_PANEL_PUBLIC_ORIGIN"
          export PLAYWRIGHT_IDENTITY_API_BASE_URL="$IDENTITY_API_BASE_URL"
          export PLAYWRIGHT_DSH_API_BASE_URL="$DSH_API_BASE_URL"
          export PLAYWRIGHT_MAILPIT_BASE_URL="http://127.0.0.1:${SAMRIM_MAILPIT_WEB_PORT}"
          export PLAYWRIGHT_IDENTITY_BOOTSTRAP_TOKEN="$OPERATOR_BOOTSTRAP_SECRET"
          export PLAYWRIGHT_CONTROL_PANEL_SERVICE_TOKEN="$CONTROL_PANEL_SERVICE_TOKEN"
          pnpm --dir apps/control-panel test:e2e:live

      - name: Report Control Panel and Identity runtime errors
        if: failure() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/control-panel.log" ]]; then
            grep -Ei 'error|exception|panic|internal server error' "$RUNNER_TEMP/control-panel.log" | tail -n 80 || true
          fi
          docker compose \
            --project-name samrim-local \
            --env-file infra/local/.env \
            -f infra/local/compose/compose.yaml \
            logs --no-color --since=5m identity 2>&1 \
            | grep -Ei 'error|exception|panic|internal server error' \
            | tail -n 80 || true

      - name: Stop Control Panel host
        if: always() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/control-panel.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/control-panel.pid")" 2>/dev/null || true
          fi

      - name: Purge Control Panel runtime
        if: always() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f infra/local/.env ]]; then
            docker compose \
              --project-name samrim-local \
              --env-file infra/local/.env \
              -f infra/local/compose/compose.yaml \
              down --volumes --remove-orphans
            rm -f infra/local/.env
          fi
