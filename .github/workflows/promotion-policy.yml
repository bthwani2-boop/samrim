name: Promotion Policy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  promotion-policy:
    name: promotion-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || 'refs/heads/main' }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate promotion metadata
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          BASE_SHA="${EVENT_BASE_SHA}"
          report="${RUNNER_TEMP}/promotion-policy.txt"; : >"${report}"; findings=0
          violation() { echo "$*" >>"${report}"; findings=$((findings + 1)); }

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            violation "promotion-policy requires a pull_request event"
          else
            [[ "${PR_BASE}" == "main" ]] || violation "base branch must be main"
            (( ${#PR_TITLE} >= 8 )) || violation "PR title is too short"
            (( ${#PR_BODY} >= 120 )) || violation "PR body is too short"
            for heading in '## Summary' '## Migration / Cutover' '## Verification' '## Security / Secrets' '## Negative space'; do
              grep -Fq -- "${heading}" <<<"${PR_BODY}" || violation "missing PR section: ${heading}"
            done
          fi

          status=PASS; reason=""
          if [[ "${findings}" -gt 0 ]]; then status=FAIL; reason="promotion metadata policy failed"; fi
          [[ -s "${report}" ]] || echo "promotion metadata policy passed" >"${report}"
          cat "${report}"
          node tools/ci/evidence.mjs --claim promotion.policy --tool samrim-promotion-policy --version 1 --candidate "${CANDIDATE_SHA}" --base "${BASE_SHA}" --scope pull-request --expected-scope pull-request --status "${status}" --findings "${findings}" --report "${report}" --format text --reason "${reason}"
          [[ "${status}" == "PASS" ]]
      - name: Upload promotion policy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-promotion-policy-${{ github.run_id }}
          path: .ci-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
