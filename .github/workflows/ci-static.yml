name: CI Static

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 1 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.NX_CLOUD_RW_TOKEN || secrets.NX_CLOUD_RO_TOKEN }}
      NX_NO_CLOUD: ${{ github.event_name == 'pull_request' && secrets.NX_CLOUD_RO_TOKEN == '' && 'true' || 'false' }}
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: bash
        run: node tools/dev/verify-ci-exact-sha.mjs

      - name: Resolve canonical affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      - name: Verify exact affected candidate
        shell: bash
        env:
          REQUIRE_NX_HEAD: "true"
        run: node tools/dev/verify-ci-exact-sha.mjs

      - name: Report exact affected SHAs
        shell: bash
        run: |
          echo "PROOF_BASE=${NX_BASE}"
          echo "PROOF_HEAD=${NX_HEAD}"
          echo "CANDIDATE_SHA=${CANDIDATE_SHA}"

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Nx Cloud CI access configuration
        shell: bash
        run: node tools/dev/verify-nx-cloud-ci.mjs

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/identity/backend/go.sum
            services/identity/clients/go/go.mod
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum

      - name: Install workspace once
        shell: bash
        run: node tools/dev/run-ci-command.mjs static-install -- pnpm install --frozen-lockfile

      - name: Materialize exact pinned Governance and Docs through Nx
        shell: bash
        run: pnpm exec nx run workspace-tooling:knowledge-materialize --outputStyle=stream

      - name: Verify repository invariants through Nx
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: |
          set -euo pipefail
          pnpm exec nx run-many \
            -t donor-residue,repository-structure,structural-hygiene,runtime-ownership,removed-domain-residue,cache-contracts,docs-command-parity,docs-config-parity,knowledge-system,knowledge-references,agent-contract,workspace-dependencies,nx-project-tags,mobile-config,brand,theme-check,theme-verify,powershell-syntax,knip \
            --outputStyle=stream \
            --parallel=3
          pnpm exec nx run repository-ci:execution-proof-system --outputStyle=stream
          pnpm exec nx run workspace-tooling:go-workspace-sync --outputStyle=stream
          pnpm exec nx run infra:compose-config --outputStyle=stream

      - name: Verify affected static graph
        if: github.event_name != 'schedule'
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: node tools/dev/run-ci-command.mjs static-affected -- pnpm exec nx affected -t lint,format-check,typecheck,unit,contract,build,export-smoke,vet --base=$NX_BASE --head=$NX_HEAD --outputStyle=stream

      - name: Verify full static graph
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: node tools/dev/run-ci-command.mjs static-full -- pnpm exec nx run-many -t lint,format-check,typecheck,unit,contract,build,export-smoke,vet --outputStyle=stream --parallel=3 --skip-nx-cache

      - name: Verify tooling is non-mutating
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          [[ -z "${drift}" ]] || { printf '%s\n' "${drift}"; git diff -- . || true; exit 1; }

      - name: Capture static failure package
        id: failure_package
        if: failure()
        shell: bash
        run: node tools/dev/capture-ci-failure.mjs --kind=static-linux

      - name: Upload static failure package
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-linux-failure-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ steps.failure_package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Report static CI performance
        if: always()
        shell: bash
        run: node tools/dev/report-ci-performance.mjs

  windows:
    name: repository-windows
    runs-on: windows-2025
    timeout-minutes: 12
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'nx-cloud-protected' || 'nx-cloud-unprotected' }}
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.NX_CLOUD_RW_TOKEN || secrets.NX_CLOUD_RO_TOKEN }}
      NX_NO_CLOUD: ${{ github.event_name == 'pull_request' && secrets.NX_CLOUD_RO_TOKEN == '' && 'true' || 'false' }}
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Configure hostile Windows Git default
        shell: pwsh
        run: git config --global core.autocrlf true

      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: pwsh
        run: node tools/dev/verify-ci-exact-sha.mjs

      - name: Verify LF checkout
        shell: pwsh
        run: |
          $bad = @(git ls-files --eol | Where-Object { $_ -match '\bw/(crlf|mixed)\b' })
          if ($bad.Count -gt 0) { $bad | Write-Host; throw "Tracked CRLF/mixed text detected." }

      - name: Resolve canonical affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      - name: Verify exact affected candidate
        shell: pwsh
        env:
          REQUIRE_NX_HEAD: "true"
        run: node tools/dev/verify-ci-exact-sha.mjs

      - name: Set up pinned pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Nx Cloud CI access configuration
        shell: pwsh
        run: node tools/dev/verify-nx-cloud-ci.mjs

      - name: Install workspace
        shell: pwsh
        run: node tools/dev/run-ci-command.mjs windows-install -- pnpm install --frozen-lockfile

      - name: Verify affected Windows Android exports
        if: github.event_name != 'schedule'
        shell: pwsh
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: node tools/dev/run-ci-command.mjs windows-export-affected -- pnpm exec nx affected -t export-smoke --base=$env:NX_BASE --head=$env:NX_HEAD --outputStyle=stream

      - name: Verify full Windows Android exports
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
          GOOGLE_MAPS_IOS_API_KEY_APP_CAPTAIN: maps-config-placeholder-1
          GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
        run: node tools/dev/run-ci-command.mjs windows-export-full -- pnpm exec nx run-many -t export-smoke --outputStyle=stream --parallel=2 --skip-nx-cache

      - name: Verify Windows proof is non-mutating
        if: always()
        shell: pwsh
        run: |
          $drift = @(git status --porcelain=v1 --untracked-files=all)
          if ($drift.Count -gt 0) {
            $drift | Write-Host
            git diff -- .
            throw "Windows static proof mutated repository state."
          }

      - name: Capture Windows static failure package
        id: failure_package
        if: failure()
        shell: pwsh
        run: node tools/dev/capture-ci-failure.mjs --kind=static-windows

      - name: Upload Windows static failure package
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-windows-failure-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: ${{ steps.failure_package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Report Windows static CI performance
        if: always()
        shell: pwsh
        run: node tools/dev/report-ci-performance.mjs
