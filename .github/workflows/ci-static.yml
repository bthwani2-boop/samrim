name: CI Static

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 1 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NX_NO_CLOUD: "true"
      GOOGLE_MAPS_ANDROID_API_KEY_APP_CLIENT: maps-config-placeholder-0
      GOOGLE_MAPS_ANDROID_API_KEY_APP_PARTNER: maps-config-placeholder-0
      GOOGLE_MAPS_ANDROID_API_KEY_APP_CAPTAIN: maps-config-placeholder-0
      GOOGLE_MAPS_ANDROID_API_KEY_APP_FIELD: maps-config-placeholder-0
      GOOGLE_MAPS_IOS_API_KEY: maps-config-placeholder-1
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve affected SHAs
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/identity/backend/go.sum
            services/identity/clients/go/go.mod
            services/dsh/backend/go.sum
            services/wlt/backend/go.sum

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Lint development tooling
        run: pnpm exec biome lint tools/dev --diagnostic-level=error

      - name: Verify affected static graph
        if: github.event_name != 'schedule'
        run: pnpm exec nx affected -t lint,format-check,typecheck,unit,contract,build,vet,export-smoke --base=$NX_BASE --head=$NX_HEAD --outputStyle=stream --parallel=3 --nxBail=true

      - name: Weekly full static regression
        if: github.event_name == 'schedule'
        run: pnpm exec nx run-many -t lint,format-check,typecheck,unit,contract,build,vet,export-smoke --all --outputStyle=stream --parallel=3 --skip-nx-cache

      - name: Verify clean checkout
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=all)"

  windows:
    name: repository-windows
    runs-on: windows-2025
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify PowerShell syntax
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/powershell/verify-syntax.ps1
