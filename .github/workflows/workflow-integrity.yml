name: Workflow Integrity

on:
  workflow_call:
    inputs:
      candidate_sha: {required: true, type: string}
      base_sha: {required: false, type: string, default: ""}
  workflow_dispatch:
    inputs:
      candidate_sha: {description: Exact candidate SHA, required: true, type: string}
      base_sha: {description: Optional base SHA, required: false, default: "", type: string}

permissions:
  contents: read

jobs:
  actionlint:
    name: actions-correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install actionlint and ShellCheck
        run: bash tools/ci/install-assurance-tools.sh actionlint shellcheck
      - name: Run actionlint with pinned ShellCheck
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -u
          source tools/ci/tool-versions.env
          actionlint -version
          shellcheck --version
          report="${RUNNER_TEMP}/actionlint.txt"; started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; code=0
          actionlint -shellcheck "$(command -v shellcheck)" >"${report}" 2>&1 || code="${?}"
          findings="$(grep -Ec '^[^:]+:[0-9]+:[0-9]+:' "${report}" 2>/dev/null || true)"
          status=PASS; reason=""
          if [[ "${code}" -ne 0 && "${findings}" -eq 0 ]]; then status=TOOL_ERROR; findings=1; reason="actionlint failed without parseable findings"
          elif [[ "${code}" -ne 0 || "${findings}" -gt 0 ]]; then status=FAIL; reason="actionlint or ShellCheck found blocking issues"
          fi
          [[ -s "${report}" ]] || echo "no actionlint or ShellCheck findings" >"${report}"
          cat "${report}"
          node tools/ci/evidence.mjs --claim workflow.actionlint --tool actionlint+shellcheck --version "${ACTIONLINT_VERSION}+${SHELLCHECK_VERSION}" --candidate "${CANDIDATE_SHA}" --base "${BASE_SHA}" --scope .github/workflows --expected-scope .github/workflows --status "${status}" --findings "${findings}" --started "${started}" --report "${report}" --format text --reason "${reason}"
          [[ "${status}" == "PASS" ]]
      - name: Upload actionlint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-workflow-actionlint-${{ github.run_id }}
          path: .ci-evidence
          if-no-files-found: error
          retention-days: 14

  zizmor:
    name: actions-security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install zizmor
        run: bash tools/ci/install-assurance-tools.sh zizmor
      - name: Run zizmor
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          source tools/ci/tool-versions.env
          zizmor --version
          report="${RUNNER_TEMP}/zizmor.sarif"; stderr_report="${RUNNER_TEMP}/zizmor.stderr"; started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; code=0
          zizmor --config .github/zizmor.yml --strict-collection --min-severity medium --min-confidence medium --format=sarif --color=never . >"${report}" 2>"${stderr_report}" || code="${?}"
          cat "${stderr_report}" >&2 || true
          status=PASS; reason=""; findings=0
          if ! jq -e . "${report}" >/dev/null 2>&1; then
            status=TOOL_ERROR; findings=1; reason="zizmor did not produce valid SARIF"
          else
            findings="$(jq '[.runs[]?.results[]?] | length' "${report}")"
            if [[ "${findings}" -gt 0 ]]; then status=FAIL; reason="zizmor found blocking workflow-security issues"
            elif [[ "${code}" -ne 0 ]]; then status=TOOL_ERROR; findings=1; reason="zizmor failed without findings"
            fi
          fi
          node tools/ci/evidence.mjs --claim workflow.zizmor --tool zizmor --version "${ZIZMOR_VERSION}" --candidate "${CANDIDATE_SHA}" --base "${BASE_SHA}" --scope .github --expected-scope .github --status "${status}" --findings "${findings}" --started "${started}" --report "${report}" --format sarif --reason "${reason}"
          [[ "${status}" == "PASS" ]]
      - name: Upload zizmor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-workflow-zizmor-${{ github.run_id }}
          path: .ci-evidence
          if-no-files-found: error
          retention-days: 14

  pinact:
    name: actions-pinning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinact
        run: bash tools/ci/install-assurance-tools.sh pinact
      - name: Verify all discovered action SHA annotations
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          source tools/ci/tool-versions.env
          pinact version
          report="${RUNNER_TEMP}/pinact.txt"; started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; code=0
          pinact run --check --verify >"${report}" 2>&1 || code="${?}"
          findings=0; status=PASS; reason=""
          if [[ "${code}" -ne 0 ]]; then findings=1; status=FAIL; reason="pinact verification failed"; fi
          [[ -s "${report}" ]] || echo "all discovered GitHub Actions are pinned and verified" >"${report}"
          cat "${report}"
          node tools/ci/evidence.mjs --claim workflow.pinact --tool pinact --version "${PINACT_VERSION}" --candidate "${CANDIDATE_SHA}" --base "${BASE_SHA}" --scope .github/workflows --expected-scope .github/workflows --status "${status}" --findings "${findings}" --started "${started}" --report "${report}" --format text --reason "${reason}"
          [[ "${status}" == "PASS" ]]
      - name: Upload pinact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-workflow-pinact-${{ github.run_id }}
          path: .ci-evidence
          if-no-files-found: error
          retention-days: 14
