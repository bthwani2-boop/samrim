name: One-shot app-client runtime materialization

on:
  push:
    branches:
      - a
    paths:
      - .github/workflows/materialize-app-client-runtime-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout samrim
        uses: actions/checkout@v4
        with:
          ref: a
          fetch-depth: 0

      - name: Checkout donor h
        uses: actions/checkout@v4
        with:
          repository: bthwani2-boop/bthwani-suite-next
          ref: h
          path: .donor
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.17.0

      - name: Verify donor and materializer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .donor rev-parse HEAD)" = "14c2ef2fd5a0ffadda00d307c9dea81d5cf49799"
          node --check tools/migration/materialize-app-client-runtime.mjs

      - name: Materialize app-client runtime equivalence
        shell: bash
        run: |
          set -euo pipefail
          node tools/migration/materialize-app-client-runtime.mjs
          rm -rf .donor

      - name: Activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.34.0 --activate
          test "$(pnpm --version)" = "10.34.0"

      - name: Generate lockfile and install
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Generate Identity client
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir services/identity openapi:generate

      - name: Verify app-owned Expo identity
        shell: bash
        run: |
          set -euo pipefail
          pnpm mobile:verify-config
          pnpm --dir apps/app-client exec expo config --type public --json > /tmp/app-client-config.json
          node -e "const c=require('/tmp/app-client-config.json');if(c.slug!=='app-client-next'||c.scheme!=='bthwani-client-next'||c.owner!=='bthwani1'||c.version!=='0.3.0'||c.android?.package!=='com.bthwani.client.next'||c.ios?.bundleIdentifier!=='com.bthwani.client.next'||c.extra?.eas?.projectId!=='abec897b-1f5f-409d-8286-607a5a6b69e2')process.exit(7);console.log('APP_CLIENT_EXPO_IDENTITY=PASS')"

      - name: Verify Android JavaScript bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/app-client-export
          pnpm --dir apps/app-client exec expo export --platform android --output-dir /tmp/app-client-export
          test -d /tmp/app-client-export
          echo APP_CLIENT_ANDROID_JS_BUNDLE=PASS
          echo NO_EAS_BUILD=PASS
          echo NO_EXPO_PREBUILD=PASS

      - name: Verify negative space
        shell: bash
        run: |
          set -euo pipefail
          test ! -d core
          test ! -d shared
          if git grep -n -e '@bthwani/core-identity' -e '@bthwani/data-runtime' -e '@bthwani/ui-kit' -- apps/app-client services/dsh packages/design-system packages/query-runtime; then
            exit 8
          fi
          git diff --check

      - name: Commit runtime equivalence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "bthwani2-boop"
          git config user.email "242864241+bthwani2-boop@users.noreply.github.com"
          git add apps/app-client services/dsh services/identity/clients/generated packages/design-system packages/query-runtime package.json pnpm-lock.yaml docs/evidence/app-client-runtime-equivalence.json
          git commit -m "refactor(mobile): materialize app-client runtime equivalence"
          git pull --rebase origin a
          git push origin HEAD:a
