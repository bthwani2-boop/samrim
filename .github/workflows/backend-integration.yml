name: Repository Backend Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-backend-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: repository-backend-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect backend-affecting change
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          elif [[ -n "${PUSH_BEFORE_SHA}" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            base="${PUSH_BEFORE_SHA}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            base="$(git rev-parse HEAD^)"
          else
            git show-ref --verify --quiet refs/remotes/origin/main || { echo "origin/main is required to scope a manual branch run"; exit 1; }
            base="$(git merge-base origin/main HEAD)"
          fi
          changed="$(git diff --name-only "${base}" HEAD)"
          if grep -Eq '^(services/(identity|dsh)/(backend|database|clients/go|contracts)/|services/wlt/|infra/local/(compose/|\.env\.example$)|tools/dev/(mailpit-challenge|run-playwright-live|verify-(identity-migrations|identity-runtime|dsh-baseline|dsh-runtime-core))\.mjs$|apps/control-panel/(package\.json|playwright\.config\.ts|playwright\.global-setup\.ts|tests/(00-live-identity|finance-runtime|zz-dsh-operator)\.spec\.ts|tests/live-identity-proof-helpers\.ts)$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|go\.work$|go\.work\.sum$|\.github/workflows/backend-integration\.yml$)' <<<"${changed}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "BACKEND_INTEGRATION_SCOPE=AFFECTED"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "BACKEND_INTEGRATION_SCOPE=UNAFFECTED"
          fi
          if grep -Eq '^(services/wlt/|services/dsh/backend/internal/integrations/wlt/|services/dsh/backend/internal/storage/postgres/order\.go$|services/dsh/database/migrations/022_order_payment_intents\.sql$|infra/local/compose/|infra/local/\.env\.example$|\.github/workflows/backend-integration\.yml$)' <<<"${changed}"; then
            echo "wlt=true" >> "${GITHUB_OUTPUT}"
            echo "WLT_CI_COMPOSITION_SCOPE=AFFECTED"
          else
            echo "wlt=false" >> "${GITHUB_OUTPUT}"
            echo "WLT_CI_COMPOSITION_SCOPE=UNAFFECTED"
          fi

      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Install pinned pnpm
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: npm install --global pnpm@10.34.0

      - name: Install workspace once
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Chromium runtime
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: pnpm --dir apps/control-panel exec playwright install --with-deps chromium

      - name: Materialize isolated CI runtime environment
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = "infra/local/.env";
          const example = fs.readFileSync("infra/local/.env.example", "utf8");
          const names = [
            "SAMRIM_POSTGRES_PASSWORD",
            "IDENTITY_CHALLENGE_HMAC_SECRET",
            "IDENTITY_DSH_SERVICE_TOKEN",
            "CONTROL_PANEL_SERVICE_TOKEN",
            "WLT_DSH_SERVICE_TOKEN",
            "IDENTITY_ABUSE_HMAC_SECRET",
            "OPERATOR_BOOTSTRAP_SECRET",
          ];
          const values = new Map(names.map((name) => [name, crypto.randomBytes(32).toString("hex")]));
          values.set("DSH_DELIVERY_PROOF_KEYRING", JSON.stringify({ "local-v1": crypto.randomBytes(32).toString("base64") }));
          const output = example.split(/\r?\n/).map((line) => {
            const separator = line.indexOf("=");
            if (separator < 1) return line;
            const name = line.slice(0, separator).trim();
            return values.has(name) ? `${name}=${values.get(name)}` : line;
          }).join("\n");
          fs.writeFileSync(path, output.endsWith("\n") ? output : `${output}\n`, { mode: 0o600 });
          NODE

      - name: Start exact backend services
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          docker compose \
            --project-name samrim-local \
            --env-file infra/local/.env \
            -f infra/local/compose/compose.yaml \
            up -d --build --wait --wait-timeout 300 \
            postgres mailpit identity dsh

      - name: Start WLT service for CI composition and health
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.wlt == 'true'
        shell: bash
        run: |
          docker compose \
            --project-name samrim-local \
            --env-file infra/local/.env \
            -f infra/local/compose/compose.yaml \
            up -d --build --wait --wait-timeout 300 \
            wlt

      - name: Start Control Panel host
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/local/.env
          set +a
          export NODE_ENV=development NEXT_TELEMETRY_DISABLED=1 NEXT_PRIVATE_DISABLE_DEV_OVERLAY_UX=1
          pnpm --dir apps/control-panel exec next dev -H 127.0.0.1 -p "$SAMRIM_CONTROL_PORT" > "$RUNNER_TEMP/control-panel.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/control-panel.pid"
          for attempt in {1..120}; do
            if curl --fail --silent --output /dev/null "http://127.0.0.1:$SAMRIM_CONTROL_PORT/"; then exit 0; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/control-panel.log" || true
          exit 1

      - name: Establish active Operator through canonical Passkey flow
        if: steps.scope.outputs.run == 'true'
        env:
          BTHWANI_IDENTITY_PROOF_SCOPE: disposable-ci
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source infra/local/.env
          set +a
          export PLAYWRIGHT_BASE_URL="$CONTROL_PANEL_PUBLIC_ORIGIN"
          export PLAYWRIGHT_IDENTITY_API_BASE_URL="$IDENTITY_API_BASE_URL"
          export PLAYWRIGHT_DSH_API_BASE_URL="$DSH_API_BASE_URL"
          export PLAYWRIGHT_MAILPIT_BASE_URL="http://127.0.0.1:${SAMRIM_MAILPIT_WEB_PORT}"
          export PLAYWRIGHT_IDENTITY_BOOTSTRAP_TOKEN="$OPERATOR_BOOTSTRAP_SECRET"
          export PLAYWRIGHT_CONTROL_PANEL_SERVICE_TOKEN="$CONTROL_PANEL_SERVICE_TOKEN"
          pnpm --dir apps/control-panel test:e2e:live

      - name: Report WLT payout registry diagnostics
        if: failure() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          docker compose \
            --project-name samrim-local \
            --env-file infra/local/.env \
            -f infra/local/compose/compose.yaml \
            logs --no-color --since=5m wlt 2>&1 | grep -F "WLT_PAYOUT_ERROR" || true

      - name: Verify backend runtime semantics
        if: steps.scope.outputs.run == 'true'
        env:
          BTHWANI_IDENTITY_PROOF_SCOPE: disposable-ci
        shell: bash
        run: |
          set -euo pipefail
          node tools/dev/verify-identity-migrations.mjs --env-file=infra/local/.env
          node tools/dev/verify-dsh-baseline.mjs --env-file=infra/local/.env
          node tools/dev/verify-identity-runtime.mjs --env-file=infra/local/.env

      - name: Verify DSH runtime semantics
        if: steps.scope.outputs.run == 'true'
        env:
          BTHWANI_IDENTITY_PROOF_SCOPE: disposable-ci
        shell: bash
        run: |
          set -euo pipefail
          node tools/dev/verify-dsh-runtime-core.mjs --env-file=infra/local/.env

      - name: Report DSH publication diagnostics
        if: failure() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f infra/local/.env ]]; then
            echo "No isolated runtime environment is available."
            exit 0
          fi
          if ! docker compose \
            --project-name samrim-local \
            --env-file infra/local/.env \
            -f infra/local/compose/compose.yaml \
            logs --no-color dsh 2>&1 | grep -E 'store publication (persistence|internal) failure'; then
            echo "No classified store publication diagnostics were emitted."
          fi

      - name: Verify backend proof is non-mutating
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          [[ -z "${drift}" ]] || { printf '%s\n' "${drift}"; git diff -- . || true; exit 1; }

      - name: Stop Control Panel host
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/control-panel.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/control-panel.pid")" 2>/dev/null || true
          fi

      - name: Purge backend services
        if: always() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          docker compose \
            --project-name samrim-local \
            --env-file infra/local/.env \
            -f infra/local/compose/compose.yaml \
            down --volumes --remove-orphans
          rm -f infra/local/.env
