name: Repository Backend Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-backend-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    name: repository-backend-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect backend-affecting change
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          elif [[ -n "${PUSH_BEFORE_SHA}" && "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]]; then
            base="${PUSH_BEFORE_SHA}"
          else
            base="$(git rev-parse HEAD^)"
          fi
          changed="$(git diff --name-only "${base}" HEAD)"
          if grep -Eq '^(services/(identity|dsh)/(backend|database|clients/go|contracts)/|infra/local/compose/|go\.work$|go\.work\.sum$|\.github/workflows/backend-integration\.yml$)' <<<"${changed}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "BACKEND_INTEGRATION_SCOPE=AFFECTED"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "BACKEND_INTEGRATION_SCOPE=UNAFFECTED"
          fi

      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.17.0

      - name: Start exact backend services
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          docker compose \
            --project-name samrim-local \
            --env-file infra/local/compose/.env.example \
            -f infra/local/compose/compose.yaml \
            up -d --build --wait --wait-timeout 300 \
            postgres mailpit identity dsh

      - name: Verify backend runtime semantics
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node tools/dev/verify-identity-migrations.mjs --env-file=infra/local/compose/.env.example
          node tools/dev/verify-dsh-baseline.mjs --env-file=infra/local/compose/.env.example
          node tools/dev/verify-identity-runtime.mjs --env-file=infra/local/compose/.env.example
          node tools/dev/verify-dsh-runtime.mjs --env-file=infra/local/compose/.env.example

      - name: Verify backend proof is non-mutating
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain --untracked-files=all)"
          [[ -z "${drift}" ]] || { printf '%s\n' "${drift}"; git diff -- . || true; exit 1; }

      - name: Purge backend services
        if: always() && steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          docker compose \
            --project-name samrim-local \
            --env-file infra/local/compose/.env.example \
            -f infra/local/compose/compose.yaml \
            down --volumes --remove-orphans
