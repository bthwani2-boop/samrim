name: Sonar Quality Observe

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-observe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud Observe
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_PASSWORD: sonar-proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DSH_DATABASE_URL: postgres://postgres:sonar-proof@127.0.0.1:5432/postgres?sslmode=disable

    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/dsh/backend/go.sum
            go.work.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Sonar coverage reports
        run: |
          mkdir -p coverage/sonar
          go test -coverprofile=coverage/sonar/dsh-postgres.out -count=1 ./services/dsh/backend/internal/storage/postgres
          node --experimental-test-coverage --test --test-reporter=lcov --test-reporter-destination=coverage/sonar/tools-dev.lcov \
            tools/dev/runtime-proof/resolve.test.mjs \
            tools/dev/runtime-proof/trusted-executables.test.mjs \
            tools/dev/verify-pr-policy.test.mjs \
            tools/dev/execution-proof-system.mjs \
            tools/dev/verify-wlt-contract-conformance.mjs

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # OBSERVE MODE
      # Do not enable sonar.qualitygate.wait yet.
      # Do not make this check required yet.
