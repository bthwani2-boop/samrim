name: Sonar Quality Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: sonar-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DSH_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
      IDENTITY_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
      WLT_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
      BTHWANI_EXPECTED_DATABASE_HOST: 127.0.0.1
      BTHWANI_EXPECTED_DATABASE_PORT: "5432"
      BTHWANI_EXPECTED_DATABASE_NAME: postgres
      BTHWANI_EXPECTED_DATABASE_USER: postgres
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate checkout
        run: node tools/dev/verify-ci-exact-sha.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/dsh/backend/go.sum
            services/identity/backend/go.sum
            services/wlt/backend/go.sum
            go.work.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Control Panel behavioral coverage
        run: pnpm --dir apps/control-panel exec playwright install --with-deps chromium

      - name: Generate Sonar coverage reports
        run: |
          mkdir -p coverage/sonar
          go -C services/dsh/backend test -coverprofile="$GITHUB_WORKSPACE/coverage/sonar/dsh.out" -count=1 ./...
          go -C services/identity/backend test -coverprofile="$GITHUB_WORKSPACE/coverage/sonar/identity.out" -count=1 ./...
          go -C services/wlt/backend test -coverprofile="$GITHUB_WORKSPACE/coverage/sonar/wlt.out" -count=1 ./...
          node --experimental-test-coverage --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/sonar/tools-dev.lcov \
            tools/dev/runtime-proof/resolve.test.mjs \
            tools/dev/runtime-proof/challenge-source.test.mjs \
            tools/dev/runtime-proof/canonical-dsh-migration-history.test.mjs \
            tools/dev/runtime-proof/trusted-executables.test.mjs \
            tools/dev/check-go-format.test.mjs \
            tools/dev/ci-failure-diagnostics.test.mjs \
            tools/dev/verify-pr-policy.test.mjs \
            services/identity/tests/contract-guard.test.mjs \
            tools/dev/execution-proof-system.mjs \
            tools/dev/verify-local-speed-contract.mjs \
            tools/dev/verify-local-speed-contract.test.mjs \
            tools/dev/verify-wlt-contract-conformance.mjs \
            tools/mobile/test-mobile-app-coverage.test.mjs \
            tools/mobile/test-mobile-app-coverage-partner.test.mjs \
            tools/mobile/test-mobile-app-coverage-captain.test.mjs \
            tools/mobile/test-mobile-app-coverage-field.test.mjs

      - name: Generate Control Panel browser coverage
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173
          BTHWANI_SONAR_COVERAGE: "1"
        run: pnpm --dir apps/control-panel test:e2e:sonar

      - name: Rank current Go coverage debt
        run: |
          set -euo pipefail
          echo "uncovered_statements total_statements coverage file"
          for profile in coverage/sonar/dsh.out coverage/sonar/identity.out coverage/sonar/wlt.out; do
            awk '
              NR == 1 { next }
              {
                split($1, location, ":")
                file = location[1]
                statements = $2 + 0
                total[file] += statements
                if (($3 + 0) == 0) uncovered[file] += statements
              }
              END {
                for (file in total) {
                  coverage = total[file] == 0 ? 100 : 100 * (total[file] - uncovered[file]) / total[file]
                  printf "%d\t%d\t%.1f\t%s\n", uncovered[file] + 0, total[file], coverage, file
                }
              }
            ' "$profile"
          done | sort -nr -k1,1 | sed -n '1,40p'

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: ${{ format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.event.pull_request.head.ref, github.event.pull_request.base.ref) }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Read back and enforce SonarQube Cloud evidence
        id: readback
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: bthwani2-boop_samrim
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          task_file=.scannerwork/report-task.txt
          if [[ ! -f "$task_file" ]]; then
            echo "Sonar report-task.txt is missing." >&2
            exit 1
          fi

          ce_task_url="$(sed -n 's/^ceTaskUrl=//p' "$task_file")"
          if [[ -z "$ce_task_url" ]]; then
            echo "Sonar ceTaskUrl is missing from report-task.txt." >&2
            exit 1
          fi

          ce_json=""
          for attempt in {1..30}; do
            ce_json="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$ce_task_url")"
            ce_status="$(jq -r '.task.status // empty' <<<"$ce_json")"
            case "$ce_status" in
              SUCCESS)
                break
                ;;
              FAILED|CANCELED)
                echo "Sonar compute-engine task ended with status ${ce_status}." >&2
                jq . <<<"$ce_json"
                exit 1
                ;;
              PENDING|IN_PROGRESS)
                sleep 2
                ;;
              *)
                echo "Unexpected Sonar compute-engine status: ${ce_status:-<empty>}" >&2
                jq . <<<"$ce_json"
                exit 1
                ;;
            esac
          done

          if [[ "$(jq -r '.task.status // empty' <<<"$ce_json")" != "SUCCESS" ]]; then
            echo "Timed out waiting for Sonar compute-engine processing." >&2
            exit 1
          fi

          analysis_id="$(jq -r '.task.analysisId // empty' <<<"$ce_json")"
          if [[ -z "$analysis_id" ]]; then
            echo "Sonar analysisId is missing after successful processing." >&2
            exit 1
          fi

          scope="pullRequest=${SONAR_PULL_REQUEST:?PR number is required for Sonar Cloud PR analysis}"
          issue_scope="$scope"

          evidence_dir="coverage/sonar/evidence"
          mkdir -p "$evidence_dir/scope-issue-pages" "$evidence_dir/main-issue-pages"

          quality_gate_url="https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&${scope}"
          measures_url="https://sonarcloud.io/api/measures/component?component=${SONAR_PROJECT_KEY}&${scope}&metricKeys=coverage,new_coverage,new_lines_to_cover,new_uncovered_lines,line_coverage,lines_to_cover,uncovered_lines,duplicated_lines_density,new_duplicated_lines_density,duplicated_lines,ncloc,bugs,vulnerabilities,code_smells,reliability_rating,security_rating,sqale_rating,security_hotspots"
          scope_coverage_files_url="https://sonarcloud.io/api/measures/component_tree?component=${SONAR_PROJECT_KEY}&${scope}&metricKeys=new_coverage,new_lines_to_cover,new_uncovered_lines&qualifiers=FIL&ps=500&s=metric&metricSort=new_uncovered_lines&asc=false"
          main_quality_gate_url="https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&branch=main"
          main_measures_url="https://sonarcloud.io/api/measures/component?component=${SONAR_PROJECT_KEY}&branch=main&metricKeys=coverage,new_coverage,new_lines_to_cover,new_uncovered_lines,line_coverage,lines_to_cover,uncovered_lines,duplicated_lines_density,new_duplicated_lines_density,duplicated_lines,ncloc,bugs,vulnerabilities,code_smells,reliability_rating,security_rating,sqale_rating,security_hotspots"
          main_uncovered_url="https://sonarcloud.io/api/measures/component_tree?component=${SONAR_PROJECT_KEY}&branch=main&metricKeys=coverage,lines_to_cover,uncovered_lines&qualifiers=FIL&ps=100&s=metric&metricSort=uncovered_lines&asc=false"
          main_duplicated_url="https://sonarcloud.io/api/measures/component_tree?component=${SONAR_PROJECT_KEY}&branch=main&metricKeys=duplicated_lines_density,duplicated_lines,ncloc&qualifiers=FIL&ps=100&s=metric&metricSort=duplicated_lines&asc=false"

          quality_gate_json="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$quality_gate_url")"
          measures_json="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$measures_url")"
          scope_coverage_files_json="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$scope_coverage_files_url")"
          main_quality_gate_json="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$main_quality_gate_url")"
          main_measures_json="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$main_measures_url")"
          main_uncovered_json="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$main_uncovered_url")"
          main_duplicated_json="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$main_duplicated_url")"
          gate_status="$(jq -r '.projectStatus.status // empty' <<<"$quality_gate_json")"

          printf '%s\n' "$ce_json" | jq . > "$evidence_dir/compute-engine.json"
          printf '%s\n' "$quality_gate_json" | jq . > "$evidence_dir/scope-quality-gate.json"
          printf '%s\n' "$measures_json" | jq . > "$evidence_dir/scope-measures.json"
          printf '%s\n' "$scope_coverage_files_json" | jq . > "$evidence_dir/scope-new-coverage-by-file.json"
          printf '%s\n' "$main_quality_gate_json" | jq . > "$evidence_dir/main-quality-gate.json"
          printf '%s\n' "$main_measures_json" | jq . > "$evidence_dir/main-measures.json"
          printf '%s\n' "$main_uncovered_json" | jq . > "$evidence_dir/main-top-uncovered.json"
          printf '%s\n' "$main_duplicated_json" | jq . > "$evidence_dir/main-top-duplicated.json"

          fetch_issue_pages() {
            local issue_scope="$1"
            local output_dir="$2"
            local page=1
            local fetched=0
            local total=0
            local count=0
            local page_file=""

            while :; do
              page_file="${output_dir}/page-${page}.json"
              curl --fail --silent --show-error --user "${SONAR_TOKEN}:" \
                "https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&${issue_scope}&resolved=false&ps=500&p=${page}" \
                | jq . > "$page_file"
              total="$(jq -r '.total // 0' "$page_file")"
              count="$(jq -r '.issues | length' "$page_file")"
              fetched=$((fetched + count))
              if (( count == 0 || fetched >= total )); then
                break
              fi
              page=$((page + 1))
            done
          }

          fetch_issue_pages "$issue_scope" "$evidence_dir/scope-issue-pages"
          fetch_issue_pages "branch=main" "$evidence_dir/main-issue-pages"

          jq -s '{total: (.[0].total // 0), issues: [.[].issues[]]}' "$evidence_dir"/scope-issue-pages/page-*.json > "$evidence_dir/scope-active-issues.json"
          jq -s '{total: (.[0].total // 0), issues: [.[].issues[]]}' "$evidence_dir"/main-issue-pages/page-*.json > "$evidence_dir/main-active-issues.json"

          scope_issue_total="$(jq -r '.total // 0' "$evidence_dir/scope-active-issues.json")"
          main_issue_total="$(jq -r '.total // 0' "$evidence_dir/main-active-issues.json")"

          jq -n \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg analysisId "$analysis_id" \
            --arg scope "$scope" \
            --arg issueScope "$issue_scope" \
            --arg gateStatus "$gate_status" \
            --argjson scopeActiveIssues "$scope_issue_total" \
            --argjson mainActiveIssues "$main_issue_total" \
            '{candidateSha:$candidateSha,analysisId:$analysisId,scope:$scope,issueScope:$issueScope,gateStatus:$gateStatus,scopeActiveIssues:$scopeActiveIssues,mainActiveIssues:$mainActiveIssues}' \
            > "$evidence_dir/summary.json"

          echo "Sonar analysisId: ${analysis_id}"
          echo "SONAR_CANDIDATE_SHA=${CANDIDATE_SHA}"
          echo "SONAR_SCOPE=${scope}"
          echo "SONAR_ISSUE_SCOPE=${issue_scope}"
          echo "SONAR_SCOPE_ACTIVE_ISSUES=${scope_issue_total}"
          echo "SONAR_MAIN_ACTIVE_ISSUES=${main_issue_total}"

          echo "::group::Sonar quality gate"
          jq . <<<"$quality_gate_json"
          echo "::endgroup::"

          echo "::group::Sonar measures"
          jq . <<<"$measures_json"
          echo "::endgroup::"

          echo "::group::PR new coverage by file"
          jq '[.components[] | {path, measures}]' <<<"$scope_coverage_files_json"
          echo "::endgroup::"

          echo "::group::Sonar active issues"
          jq '{total, issues: [.issues[] | {key, rule, severity, type, component, line, message}]}' "$evidence_dir/scope-active-issues.json"
          echo "::endgroup::"

          echo "::group::Main baseline measures"
          jq . <<<"$main_measures_json"
          echo "::endgroup::"

          echo "::group::Main baseline top uncovered files"
          jq '[.components[] | {path, measures}]' <<<"$main_uncovered_json"
          echo "::endgroup::"

          echo "::group::Main baseline top duplicated files"
          jq '[.components[] | {path, measures}]' <<<"$main_duplicated_json"
          echo "::endgroup::"

          if [[ "$gate_status" != "OK" ]]; then
            echo "SONAR_QUALITY_GATE=${gate_status:-UNKNOWN}" >&2
            echo "SonarQube Cloud Quality Gate is authoritative and must be OK on the exact candidate." >&2
            exit 1
          fi

          if (( scope_issue_total != 0 )); then
            echo "SONAR_SCOPE_ACTIVE_ISSUES=${scope_issue_total}" >&2
            echo "Active Sonar issues remain on the exact candidate scope." >&2
            exit 1
          fi

          echo "SONAR_QUALITY_GATE=OK"

      - name: Upload exact Sonar evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-evidence-${{ env.CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: coverage/sonar/evidence
          if-no-files-found: warn
          retention-days: 14
