name: Sonar Quality Observe

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-observe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud Observe
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DSH_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
      IDENTITY_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable

    if: >
      github.ref == 'refs/heads/main' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: |
            services/dsh/backend/go.sum
            services/identity/backend/go.sum
            services/wlt/backend/go.sum
            go.work.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Sonar coverage reports
        run: |
          mkdir -p coverage/sonar
          go -C services/dsh/backend test -coverprofile="$GITHUB_WORKSPACE/coverage/sonar/dsh.out" -count=1 ./...
          go -C services/identity/backend test -coverprofile="$GITHUB_WORKSPACE/coverage/sonar/identity.out" -count=1 ./...
          go -C services/wlt/backend test -coverprofile="$GITHUB_WORKSPACE/coverage/sonar/wlt.out" -count=1 ./...
          node --experimental-test-coverage --test --test-reporter=lcov --test-reporter-destination=coverage/sonar/tools-dev.lcov \
            tools/dev/runtime-proof/resolve.test.mjs \
            tools/dev/runtime-proof/trusted-executables.test.mjs \
            tools/dev/check-go-format.test.mjs \
            tools/dev/ci-failure-diagnostics.test.mjs \
            tools/dev/verify-pr-policy.test.mjs \
            services/identity/tests/contract-guard.test.mjs \
            tools/dev/execution-proof-system.mjs \
            tools/dev/verify-wlt-contract-conformance.mjs \
            tools/mobile/test-mobile-app-coverage.test.mjs \
            tools/mobile/test-mobile-app-coverage-partner.test.mjs \
            tools/mobile/test-mobile-app-coverage-captain.test.mjs \
            tools/mobile/test-mobile-app-coverage-field.test.mjs

      - name: Rank current Go coverage debt
        run: |
          set -euo pipefail
          echo "uncovered_statements total_statements coverage file"
          for profile in coverage/sonar/dsh.out coverage/sonar/identity.out coverage/sonar/wlt.out; do
            awk '
              NR == 1 { next }
              {
                split($1, location, ":")
                file = location[1]
                statements = $2 + 0
                total[file] += statements
                if (($3 + 0) == 0) uncovered[file] += statements
              }
              END {
                for (file in total) {
                  coverage = total[file] == 0 ? 100 : 100 * (total[file] - uncovered[file]) / total[file]
                  printf "%d\t%d\t%.1f\t%s\n", uncovered[file] + 0, total[file], coverage, file
                }
              }
            ' "$profile"
          done | sort -nr -k1,1 | sed -n '1,40p'

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.event.pull_request.head.ref, github.event.pull_request.base.ref) || format('-Dsonar.branch.name={0}', github.ref_name) }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Read back SonarQube Cloud evidence
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: bthwani2-boop_samrim
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          task_file=.scannerwork/report-task.txt
          if [[ ! -f "$task_file" ]]; then
            echo "Sonar report-task.txt is missing." >&2
            exit 1
          fi

          ce_task_url="$(sed -n 's/^ceTaskUrl=//p' "$task_file")"
          if [[ -z "$ce_task_url" ]]; then
            echo "Sonar ceTaskUrl is missing from report-task.txt." >&2
            exit 1
          fi

          ce_json=""
          for attempt in {1..30}; do
            ce_json="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$ce_task_url")"
            ce_status="$(jq -r '.task.status // empty' <<<"$ce_json")"
            case "$ce_status" in
              SUCCESS)
                break
                ;;
              FAILED|CANCELED)
                echo "Sonar compute-engine task ended with status ${ce_status}." >&2
                jq . <<<"$ce_json"
                exit 1
                ;;
              PENDING|IN_PROGRESS)
                sleep 2
                ;;
              *)
                echo "Unexpected Sonar compute-engine status: ${ce_status:-<empty>}" >&2
                jq . <<<"$ce_json"
                exit 1
                ;;
            esac
          done

          if [[ "$(jq -r '.task.status // empty' <<<"$ce_json")" != "SUCCESS" ]]; then
            echo "Timed out waiting for Sonar compute-engine processing." >&2
            exit 1
          fi

          analysis_id="$(jq -r '.task.analysisId // empty' <<<"$ce_json")"
          if [[ -z "$analysis_id" ]]; then
            echo "Sonar analysisId is missing after successful processing." >&2
            exit 1
          fi

          if [[ -n "${SONAR_PULL_REQUEST:-}" ]]; then
            scope="pullRequest=${SONAR_PULL_REQUEST}"
          else
            scope="branch=${GITHUB_REF_NAME}"
          fi

          quality_gate_url="https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}&${scope}"
          measures_url="https://sonarcloud.io/api/measures/component?component=${SONAR_PROJECT_KEY}&${scope}&metricKeys=coverage,new_coverage,line_coverage,lines_to_cover,uncovered_lines,duplicated_lines_density,new_duplicated_lines_density,duplicated_lines,ncloc,bugs,vulnerabilities,code_smells,reliability_rating,security_rating,sqale_rating,security_hotspots"
          issues_url="https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&${scope}&resolved=false&ps=100"
          main_uncovered_url="https://sonarcloud.io/api/measures/component_tree?component=${SONAR_PROJECT_KEY}&branch=main&metricKeys=coverage,lines_to_cover,uncovered_lines&qualifiers=FIL&ps=40&s=metric&metricSort=uncovered_lines&asc=false"
          main_duplicated_url="https://sonarcloud.io/api/measures/component_tree?component=${SONAR_PROJECT_KEY}&branch=main&metricKeys=duplicated_lines_density,duplicated_lines,ncloc&qualifiers=FIL&ps=40&s=metric&metricSort=duplicated_lines&asc=false"

          echo "Sonar analysisId: ${analysis_id}"
          echo "::group::Sonar quality gate"
          curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$quality_gate_url" | jq .
          echo "::endgroup::"

          echo "::group::Sonar measures"
          curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$measures_url" | jq .
          echo "::endgroup::"

          echo "::group::Sonar active issues"
          curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$issues_url" \
            | jq '{total, issues: [.issues[] | {key, rule, severity, type, component, line, message}]}'
          echo "::endgroup::"

          echo "::group::Main baseline top uncovered files"
          curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$main_uncovered_url" \
            | jq '[.components[] | {path, measures}]'
          echo "::endgroup::"

          echo "::group::Main baseline top duplicated files"
          curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$main_duplicated_url" \
            | jq '[.components[] | {path, measures}]'
          echo "::endgroup::"

      # OBSERVE MODE
      # Do not enable sonar.qualitygate.wait yet.
      # Do not make this check required yet.
