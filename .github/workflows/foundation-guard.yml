name: BThwani Foundation Guard (structural only)

on:
  workflow_dispatch:
  push:
    branches:
      - 'refoundation/clean-house-20261112'
  pull_request:
    branches:
      - 'refoundation/clean-house-20261112'

permissions:
  contents: read

concurrency:
  group: foundation-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation structure only (NOT product acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check required Node and working tree
        run: |
          node --version
          git status --short
      - name: Test guard sensitivity
        run: node --test tools/governance/verify-foundation.test.mjs tools/governance/review-examples.test.mjs
      - name: Verify foundation without asserting business readiness
        run: node tools/governance/verify-foundation.mjs
      - name: Verify Stage-4 source versions and external app identities (static only)
        run: node tools/mobile/verify-app-foundations.mjs
      - name: Reject manual RTL overrides in Expo screens and confirm native config
        run: |
          node --test tools/mobile/verify-rtl.test.mjs
          node tools/mobile/verify-rtl.mjs
      - name: Record limits explicitly
        run: |
          echo 'FOUNDATION_ONLY: governance cutover is NOT_READY'
          echo 'NOT_RUN: SQL, source services, runtime, security, finance, full Product acceptance'

  presentation:
    name: Presentation config, design and TypeScript (NOT runtime)
    needs: foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use repository-pinned Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact locked dependencies (no lifecycle scripts)
        run: |
          corepack enable pnpm
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate design, native config, appearance races and all app types
        run: |
          pnpm check:design
          pnpm check:apps
      - name: Export Expo Web presentation hosts (SSR artifacts only)
        run: |
          pnpm --dir apps/customer exec expo export --platform web
          pnpm --dir apps/merchant exec expo export --platform web
      - name: Export Expo Android JavaScript (NOT a native binary)
        run: |
          pnpm --dir apps/customer exec expo export --platform android
          pnpm --dir apps/merchant exec expo export --platform android
          pnpm --dir apps/captain exec expo export --platform android
      - name: Build the pinned Next.js Operator presentation host
        run: pnpm --dir apps/control-panel build
      - name: Record missing live platform proof
        run: |
          echo 'NOT_RUN: Android/iOS binary, actual browser hydration/CSP, owner APIs, finance and security'
