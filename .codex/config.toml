# Project-local Codex defaults for Spec Kit command dispatch.
# Do not copy this configuration into user-global settings.
model = "gpt-6-luna"
model_reasoning_effort = "medium"
service_tier = "fast"
sandbox_mode = "workspace-write"
# Avoid running user PowerShell profiles in isolated Codex shells.
allow_login_shell = false

# Scoped guidance for the official Spec Kit skills, not an alternate workflow.
developer_instructions = """
For $speckit-* workflow steps: execute only the named step. The Specify workflow engine owns other stages and human approvals. Honor required governance, prerequisite checks, and mandatory hooks, but prefer targeted reads of the current feature's spec/plan/tasks and relevant owner files. Do not recursively enumerate .specify/workflows/runs, the whole repository, or historic Codex memories unless a concrete requirement makes it necessary. Reuse accepted artifacts unchanged; report missing evidence instead of doing a project-wide audit. No edits outside the assigned write scope.
"""

[features]
fast_mode = true
