id: bthwani-codex-strict
extends: speckit
priority: 10
enabled: true
edits:
  - insert_before: specify
    step:
      id: bthwani-preflight
      type: shell
      run: "powershell.exe -NoProfile -NonInteractive -File .specify/scripts/powershell/verify-bthwani-codex.ps1"
      strict: true
  - replace: specify
    step:
      id: specify
      command: speckit.specify
      integration: codex
      model: gpt-6-luna
      input:
        args: "{{ inputs.spec }}"
  - insert_before: review-spec
    step:
      id: clarify
      command: speckit.clarify
      integration: codex
      model: gpt-6-luna
      input:
        args: "{{ inputs.spec }}"
  - replace: plan
    step:
      id: plan
      command: speckit.plan
      integration: codex
      model: gpt-6-luna
      input:
        args: "{{ inputs.spec }}"
  - insert_after: review-plan
    step:
      id: checklist
      command: speckit.checklist
      integration: codex
      model: gpt-6-luna
      input:
        args: "{{ inputs.spec }}"
  - replace: tasks
    step:
      id: tasks
      command: speckit.tasks
      integration: codex
      model: gpt-6-luna
      input:
        args: "{{ inputs.spec }}"
  - insert_after: tasks
    step:
      id: analyze
      command: speckit.analyze
      integration: codex
      model: gpt-6-luna
      input:
        args: "{{ inputs.spec }}"
  - insert_before: implement
    step:
      id: review-implementation
      type: gate
      message: "Approve the planned implementation scope, task ownership, tests, and protected-operation exclusions. Reject if evidence or permission is missing."
      options: [approve, reject]
      on_reject: abort
  - replace: implement
    step:
      id: implement
      command: speckit.implement
      integration: codex
      model: gpt-6-luna
      input:
        args: "{{ inputs.spec }}"
  - insert_after: implement
    step:
      id: converge
      command: speckit.converge
      integration: codex
      model: gpt-6-luna
      input:
        args: "{{ inputs.spec }}"
  - insert_after: implement
    step:
      id: bthwani-final-review
      type: gate
      message: "Review the converged implementation and independent acceptance evidence on the final candidate. Approve only when all applicable criteria and critical risk reviews are proven. This gate is not production approval."
      options: [approve, reject]
      on_reject: abort
