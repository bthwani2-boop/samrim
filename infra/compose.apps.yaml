# Optional owner services. DSH is a real, *public-discovery-only* Go process;
# Identity and WLT remain inactive until their authentic owner runtimes exist.
# Never run the whole implementation profile: select an explicit proven service.
# Load together with infra/compose.yaml.
services:
  identity-migrate:
    profiles: [implementation]
    build:
      context: ..
      dockerfile: services/identity/backend/Dockerfile
    image: bthwani-refoundation-identity:dev
    restart: "no"
    entrypoint: ["/migrate"]
    environment:
      BTHWANI_ENV: development
      IDENTITY_MIGRATION_DATABASE_URL: "${REF_IDENTITY_MIGRATION_DATABASE_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [isolated]

  identity-bootstrap:
    profiles: [implementation]
    build:
      context: ..
      dockerfile: services/identity/backend/Dockerfile
    image: bthwani-refoundation-identity:dev
    restart: "no"
    entrypoint: ["/bootstrap-operator"]
    environment:
      BTHWANI_ENV: development
      IDENTITY_BOOTSTRAP_DOCKER_LOCAL_ONLY: "1"
      IDENTITY_DATABASE_URL: "${REF_IDENTITY_MIGRATION_DATABASE_URL:-}"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    networks: [isolated]

  dsh-migrate:
    profiles: [implementation]
    image: bthwani-refoundation-dsh:dev
    restart: "no"
    entrypoint: ["/usr/local/bin/dsh", "-mode=migrate"]
    environment:
      REF_POSTGRES_USER: "${REF_POSTGRES_USER:?missing isolated user}"
      REF_POSTGRES_PASSWORD: "${REF_POSTGRES_PASSWORD:?missing isolated password}"
      REF_POSTGRES_DB: "${REF_POSTGRES_DB:?missing isolated database}"
      DSH_DB_HOST: postgres
      DSH_DB_SCHEMA: "${REF_DSH_DISCOVERY_SCHEMA:?choose verified isolated dsh_test_* schema}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [isolated]

  wlt-migrate:
    profiles: [implementation]
    build:
      context: ..
      dockerfile: services/wlt/backend/Dockerfile
    image: bthwani-refoundation-wlt:dev
    restart: "no"
    entrypoint: ["/migrate"]
    environment:
      BTHWANI_ENV: development
      WLT_MIGRATION_DATABASE_URL: "${REF_WLT_MIGRATION_DATABASE_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [isolated]

  postgres-access:
    profiles: [implementation]
    build:
      context: ..
      dockerfile: infra/docker/postgres-access.Dockerfile
    image: bthwani-refoundation-postgres-access:dev
    restart: "no"
    depends_on:
      identity-bootstrap:
        condition: service_completed_successfully
      dsh-migrate:
        condition: service_completed_successfully
      wlt-migrate:
        condition: service_completed_successfully
    environment:
      REF_POSTGRES_DB: "${REF_POSTGRES_DB:-bthwani_refoundation}"
    networks: [isolated]

  identity:
    profiles: [implementation]
    build:
      context: ..
      dockerfile: services/identity/backend/Dockerfile
    image: bthwani-refoundation-identity:dev
    restart: unless-stopped
    environment:
      BTHWANI_ENV: development
      BTHWANI_LISTEN_HOST: "0.0.0.0"
      PORT: "8082"
      IDENTITY_DATABASE_URL: "${REF_IDENTITY_DATABASE_URL:-}"
      IDENTITY_CHALLENGE_DELIVERY_MODE: mailpit
      IDENTITY_MAILPIT_SMTP_ADDR: mailpit:1025
    ports:
      - "127.0.0.1:${REF_IDENTITY_PORT:-3201}:8082"
    depends_on:
      postgres-access:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    networks: [isolated, loopback]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/identity/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  wlt:
    profiles: [implementation]
    build:
      context: ..
      dockerfile: services/wlt/backend/Dockerfile
    image: bthwani-refoundation-wlt:dev
    restart: unless-stopped
    environment:
      BTHWANI_ENV: development
      BTHWANI_LISTEN_HOST: "0.0.0.0"
      PORT: "8083"
      WLT_DATABASE_URL: "${REF_WLT_DATABASE_URL:-}"
      WLT_IDENTITY_API_BASE_URL: http://identity:8082
    ports:
      - "127.0.0.1:${REF_WLT_PORT:-3203}:8083"
    depends_on:
      postgres-access:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
    networks: [isolated, loopback]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/wlt/readiness"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Real DSH public discovery only. Protected Store actions/Orders remain fail-closed
  # until genuine Identity, WLT and canonical DSH contracts are implemented.
  dsh:
    profiles: [implementation]
    image: bthwani-refoundation-dsh:dev
    restart: unless-stopped
    # Public read-only process. Prevent writable container filesystem and
    # Linux privilege escalation; PostgreSQL permissions are a separate gate.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.bthwani.environment: refoundation
      # Legacy runtime identifier, not the current Git checkout path.
      com.bthwani.worktree: samrim-refoundation-clean-20261112
      com.bthwani.capability: customer-store-catalog
    environment:
      REF_POSTGRES_USER: "${REF_POSTGRES_USER:?missing isolated user}"
      REF_POSTGRES_PASSWORD: "${REF_POSTGRES_PASSWORD:?missing isolated password}"
      REF_POSTGRES_DB: "${REF_POSTGRES_DB:?missing isolated database}"
      DSH_DB_HOST: postgres
      DSH_DB_SCHEMA: "${REF_DSH_DISCOVERY_SCHEMA:?choose verified isolated dsh_test_* schema}"
      DSH_PUBLIC_CORS_ORIGINS: "${REF_DSH_PUBLIC_CORS_ORIGINS:?configure development browser origins}"
    ports:
      - "127.0.0.1:${REF_DSH_PORT:-3202}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [isolated, loopback]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
