# Only real Go DSH owner roles belong in this overlay.
# Pair with infra/compose.yaml and optionally compose.identity-verifier.yaml.
# Never start every profile: migration is an explicit operator-controlled action.
services:
  dsh-migrate:
    # Deliberately separate from the normal implementation service profile.
    profiles: [migration]
    image: "bthwani-refoundation-dsh:${REF_DSH_IMAGE_TAG:-dev}"
    restart: "no"
    entrypoint: ["/usr/local/bin/dsh", "-mode=migrate"]
    environment:
      REF_POSTGRES_USER: "${REF_POSTGRES_USER:?missing isolated user}"
      REF_POSTGRES_PASSWORD: "${REF_POSTGRES_PASSWORD:?missing isolated password}"
      REF_POSTGRES_DB: "${REF_POSTGRES_DB:?missing isolated database}"
      DSH_DB_HOST: postgres
      DSH_DB_SCHEMA: "${REF_DSH_DISCOVERY_SCHEMA:?choose verified isolated dsh_test_* schema}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [isolated]

  dsh:
    profiles: [implementation]
    image: "bthwani-refoundation-dsh:${REF_DSH_IMAGE_TAG:-dev}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.bthwani.environment: refoundation
      com.bthwani.worktree: samrim-refoundation-clean-20261112
      com.bthwani.capability: customer-store-catalog
    environment:
      REF_POSTGRES_USER: "${REF_POSTGRES_USER:?missing isolated user}"
      REF_POSTGRES_PASSWORD: "${REF_POSTGRES_PASSWORD:?missing isolated password}"
      REF_POSTGRES_DB: "${REF_POSTGRES_DB:?missing isolated database}"
      DSH_DB_HOST: postgres
      DSH_DB_SCHEMA: "${REF_DSH_DISCOVERY_SCHEMA:?choose verified isolated dsh_test_* schema}"
      DSH_PUBLIC_CORS_ORIGINS: "${REF_DSH_PUBLIC_CORS_ORIGINS:?configure development browser origins}"
    ports:
      - "127.0.0.1:${REF_DSH_PORT:-3202}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [isolated, loopback]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
