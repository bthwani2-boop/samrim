# Only real Go DSH owner roles belong in this overlay.
# Pair with infra/compose.yaml and optionally compose.identity.yaml.
# Never start every profile: fresh bootstrap is an explicit operator-controlled action.
services:
  dsh-bootstrap:
    # Deliberately separate from the normal implementation service profile.
    profiles: [bootstrap]
    image: "bthwani-refoundation-dsh:${REF_DSH_IMAGE_TAG:-dev}"
    restart: "no"
    entrypoint: ["/usr/local/bin/dsh", "-mode=bootstrap"]
    environment:
      REF_POSTGRES_USER: "${REF_DSH_BOOTSTRAP_USER:-}"
      REF_POSTGRES_PASSWORD: "${REF_DSH_BOOTSTRAP_PASSWORD:-}"
      REF_POSTGRES_DB: "${REF_DSH_RUNTIME_DATABASE:?provision dedicated DSH database}"
      DSH_DB_HOST: postgres
      DSH_DB_SCHEMA: "${REF_DSH_DISCOVERY_SCHEMA:?choose verified isolated dsh_test_* schema}"
      BTHWANI_ISOLATED_TEST_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [isolated]

  dsh:
    profiles: [implementation]
    image: "bthwani-refoundation-dsh:${REF_DSH_IMAGE_TAG:-dev}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.bthwani.environment: refoundation
      com.bthwani.worktree: samrim-refoundation-clean-20261112
      com.bthwani.capability: customer-store-catalog
    environment:
      REF_POSTGRES_USER: "${REF_DSH_RUNTIME_USER:?provision limited DSH runtime role}"
      REF_POSTGRES_PASSWORD: "${REF_DSH_RUNTIME_PASSWORD:?provision dedicated DSH runtime credentials}"
      REF_POSTGRES_DB: "${REF_DSH_RUNTIME_DATABASE:?provision dedicated DSH database}"
      DSH_DB_HOST: postgres
      DSH_DB_SCHEMA: "${REF_DSH_DISCOVERY_SCHEMA:?choose verified isolated dsh_test_* schema}"
      DSH_PUBLIC_CORS_ORIGINS: "${REF_DSH_PUBLIC_CORS_ORIGINS:?configure development browser origins}"
      DSH_IDENTITY_VERIFIER_URL: "${REF_DSH_IDENTITY_VERIFIER_URL:-}"
      BTHWANI_ISOLATED_TEST_MODE: "true"
      BTHWANI_ISOLATED_CONTAINER_MODE: "true"
      DSH_ENABLE_ISOLATED_CUSTOMER_CART: "${REF_DSH_ENABLE_ISOLATED_CUSTOMER_CART:-false}"
      DSH_ENABLE_ISOLATED_EMPLOYEES: "${REF_DSH_ENABLE_ISOLATED_EMPLOYEES:-false}"
    ports:
      - "127.0.0.1:${REF_DSH_PORT:-3202}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [isolated, loopback]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
