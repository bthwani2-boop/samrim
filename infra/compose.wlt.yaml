# Explicitly admitted isolated WLT Customer read-only owner.
# Pair with compose.yaml. It never applies migrations or posts funds.
services:
  wlt:
    profiles: [wlt-reader]
    image: "bthwani-refoundation-wlt:${REF_WLT_IMAGE_TAG:-dev}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.bthwani.environment: refoundation
      com.bthwani.capability: customer-wallet-read-only
      com.bthwani.worktree: samrim-refoundation-clean-20261112
    environment:
      BTHWANI_ISOLATED_TEST_MODE: "true"
      BTHWANI_ISOLATED_CONTAINER_MODE: "true"
      WLT_DEV_LISTEN_ADDR: "0.0.0.0:8080"
      WLT_TEST_DATABASE_URL: "${REF_WLT_TEST_DATABASE_URL:?isolated WLT read-only PostgreSQL URL required}"
      WLT_TEST_IDENTITY_ORIGIN: "http://identity:3302"
      WLT_TEST_DSH_ORIGIN: "http://dsh:8080"
    ports:
      - "127.0.0.1:${REF_WLT_PORT:-3203}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [isolated, loopback]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
