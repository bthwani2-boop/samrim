# Explicit isolated Captain admission, layered on the existing Merchant TLS overlay.
# External volumes must be provisioned for this environment; no host port or issuer.
services:
  identity:
    environment:
      IDENTITY_ENABLE_ISOLATED_CAPTAIN_ADMISSION: "true"
      IDENTITY_DSH_CAPTAIN_STANDING_URL: "https://dsh:3344"
      IDENTITY_DSH_CAPTAIN_STANDING_CA: /run/dsh-captain-ca/ca.pem
    volumes:
      - captain-dsh-ca:/run/dsh-captain-ca:ro
  dsh:
    environment:
      DSH_ENABLE_ISOLATED_CAPTAIN_STANDING: "true"
      DSH_ISOLATED_CAPTAIN_TLS_CERT: /run/dsh-captain-tls/server.pem
      DSH_ISOLATED_CAPTAIN_TLS_KEY: /run/dsh-captain-tls/server-key.pem
    volumes:
      - captain-dsh-tls:/run/dsh-captain-tls:ro
volumes:
  captain-dsh-ca:
    name: bthwani-refoundation-captain-dsh-ca
    external: true
  captain-dsh-tls:
    name: bthwani-refoundation-captain-dsh-tls
    external: true