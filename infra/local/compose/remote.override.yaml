# Optional remote Docker Desktop runtime on BTHWANI-DOCKER.
# Loaded by tools/dev/dev.ps1 only for Docker context "bthwani-docker".
# Bind mounts refer to the Lenovo host, not to paths on Surface.
services:
  postgres-access:
    volumes:
      - type: bind
        source: "${SAMRIM_REMOTE_DOCKER_ROOT:?set remote runtime root in infra/local/.env}/compose/runtime-roles.sql"
        target: /etc/samrim/runtime-roles.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${SAMRIM_REMOTE_DOCKER_ROOT:?set remote runtime root in infra/local/.env}/compose/verify-runtime-access.sh"
        target: /etc/samrim/verify-runtime-access.sh
        read_only: true
        bind:
          create_host_path: false
  payment-mock:
    volumes:
      - type: bind
        source: "${SAMRIM_REMOTE_DOCKER_ROOT:?set remote runtime root in infra/local/.env}/payment-provider-mock"
        target: /home/wiremock
        read_only: true
        bind:
          create_host_path: false
