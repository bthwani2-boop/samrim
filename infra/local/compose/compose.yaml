name: samrim-local

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${SAMRIM_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${SAMRIM_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${SAMRIM_POSTGRES_DB}"
    volumes:
      - samrim-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SAMRIM_MAILPIT_WEB_PORT:-18026}:8025"

  media:
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: "${DSH_MEDIA_ACCESS_KEY:-samrim-media}"
      AWS_SECRET_ACCESS_KEY: "${DSH_MEDIA_SECRET_KEY:-samrim-media-secret}"
      S3_BUCKET: "${DSH_MEDIA_BUCKET:-samrim-catalog-media}"
    ports:
      - "127.0.0.1:${SAMRIM_MEDIA_PORT:-18333}:8333"
    volumes:
      - samrim-media-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 2s

  identity-migrate:
    image: samrim-local-identity:dev
    build:
      context: ../../..
      dockerfile: services/identity/backend/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BTHWANI_ENV: "development"
      IDENTITY_MIGRATION_DATABASE_URL: "postgres://${SAMRIM_POSTGRES_USER}:${SAMRIM_POSTGRES_PASSWORD}@postgres:5432/${SAMRIM_POSTGRES_DB}?sslmode=disable"
      BTHWANI_EXPECTED_DATABASE_HOST: "postgres"
      BTHWANI_EXPECTED_DATABASE_PORT: "5432"
      BTHWANI_EXPECTED_DATABASE_NAME: "${SAMRIM_POSTGRES_DB}"
      BTHWANI_EXPECTED_DATABASE_USER: "${SAMRIM_POSTGRES_USER}"
      IDENTITY_MIGRATION_DIR: "/app/migrations"
    entrypoint: ["/migrate"]

  identity:
    image: samrim-local-identity:dev
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: services/identity/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      identity-migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8082"
      BTHWANI_LISTEN_HOST: "0.0.0.0"
      BTHWANI_ENV: "development"
      IDENTITY_DEVELOPMENT_CLIENT_ACTOR_ID: "${IDENTITY_DEVELOPMENT_CLIENT_ACTOR_ID:-}"
      IDENTITY_DEVELOPMENT_PARTNER_ACTOR_ID: "${IDENTITY_DEVELOPMENT_PARTNER_ACTOR_ID:-}"
      IDENTITY_DEVELOPMENT_CAPTAIN_ACTOR_ID: "${IDENTITY_DEVELOPMENT_CAPTAIN_ACTOR_ID:-}"
      IDENTITY_DEVELOPMENT_FIELD_ACTOR_ID: "${IDENTITY_DEVELOPMENT_FIELD_ACTOR_ID:-}"
      IDENTITY_DEVELOPMENT_OPERATOR_ACTOR_ID: "${IDENTITY_DEVELOPMENT_OPERATOR_ACTOR_ID:-}"
      IDENTITY_DATABASE_URL: "postgres://${SAMRIM_POSTGRES_USER}:${SAMRIM_POSTGRES_PASSWORD}@postgres:5432/${SAMRIM_POSTGRES_DB}?sslmode=disable"
      IDENTITY_MAINTENANCE_DATABASE_URL: "postgres://${SAMRIM_POSTGRES_USER}:${SAMRIM_POSTGRES_PASSWORD}@postgres:5432/${SAMRIM_POSTGRES_DB}?sslmode=disable"
      BTHWANI_EXPECTED_DATABASE_HOST: "postgres"
      BTHWANI_EXPECTED_DATABASE_PORT: "5432"
      BTHWANI_EXPECTED_DATABASE_NAME: "${SAMRIM_POSTGRES_DB}"
      BTHWANI_EXPECTED_DATABASE_USER: "${SAMRIM_POSTGRES_USER}"
      IDENTITY_AUTO_MIGRATE: "false"
      IDENTITY_RETENTION_CHALLENGE_DAYS: "${IDENTITY_RETENTION_CHALLENGE_DAYS:-30}"
      IDENTITY_RETENTION_PASSWORD_ATTEMPT_DAYS: "${IDENTITY_RETENTION_PASSWORD_ATTEMPT_DAYS:-30}"
      IDENTITY_RETENTION_OPERATOR_ENROLLMENT_DAYS: "${IDENTITY_RETENTION_OPERATOR_ENROLLMENT_DAYS:-30}"
      IDENTITY_RETENTION_SESSION_DAYS: "${IDENTITY_RETENTION_SESSION_DAYS:-90}"
      IDENTITY_RETENTION_AUDIT_DAYS: "${IDENTITY_RETENTION_AUDIT_DAYS:-365}"
      IDENTITY_RETENTION_BATCH_SIZE: "${IDENTITY_RETENTION_BATCH_SIZE:-500}"
      IDENTITY_CHALLENGE_HMAC_SECRET: "${IDENTITY_CHALLENGE_HMAC_SECRET}"
      IDENTITY_ABUSE_HMAC_SECRET: "${IDENTITY_ABUSE_HMAC_SECRET}"
      IDENTITY_DSH_SERVICE_TOKEN: "${IDENTITY_DSH_SERVICE_TOKEN}"
      CONTROL_PANEL_SERVICE_TOKEN: "${CONTROL_PANEL_SERVICE_TOKEN}"
      OPERATOR_BOOTSTRAP_SECRET: "${OPERATOR_BOOTSTRAP_SECRET:-}"
      IDENTITY_TRUSTED_PROXY_IPS: "${IDENTITY_TRUSTED_PROXY_IPS:-}"
      IDENTITY_CHALLENGE_DELIVERY_MODE: "${IDENTITY_CHALLENGE_DELIVERY_MODE}"
      IDENTITY_MAILPIT_SMTP_ADDR: "mailpit:1025"
      IDENTITY_MAILPIT_RECIPIENT: "${IDENTITY_MAILPIT_RECIPIENT}"
      IDENTITY_CORS_ALLOWED_ORIGINS: "${IDENTITY_CORS_ALLOWED_ORIGINS}"
      IDENTITY_WEBAUTHN_RP_ID: "${IDENTITY_WEBAUTHN_RP_ID:-localhost}"
      IDENTITY_WEBAUTHN_ALLOWED_ORIGINS: "${IDENTITY_WEBAUTHN_ALLOWED_ORIGINS:-http://localhost:13000}"
    ports:
      - "127.0.0.1:${SAMRIM_IDENTITY_PORT:-18082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/identity/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  dsh-migrate:
    image: samrim-local-dsh:dev
    build:
      context: ../../..
      dockerfile: services/dsh/backend/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BTHWANI_ENV: "development"
      DSH_MIGRATION_DATABASE_URL: "postgres://${SAMRIM_POSTGRES_USER}:${SAMRIM_POSTGRES_PASSWORD}@postgres:5432/${SAMRIM_POSTGRES_DB}?sslmode=disable"
      BTHWANI_EXPECTED_DATABASE_HOST: "postgres"
      BTHWANI_EXPECTED_DATABASE_PORT: "5432"
      BTHWANI_EXPECTED_DATABASE_NAME: "${SAMRIM_POSTGRES_DB}"
      BTHWANI_EXPECTED_DATABASE_USER: "${SAMRIM_POSTGRES_USER}"
      DSH_MIGRATION_DIR: "/app/migrations"
      DSH_DELIVERY_PROOF_ACTIVE_KEY_ID: "${DSH_DELIVERY_PROOF_ACTIVE_KEY_ID:-}"
      DSH_DELIVERY_PROOF_KEYRING: "${DSH_DELIVERY_PROOF_KEYRING:-}"
    entrypoint: ["/migrate"]

  dsh:
    image: samrim-local-dsh:dev
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: services/dsh/backend/Dockerfile
    depends_on:
      identity:
        condition: service_healthy
      media:
        condition: service_healthy
      dsh-migrate:
        condition: service_completed_successfully
      wlt:
        condition: service_healthy
    environment:
      PORT: "8080"
      BTHWANI_LISTEN_HOST: "0.0.0.0"
      BTHWANI_ENV: "development"
      DSH_IDENTITY_API_BASE_URL: "http://identity:8082"
      DSH_WLT_API_BASE_URL: "http://wlt:8083"
      DSH_DATABASE_URL: "postgres://${SAMRIM_POSTGRES_USER}:${SAMRIM_POSTGRES_PASSWORD}@postgres:5432/${SAMRIM_POSTGRES_DB}?sslmode=disable"
      DSH_MIGRATION_DATABASE_URL: "postgres://${SAMRIM_POSTGRES_USER}:${SAMRIM_POSTGRES_PASSWORD}@postgres:5432/${SAMRIM_POSTGRES_DB}?sslmode=disable"
      DSH_SCHEMA_DATABASE_URL: "postgres://${SAMRIM_POSTGRES_USER}:${SAMRIM_POSTGRES_PASSWORD}@postgres:5432/${SAMRIM_POSTGRES_DB}?sslmode=disable"
      BTHWANI_EXPECTED_DATABASE_HOST: "postgres"
      BTHWANI_EXPECTED_DATABASE_PORT: "5432"
      BTHWANI_EXPECTED_DATABASE_NAME: "${SAMRIM_POSTGRES_DB}"
      BTHWANI_EXPECTED_DATABASE_USER: "${SAMRIM_POSTGRES_USER}"
      DSH_MIGRATION_DIR: "/app/migrations"
      IDENTITY_DSH_SERVICE_TOKEN: "${IDENTITY_DSH_SERVICE_TOKEN}"
      CONTROL_PANEL_SERVICE_TOKEN: "${CONTROL_PANEL_SERVICE_TOKEN}"
      WLT_DSH_SERVICE_TOKEN: "${WLT_DSH_SERVICE_TOKEN}"
      WLT_DESTINATION_ENCRYPTION_KEY: "${WLT_DESTINATION_ENCRYPTION_KEY:-}"
      DSH_DELIVERY_PROOF_ACTIVE_KEY_ID: "${DSH_DELIVERY_PROOF_ACTIVE_KEY_ID:-}"
      DSH_DELIVERY_PROOF_KEYRING: "${DSH_DELIVERY_PROOF_KEYRING:-}"
      DSH_MEDIA_S3_ENDPOINT: "http://media:8333"
      DSH_MEDIA_ACCESS_KEY: "${DSH_MEDIA_ACCESS_KEY:-samrim-media}"
      DSH_MEDIA_SECRET_KEY: "${DSH_MEDIA_SECRET_KEY:-samrim-media-secret}"
      DSH_MEDIA_BUCKET: "${DSH_MEDIA_BUCKET:-samrim-catalog-media}"
      DSH_MEDIA_PUBLIC_BASE_URL: "${DSH_MEDIA_PUBLIC_BASE_URL:-http://127.0.0.1:18080/dsh/catalog/media}"
      DSH_MEDIA_MAX_BYTES: "${DSH_MEDIA_MAX_BYTES:-10485760}"
    ports:
      - "127.0.0.1:${SAMRIM_DSH_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/dsh/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  wlt-migrate:
    image: samrim-local-wlt:dev
    build:
      context: ../../..
      dockerfile: services/wlt/backend/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BTHWANI_ENV: "development"
      WLT_MIGRATION_DATABASE_URL: "postgres://${SAMRIM_POSTGRES_USER}:${SAMRIM_POSTGRES_PASSWORD}@postgres:5432/${SAMRIM_POSTGRES_DB}?sslmode=disable"
      BTHWANI_EXPECTED_DATABASE_HOST: "postgres"
      BTHWANI_EXPECTED_DATABASE_PORT: "5432"
      BTHWANI_EXPECTED_DATABASE_NAME: "${SAMRIM_POSTGRES_DB}"
      BTHWANI_EXPECTED_DATABASE_USER: "${SAMRIM_POSTGRES_USER}"
      WLT_MIGRATION_DIR: "/app/migrations"
    entrypoint: ["/migrate"]

  wlt:
    image: samrim-local-wlt:dev
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: services/wlt/backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      wlt-migrate:
        condition: service_completed_successfully
    environment:
      PORT: "8083"
      BTHWANI_LISTEN_HOST: "0.0.0.0"
      BTHWANI_ENV: "development"
      WLT_DATABASE_URL: "postgres://${SAMRIM_POSTGRES_USER}:${SAMRIM_POSTGRES_PASSWORD}@postgres:5432/${SAMRIM_POSTGRES_DB}?sslmode=disable"
      WLT_SCHEMA_DATABASE_URL: "postgres://${SAMRIM_POSTGRES_USER}:${SAMRIM_POSTGRES_PASSWORD}@postgres:5432/${SAMRIM_POSTGRES_DB}?sslmode=disable"
      BTHWANI_EXPECTED_DATABASE_HOST: "postgres"
      BTHWANI_EXPECTED_DATABASE_PORT: "5432"
      BTHWANI_EXPECTED_DATABASE_NAME: "${SAMRIM_POSTGRES_DB}"
      BTHWANI_EXPECTED_DATABASE_USER: "${SAMRIM_POSTGRES_USER}"
      WLT_MIGRATION_DIR: "/app/migrations"
      WLT_DSH_SERVICE_TOKEN: "${WLT_DSH_SERVICE_TOKEN}"
      WLT_DESTINATION_ENCRYPTION_KEY: "${WLT_DESTINATION_ENCRYPTION_KEY:-}"
      WLT_FINANCE_EVIDENCE_ENCRYPTION_KEY: "${WLT_FINANCE_EVIDENCE_ENCRYPTION_KEY:-}"
      WLT_CASH_IN_MODE: "${WLT_CASH_IN_MODE:-simulator}"
    ports:
      - "127.0.0.1:${SAMRIM_WLT_PORT:-18083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/wlt/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

volumes:
  samrim-postgres-data:
  samrim-media-data:
