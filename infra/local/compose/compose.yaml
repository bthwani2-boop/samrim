name: samrim-local

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${SAMRIM_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${SAMRIM_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${SAMRIM_POSTGRES_DB}"
    ports:
      - "127.0.0.1:${SAMRIM_POSTGRES_PORT:-55432}:5432"
    volumes:
      - samrim-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${SAMRIM_MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${SAMRIM_MINIO_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:${SAMRIM_MINIO_API_PORT:-59000}:9000"
      - "127.0.0.1:${SAMRIM_MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - samrim-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SAMRIM_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${SAMRIM_MAILPIT_WEB_PORT:-8025}:8025"

volumes:
  samrim-postgres-data:
  samrim-minio-data:
