sonar.organization=bthwani2-boop
sonar.projectKey=bthwani2-boop_samrim
sonar.projectName=samrim

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*.test.mjs,**/tests/**/*.ts,tools/dev/verify-dsh-runtime-core.mjs,tools/mobile/test-mobile-app.mjs
sonar.scm.provider=git

# PNGs are binary media assets (including UI assets and test fixtures), not source files.
# Historical Sonar audit exports are non-authoritative evidence, not analyzable source code.
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/.expo/**,**/.nx/**,**/.turbo/**,**/playwright-report/**,**/test-results/**,**/out/**,**/*.png,**/*_test.go,**/*.test.mjs,**/tests/**/*.ts,tools/dev/verify-dsh-runtime-core.mjs,tools/mobile/test-mobile-app.mjs,tools/sonar-audit/**
# PostgreSQL migrations use .sql; reserve PL/SQL analysis for actual Oracle source suffixes.
sonar.plsql.file.suffixes=.pls,.pks,.pkb
sonar.go.coverage.reportPaths=coverage/sonar/dsh.out,coverage/sonar/identity.out,coverage/sonar/wlt.out
sonar.javascript.lcov.reportPaths=coverage/sonar/tools-dev.lcov

# Coverage reports come from the Go module tests and Node's built-in test coverage reporter.
# Do not enable sonar.qualitygate.wait during Observe mode.
