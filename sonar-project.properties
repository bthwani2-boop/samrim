sonar.organization=bthwani2-boop
sonar.projectKey=bthwani2-boop_samrim
sonar.projectName=samrim

sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Sonar is a remote static-quality layer. Local/CI tests own test execution and coverage.
sonar.sources=apps,packages,services
sonar.tests=apps,packages,services
sonar.test.inclusions=**/*_test.go,**/*.test.*,**/*.spec.*,**/tests/**

# Keep generated/build/test artifacts out of product-code analysis.
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/.expo/**,**/.nx/**,**/.turbo/**,**/playwright-report/**,**/test-results/**,**/out/**,**/generated/**,**/*.generated.*,**/*_test.go,**/*.test.*,**/*.spec.*,**/tests/**

# Coverage stays with Nx/tests; Sonar must not duplicate or gate that pipeline.
sonar.coverage.exclusions=**/*
