# ============================================================
# BTHWANI — SonarQube Cloud
# Remote CI analysis only
# ============================================================

sonar.organization=.InteropServices.Marshal]::SecureStringToBSTR(
sonar.projectKey=figured"
sonar.projectName=samrim

sonar.sourceEncoding=UTF-8

# Analyze the repository as one Sonar project.
# Keep the initial scope broad to avoid blind spots.
sonar.sources=.

sonar.scm.provider=git

# Generated/cache/output directories only.
# Do not exclude real source merely to silence findings.
sonar.exclusions=\
**/node_modules/**,\
**/.next/**,\
**/dist/**,\
**/build/**,\
**/coverage/**,\
**/.expo/**,\
**/.nx/**,\
**/.turbo/**,\
**/playwright-report/**,\
**/test-results/**,\
**/out/**

# ------------------------------------------------------------
# Phase 1 policy
# ------------------------------------------------------------
#
# Sonar is OBSERVABILITY only.
#
# Coverage import is intentionally deferred until the
# canonical test-report paths are proven.
#
# No:
#   sonar.qualitygate.wait=true
#
# Sonar must not affect the local development loop.
